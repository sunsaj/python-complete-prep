's the smallest piece of <code>s<\/code> that has all the letters on my shopping list <code>t<\/code>?\"<\/p>\n<p><b>Real-life picture:<\/b> you're walking down a market street (<code>s<\/code>) with a shopping list (<code>t<\/code>). You <b>expand<\/b> your walk to the right until your bag has everything on the list. Then you try to <b>shrink from the left<\/b>: can you skip the first few shops and still have everything? Shrink as long as the bag stays complete, recording the shortest stretch. When removing a shop breaks the bag, expand right again. Repeat.<\/p>\n<p>That's the \"expand until valid, shrink while valid\" pattern, the most important sliding window template.<\/p>", "approach": "<ol><li><code>need = Counter(t)<\/code>, how many of each letter we need. <code>missing = len(t)<\/code>, how many letters are still missing in total.<\/li><li>Move <code>right<\/code> across <code>s<\/code>: - If <code>need[ch] &gt; 0<\/code>, this letter was useful, so <code>missing -= 1<\/code>. - <code>need[ch] -= 1<\/code>. It can go negative, which means we have extra copies. - While <code>missing == 0<\/code> (the window is valid): - Record the window if it's the shortest so far. - Remove <code>s[left]<\/code>: <code>need[s[left]] += 1<\/code>. If it becomes &gt; 0, we just lost a needed letter, so <code>missing += 1<\/code>. - <code>left += 1<\/code>.<\/li><li>Return the best window.<\/li><\/ol>\n<h4>Mini walk-through, \"ADOBECODEBANC\" / \"ABC\"<\/h4>\n<ul><li>Expand until \"ADOBEC\" has A, B, C. Valid, length 6.<\/li><li>Shrink: dropping A breaks it. Expand… eventually \"CODEBA\", \"BANC\".<\/li><li>The shortest valid window seen is <b>\"BANC\"<\/b> (length 4).<\/li><\/ul>", "hints": ["Count what you need from t.", "Expand right until every needed letter is covered (track a 'missing' counter).", "While covered, record the window and shrink from the left."], "starter": "def min_window(s, t):\n    pass\n", "solution": "from collections import Counter\n\ndef min_window(s, t):\n    if not t or not s:\n        return \"\"\n    need = Counter(t)          # how many more of each letter we still need\n    missing = len(t)           # total letters still missing\n    left = 0\n    best = (float(\"inf\"), 0, 0)    # (length, start, end)\n    for right, ch in enumerate(s):\n        if need[ch] > 0:\n            missing -= 1       # this letter fills a real need\n        need[ch] -= 1          # negative = extra copies in the window\n        while missing == 0:    # window has everything, so try to shrink it\n            if right - left + 1 < best[0]:\n                best = (right - left + 1, left, right + 1)\n            need[s[left]] += 1\n            if need[s[left]] > 0:\n                missing += 1   # we just dropped a needed letter\n            left += 1\n    return \"\" if best[0] == float(\"inf\") else s[best[1]:best[2]]\n", "complexity": "<p><b>Time O(|s| + |t|)<\/b>: each index enters and leaves the window once. <b>Space O(k)<\/b> for the counts.<\/p>", "mistakes": "<ul><li>Comparing whole Counters at every step (O(26) each). That's fine, but the <code>missing<\/code> counter is the clean O(1) way.<\/li><li>Forgetting duplicate letters in <code>t<\/code> (\"aa\" needs two a's).<\/li><\/ul>", "tests": "\nT(\"example 1\", lambda: min_window(\"ADOBECODEBANC\", \"ABC\"), \"BANC\")\nT(\"exact\", lambda: min_window(\"a\", \"a\"), \"a\")\nT(\"impossible\", lambda: min_window(\"a\", \"aa\"), \"\")\nT(\"duplicates needed\", lambda: min_window(\"aaflslflsldkalskaaa\", \"aaa\"), \"aaa\")\nT(\"whole string\", lambda: min_window(\"ab\", \"ba\"), \"ab\")\n"}, {"id": "reverse-with-stack", "topic": "stack", "level": "Warm-up", "title": "Reverse a String Using a Stack", "blind": false, "lc": null, "statement": "<p>Reverse the string <code>s<\/code> using a <b>stack<\/b> (a Python list with <code>append<\/code> and <code>pop<\/code>). Don't use slicing.<\/p>", "examples": "<pre class=\"plain\">reverse_with_stack(\"hello\")  → \"olleh\"<\/pre>", "eli10": "<p>A <b>stack<\/b> is a pile of plates: you can only put a plate on <b>top<\/b> (<code>append<\/code>) or take the <b>top<\/b> plate off (<code>pop<\/code>). The last plate in is the first plate out (\"LIFO\").<\/p>\n<p>Put each letter on the pile, then take them all off. They come out in reverse order!<\/p>", "approach": "<ol><li>Push every character: <code>stack.append(ch)<\/code>.<\/li><li>Pop until empty, adding each popped letter to the result.<\/li><\/ol>", "hints": ["<code>list.append<\/code> pushes, and <code>list.pop()<\/code> removes the last item."], "starter": "def reverse_with_stack(s):\n    stack = []\n    pass\n", "solution": "def reverse_with_stack(s):\n    stack = []\n    for ch in s:\n        stack.append(ch)            # push\n    out = []\n    while stack:\n        out.append(stack.pop())     # pop gives the last pushed letter first\n    return \"\".join(out)\n", "complexity": "<p><b>Time O(n)<\/b>, <b>Space O(n)<\/b>.<\/p>", "mistakes": "", "tests": "\nT(\"hello\", lambda: reverse_with_stack(\"hello\"), \"olleh\")\nT(\"empty\", lambda: reverse_with_stack(\"\"), \"\")\nT(\"one\", lambda: reverse_with_stack(\"x\"), \"x\")\n"}, {"id": "valid-parentheses", "topic": "stack", "level": "Easy", "title": "Valid Parentheses", "blind": true, "lc": 20, "statement": "<p>Given a string containing only <code>()[]{}<\/code>, return <code>True<\/code> if the brackets are <b>valid<\/b>: every opener is closed by the <b>same type<\/b>, in the <b>correct order<\/b>.<\/p>", "examples": "<pre class=\"plain\">is_valid(\"()[]{}\")  → True\nis_valid(\"(]\")      → False\nis_valid(\"([)]\")    → False   (closed in the wrong order)\nis_valid(\"{[]}\")    → True<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"Does every bracket close properly, like nested boxes?\"<\/p>\n<p><b>Real-life picture:<\/b> you're stacking boxes inside boxes. Each <code>(<\/code>, <code>[<\/code>, <code>{<\/code> opens a new box <b>on top of the pile<\/b>. A closing bracket must close <b>the most recently opened box<\/b>, the one on top. If the top box is a <code>[<\/code> but you see <code>)<\/code>, that's wrong. At the end the pile must be empty (every box closed).<\/p>\n<p>\"Most recent first\" is exactly what a <b>stack<\/b> gives you.<\/p>", "approach": "<ol><li><code>pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}<\/code>.<\/li><li>For each character: - An opener: push it. - A closer: if the stack is empty, or its top isn't the matching opener, return False. Otherwise pop.<\/li><li>At the end, return <code>not stack<\/code> (everything was closed).<\/li><\/ol>\n<h4>Walk-through on \"([)]\"<\/h4>\n<table><tr><th>ch<\/th><th>stack before<\/th><th>action<\/th><\/tr><tr><td>(<\/td><td>[]<\/td><td>push → [(]<\/td><\/tr><tr><td>[<\/td><td>[(]<\/td><td>push → [(, []<\/td><\/tr><tr><td>)<\/td><td>[(, []<\/td><td>top is [ but we need ( → <b>False<\/b><\/td><\/tr><\/table>", "hints": ["The most recently opened bracket must be closed first.", "Push openers onto a stack, and for closers check the top."], "starter": "def is_valid(s):\n    pass\n", "solution": "def is_valid(s):\n    pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    stack = []\n    for ch in s:\n        if ch in pairs:                                  # a closing bracket\n            if not stack or stack[-1] != pairs[ch]:\n                return False                             # nothing to close, or the wrong type\n            stack.pop()\n        else:\n            stack.append(ch)                             # an opening bracket\n    return not stack                                     # leftover openers = invalid\n", "complexity": "<p><b>Time O(n)<\/b>, <b>Space O(n)<\/b>.<\/p>", "mistakes": "<ul><li>Only counting brackets. \"([)]\" has balanced counts but is invalid.<\/li><li>Forgetting the final empty check (\"((\" must be False).<\/li><\/ul>", "tests": "\nT(\"simple\", lambda: is_valid(\"()[]{}\"), True)\nT(\"wrong type\", lambda: is_valid(\"(]\"), False)\nT(\"wrong order\", lambda: is_valid(\"([)]\"), False)\nT(\"nested\", lambda: is_valid(\"{[]}\"), True)\nT(\"unclosed\", lambda: is_valid(\"((\"), False)\nT(\"closer first\", lambda: is_valid(\"]\"), False)\n"}, {"id": "min-stack", "topic": "stack", "level": "Medium", "title": "Min Stack (DSA extra)", "blind": false, "lc": 155, "statement": "<p>Design a class <code>MinStack<\/code> with <code>push(x)<\/code>, <code>pop()<\/code>, <code>top()<\/code> and <code>get_min()<\/code>, where <b>every operation is O(1)<\/b>. <code>get_min()<\/code> returns the smallest element currently in the stack.<\/p>", "examples": "<pre class=\"plain\">s = MinStack(); s.push(-2); s.push(0); s.push(-3)\ns.get_min() → -3;  s.pop();  s.top() → 0;  s.get_min() → -2<\/pre>", "eli10": "<p>The difficulty: after you pop the smallest element, what's the new minimum? Searching the whole stack would be slow.<\/p>\n<p>Trick: next to each plate, write down <b>\"the minimum of everything at or below this plate\"<\/b>. When you pop a plate, the plate under it already knows the minimum for the stack that remains!<\/p>", "approach": "<p>Store pairs <code>(value, min_so_far)<\/code>. On push: <code>min_so_far = min(x, current_min)<\/code>. <code>get_min()<\/code> just reads the top pair's second value.<\/p>", "hints": ["Store the current minimum alongside each element."], "starter": "class MinStack:\n    def __init__(self):\n        pass\n    def push(self, x):\n        pass\n    def pop(self):\n        pass\n    def top(self):\n        pass\n    def get_min(self):\n        pass\n", "solution": "class MinStack:\n    def __init__(self):\n        self.items = []                     # pairs: (value, min of this and everything below)\n    def push(self, x):\n        current_min = min(x, self.items[-1][1]) if self.items else x\n        self.items.append((x, current_min))\n    def pop(self):\n        self.items.pop()\n    def top(self):\n        return self.items[-1][0]\n    def get_min(self):\n        return self.items[-1][1]\n", "complexity": "<p><b>All operations O(1)<\/b>. <b>Space O(n)<\/b>.<\/p>", "mistakes": "", "tests": "\ndef _run():\n    s = MinStack(); s.push(-2); s.push(0); s.push(-3)\n    out = [s.get_min()]; s.pop(); out += [s.top(), s.get_min()]\n    return out\nT(\"example\", _run, [-3, 0, -2])\ndef _run2():\n    s = MinStack(); s.push(5); s.push(5); s.pop(); return s.get_min()\nT(\"equal values\", _run2, 5)\ndef _run3():\n    s = MinStack()\n    for x in [3, 1, 4, 1, 5]: s.push(x)\n    mins = []\n    for _ in range(5): mins.append(s.get_min()); s.pop()\n    return mins\nT(\"pop sequence\", _run3, [1, 1, 1, 1, 3])\n"}, {"id": "daily-temperatures", "topic": "stack", "level": "Medium", "title": "Daily Temperatures (DSA extra: monotonic stack)", "blind": false, "lc": 739, "statement": "<p>Given daily <code>temps<\/code>, return a list <code>answer<\/code> where <code>answer[i]<\/code> is <b>how many days you wait after day i for a warmer temperature<\/b>, or 0 if that never happens.<\/p>", "examples": "<pre class=\"plain\">daily_temperatures([73, 74, 75, 71, 69, 72, 76, 73]) → [1, 1, 4, 2, 1, 1, 0, 0]<\/pre>", "eli10": "<p>Picture people in a queue, each holding a temperature card and waiting for someone warmer to arrive. Keep a <b>stack of people still waiting<\/b>. When a new, warmer day comes, everyone waiting with a colder card gets their answer: the day difference. They leave the stack.<\/p>\n<p>The stack always holds temperatures in <b>decreasing<\/b> order from bottom to top. That's called a <b>monotonic stack<\/b>, a pattern used in many \"next greater element\" problems.<\/p>", "approach": "<ol><li><code>stack<\/code> holds the <b>indices<\/b> of days still waiting.<\/li><li>For each day <code>i<\/code>: while the stack isn't empty and <code>temps[i] &gt; temps[stack[-1]]<\/code>, pop <code>j<\/code> and set <code>answer[j] = i - j<\/code>.<\/li><li>Push <code>i<\/code>.<\/li><\/ol>", "hints": ["Keep the indices of days still waiting for a warmer day.", "A warmer day resolves everyone colder on top of the stack."], "starter": "def daily_temperatures(temps):\n    pass\n", "solution": "def daily_temperatures(temps):\n    answer = [0] * len(temps)\n    stack = []                                   # indices still waiting (decreasing temperatures)\n    for i, t in enumerate(temps):\n        while stack and t > temps[stack[-1]]:\n            j = stack.pop()\n            answer[j] = i - j                    # day j waited i - j days\n        stack.append(i)\n    return answer\n", "complexity": "<p><b>Time O(n)<\/b>: each index is pushed and popped at most once. <b>Space O(n)<\/b>.<\/p>", "mistakes": "", "tests": "\nT(\"example\", lambda: daily_temperatures([73, 74, 75, 71, 69, 72, 76, 73]), [1, 1, 4, 2, 1, 1, 0, 0])\nT(\"increasing\", lambda: daily_temperatures([30, 40, 50, 60]), [1, 1, 1, 0])\nT(\"decreasing\", lambda: daily_temperatures([60, 50, 40]), [0, 0, 0])\n"}, {"id": "binary-search", "topic": "binary-search", "level": "Easy", "title": "Classic Binary Search", "blind": false, "lc": 704, "statement": "<p>Given a <b>sorted<\/b> list <code>nums<\/code> and a <code>target<\/code>, return the index of <code>target<\/code>, or <code>-1<\/code> if it isn't there. Must be <b>O(log n)<\/b>.<\/p>", "examples": "<pre class=\"plain\">search([-1, 0, 3, 5, 9, 12], 9)  → 4\nsearch([-1, 0, 3, 5, 9, 12], 2)  → -1<\/pre>", "eli10": "<p>The \"guess my number between 1 and 100\" game: you guess 50. \"Higher!\" Now you know it's 51–100, so you threw away half the possibilities with one guess. Guess the middle again (75), and so on. With 100 numbers you need at most 7 guesses. With a million, about 20!<\/p>\n<p>That's why binary search is <b>O(log n)<\/b>: each step halves the search space.<\/p>", "approach": "<ol><li><code>lo = 0<\/code>, <code>hi = len(nums) - 1<\/code>.<\/li><li>While <code>lo &lt;= hi<\/code>: <code>mid = (lo + hi) // 2<\/code>. - Found → return <code>mid<\/code>. - <code>nums[mid] &lt; target<\/code> → the answer is to the right: <code>lo = mid + 1<\/code>. - Otherwise → <code>hi = mid - 1<\/code>.<\/li><li>Return -1.<\/li><\/ol>", "hints": ["Look at the middle element and decide which half to keep.", "Use <code>while lo &lt;= hi<\/code> and move lo or hi past mid."], "starter": "def search(nums, target):\n    pass\n", "solution": "def search(nums, target):\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[mid] < target:\n            lo = mid + 1           # target is in the right half\n        else:\n            hi = mid - 1           # target is in the left half\n    return -1\n", "complexity": "<p><b>Time O(log n)<\/b>. <b>Space O(1)<\/b>.<\/p>", "mistakes": "<ul><li><code>lo = mid<\/code> instead of <code>mid + 1<\/code> → infinite loop.<\/li><li><code>while lo &lt; hi<\/code> → misses the last remaining element.<\/li><\/ul>", "tests": "\nT(\"found\", lambda: search([-1, 0, 3, 5, 9, 12], 9), 4)\nT(\"missing\", lambda: search([-1, 0, 3, 5, 9, 12], 2), -1)\nT(\"single found\", lambda: search([5], 5), 0)\nT(\"first\", lambda: search([1, 2, 3], 1), 0)\nT(\"big\", lambda: search(list(range(0, 2000000, 2)), 1999998), 999999)\n"}, {"id": "find-min-rotated", "topic": "binary-search", "level": "Medium", "title": "Find Minimum in Rotated Sorted Array", "blind": true, "lc": 153, "statement": "<p>A sorted list of <b>distinct<\/b> numbers was <b>rotated<\/b>: some prefix was moved to the end, e.g. <code>[0,1,2,4,5,6,7]<\/code> → <code>[4,5,6,7,0,1,2]<\/code>. Return the <b>minimum<\/b> in O(log n).<\/p>", "examples": "<pre class=\"plain\">find_min([3, 4, 5, 1, 2])         → 1\nfind_min([4, 5, 6, 7, 0, 1, 2])   → 0\nfind_min([11, 13, 15, 17])        → 11   (rotated 0 times)<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"Where is the 'drop' in a sorted list that got cut and re-glued?\"<\/p>\n<p><b>Real-life picture:<\/b> the list looks like a hill that goes up, then <b>falls off a cliff<\/b>, then goes up again: <code>4 5 6 7 | 0 1 2<\/code>. The minimum is right after the cliff.<\/p>\n<p>Look at the <b>middle<\/b> and compare it with the <b>last<\/b> element:<\/p>\n<ul><li>If middle &gt; last, the cliff is somewhere to the <b>right<\/b> of the middle (we're still on the first, high part).<\/li><li>If middle &lt; last, everything from the middle to the end is a nice sorted climb, so the cliff (the minimum) is at the middle or to its <b>left<\/b>.<\/li><\/ul>\n<p>Each comparison throws away half, which is binary search!<\/p>", "approach": "<ol><li><code>lo = 0<\/code>, <code>hi = n - 1<\/code>.<\/li><li>While <code>lo &lt; hi<\/code>: - <code>mid = (lo + hi) // 2<\/code> - If <code>nums[mid] &gt; nums[hi]<\/code>: the minimum is right of mid → <code>lo = mid + 1<\/code>. - Else: the minimum is at mid or left → <code>hi = mid<\/code> (keep mid, it might be the answer!).<\/li><li>Return <code>nums[lo]<\/code>.<\/li><\/ol>\n<h4>Walk-through on [4, 5, 6, 7, 0, 1, 2]<\/h4>\n<table><tr><th>lo<\/th><th>hi<\/th><th>mid<\/th><th>nums[mid] vs nums[hi]<\/th><th>move<\/th><\/tr><tr><td>0<\/td><td>6<\/td><td>3<\/td><td>7 &gt; 2<\/td><td>lo = 4<\/td><\/tr><tr><td>4<\/td><td>6<\/td><td>5<\/td><td>1 &lt; 2<\/td><td>hi = 5<\/td><\/tr><tr><td>4<\/td><td>5<\/td><td>4<\/td><td>0 &lt; 1<\/td><td>hi = 4<\/td><\/tr><tr><td>4<\/td><td>4<\/td><td>—<\/td><td>stop<\/td><td>answer nums[4] = <b>0<\/b><\/td><\/tr><\/table>", "hints": ["Compare the middle element with the last element.", "If middle &gt; last, the minimum is to the right.", "Otherwise the minimum is at mid or to its left (don't exclude mid)."], "starter": "def find_min(nums):\n    pass\n", "solution": "def find_min(nums):\n    lo, hi = 0, len(nums) - 1\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if nums[mid] > nums[hi]:\n            lo = mid + 1          # the cliff is to the right of mid\n        else:\n            hi = mid              # mid could be the minimum, so keep it\n    return nums[lo]\n", "complexity": "<p><b>Time O(log n)<\/b>. <b>Space O(1)<\/b>.<\/p>", "mistakes": "<ul><li>Writing <code>hi = mid - 1<\/code>, which can jump past the minimum.<\/li><li>Comparing with <code>nums[lo]<\/code> instead of <code>nums[hi]<\/code>, which gets the non-rotated case wrong.<\/li><\/ul>", "tests": "\nT(\"example 1\", lambda: find_min([3, 4, 5, 1, 2]), 1)\nT(\"example 2\", lambda: find_min([4, 5, 6, 7, 0, 1, 2]), 0)\nT(\"not rotated\", lambda: find_min([11, 13, 15, 17]), 11)\nT(\"two items\", lambda: find_min([2, 1]), 1)\nT(\"single\", lambda: find_min([7]), 7)\n"}, {"id": "search-rotated", "topic": "binary-search", "level": "Medium", "title": "Search in Rotated Sorted Array", "blind": true, "lc": 33, "statement": "<p>A sorted list of distinct numbers was rotated (like the previous problem). Return the index of <code>target<\/code>, or -1. Must be O(log n).<\/p>", "examples": "<pre class=\"plain\">search_rotated([4, 5, 6, 7, 0, 1, 2], 0)  → 4\nsearch_rotated([4, 5, 6, 7, 0, 1, 2], 3)  → -1<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> binary search, but the list is \"broken\" in one place.<\/p>\n<p><b>The key insight:<\/b> cut a rotated list at <b>any<\/b> middle, and <b>at least one half is perfectly sorted<\/b>. Check which half is sorted (compare its ends). Then ask the easy question: <i>\"Is the target inside the sorted half's range?\"<\/i><\/p>\n<ul><li>Yes → search there.<\/li><li>No → it must be in the other half.<\/li><\/ul>\n<p>Example: <code>[4 5 6 7 | 0 1 2]<\/code>, mid = 7. The left half 4…7 is sorted. Is 0 between 4 and 7? No, so go right.<\/p>", "approach": "<p>While <code>lo &lt;= hi<\/code>:<\/p>\n<ol><li><code>mid<\/code>. If <code>nums[mid] == target<\/code> → return mid.<\/li><li>If <code>nums[lo] &lt;= nums[mid]<\/code> (the <b>left half is sorted<\/b>): - If <code>nums[lo] &lt;= target &lt; nums[mid]<\/code> → <code>hi = mid - 1<\/code>, else <code>lo = mid + 1<\/code>.<\/li><li>Else (the <b>right half is sorted<\/b>): - If <code>nums[mid] &lt; target &lt;= nums[hi]<\/code> → <code>lo = mid + 1<\/code>, else <code>hi = mid - 1<\/code>.<\/li><\/ol>", "hints": ["One of the two halves around mid is always sorted.", "Figure out which half is sorted by comparing nums[lo] and nums[mid].", "Check whether the target lies within that sorted half's range."], "starter": "def search_rotated(nums, target):\n    pass\n", "solution": "def search_rotated(nums, target):\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[lo] <= nums[mid]:                    # left half is sorted\n            if nums[lo] <= target < nums[mid]:\n                hi = mid - 1                         # target is inside the sorted left half\n            else:\n                lo = mid + 1\n        else:                                        # right half is sorted\n            if nums[mid] < target <= nums[hi]:\n                lo = mid + 1                         # target is inside the sorted right half\n            else:\n                hi = mid - 1\n    return -1\n", "complexity": "<p><b>Time O(log n)<\/b>. <b>Space O(1)<\/b>.<\/p>", "mistakes": "<ul><li>Using <code>&lt;<\/code> instead of <code>&lt;=<\/code> in <code>nums[lo] &lt;= nums[mid]<\/code>. When lo == mid, the left 'half' is a single element and counts as sorted.<\/li><\/ul>", "tests": "\nT(\"example 1\", lambda: search_rotated([4, 5, 6, 7, 0, 1, 2], 0), 4)\nT(\"missing\", lambda: search_rotated([4, 5, 6, 7, 0, 1, 2], 3), -1)\nT(\"single missing\", lambda: search_rotated([1], 0), -1)\nT(\"two items\", lambda: search_rotated([3, 1], 1), 1)\nT(\"in left part\", lambda: search_rotated([5, 1, 3], 5), 0)\nT(\"not rotated\", lambda: search_rotated([1, 2, 3, 4, 5], 4), 3)\n"}, {"id": "ll-count", "topic": "linked-list", "level": "Warm-up", "title": "Count and Sum a Linked List", "blind": false, "lc": null, "statement": "<p>A <b>linked list<\/b> is a chain of <code>ListNode<\/code>s. Each node has a <code>.val<\/code> and a <code>.next<\/code>, which points to the next node (<code>None<\/code> at the end). Given the <code>head<\/code>, return <code>(count, total)<\/code>: the number of nodes and the sum of their values.<\/p>\n<p>The helpers <code>ListNode<\/code>, <code>to_ll([...])<\/code> and <code>from_ll(head)<\/code> are already available.<\/p>", "examples": "<pre class=\"plain\">count_and_sum(to_ll([3, 1, 4]))  → (3, 8)\ncount_and_sum(None)              → (0, 0)    (an empty list)<\/pre>", "eli10": "<p>A linked list is a <b>treasure hunt<\/b>. You hold the first clue (the head). Each clue has a value written on it and tells you where the next clue is. To visit everything, you keep following \"next\" until there's no next clue (<code>None<\/code>).<\/p>\n<p>Unlike a Python list, you <b>can't jump to position 5<\/b>. You have to walk there one clue at a time.<\/p>", "approach": "<pre><code>node = head\nwhile node is not None:\n    ...use node.val...\n    node = node.next      # follow the arrow<\/code><\/pre>\n<p>This walking loop is the base of every linked list problem.<\/p>", "hints": ["Use a variable <code>node<\/code> that starts at head and moves to node.next each step."], "starter": "def count_and_sum(head):\n    pass\n", "solution": "def count_and_sum(head):\n    count = total = 0\n    node = head\n    while node is not None:\n        count += 1\n        total += node.val\n        node = node.next          # move to the next clue\n    return (count, total)\n", "complexity": "<p><b>Time O(n)<\/b>, <b>Space O(1)<\/b>.<\/p>", "mistakes": "", "tests": "\nT(\"three nodes\", lambda: count_and_sum(to_ll([3, 1, 4])), (3, 8))\nT(\"empty\", lambda: count_and_sum(None), (0, 0))\nT(\"one node\", lambda: count_and_sum(to_ll([-5])), (1, -5))\n"}, {"id": "reverse-linked-list", "topic": "linked-list", "level": "Easy", "title": "Reverse Linked List", "blind": true, "lc": 206, "statement": "<p>Reverse a singly linked list and return the <b>new head<\/b>.<\/p>", "examples": "<pre class=\"plain\">1 -&gt; 2 -&gt; 3 -&gt; 4 -&gt; 5   becomes   5 -&gt; 4 -&gt; 3 -&gt; 2 -&gt; 1\nfrom_ll(reverse_list(to_ll([1, 2, 3, 4, 5])))  → [5, 4, 3, 2, 1]<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"Make every arrow point backwards.\"<\/p>\n<p><b>Real-life picture:<\/b> kids stand in a line, each pointing at the kid <b>in front<\/b> of them. You walk down the line and tell each kid: <i>\"Turn around and point at the kid <b>behind<\/b> you instead.\"<\/i> The danger: once a kid turns around, you lose track of who was in front. So <b>before<\/b> turning them, remember the next kid.<\/p>\n<p>You need three hands:<\/p>\n<ul><li><code>prev<\/code>: the kid behind (the new direction to point at),<\/li><li><code>curr<\/code>: the kid you're turning now,<\/li><li><code>nxt<\/code>: the kid in front (saved before turning, so you don't lose the rest of the line).<\/li><\/ul>", "approach": "<pre class=\"plain\">prev = None, curr = head\nrepeat while curr:\n    nxt = curr.next      # 1. remember the rest of the line\n    curr.next = prev     # 2. turn the arrow around\n    prev = curr          # 3. step forward: prev moves up\n    curr = nxt           #    and curr moves up\nreturn prev              # the old tail is the new head<\/pre>\n<h4>Walk-through on 1 → 2 → 3<\/h4>\n<table><tr><th>step<\/th><th>prev<\/th><th>curr<\/th><th>what changes<\/th><\/tr><tr><td>start<\/td><td>None<\/td><td>1<\/td><td><\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>2<\/td><td>1 now points to None<\/td><\/tr><tr><td>2<\/td><td>2<\/td><td>3<\/td><td>2 now points to 1<\/td><\/tr><tr><td>3<\/td><td>3<\/td><td>None<\/td><td>3 now points to 2 → done, the head is 3<\/td><\/tr><\/table>", "hints": ["You need to remember the next node before changing curr.next.", "Use three variables: prev, curr, nxt.", "At the end, prev is the new head."], "starter": "def reverse_list(head):\n    pass\n", "solution": "def reverse_list(head):\n    prev, curr = None, head\n    while curr:\n        nxt = curr.next       # save the rest of the list\n        curr.next = prev      # flip the arrow\n        prev, curr = curr, nxt\n    return prev               # the old last node is the new head\n", "complexity": "<p><b>Time O(n)<\/b>, <b>Space O(1)<\/b>. (The recursive version is O(n) space because of the call stack.)<\/p>", "mistakes": "<ul><li>Writing <code>curr.next = prev<\/code> before saving <code>curr.next<\/code>. You lose the rest of the list.<\/li><li>Returning <code>head<\/code>, which is now the <b>last<\/b> node.<\/li><\/ul>", "tests": "\nT(\"five nodes\", lambda: from_ll(reverse_list(to_ll([1, 2, 3, 4, 5]))), [5, 4, 3, 2, 1])\nT(\"two nodes\", lambda: from_ll(reverse_list(to_ll([1, 2]))), [2, 1])\nT(\"empty\", lambda: from_ll(reverse_list(None)), [])\nT(\"long\", lambda: from_ll(reverse_list(to_ll(range(5000)))), list(range(4999, -1, -1)))\n"}, {"id": "merge-two-lists", "topic": "linked-list", "level": "Easy", "title": "Merge Two Sorted Lists", "blind": true, "lc": 21, "statement": "<p>Merge two <b>sorted<\/b> linked lists into one sorted list (by re-linking the nodes) and return its head.<\/p>", "examples": "<pre class=\"plain\">merge_two_lists(to_ll([1, 2, 4]), to_ll([1, 3, 4]))  → 1 -&gt; 1 -&gt; 2 -&gt; 3 -&gt; 4 -&gt; 4<\/pre>", "eli10": "<p><b>Real-life picture:<\/b> two queues of students, each already sorted by height. You form one new sorted queue. At each step, look at the <b>front<\/b> student of both queues, and send the <b>shorter<\/b> one to the new queue. When one queue is empty, the whole other queue just joins at the end (it's already sorted).<\/p>\n<p><b>The \"dummy node\" trick:<\/b> starting the new queue is awkward (who is first?). So put a <b>fake student<\/b> at the front (a dummy). Build after it, and at the end return <code>dummy.next<\/code>. This removes all the special cases.<\/p>", "approach": "<ol><li><code>dummy = tail = ListNode()<\/code>.<\/li><li>While both lists have nodes: attach the smaller front node to <code>tail.next<\/code>, advance that list, and advance <code>tail<\/code>.<\/li><li>Attach whichever list remains: <code>tail.next = l1 or l2<\/code>.<\/li><li>Return <code>dummy.next<\/code>.<\/li><\/ol>", "hints": ["Compare the two front nodes and take the smaller one.", "A dummy starting node avoids special-casing the head.", "When one list runs out, attach the rest of the other."], "starter": "def merge_two_lists(l1, l2):\n    pass\n", "solution": "def merge_two_lists(l1, l2):\n    dummy = tail = ListNode()          # fake head: we return dummy.next\n    while l1 and l2:\n        if l1.val <= l2.val:\n            tail.next, l1 = l1, l1.next\n        else:\n            tail.next, l2 = l2, l2.next\n        tail = tail.next\n    tail.next = l1 or l2               # the leftover is already sorted\n    return dummy.next\n", "complexity": "<p><b>Time O(n + m)<\/b>, <b>Space O(1)<\/b>: we only re-link existing nodes.<\/p>", "mistakes": "", "tests": "\nT(\"example\", lambda: from_ll(merge_two_lists(to_ll([1, 2, 4]), to_ll([1, 3, 4]))), [1, 1, 2, 3, 4, 4])\nT(\"both empty\", lambda: from_ll(merge_two_lists(None, None)), [])\nT(\"one empty\", lambda: from_ll(merge_two_lists(None, to_ll([0]))), [0])\nT(\"disjoint\", lambda: from_ll(merge_two_lists(to_ll([5, 6]), to_ll([1, 2]))), [1, 2, 5, 6])\n"}, {"id": "linked-list-cycle", "topic": "linked-list", "level": "Easy", "title": "Linked List Cycle", "blind": true, "lc": 141, "statement": "<p>Return <code>True<\/code> if the linked list has a <b>cycle<\/b> (some node's <code>next<\/code> points back to an earlier node), else <code>False<\/code>. Try for O(1) memory.<\/p>", "examples": "<pre class=\"plain\">3 -&gt; 2 -&gt; 0 -&gt; -4 --+\n     ^--------------+     → True\n1 -&gt; 2 -&gt; None           → False<\/pre>", "eli10": "<p><b>Real-life picture:<\/b> two runners on a track: a <b>tortoise<\/b> (1 step at a time) and a <b>hare<\/b> (2 steps at a time).<\/p>\n<ul><li>If the track is a straight road with an end, the hare reaches the end and we know there's no loop.<\/li><li>If the track is a <b>circular loop<\/b>, the hare keeps lapping around and eventually <b>catches up with the tortoise<\/b> from behind.<\/li><\/ul>\n<p>So: move slow by 1 and fast by 2. If they ever land on the same node, there's a cycle. This is <b>Floyd's cycle detection<\/b> (\"tortoise and hare\").<\/p>\n<p>Easy alternative: keep a set of visited nodes. If you see one again, it's a cycle. That uses O(n) memory.<\/p>", "approach": "<pre class=\"plain\">slow = fast = head\nwhile fast and fast.next:\n    slow = slow.next\n    fast = fast.next.next\n    if slow is fast: return True\nreturn False<\/pre>\n<p>Why must they meet? Inside the loop, the gap between them shrinks by 1 every step, so it must reach 0.<\/p>", "hints": ["Two pointers at different speeds.", "If the fast pointer reaches None, there's no cycle.", "Compare nodes with <code>is<\/code>, not by value."], "starter": "def has_cycle(head):\n    pass\n", "solution": "def has_cycle(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next             # 1 step\n        fast = fast.next.next        # 2 steps\n        if slow is fast:             # the hare lapped the tortoise\n            return True\n    return False                     # the hare reached the end of the road\n", "complexity": "<p><b>Time O(n)<\/b>, <b>Space O(1)<\/b>.<\/p>", "mistakes": "<ul><li>Comparing <code>slow.val == fast.val<\/code>. Different nodes can hold equal values, so compare the node objects with <code>is<\/code>.<\/li><\/ul>", "tests": "\ndef _cyc(vals, pos):\n    head = to_ll(vals)\n    if pos >= 0:\n        tail = head; target = head\n        for _ in range(pos): target = target.next\n        while tail.next: tail = tail.next\n        tail.next = target\n    return head\nT(\"cycle\", lambda: has_cycle(_cyc([3, 2, 0, -4], 1)), True)\nT(\"two-node cycle\", lambda: has_cycle(_cyc([1, 2], 0)), True)\nT(\"no cycle\", lambda: has_cycle(_cyc([1, 2, 3], -1)), False)\nT(\"empty\", lambda: has_cycle(None), False)\nT(\"equal values, no cycle\", lambda: has_cycle(to_ll([1, 1, 1, 1])), False)\n"}, {"id": "remove-nth-from-end", "topic": "linked-list", "level": "Medium", "title": "Remove Nth Node From End of List", "blind": true, "lc": 19, "statement": "<p>Remove the <b>n-th node from the end<\/b> of the list (n=1 means the last node) and return the head. Try to do it in <b>one pass<\/b>.<\/p>", "examples": "<pre class=\"plain\">remove_nth_from_end(to_ll([1, 2, 3, 4, 5]), 2)  → 1 -&gt; 2 -&gt; 3 -&gt; 5\nremove_nth_from_end(to_ll([1]), 1)              → empty<\/pre>", "eli10": "<p><b>Real-life picture:<\/b> two people walk down a corridor holding a <b>rope of length n<\/b> between them. The front person starts n steps ahead. They walk together at the same speed. When the <b>front person hits the wall<\/b> (the end), the back person is <b>exactly n steps from the end<\/b>, standing just before the node to delete.<\/p>\n<p>A <b>dummy<\/b> node before the head handles the case where we must delete the head itself.<\/p>", "approach": "<ol><li><code>dummy.next = head<\/code>, <code>fast = slow = dummy<\/code>.<\/li><li>Move <code>fast<\/code> <b>n + 1<\/b> steps ahead (so <code>slow<\/code> stops one node <b>before<\/b> the target).<\/li><li>Move both until <code>fast<\/code> is None.<\/li><li><code>slow.next = slow.next.next<\/code> (skip the target).<\/li><li>Return <code>dummy.next<\/code>.<\/li><\/ol>", "hints": ["Use two pointers with a gap of n between them.", "A dummy node handles removing the first node.", "Stop slow one node before the node to remove."], "starter": "def remove_nth_from_end(head, n):\n    pass\n", "solution": "def remove_nth_from_end(head, n):\n    dummy = ListNode(0, head)\n    fast = slow = dummy\n    for _ in range(n + 1):\n        fast = fast.next               # open a gap of n + 1\n    while fast:\n        fast, slow = fast.next, slow.next\n    slow.next = slow.next.next         # skip the n-th node from the end\n    return dummy.next\n", "complexity": "<p><b>Time O(length)<\/b>, one pass. <b>Space O(1)<\/b>.<\/p>", "mistakes": "", "tests": "\nT(\"example\", lambda: from_ll(remove_nth_from_end(to_ll([1, 2, 3, 4, 5]), 2)), [1, 2, 3, 5])\nT(\"only node\", lambda: from_ll(remove_nth_from_end(to_ll([1]), 1)), [])\nT(\"remove head\", lambda: from_ll(remove_nth_from_end(to_ll([1, 2]), 2)), [2])\nT(\"remove tail\", lambda: from_ll(remove_nth_from_end(to_ll([1, 2]), 1)), [1])\n"}, {"id": "reorder-list", "topic": "linked-list", "level": "Medium", "title": "Reorder List", "blind": true, "lc": 143, "statement": "<p>Reorder <code>L0 → L1 → … → Ln<\/code> into <code>L0 → Ln → L1 → Ln-1 → L2 → …<\/code> <b>in place<\/b> (change the links, return nothing).<\/p>", "examples": "<pre class=\"plain\">1 -&gt; 2 -&gt; 3 -&gt; 4        becomes  1 -&gt; 4 -&gt; 2 -&gt; 3\n1 -&gt; 2 -&gt; 3 -&gt; 4 -&gt; 5   becomes  1 -&gt; 5 -&gt; 2 -&gt; 4 -&gt; 3<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"Alternate between taking from the front and the back.\"<\/p>\n<p><b>Real-life picture:<\/b> a deck of cards numbered 1 to 5. Cut it in <b>half<\/b>: [1 2 3] and [4 5]. Turn the second half <b>upside down<\/b>: [5 4]. Now <b>shuffle them together<\/b>, one from each pile: 1, 5, 2, 4, 3.<\/p>\n<p>That's three problems you already know:<\/p>\n<ol><li><b>Find the middle<\/b> (slow/fast pointers, like the cycle problem).<\/li><li><b>Reverse<\/b> the second half (Reverse Linked List).<\/li><li><b>Merge alternately<\/b> (like Merge Two Lists, but alternating).<\/li><\/ol>", "approach": "<ol><li>Middle: <code>slow, fast = head, head.next<\/code>, and while <code>fast and fast.next<\/code>: slow +1, fast +2. <code>slow<\/code> ends at the end of the first half.<\/li><li><code>second = slow.next<\/code>, <code>slow.next = None<\/code> (cut), then reverse <code>second<\/code>.<\/li><li>Weave: <code>first, second = head, reversed<\/code>. While <code>second<\/code>: save both nexts, link <code>first → second → first's old next<\/code>, and advance.<\/li><\/ol>", "hints": ["Break it into: find the middle, reverse the second half, merge alternately.", "Don't forget to cut the list in the middle (set next to None)."], "starter": "def reorder_list(head):\n    # modify the list in place; return nothing\n    pass\n", "solution": "def reorder_list(head):\n    if not head or not head.next:\n        return\n    slow, fast = head, head.next          # 1. find the middle\n    while fast and fast.next:\n        slow, fast = slow.next, fast.next.next\n    second = slow.next\n    slow.next = None                      # cut into two halves\n    prev = None                           # 2. reverse the second half\n    while second:\n        second.next, prev, second = prev, second, second.next\n    first, second = head, prev            # 3. weave them together\n    while second:\n        f_next, s_next = first.next, second.next\n        first.next = second\n        second.next = f_next\n        first, second = f_next, s_next\n", "complexity": "<p><b>Time O(n)<\/b>, <b>Space O(1)<\/b>.<\/p>", "mistakes": "<ul><li>Forgetting to cut the first half (<code>slow.next = None<\/code>), which creates a cycle.<\/li><\/ul>", "tests": "\ndef _ro(vals):\n    h = to_ll(vals); reorder_list(h); return from_ll(h, 100)\nT(\"even\", lambda: _ro([1, 2, 3, 4]), [1, 4, 2, 3])\nT(\"odd\", lambda: _ro([1, 2, 3, 4, 5]), [1, 5, 2, 4, 3])\nT(\"one\", lambda: _ro([1]), [1])\nT(\"two\", lambda: _ro([1, 2]), [1, 2])\n"}, {"id": "merge-k-lists", "topic": "linked-list", "level": "Hard", "title": "Merge K Sorted Lists", "blind": true, "lc": 23, "statement": "<p>Given a list of <code>k<\/code> sorted linked lists, merge them into one sorted linked list and return its head.<\/p>", "examples": "<pre class=\"plain\">merge_k_lists([to_ll([1, 4, 5]), to_ll([1, 3, 4]), to_ll([2, 6])])  → 1 1 2 3 4 4 5 6\nmerge_k_lists([])  → empty<\/pre>", "eli10": "<p><b>Real-life picture:<\/b> k sorted queues of students at k doors, and you need one sorted queue. At each step you want <b>the shortest student among all the k fronts<\/b>. Looking at all k fronts every time is slow (k checks per student).<\/p>\n<p>Use a <b>min-heap<\/b> (a \"magic box\" that always gives you the smallest item fast, in O(log k)). Put the front student of each queue in the box. Take out the smallest, add it to the result, and put <b>that queue's next student<\/b> into the box. Repeat until the box is empty.<\/p>\n<p>(Divide and conquer also works: merge the lists in pairs, like a tournament, using Merge Two Lists. That's also O(N log k).)<\/p>", "approach": "<ol><li>Push <code>(node.val, i, node)<\/code> for each non-empty list. The index <code>i<\/code> breaks ties, because Python can't compare two ListNodes.<\/li><li><code>dummy = tail = ListNode()<\/code>.<\/li><li>While the heap isn't empty: pop the smallest <code>(val, i, node)<\/code>, attach it, and if <code>node.next<\/code> exists, push <code>(node.next.val, i, node.next)<\/code>.<\/li><li>Return <code>dummy.next<\/code>.<\/li><\/ol>", "hints": ["You need the smallest of k front nodes repeatedly. Which data structure does that fast?", "Python's heapq is a min-heap. Store (value, tie_breaker, node)."], "starter": "import heapq\n\ndef merge_k_lists(lists):\n    pass\n", "solution": "import heapq\n\ndef merge_k_lists(lists):\n    heap = [(node.val, i, node) for i, node in enumerate(lists) if node]\n    heapq.heapify(heap)                         # the k front nodes\n    dummy = tail = ListNode()\n    while heap:\n        val, i, node = heapq.heappop(heap)      # the smallest front of all lists\n        tail.next = node\n        tail = node\n        if node.next:\n            heapq.heappush(heap, (node.next.val, i, node.next))   # replace it with its successor\n    return dummy.next\n", "complexity": "<p><b>Time O(N log k)<\/b>: N total nodes, each push/pop is log k. <b>Space O(k)<\/b> for the heap.<\/p>", "mistakes": "<ul><li>Pushing <code>(val, node)<\/code> without a tie-breaker → <code>TypeError: '&lt;' not supported between ListNode<\/code> when values are equal.<\/li><li>Collecting all values, sorting, and rebuilding is O(N log N). It works, but it's not what interviewers want.<\/li><\/ul>", "tests": "\nT(\"example\", lambda: from_ll(merge_k_lists([to_ll([1, 4, 5]), to_ll([1, 3, 4]), to_ll([2, 6])])), [1, 1, 2, 3, 4, 4, 5, 6])\nT(\"no lists\", lambda: from_ll(merge_k_lists([])), [])\nT(\"empty lists\", lambda: from_ll(merge_k_lists([None, None])), [])\nT(\"many equal values\", lambda: from_ll(merge_k_lists([to_ll([1, 1]), to_ll([1]), to_ll([1, 1])])), [1, 1, 1, 1, 1])\n"}, {"id": "tree-sum", "topic": "trees", "level": "Warm-up", "title": "Sum and Count the Nodes of a Tree", "blind": false, "lc": null, "statement": "<p>A binary tree node (<code>TreeNode<\/code>) has <code>.val<\/code>, <code>.left<\/code> and <code>.right<\/code>. Return the <b>sum of all values<\/b> in the tree. (The helper <code>to_tree([...])<\/code> builds a tree from a level-order list.)<\/p>", "examples": "<pre class=\"plain\">        5\n       / \\\n      3   8       tree_sum(to_tree([5, 3, 8, 1])) → 17\n     /\n    1<\/pre>", "eli10": "<p>A tree is like a <b>family tree<\/b> or folders inside folders. The magic tool for trees is <b>recursion<\/b>: a function that calls itself on smaller pieces.<\/p>\n<p>To sum a tree, ask: <i>\"What's the sum of my tree?\"<\/i> It's <b>my value + the sum of my left subtree + the sum of my right subtree<\/b>. Each subtree is just a smaller tree, so the same function handles it. An empty tree (<code>None<\/code>) has sum 0. That's the <b>base case<\/b> that stops the recursion.<\/p>\n<p>Almost every tree problem follows this shape:<\/p>\n<pre><code>def solve(node):\n    if node is None: return &lt;answer for empty&gt;\n    left = solve(node.left)\n    right = solve(node.right)\n    return &lt;combine node.val, left, right&gt;<\/code><\/pre>", "approach": "<p><code>return 0 if not node else node.val + tree_sum(node.left) + tree_sum(node.right)<\/code><\/p>", "hints": ["Base case: an empty tree has sum 0.", "Sum = value + sum(left) + sum(right)."], "starter": "def tree_sum(root):\n    pass\n", "solution": "def tree_sum(root):\n    if root is None:\n        return 0                                   # empty tree\n    return root.val + tree_sum(root.left) + tree_sum(root.right)\n", "complexity": "<p><b>Time O(n)<\/b>. <b>Space O(h)<\/b> for the recursion, where h is the tree height.<\/p>", "mistakes": "", "tests": "\nT(\"example\", lambda: tree_sum(to_tree([5, 3, 8, 1])), 17)\nT(\"empty\", lambda: tree_sum(None), 0)\nT(\"negatives\", lambda: tree_sum(to_tree([-1, -2, None, -3])), -6)\n"}, {"id": "invert-tree", "topic": "trees", "level": "Easy", "title": "Invert Binary Tree", "blind": true, "lc": 226, "statement": "<p>Mirror the tree: swap the left and right children of <b>every<\/b> node. Return the root.<\/p>", "examples": "<pre class=\"plain\">     4                4\n   /   \\            /   \\\n  2     7    →     7     2\n / \\   / \\        / \\   / \\\n1   3 6   9      9   6 3   1<\/pre>", "eli10": "<p><b>Real-life picture:<\/b> hold a family-tree poster up to a <b>mirror<\/b>. Everything on the left appears on the right.<\/p>\n<p>With recursion: <i>\"To mirror my tree: swap my two children, then mirror each child's tree.\"<\/i> An empty tree is already mirrored.<\/p>", "approach": "<pre class=\"plain\">invert(node):\n    if node is None: return None\n    node.left, node.right = invert(node.right), invert(node.left)\n    return node<\/pre>\n<p>You can also do it with a queue (BFS), swapping the children of each node you visit.<\/p>", "hints": ["At each node, swap left and right.", "Do the same for both subtrees (recursion)."], "starter": "def invert_tree(root):\n    pass\n", "solution": "def invert_tree(root):\n    if root is None:\n        return None\n    root.left, root.right = invert_tree(root.right), invert_tree(root.left)   # swap the mirrored subtrees\n    return root\n", "complexity": "<p><b>Time O(n)<\/b>, <b>Space O(h)<\/b>.<\/p>", "mistakes": "", "tests": "\nT(\"example\", lambda: from_tree(invert_tree(to_tree([4, 2, 7, 1, 3, 6, 9]))), [4, 7, 2, 9, 6, 3, 1])\nT(\"small\", lambda: from_tree(invert_tree(to_tree([2, 1, 3]))), [2, 3, 1])\nT(\"empty\", lambda: from_tree(invert_tree(None)), [])\nT(\"one-sided\", lambda: from_tree(invert_tree(to_tree([1, 2]))), [1, None, 2])\n"}, {"id": "max-depth", "topic": "trees", "level": "Easy", "title": "Maximum Depth of Binary Tree", "blind": true, "lc": 104, "statement": "<p>Return the tree's <b>maximum depth<\/b>: the number of nodes on the longest path from the root down to a leaf.<\/p>", "examples": "<pre class=\"plain\">max_depth(to_tree([3, 9, 20, None, None, 15, 7]))  → 3\nmax_depth(None)                                    → 0<\/pre>", "eli10": "<p><b>Real-life picture:<\/b> how many generations does a family tree have? A person's tree is <b>1 (themselves) + the deeper of their children's trees<\/b>.<\/p>\n<p><code>depth(node) = 1 + max(depth(left), depth(right))<\/code>, and the depth of nothing is 0.<\/p>", "approach": "<p>Recursion: <code>return 0 if not node else 1 + max(max_depth(node.left), max_depth(node.right))<\/code>. The BFS alternative counts levels with a queue.<\/p>", "hints": ["Depth of an empty tree = 0.", "Depth = 1 + max(depth of left, depth of right)."], "starter": "def max_depth(root):\n    pass\n", "solution": "def max_depth(root):\n    if root is None:\n        return 0\n    return 1 + max(max_depth(root.left), max_depth(root.right))\n", "complexity": "<p><b>Time O(n)<\/b>, <b>Space O(h)<\/b>.<\/p>", "mistakes": "", "tests": "\nT(\"example\", lambda: max_depth(to_tree([3, 9, 20, None, None, 15, 7])), 3)\nT(\"empty\", lambda: max_depth(None), 0)\nT(\"chain\", lambda: max_depth(to_tree([1, None, 2])), 2)\n"}, {"id": "same-tree", "topic": "trees", "level": "Easy", "title": "Same Tree", "blind": true, "lc": 100, "statement": "<p>Return <code>True<\/code> if two binary trees are <b>identical<\/b>: the same shape and the same values.<\/p>", "examples": "<pre class=\"plain\">is_same_tree(to_tree([1, 2, 3]), to_tree([1, 2, 3]))   → True\nis_same_tree(to_tree([1, 2]), to_tree([1, None, 2]))   → False<\/pre>", "eli10": "<p><b>Real-life picture:<\/b> two people compare their family trees branch by branch. Two trees are the same if <b>the roots match<\/b>, the <b>left family trees match<\/b>, and the <b>right family trees match<\/b>.<\/p>\n<p>Base cases: both empty → same. Exactly one empty, or different values → not the same.<\/p>", "approach": "<pre class=\"plain\">same(p, q):\n    if not p and not q: return True\n    if not p or not q or p.val != q.val: return False\n    return same(p.left, q.left) and same(p.right, q.right)<\/pre>", "hints": ["Handle the 'both None' and 'one None' cases first.", "Then compare values and recurse on both sides."], "starter": "def is_same_tree(p, q):\n    pass\n", "solution": "def is_same_tree(p, q):\n    if p is None and q is None:\n        return True                  # both empty\n    if p is None or q is None or p.val != q.val:\n        return False                 # shape or value differs\n    return is_same_tree(p.left, q.left) and is_same_tree(p.right, q.right)\n", "complexity": "<p><b>Time O(n)<\/b>, <b>Space O(h)<\/b>.<\/p>", "mistakes": "", "tests": "\nT(\"same\", lambda: is_same_tree(to_tree([1, 2, 3]), to_tree([1, 2, 3])), True)\nT(\"different shape\", lambda: is_same_tree(to_tree([1, 2]), to_tree([1, None, 2])), False)\nT(\"different values\", lambda: is_same_tree(to_tree([1, 2, 1]), to_tree([1, 1, 2])), False)\nT(\"both empty\", lambda: is_same_tree(None, None), True)\n"}, {"id": "subtree", "topic": "trees", "level": "Easy", "title": "Subtree of Another Tree", "blind": true, "lc": 572, "statement": "<p>Return <code>True<\/code> if <code>sub<\/code> appears <b>inside<\/b> <code>root<\/code> as a subtree: some node of <code>root<\/code> together with <b>all<\/b> of its descendants must equal <code>sub<\/code> exactly.<\/p>", "examples": "<pre class=\"plain\">root = [3, 4, 5, 1, 2], sub = [4, 1, 2]                      → True\nroot = [3, 4, 5, 1, 2, None, None, None, None, 0], sub = [4, 1, 2]  → False  (the 4 there has an extra child 0)<\/pre>", "eli10": "<p><b>Real-life picture:<\/b> \"Is this small family tree (sub) a complete branch somewhere in the big family tree?\"<\/p>\n<p>Walk to <b>every node<\/b> of the big tree and ask: <i>\"Starting here, is the tree exactly the same as <code>sub<\/code>?\"<\/i> You already wrote that check: it's <b>Same Tree<\/b>! So this problem is \"Same Tree, tried at every node\".<\/p>", "approach": "<pre class=\"plain\">is_subtree(root, sub):\n    if root is None: return False        (ran out of places to try)\n    if is_same(root, sub): return True\n    return is_subtree(root.left, sub) or is_subtree(root.right, sub)<\/pre>", "hints": ["Reuse the Same Tree function.", "Try every node of root as the starting point."], "starter": "def is_subtree(root, sub):\n    pass\n", "solution": "def is_subtree(root, sub):\n    def same(a, b):\n        if not a and not b:\n            return True\n        if not a or not b or a.val != b.val:\n            return False\n        return same(a.left, b.left) and same(a.right, b.right)\n\n    if root is None:\n        return sub is None\n    if same(root, sub):\n        return True                       # a match starting here\n    return is_subtree(root.left, sub) or is_subtree(root.right, sub)\n", "complexity": "<p><b>Time O(n · m)<\/b> in the worst case (n nodes, m nodes in sub). <b>Space O(h)<\/b>. (A hashing or serialization trick gives O(n + m).)<\/p>", "mistakes": "", "tests": "\nT(\"yes\", lambda: is_subtree(to_tree([3, 4, 5, 1, 2]), to_tree([4, 1, 2])), True)\nT(\"extra child\", lambda: is_subtree(to_tree([3, 4, 5, 1, 2, None, None, None, None, 0]), to_tree([4, 1, 2])), False)\nT(\"whole tree\", lambda: is_subtree(to_tree([1, 2]), to_tree([1, 2])), True)\nT(\"leaf\", lambda: is_subtree(to_tree([1, 2, 3]), to_tree([3])), True)\n"}, {"id": "lca-bst", "topic": "trees", "level": "Medium", "title": "Lowest Common Ancestor of a BST", "blind": true, "lc": 235, "statement": "<p>In a <b>Binary Search Tree<\/b> (every left descendant &lt; node &lt; every right descendant), find the <b>lowest common ancestor<\/b> of nodes with values <code>p<\/code> and <code>q<\/code>: the deepest node that has both in its subtree (a node counts as its own descendant). Return that node's <b>value<\/b>.<\/p>", "examples": "<pre class=\"plain\">        6\n      /   \\\n     2     8\n    / \\   / \\\n   0   4 7   9\n      / \\\n     3   5\nlca_bst(root, 2, 8) → 6     lca_bst(root, 2, 4) → 2     lca_bst(root, 3, 5) → 4<\/pre>", "eli10": "<p><b>What's a BST?<\/b> A tree where <b>smaller values go left, bigger go right<\/b>, everywhere. Like a sorted list arranged as a tree.<\/p>\n<p><b>What it's really asking:<\/b> \"Where do the paths to p and q split apart?\"<\/p>\n<p><b>Real-life picture:<\/b> you're giving directions from the root. At each node:<\/p>\n<ul><li>If <b>both<\/b> p and q are <b>smaller<\/b>, they're both in the left subtree, so go left.<\/li><li>If <b>both<\/b> are <b>bigger<\/b>, go right.<\/li><li>Otherwise they're on <b>different sides<\/b> (or one of them is this node). This node is where the paths split, so it's the answer!<\/li><\/ul>", "approach": "<pre class=\"plain\">node = root\nwhile node:\n    if p &lt; node.val and q &lt; node.val: node = node.left\n    elif p &gt; node.val and q &gt; node.val: node = node.right\n    else: return node.val<\/pre>\n<p>No recursion is needed. Each step goes one level down: O(h).<\/p>", "hints": ["Use the BST ordering: compare p and q with the current node.", "If both are on the same side, go that way; otherwise you've found the split point."], "starter": "def lca_bst(root, p, q):\n    # p and q are values; return the value of the LCA node\n    pass\n", "solution": "def lca_bst(root, p, q):\n    node = root\n    while node:\n        if p < node.val and q < node.val:\n            node = node.left           # both are in the left subtree\n        elif p > node.val and q > node.val:\n            node = node.right          # both are in the right subtree\n        else:\n            return node.val            # they split here (or one of them IS this node)\n", "complexity": "<p><b>Time O(h)<\/b>: O(log n) if balanced. <b>Space O(1)<\/b>.<\/p>", "mistakes": "", "tests": "\n_t = [6, 2, 8, 0, 4, 7, 9, None, None, 3, 5]\nT(\"split at root\", lambda: lca_bst(to_tree(_t), 2, 8), 6)\nT(\"ancestor is p\", lambda: lca_bst(to_tree(_t), 2, 4), 2)\nT(\"deep\", lambda: lca_bst(to_tree(_t), 3, 5), 4)\nT(\"two nodes\", lambda: lca_bst(to_tree([2, 1]), 2, 1), 2)\n"}, {"id": "level-order", "topic": "trees", "level": "Medium", "title": "Binary Tree Level Order Traversal", "blind": true, "lc": 102, "statement": "<p>Return the node values <b>level by level<\/b>, left to right, as a list of lists.<\/p>", "examples": "<pre class=\"plain\">level_order(to_tree([3, 9, 20, None, None, 15, 7]))  → [[3], [9, 20], [15, 7]]<\/pre>", "eli10": "<p><b>Real-life picture:<\/b> a family photo taken <b>generation by generation<\/b>: grandparents first, then parents, then kids.<\/p>\n<p>Use a <b>queue<\/b> (first in, first out, like a ticket counter line). Start with the root in the queue. For each level: count how many people are in the queue right now (that's the whole current generation). Take them out one by one, write down their values, and add <b>their children<\/b> to the back of the queue. This is <b>BFS (Breadth-First Search)<\/b>.<\/p>", "approach": "<pre class=\"plain\">queue = deque([root])\nwhile queue:\n    level = []\n    for _ in range(len(queue)):        # exactly the nodes of this level\n        node = queue.popleft()\n        level.append(node.val)\n        add node.left / node.right if they exist\n    result.append(level)<\/pre>", "hints": ["Use a queue (collections.deque).", "Process exactly len(queue) nodes per level."], "starter": "from collections import deque\n\ndef level_order(root):\n    pass\n", "solution": "from collections import deque\n\ndef level_order(root):\n    if root is None:\n        return []\n    result, queue = [], deque([root])\n    while queue:\n        level = []\n        for _ in range(len(queue)):           # only the nodes already waiting = this level\n            node = queue.popleft()\n            level.append(node.val)\n            if node.left:\n                queue.append(node.left)\n            if node.right:\n                queue.append(node.right)\n        result.append(level)\n    return result\n", "complexity": "<p><b>Time O(n)<\/b>. <b>Space O(w)<\/b>, where w is the maximum width of a level.<\/p>", "mistakes": "<ul><li>Using <code>list.pop(0)<\/code> as the queue, which is O(n) per pop. Use <code>deque.popleft()<\/code>.<\/li><\/ul>", "tests": "\nT(\"example\", lambda: level_order(to_tree([3, 9, 20, None, None, 15, 7])), [[3], [9, 20], [15, 7]])\nT(\"one node\", lambda: level_order(to_tree([1])), [[1]])\nT(\"empty\", lambda: level_order(None), [])\nT(\"left chain\", lambda: level_order(to_tree([1, 2, None, 3])), [[1], [2], [3]])\n"}, {"id": "validate-bst", "topic": "trees", "level": "Medium", "title": "Validate Binary Search Tree", "blind": true, "lc": 98, "statement": "<p>Return <code>True<\/code> if the tree is a valid BST: for <b>every<\/b> node, all values in its left subtree are <b>strictly smaller<\/b> and all values in its right subtree are <b>strictly larger<\/b>.<\/p>", "examples": "<pre class=\"plain\">is_valid_bst(to_tree([2, 1, 3]))                    → True\nis_valid_bst(to_tree([5, 1, 4, None, None, 3, 6]))  → False   (4 is in 5's right subtree but 4 &lt; 5)\nis_valid_bst(to_tree([5, 4, 6, None, None, 3, 7]))  → False   (3 is in 5's right subtree)<\/pre>", "eli10": "<p><b>The trap:<\/b> checking only \"left child &lt; node &lt; right child\" is <b>not enough<\/b>. A node deep in the right subtree must still be bigger than the root, as in the third example.<\/p>\n<p><b>Real-life picture:<\/b> each node is given an <b>allowed range<\/b> of values by its ancestors. The root may be anything: (−∞, +∞). Going <b>left<\/b> means \"you must be smaller than me\", so the upper limit becomes my value. Going <b>right<\/b> means \"you must be bigger than me\", so the lower limit becomes my value. Every node must fit inside its range.<\/p>", "approach": "<pre class=\"plain\">valid(node, low, high):\n    if node is None: return True\n    if not (low &lt; node.val &lt; high): return False\n    return valid(node.left, low, node.val) and valid(node.right, node.val, high)\nstart: valid(root, -inf, +inf)<\/pre>\n<p>Alternative: an <b>in-order traversal<\/b> (left, node, right) of a BST gives a strictly increasing sequence, so check that.<\/p>", "hints": ["Comparing only with the direct children is not enough.", "Pass down an allowed (low, high) range for each node."], "starter": "def is_valid_bst(root):\n    pass\n", "solution": "def is_valid_bst(root):\n    def valid(node, low, high):\n        if node is None:\n            return True\n        if not (low < node.val < high):\n            return False                        # outside the range the ancestors allow\n        return valid(node.left, low, node.val) and valid(node.right, node.val, high)\n    return valid(root, float(\"-inf\"), float(\"inf\"))\n", "complexity": "<p><b>Time O(n)<\/b>, <b>Space O(h)<\/b>.<\/p>", "mistakes": "", "tests": "\nT(\"valid\", lambda: is_valid_bst(to_tree([2, 1, 3])), True)\nT(\"child violation\", lambda: is_valid_bst(to_tree([5, 1, 4, None, None, 3, 6])), False)\nT(\"deep violation\", lambda: is_valid_bst(to_tree([5, 4, 6, None, None, 3, 7])), False)\nT(\"duplicates invalid\", lambda: is_valid_bst(to_tree([2, 2, 2])), False)\nT(\"single\", lambda: is_valid_bst(to_tree([1])), True)\n"}, {"id": "kth-smallest-bst", "topic": "trees", "level": "Medium", "title": "Kth Smallest Element in a BST", "blind": true, "lc": 230, "statement": "<p>Return the <b>k-th smallest<\/b> value (1-indexed) in a BST.<\/p>", "examples": "<pre class=\"plain\">kth_smallest(to_tree([3, 1, 4, None, 2]), 1)            → 1\nkth_smallest(to_tree([5, 3, 6, 2, 4, None, None, 1]), 3) → 3<\/pre>", "eli10": "<p><b>Key fact:<\/b> visiting a BST <b>in-order<\/b> (left subtree, then the node, then the right subtree) gives the values <b>in sorted order<\/b>. It's like reading a sorted list that has been folded into a tree.<\/p>\n<p>So just walk in-order and <b>stop at the k-th node<\/b> you visit. Use a stack to walk iteratively: keep going left as far as possible (stacking the nodes), pop one (that's the next smallest), then go to its right child.<\/p>", "approach": "<pre class=\"plain\">stack, node = [], root\nwhile True:\n    while node: stack.append(node); node = node.left      # go as far left as possible\n    node = stack.pop()                                     # the next smallest\n    k -= 1\n    if k == 0: return node.val\n    node = node.right<\/pre>", "hints": ["In-order traversal of a BST visits values in sorted order.", "Count nodes as you visit them and stop at k."], "starter": "def kth_smallest(root, k):\n    pass\n", "solution": "def kth_smallest(root, k):\n    stack, node = [], root\n    while True:\n        while node:                 # dive left: smaller values first\n            stack.append(node)\n            node = node.left\n        node = stack.pop()          # the next value in sorted order\n        k -= 1\n        if k == 0:\n            return node.val\n        node = node.right           # then the bigger values of this subtree\n", "complexity": "<p><b>Time O(h + k)<\/b>, <b>Space O(h)<\/b>.<\/p>", "mistakes": "", "tests": "\nT(\"k = 1\", lambda: kth_smallest(to_tree([3, 1, 4, None, 2]), 1), 1)\nT(\"k = 3\", lambda: kth_smallest(to_tree([5, 3, 6, 2, 4, None, None, 1]), 3), 3)\nT(\"largest\", lambda: kth_smallest(to_tree([2, 1, 3]), 3), 3)\n"}, {"id": "build-tree-pre-in", "topic": "trees", "level": "Medium", "title": "Construct Binary Tree from Preorder and Inorder", "blind": true, "lc": 105, "statement": "<p>Given the <code>preorder<\/code> (node, left, right) and <code>inorder<\/code> (left, node, right) traversals of a tree with <b>unique<\/b> values, rebuild the tree and return its root.<\/p>", "examples": "<pre class=\"plain\">preorder = [3, 9, 20, 15, 7], inorder = [9, 3, 15, 20, 7]\n→ tree [3, 9, 20, None, None, 15, 7]<\/pre>", "eli10": "<p><b>Two clues:<\/b><\/p>\n<ul><li><b>Preorder<\/b> always lists the <b>root first<\/b>. So <code>preorder[0] = 3<\/code> is the root.<\/li><li><b>Inorder<\/b> lists <b>everything left of the root, then the root, then everything right<\/b>. Find 3 in inorder: <code>[9] 3 [15, 20, 7]<\/code>. Now you know the <b>left subtree has 1 node<\/b> (9) and the <b>right subtree has 3 nodes<\/b>.<\/li><\/ul>\n<p>Then repeat the same trick on each side with the matching slices. It's like a detective puzzle: the preorder says \"who is the boss\", and the inorder says \"who sits on the boss's left or right\".<\/p>", "approach": "<ol><li>Build <code>index = {value: position in inorder}<\/code> for O(1) lookups.<\/li><li>Keep a pointer <code>pre_i<\/code> into preorder (the next root to use).<\/li><li><code>build(lo, hi)<\/code> builds the subtree whose inorder range is <code>[lo, hi]<\/code>: - If <code>lo &gt; hi<\/code>, return None. - <code>root_val = preorder[pre_i]<\/code>, then <code>pre_i += 1<\/code>. - <code>mid = index[root_val]<\/code>. - <code>root.left = build(lo, mid - 1)<\/code>, then <code>root.right = build(mid + 1, hi)<\/code>. <b>Left first<\/b>, because preorder lists the left subtree before the right.<\/li><\/ol>", "hints": ["preorder[0] is always the root.", "The root's position in inorder splits the left and right subtrees.", "Use a dict for value → inorder index, and consume preorder left to right."], "starter": "def build_tree(preorder, inorder):\n    pass\n", "solution": "def build_tree(preorder, inorder):\n    index = {v: i for i, v in enumerate(inorder)}\n    pre_i = 0\n\n    def build(lo, hi):                    # build from inorder[lo..hi]\n        nonlocal pre_i\n        if lo > hi:\n            return None\n        root = TreeNode(preorder[pre_i])  # the next preorder value is this subtree's root\n        pre_i += 1\n        mid = index[root.val]\n        root.left = build(lo, mid - 1)    # left first: preorder visits left before right\n        root.right = build(mid + 1, hi)\n        return root\n\n    return build(0, len(inorder) - 1)\n", "complexity": "<p><b>Time O(n)<\/b> with the index dict. <b>Space O(n)<\/b>.<\/p>", "mistakes": "", "tests": "\nT(\"example\", lambda: from_tree(build_tree([3, 9, 20, 15, 7], [9, 3, 15, 20, 7])), [3, 9, 20, None, None, 15, 7])\nT(\"single\", lambda: from_tree(build_tree([-1], [-1])), [-1])\nT(\"left chain\", lambda: from_tree(build_tree([3, 2, 1], [1, 2, 3])), [3, 2, None, 1])\nT(\"right chain\", lambda: from_tree(build_tree([1, 2, 3], [1, 2, 3])), [1, None, 2, None, 3])\n"}, {"id": "max-path-sum", "topic": "trees", "level": "Hard", "title": "Binary Tree Maximum Path Sum", "blind": true, "lc": 124, "statement": "<p>A <b>path<\/b> is any sequence of connected nodes (each used at most once). It doesn't have to pass through the root, and it can go up then down. Return the <b>maximum sum<\/b> of any non-empty path. Values can be negative.<\/p>", "examples": "<pre class=\"plain\">max_path_sum(to_tree([1, 2, 3]))                          → 6    (2 - 1 - 3)\nmax_path_sum(to_tree([-10, 9, 20, None, None, 15, 7]))    → 42   (15 - 20 - 7)\nmax_path_sum(to_tree([-3]))                               → -3<\/pre>", "eli10": "<p><b>Real-life picture:<\/b> each node is a town with a toll (positive = you earn money, negative = you pay). You want the most profitable road trip that never visits a town twice. A trip looks like an <b>upside-down V<\/b>: it climbs up from one side to a \"peak\" town, then goes down the other side.<\/p>\n<p>For each town, ask two questions:<\/p>\n<ol><li><b>\"Best trip with me as the peak?\"<\/b> = my value + the best downward path on my left (if it's positive) + the best downward path on my right (if positive). Update the global best.<\/li><li><b>\"Best path going *down* from me, to give to my parent?\"<\/b> = my value + the better <b>one<\/b> of my left/right downward paths. A parent can only continue through <b>one<\/b> side, because a path can't split.<\/li><\/ol>\n<p>Negative branches are ignored by taking <code>max(0, branch)<\/code>: \"don't go there at all\".<\/p>", "approach": "<pre class=\"plain\">best = -infinity\ngain(node):                       # best downward path starting at node\n    if not node: return 0\n    left = max(0, gain(node.left))\n    right = max(0, gain(node.right))\n    best = max(best, node.val + left + right)    # node as the peak\n    return node.val + max(left, right)           # one side only, for the parent<\/pre>", "hints": ["For each node, consider it as the 'top' of the path.", "The recursive function returns the best ONE-sided downward path.", "Ignore negative branches with max(0, ...)."], "starter": "def max_path_sum(root):\n    pass\n", "solution": "def max_path_sum(root):\n    best = float(\"-inf\")\n\n    def gain(node):\n        nonlocal best\n        if node is None:\n            return 0\n        left = max(0, gain(node.left))           # skip losing branches\n        right = max(0, gain(node.right))\n        best = max(best, node.val + left + right)    # path that peaks at this node\n        return node.val + max(left, right)           # the parent can use only one side\n\n    gain(root)\n    return best\n", "complexity": "<p><b>Time O(n)<\/b>, <b>Space O(h)<\/b>.<\/p>", "mistakes": "<ul><li>Returning <code>node.val + left + right<\/code> to the parent. A path can't branch both ways and continue upward.<\/li><li>Starting <code>best = 0<\/code>. An all-negative tree must return its largest single value.<\/li><\/ul>", "tests": "\nT(\"small\", lambda: max_path_sum(to_tree([1, 2, 3])), 6)\nT(\"classic\", lambda: max_path_sum(to_tree([-10, 9, 20, None, None, 15, 7])), 42)\nT(\"single negative\", lambda: max_path_sum(to_tree([-3])), -3)\nT(\"all negative\", lambda: max_path_sum(to_tree([-2, -1])), -1)\nT(\"go through\", lambda: max_path_sum(to_tree([5, 4, 8, 11, None, 13, 4, 7, 2, None, None, None, 1])), 48)\n"}, {"id": "serialize-tree", "topic": "trees", "level": "Hard", "title": "Serialize and Deserialize Binary Tree", "blind": true, "lc": 297, "statement": "<p>Write <code>serialize(root)<\/code>, which turns a tree into a <b>string<\/b>, and <code>deserialize(data)<\/code>, which rebuilds the <b>same<\/b> tree from it. Any format is fine, as long as the round trip works.<\/p>", "examples": "<pre class=\"plain\">deserialize(serialize(to_tree([1, 2, 3, None, None, 4, 5])))  → the same tree<\/pre>", "eli10": "<p><b>Real-life picture:<\/b> you want to send a tree by SMS, which only allows text. Write down a <b>preorder walk<\/b> (node, then left, then right), and write a special mark like <code>#<\/code> for every <b>empty spot<\/b>. The empty spots are important: they tell the receiver where a branch stops, which captures the <b>shape<\/b>.<\/p>\n<p><code>1,2,#,#,3,4,#,#,5,#,#<\/code><\/p>\n<p>To rebuild, read the values in the same order: the first value is the root, then rebuild its left subtree (consuming values), then its right subtree. Each <code>#<\/code> means \"nothing here\".<\/p>", "approach": "<h4>serialize (preorder with markers)<\/h4>\n<p><code>walk(node)<\/code>: if None, write \"#\". Otherwise write node.val, then walk(left), then walk(right). Join with commas.<\/p>\n<h4>deserialize<\/h4>\n<p>Split on commas into an iterator. <code>build()<\/code>: take the next token. If it's \"#\", return None. Otherwise make a node, with <code>node.left = build()<\/code> and <code>node.right = build()<\/code>.<\/p>", "hints": ["Preorder + a marker for None captures the shape completely.", "Deserialize by consuming tokens in the same order with recursion."], "starter": "def serialize(root):\n    pass\n\ndef deserialize(data):\n    pass\n", "solution": "def serialize(root):\n    out = []\n    def walk(node):\n        if node is None:\n            out.append(\"#\")              # mark the empty spot so the shape is kept\n            return\n        out.append(str(node.val))\n        walk(node.left)\n        walk(node.right)\n    walk(root)\n    return \",\".join(out)\n\ndef deserialize(data):\n    tokens = iter(data.split(\",\"))\n    def build():\n        tok = next(tokens)\n        if tok == \"#\":\n            return None\n        node = TreeNode(int(tok))\n        node.left = build()              # same order as serialize: left first\n        node.right = build()\n        return node\n    return build()\n", "complexity": "<p><b>Time O(n)<\/b> both ways. <b>Space O(n)<\/b>.<\/p>", "mistakes": "", "tests": "\ndef _rt(vals): return from_tree(deserialize(serialize(to_tree(vals))))\nT(\"example\", lambda: _rt([1, 2, 3, None, None, 4, 5]), [1, 2, 3, None, None, 4, 5])\nT(\"empty\", lambda: _rt([]), [])\nT(\"negatives\", lambda: _rt([-1, -2, None, -30]), [-1, -2, None, -30])\nC(\"serialize returns str\", lambda: isinstance(serialize(to_tree([1])), str))\n"}, {"id": "k-smallest", "topic": "heap", "level": "Warm-up", "title": "K Smallest Numbers with heapq", "blind": false, "lc": null, "statement": "<p>Return the <code>k<\/code> smallest numbers of <code>nums<\/code> in increasing order, using <b><code>heapq<\/code><\/b> (not <code>sorted<\/code>).<\/p>", "examples": "<pre class=\"plain\">k_smallest([5, 1, 9, 3, 7], 3)  → [1, 3, 5]<\/pre>", "eli10": "<p>A <b>heap<\/b> is a \"magic box\": you can throw numbers in, and you can always take out the <b>smallest<\/b> one quickly (O(log n)). Python's <code>heapq<\/code> turns a normal list into such a box.<\/p>\n<ul><li><code>heapq.heapify(lst)<\/code> turns a list into a heap in O(n).<\/li><li><code>heapq.heappop(h)<\/code> removes and returns the smallest.<\/li><li><code>heapq.heappush(h, x)<\/code> adds x.<\/li><\/ul>", "approach": "<p>Heapify a copy, then pop k times.<\/p>", "hints": ["heapify, then heappop k times."], "starter": "import heapq\n\ndef k_smallest(nums, k):\n    pass\n", "solution": "import heapq\n\ndef k_smallest(nums, k):\n    h = list(nums)\n    heapq.heapify(h)                                   # O(n)\n    return [heapq.heappop(h) for _ in range(k)]        # k pops, each O(log n)\n", "complexity": "<p><b>Time O(n + k log n)<\/b>. <b>Space O(n)<\/b>.<\/p>", "mistakes": "", "tests": "\nT(\"example\", lambda: k_smallest([5, 1, 9, 3, 7], 3), [1, 3, 5])\nT(\"k = 0\", lambda: k_smallest([2, 1], 0), [])\nT(\"duplicates\", lambda: k_smallest([2, 2, 1], 2), [1, 2])\n"}, {"id": "kth-largest", "topic": "heap", "level": "Medium", "title": "Kth Largest Element (DSA extra)", "blind": false, "lc": 215, "statement": "<p>Return the k-th <b>largest<\/b> element of <code>nums<\/code> (k=1 means the maximum). Try O(n log k).<\/p>", "examples": "<pre class=\"plain\">kth_largest([3, 2, 1, 5, 6, 4], 2)  → 5<\/pre>", "eli10": "<p>Keep a small <b>min-heap of size k<\/b>, the \"top k club\". Every new number tries to join. If the club has more than k members, kick out the <b>smallest<\/b>. At the end the club holds the k largest numbers, and the <b>smallest member of the club<\/b> is the k-th largest overall.<\/p>", "approach": "<p>Push each number, and pop when <code>len(heap) &gt; k<\/code>. Return <code>heap[0]<\/code>.<\/p>", "hints": ["A min-heap of size k keeps the k largest numbers seen so far.", "Its top (heap[0]) is the k-th largest."], "starter": "import heapq\n\ndef kth_largest(nums, k):\n    pass\n", "solution": "import heapq\n\ndef kth_largest(nums, k):\n    club = []\n    for x in nums:\n        heapq.heappush(club, x)\n        if len(club) > k:\n            heapq.heappop(club)        # drop the smallest; keep only the top k\n    return club[0]                     # the smallest of the top k\n", "complexity": "<p><b>Time O(n log k)<\/b>, <b>Space O(k)<\/b>.<\/p>", "mistakes": "", "tests": "\nT(\"example\", lambda: kth_largest([3, 2, 1, 5, 6, 4], 2), 5)\nT(\"duplicates\", lambda: kth_largest([3, 2, 3, 1, 2, 4, 5, 5, 6], 4), 4)\nT(\"k = 1\", lambda: kth_largest([1], 1), 1)\n"}, {"id": "top-k-frequent", "topic": "heap", "level": "Medium", "title": "Top K Frequent Elements", "blind": true, "lc": 347, "statement": "<p>Return the <code>k<\/code> most frequent elements of <code>nums<\/code>, in any order. The answer is unique.<\/p>", "examples": "<pre class=\"plain\">top_k_frequent([1, 1, 1, 2, 2, 3], 2)  → [1, 2]\ntop_k_frequent([1], 1)                 → [1]<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"Which k things appear the most?\"<\/p>\n<p><b>Real-life picture:<\/b> the most popular songs in your class. First <b>count the votes<\/b> for each song (a frequency dict). Then find the k songs with the most votes.<\/p>\n<p>Two good ways:<\/p>\n<ol><li><b>Heap:<\/b> keep a top-k club ordered by count, like the Kth Largest problem. O(n log k).<\/li><li><b>Bucket sort (the clever O(n) trick):<\/b> a count can be at most n. Make buckets numbered 0…n. Put each number into the bucket matching its count (\"songs with 3 votes\" go in bucket 3). Then walk the buckets from the <b>highest<\/b> down, collecting numbers until you have k.<\/li><\/ol>", "approach": "<h4>Bucket version<\/h4>\n<ol><li><code>count = Counter(nums)<\/code>.<\/li><li><code>buckets = [[] for _ in range(len(nums) + 1)]<\/code>, and for each <code>num, c<\/code>: <code>buckets[c].append(num)<\/code>.<\/li><li>Walk <code>c<\/code> from len(nums) down to 1, extending the result, and stop when you have k.<\/li><\/ol>\n<h4>Walk-through: [1,1,1,2,2,3], k=2<\/h4>\n<ul><li>counts: {1:3, 2:2, 3:1}<\/li><li>buckets[3] = [1], buckets[2] = [2], buckets[1] = [3]<\/li><li>From the top: take 1 (from bucket 3), then 2 (from bucket 2) → [1, 2] ✓<\/li><\/ul>", "hints": ["Count frequencies first.", "Then you need the k largest counts: use a heap, or buckets indexed by count."], "starter": "from collections import Counter\n\ndef top_k_frequent(nums, k):\n    pass\n", "solution": "from collections import Counter\n\ndef top_k_frequent(nums, k):\n    count = Counter(nums)\n    buckets = [[] for _ in range(len(nums) + 1)]   # buckets[c] = numbers seen exactly c times\n    for num, c in count.items():\n        buckets[c].append(num)\n    result = []\n    for c in range(len(buckets) - 1, 0, -1):       # most frequent first\n        for num in buckets[c]:\n            result.append(num)\n            if len(result) == k:\n                return result\n    return result\n", "complexity": "<p><b>Time O(n)<\/b> with buckets (a heap gives O(n log k)). <b>Space O(n)<\/b>.<\/p>", "mistakes": "<ul><li>Sorting the counts gives O(n log n). It's acceptable, but mention the faster options.<\/li><\/ul>", "tests": "\nT(\"example\", lambda: top_k_frequent([1, 1, 1, 2, 2, 3], 2), [1, 2], same_items)\nT(\"single\", lambda: top_k_frequent([1], 1), [1], same_items)\nT(\"negatives\", lambda: top_k_frequent([4, -1, -1, 4, 4, 2], 2), [4, -1], same_items)\nT(\"all\", lambda: top_k_frequent([1, 2], 2), [1, 2], same_items)\n"}, {"id": "median-stream", "topic": "heap", "level": "Hard", "title": "Find Median from Data Stream", "blind": true, "lc": 295, "statement": "<p>Design <code>MedianFinder<\/code> with <code>add_num(x)<\/code> and <code>find_median()<\/code>. Numbers arrive one at a time, and <code>find_median()<\/code> returns the current median (the average of the two middle values when the count is even).<\/p>", "examples": "<pre class=\"plain\">m = MedianFinder(); m.add_num(1); m.add_num(2); m.find_median() → 1.5\nm.add_num(3); m.find_median() → 2<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"Keep track of the middle value as numbers keep arriving.\"<\/p>\n<p><b>Real-life picture:<\/b> students enter a hall one by one and you must always know the middle height. Split the students into two groups:<\/p>\n<ul><li><b>Short group<\/b> (the smaller half): you need quick access to its <b>tallest<\/b> member.<\/li><li><b>Tall group<\/b> (the bigger half): you need quick access to its <b>shortest<\/b> member.<\/li><\/ul>\n<p>Keep the groups <b>equal in size<\/b> (or the short group has one extra). Then the median is either the tallest short student, or the average of the tallest short and the shortest tall.<\/p>\n<p>\"Quick access to the biggest/smallest\" means <b>heaps<\/b>: a <b>max-heap<\/b> for the short half and a <b>min-heap<\/b> for the tall half. Python only has min-heaps, so store <b>negative numbers<\/b> to fake a max-heap.<\/p>", "approach": "<p><code>add_num(x)<\/code>:<\/p>\n<ol><li>Push x into <code>low<\/code> (as −x).<\/li><li>Move low's largest into <code>high<\/code> (this keeps every low ≤ every high).<\/li><li>If <code>high<\/code> is now bigger than <code>low<\/code>, move high's smallest back to <code>low<\/code>.<\/li><\/ol>\n<p><code>find_median()<\/code>:<\/p>\n<ul><li>If <code>low<\/code> has more elements: return <code>-low[0]<\/code>.<\/li><li>Else: return <code>(-low[0] + high[0]) / 2<\/code>.<\/li><\/ul>\n<p>Each add is O(log n), and find_median is O(1).<\/p>", "hints": ["Split the numbers into a lower half and an upper half.", "Max-heap for the lower half (store negatives), min-heap for the upper half.", "Rebalance so the sizes differ by at most 1."], "starter": "import heapq\n\nclass MedianFinder:\n    def __init__(self):\n        pass\n    def add_num(self, x):\n        pass\n    def find_median(self):\n        pass\n", "solution": "import heapq\n\nclass MedianFinder:\n    def __init__(self):\n        self.low = []     # max-heap (stored as negatives): the smaller half\n        self.high = []    # min-heap: the larger half\n\n    def add_num(self, x):\n        heapq.heappush(self.low, -x)\n        heapq.heappush(self.high, -heapq.heappop(self.low))      # the biggest of low goes to high\n        if len(self.high) > len(self.low):\n            heapq.heappush(self.low, -heapq.heappop(self.high))  # keep low the same size or 1 bigger\n\n    def find_median(self):\n        if len(self.low) > len(self.high):\n            return -self.low[0]\n        return (-self.low[0] + self.high[0]) / 2\n", "complexity": "<p><b>add_num O(log n)<\/b>, <b>find_median O(1)<\/b>, <b>Space O(n)<\/b>.<\/p>", "mistakes": "<ul><li>Sorting the whole list on every query is O(n log n) per call, which is too slow for a stream.<\/li><\/ul>", "tests": "\ndef _run(ops):\n    m = MedianFinder(); out = []\n    for x in ops:\n        if x == \"?\": out.append(m.find_median())\n        else: m.add_num(x)\n    return out\nT(\"example\", lambda: _run([1, 2, \"?\", 3, \"?\"]), [1.5, 2])\nT(\"negatives\", lambda: _run([-1, \"?\", -2, \"?\", -3, \"?\"]), [-1, -1.5, -2])\nT(\"unsorted stream\", lambda: _run([5, 15, 1, 3, \"?\", 8, \"?\"]), [4.0, 5])\n"}, {"id": "binary-strings", "topic": "backtracking", "level": "Warm-up", "title": "All Binary Strings of Length n", "blind": false, "lc": null, "statement": "<p>Return all strings of length <code>n<\/code> made of <code>0<\/code> and <code>1<\/code>, in increasing order.<\/p>", "examples": "<pre class=\"plain\">binary_strings(2)  → [\"00\", \"01\", \"10\", \"11\"]<\/pre>", "eli10": "<p>Think of filling <code>n<\/code> empty boxes. For the first box you <b>choose<\/b> 0 or 1. For each choice you go on and fill the next box, and so on. When all boxes are filled, write the string down. Then <b>go back<\/b> (undo) and try the other choice.<\/p>\n<p>That's <b>backtracking<\/b>: <i>choose → explore → un-choose<\/i>. It's like exploring every path in a maze, stepping back when you reach the end.<\/p>", "approach": "<pre class=\"plain\">def go(path):\n    if len(path) == n: result.append(\"\".join(path)); return\n    for bit in \"01\":\n        path.append(bit)     # choose\n        g
