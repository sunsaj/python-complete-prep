<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coding Practice: DSA + Blind 75 in Python</title>
<style>
:root{--bg:#0f1115;--bg2:#151821;--bg3:#1c2030;--fg:#e6e8ee;--muted:#9aa3b5;--line:#262b3a;--accent:#ffd43b;--accent2:#4b8bbe;--ok:#3fb950;--bad:#f85149;--warn:#f0883e;--vio:#bc8cff;--cyan:#39c5cf;
--code-bg:#0b0d12;--kw:#ff7b72;--str:#a5d6ff;--num:#79c0ff;--com:#6e7781;--fn:#d2a8ff;--bi:#ffa657;--dec:#7ee787;--side:300px}
[data-theme="light"]{--bg:#fbfaf7;--bg2:#f3f1ec;--bg3:#ebe8e0;--fg:#1d2230;--muted:#5b6475;--line:#dcd8cd;--accent:#b8860b;--accent2:#2f6aa0;--code-bg:#f6f4ee;--kw:#cf222e;--str:#0a3069;--num:#0550ae;--com:#8c959f;--fn:#8250df;--bi:#953800;--dec:#116329}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent2)}
code,pre,textarea{font-family:"JetBrains Mono","Cascadia Code",Consolas,"SF Mono",Menlo,monospace}
.topbar{position:fixed;top:0;left:0;right:0;height:56px;z-index:30;display:flex;align-items:center;gap:12px;padding:0 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;white-space:nowrap}.brand span{color:var(--accent)}
.topbar .grow{flex:1}
.topbar input[type=search]{width:260px;max-width:30vw;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--fg)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--bg2);color:var(--fg);padding:7px 12px;border-radius:8px;font-size:14px;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--ok);border-color:var(--ok);color:#06240f;font-weight:700}
.btn.primary:disabled{opacity:.6;cursor:wait}
.toggle{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
#menuBtn{display:none}
.side{position:fixed;top:56px;bottom:0;left:0;width:var(--side);overflow-y:auto;background:var(--bg2);border-right:1px solid var(--line);padding:12px 10px 40px}
.meter{font-size:13px;color:var(--muted);padding:2px 8px 10px}.meter b{color:var(--fg)}
.bar{height:6px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:5px 0 8px}.bar i{display:block;height:100%;background:var(--ok);width:0}
.tgroup{margin-bottom:2px}
.thead{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:600;color:var(--fg);text-decoration:none}
.thead:hover,.thead.active{background:var(--bg3)}
.thead small{color:var(--muted);font-weight:500}
.plist{display:none;padding:0 0 6px 8px}.tgroup.open .plist{display:block}
.pitem{display:flex;gap:7px;align-items:center;padding:4px 8px;border-radius:6px;font-size:13.5px;color:var(--fg);text-decoration:none;line-height:1.3}
.pitem:hover{background:var(--bg3)}.pitem.active{background:var(--bg3);box-shadow:inset 3px 0 0 var(--accent)}
.pitem .ck{width:14px;color:var(--ok);flex:none}
.pitem.hidden,.tgroup.hidden{display:none}
.lv{font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:1px 6px;border-radius:4px;flex:none}
.lv.Warm-up{background:#2d3a52;color:#a5d6ff}.lv.Easy{background:#1f3d2a;color:#7ee787}.lv.Medium{background:#4a3a14;color:#ffd43b}.lv.Hard{background:#4d1f1f;color:#ffa198}
[data-theme="light"] .lv.Warm-up{background:#dbeafe;color:#1e40af}[data-theme="light"] .lv.Easy{background:#dcfce7;color:#166534}[data-theme="light"] .lv.Medium{background:#fef3c7;color:#92400e}[data-theme="light"] .lv.Hard{background:#fee2e2;color:#991b1b}
.b75{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:4px;background:var(--vio);color:#160b2b;flex:none}
main{margin-left:var(--side);padding:76px 28px 100px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:32px;line-height:1.15;margin:8px 0}
h2{font-size:24px;margin:26px 0 8px}
h3{font-size:19px;margin:22px 0 6px}
h4{font-size:16px;margin:16px 0 4px;color:var(--accent2)}
.muted{color:var(--muted)}
:not(pre)>code{background:var(--bg3);padding:1px 6px;border-radius:5px;font-size:.88em}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;font-size:13.5px;line-height:1.55;margin:10px 0}
pre.plain{color:var(--muted)}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left}th{background:var(--bg3)}
.note{border-left:4px solid var(--cyan);background:var(--bg2);padding:9px 13px;border-radius:7px;margin:10px 0}
.tok-kw{color:var(--kw)}.tok-str{color:var(--str)}.tok-num{color:var(--num)}.tok-com{color:var(--com);font-style:italic}.tok-fn{color:var(--fn)}.tok-bi{color:var(--bi)}.tok-dec{color:var(--dec)}.tok-self{color:var(--bi);font-style:italic}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin:14px 0}
.card{display:block;border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:13px 15px;color:var(--fg);text-decoration:none}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:700}.card .n{font-size:13px;color:var(--muted)}
.card .d{font-size:13.5px;color:var(--muted);margin:4px 0 8px}
.hero{border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--bg2)),var(--bg2));border-radius:14px;padding:18px 20px;margin-bottom:14px}
.ptable a{color:var(--fg);text-decoration:none}.ptable a:hover{color:var(--accent2)}
.ptable td{vertical-align:middle}
.phead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px}
.crumb{font-size:13px;color:var(--muted)}
details.box{border:1px solid var(--line);border-radius:10px;background:var(--bg2);margin:12px 0}
details.box>summary{cursor:pointer;padding:10px 14px;font-weight:700;list-style:none}
details.box>summary::before{content:"▸ ";color:var(--accent)}details.box[open]>summary::before{content:"▾ "}
details.box>div{padding:2px 16px 12px;border-top:1px solid var(--line)}
details.box.eli{border-left:4px solid var(--cyan)}details.box.sol{border-left:4px solid var(--ok)}details.box.app{border-left:4px solid var(--vio)}
.hints .hint{border-left:3px solid var(--accent);background:var(--bg2);padding:7px 12px;border-radius:6px;margin:6px 0}
.editor{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code-bg);margin-top:8px}
.ebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg2)}
.ebar .status{font-size:13px;color:var(--muted);margin-left:auto}
.ebody{display:flex;max-height:560px;overflow:auto}
.gutter{padding:12px 8px 12px 10px;text-align:right;color:var(--com);user-select:none;font:13.5px/1.55 "JetBrains Mono",Consolas,monospace;min-width:42px;white-space:pre;background:var(--code-bg)}
textarea.code{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--fg);padding:12px 12px;font-size:13.5px;line-height:1.55;tab-size:4;white-space:pre;overflow:hidden;min-height:240px}
.out{border:1px solid var(--line);border-radius:10px;margin-top:10px;background:var(--bg2);display:none}
.out.show{display:block}
.out .sum{padding:9px 14px;font-weight:700;border-bottom:1px solid var(--line)}
.out .sum.pass{color:var(--ok)}.out .sum.fail{color:var(--bad)}
.out .tests{padding:6px 14px 10px}
.t-row{padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}.t-row:last-child{border-bottom:0}
.t-row .nm{font-weight:600}.t-row.ok .nm{color:var(--ok)}.t-row.bad .nm{color:var(--bad)}
.t-row pre{margin:5px 0;font-size:12.5px;padding:7px 10px}
.out pre.stdout{margin:8px 14px 12px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;background:var(--bg3)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;display:flex;align-items:center;justify-content:center;font-size:64px;animation:pop 1.2s ease forwards}
@keyframes pop{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.4)}}
@media (max-width:980px){.side{transform:translateX(-100%);transition:transform .2s;z-index:29}body.nav-open .side{transform:none}main{margin-left:0;padding:76px 14px 80px}#menuBtn{display:inline-flex}.topbar input[type=search]{display:none}.brand small{display:none}}
</style>
</head>

<script id="data" type="application/json">{"intro": "<h4>How to use this page<\/h4>\n<ol><li>Go through the topics <b>in order<\/b>. Each one starts with an easy warm-up and gets harder: <b>Warm-up → Easy → Medium → Hard<\/b>.<\/li><li>For each problem: read it, then read <b>\"Understand it like a 10th grader\"<\/b>. Try to code it in the editor before looking at the approach.<\/li><li>Stuck? Reveal the <b>hints one at a time<\/b>. Still stuck after 25 minutes? Read the approach, then <b>close it and code it yourself<\/b>.<\/li><li>Press <b>Run tests<\/b> (or Ctrl + Enter). Python really runs in your browser. Every problem is marked ✓ when all its tests pass.<\/li><li>Re-solve the problems you needed the solution for <b>3 days later<\/b>, from a blank editor. That's what makes it stick.<\/li><\/ol>\n<h4>Big-O, explained like you're in 10th standard<\/h4>\n<p>Big-O answers <b>\"how much slower does my code get when the input gets bigger?\"<\/b><\/p>\n<table><tr><th>Big-O<\/th><th>name<\/th><th>1,000 items → steps<\/th><th>picture<\/th><\/tr><tr><td>O(1)<\/td><td>constant<\/td><td>1<\/td><td>grab the top plate<\/td><\/tr><tr><td>O(log n)<\/td><td>logarithmic<\/td><td>~10<\/td><td>guess-the-number by halving<\/td><\/tr><tr><td>O(n)<\/td><td>linear<\/td><td>1,000<\/td><td>read every page once<\/td><\/tr><tr><td>O(n log n)<\/td><td>sorting<\/td><td>~10,000<\/td><td>sorting a deck of cards smartly<\/td><\/tr><tr><td>O(n²)<\/td><td>quadratic<\/td><td>1,000,000<\/td><td>everyone shakes hands with everyone<\/td><\/tr><tr><td>O(2ⁿ)<\/td><td>exponential<\/td><td>way too many<\/td><td>trying every combination<\/td><\/tr><\/table>\n<div class=\"note\">A computer does about <b>100 million simple steps per second<\/b> in Python (much less, honestly about 10–50 million). If n = 100,000, O(n²) is 10 billion steps, which is too slow. That's why interviewers push you from O(n²) to O(n) or O(n log n).<\/div>\n<h4>Python tools you'll use all the time<\/h4>\n<pre><code>from collections import Counter, defaultdict, deque\nimport heapq, bisect\nseen = set();  freq = Counter(words);  groups = defaultdict(list)\nq = deque([start]); q.popleft()          # queue for BFS\nheapq.heappush(h, x); heapq.heappop(h)   # min-heap\ni = bisect.bisect_left(sorted_list, x)   # binary search<\/code><\/pre>", "topics": [{"id": "arrays", "title": "Arrays & Hashing", "blurb": "Lists and dictionaries: the two tools behind most interview answers.", "primer": "<p><b>Lists<\/b> keep things in order and let you jump to any position instantly (<code>nums[5]<\/code>). <b>Dictionaries and sets<\/b> answer <i>\"have I seen this?\"<\/i> or <i>\"what's stored under this key?\"<\/i> instantly, without searching everything.<\/p>\n<div class=\"note\">The #1 interview trick: when your solution has a loop inside a loop (O(n²)), ask \"<b>can a dict or set remember what I've already seen?<\/b>\". That usually turns it into one loop (O(n)).<\/div>\n<p><b>Signals:<\/b> \"duplicate\", \"count\", \"pair that sums to\", \"group by\", \"seen before\".<\/p>\n<pre><code>seen = set()            # membership in O(1)\ncount = {}              # frequency map\ncount[x] = count.get(x, 0) + 1\nfrom collections import Counter, defaultdict<\/code><\/pre>"}, {"id": "two-pointers", "title": "Two Pointers", "blurb": "Two fingers walking through a list, from both ends or at different speeds.", "primer": "<p>Put <b>two fingers<\/b> on a list and move them according to a rule, instead of trying every pair.<\/p>\n<ul><li><b>From both ends toward the middle:<\/b> palindromes, reversing, pair sums in a <b>sorted<\/b> list.<\/li><li><b>Both from the left at different speeds:<\/b> linked list middles and cycles (you'll see this later).<\/li><\/ul>\n<div class=\"note\">Two pointers usually needs <b>sorted<\/b> data or a symmetric structure. Sorting first costs O(n log n) but often unlocks an O(n) scan.<\/div>\n<pre><code>left, right = 0, len(nums) - 1\nwhile left &lt; right:\n    if condition: left += 1\n    else: right -= 1<\/code><\/pre>"}, {"id": "sliding-window", "title": "Sliding Window", "blurb": "A window that grows and shrinks as it slides over a list or string.", "primer": "<p>A <b>window<\/b> is a contiguous piece of a list or string <code>[left … right]<\/code>. Instead of re-checking every piece from scratch, <b>slide<\/b> the window: grow it on the right, shrink it on the left, and update a running summary (a sum, counts, \"last seen\" positions).<\/p>\n<p><b>Signals:<\/b> \"longest/shortest <b>substring/subarray<\/b> such that…\", \"at most k…\", \"contains all of…\".<\/p>\n<pre><code>left = 0\nfor right, x in enumerate(items):\n    add x to the window\n    while window is invalid:\n        remove items[left]; left += 1\n    best = max(best, right - left + 1)<\/code><\/pre>"}, {"id": "stack", "title": "Stack", "blurb": "A pile of plates: the last one you put on is the first one you take off.", "primer": "<p>A <b>stack<\/b> is a pile of plates: <b>Last In, First Out<\/b>. In Python, use a list: <code>append<\/code> to push, <code>pop()<\/code> to pop, <code>stack[-1]<\/code> to peek.<\/p>\n<p><b>Signals:<\/b> matching brackets, \"most recent\", undo, nested structures, \"next greater/smaller element\" (a <b>monotonic stack<\/b>: keep the stack sorted by popping anything that breaks the order).<\/p>"}, {"id": "binary-search", "title": "Binary Search", "blurb": "Guess the middle, throw away half, repeat.", "primer": "<p><b>Guess the middle, throw away half.<\/b> Each step halves the search space, so a million items take only ~20 steps: <b>O(log n)<\/b>.<\/p>\n<p>It needs something <b>sorted<\/b>, or more generally a <b>yes/no condition that flips once<\/b> (false, false, false, true, true). Binary search finds where it flips.<\/p>\n<pre><code>lo, hi = 0, len(nums) - 1\nwhile lo &lt;= hi:\n    mid = (lo + hi) // 2\n    if nums[mid] == target: return mid\n    if nums[mid] &lt; target: lo = mid + 1\n    else: hi = mid - 1<\/code><\/pre>\n<div class=\"note\">Most bugs are off-by-one errors: <code>lo &lt;= hi<\/code> vs <code>lo &lt; hi<\/code>, and <code>hi = mid<\/code> vs <code>mid - 1<\/code>. Trace a 2-element example by hand.<\/div>"}, {"id": "linked-list", "title": "Linked List", "blurb": "A treasure hunt: each clue points to the next one.", "primer": "<p>A chain of nodes: each has a <code>val<\/code> and a <code>next<\/code> arrow. You can't jump to the middle, only <b>walk<\/b>. The tricks:<\/p>\n<ul><li><b>Dummy head node:<\/b> avoids special cases when the head changes.<\/li><li><b>Fast &amp; slow pointers:<\/b> find the middle, detect cycles, find the k-th from the end.<\/li><li><b>Reverse in place<\/b> with prev/curr/next.<\/li><\/ul>\n<div class=\"note\">Draw boxes and arrows on paper! Linked list bugs are almost always \"I lost the pointer to the rest of the list\".<\/div>\n<p>The helpers <code>to_ll([1,2,3])<\/code> and <code>from_ll(head)<\/code> let you test easily.<\/p>"}, {"id": "trees", "title": "Trees", "blurb": "A family tree: each node has children, and recursion is the natural tool.", "primer": "<p>A <b>binary tree<\/b>: each node has up to two children, left and right. Trees are naturally <b>recursive<\/b>: every child is the root of a smaller tree.<\/p>\n<p><b>The recursion recipe:<\/b><\/p>\n<ol><li><b>Base case:<\/b> what's the answer for an empty tree (<code>None<\/code>)?<\/li><li><b>Trust the recursion:<\/b> assume <code>solve(left)<\/code> and <code>solve(right)<\/code> already work.<\/li><li><b>Combine<\/b> them with the current node.<\/li><\/ol>\n<p><b>BST (Binary Search Tree):<\/b> left &lt; node &lt; right everywhere. An <b>in-order<\/b> walk (left, node, right) visits the values in sorted order.<\/p>\n<p><b>BFS<\/b> (a queue, level by level) vs <b>DFS<\/b> (recursion or a stack, go deep first).<\/p>\n<p>Helpers: <code>to_tree([3, 9, 20, None, None, 15, 7])<\/code> builds from level order, and <code>from_tree(root)<\/code> converts back.<\/p>"}, {"id": "heap", "title": "Heap / Priority Queue", "blurb": "A magic box that always hands you the smallest (or largest) item first.", "primer": "<p>A <b>heap<\/b> gives you the <b>smallest<\/b> item in O(1) and lets you add or remove items in O(log n). Python: <code>import heapq<\/code>. It's a <b>min-heap<\/b> on a normal list.<\/p>\n<ul><li><b>Max-heap:<\/b> push negative numbers (<code>-x<\/code>).<\/li><li><b>Top-k largest:<\/b> keep a min-heap of size k and pop when it grows bigger.<\/li><li><b>Ties:<\/b> push tuples like <code>(priority, counter, item)<\/code>.<\/li><\/ul>\n<p><b>Signals:<\/b> \"k largest/smallest\", \"merge k sorted\", \"median of a stream\", \"schedule the earliest/cheapest next\".<\/p>"}, {"id": "backtracking", "title": "Backtracking", "blurb": "Try a choice, explore, undo it, and try the next one.", "primer": "<p><b>Try every possibility, but undo as you go.<\/b> Explore a \"decision tree\": at each step, make a choice, recurse, then <b>undo the choice<\/b> and try the next one.<\/p>\n<pre><code>def go(state):\n    if done(state): record a COPY; return\n    for choice in options(state):\n        make(choice)\n        go(state)\n        undo(choice)<\/code><\/pre>\n<p><b>Signals:<\/b> \"all combinations / permutations / subsets\", \"can you place / spell / arrange\". It's often exponential, so <b>prune<\/b> branches that can't work.<\/p>"}, {"id": "tries", "title": "Tries", "blurb": "A tree of letters that makes prefix search instant.", "primer": "<p>A <b>trie<\/b> (say \"try\") is a tree of letters. Each path from the root spells a prefix, and words with the same beginning share a path. Looking up a word of length L takes O(L), no matter how many words are stored.<\/p>\n<p><b>Signals:<\/b> \"prefix\", \"autocomplete\", \"starts with\", \"search many words at once\", \"wildcard search\".<\/p>\n<pre><code>root = {}\nnode = root\nfor ch in word: node = node.setdefault(ch, {})\nnode[\"$\"] = True      # end of word<\/code><\/pre>"}, {"id": "graphs", "title": "Graphs", "blurb": "Cities and roads: BFS, DFS, and topological order.", "primer": "<p><b>Nodes<\/b> (things) connected by <b>edges<\/b> (relationships): cities and roads, people and friendships, courses and prerequisites. A grid is a graph too: each cell connects to its 4 neighbours.<\/p>\n<ul><li><b>DFS<\/b> (go deep): flood fill, connectivity, path existence.<\/li><li><b>BFS<\/b> (spread in rings): the <b>shortest path<\/b> in steps.<\/li><li><b>Topological sort<\/b> (Kahn: repeatedly take nodes with no incoming edges): ordering with dependencies, cycle detection in <b>directed<\/b> graphs.<\/li><li><b>Union-Find:<\/b> \"are these connected?\", counting groups, cycle detection in <b>undirected<\/b> graphs.<\/li><\/ul>\n<div class=\"note\">Always keep a <b>visited<\/b> set, or you'll loop forever on cycles.<\/div>"}, {"id": "dp-1d", "title": "1-D Dynamic Programming", "blurb": "Solve small versions first, write the answers down, build up.", "primer": "<p><b>Dynamic programming = solve smaller versions of the problem first, write the answers down, and build up.<\/b> It's just recursion plus memory.<\/p>\n<p><b>The 4-step recipe:<\/b><\/p>\n<ol><li><b>Define the state:<\/b> <code>dp[i]<\/code> means <i>what exactly?<\/i> (\"ways to reach step i\", \"best total up to house i\").<\/li><li><b>Recurrence:<\/b> ask \"what was the <b>last<\/b> choice?\" and build <code>dp[i]<\/code> from smaller <code>dp[...]<\/code>.<\/li><li><b>Base cases:<\/b> the smallest answers you know without thinking.<\/li><li><b>Order:<\/b> fill from small to big. Often you only need the last one or two values.<\/li><\/ol>\n<p><b>Signals:<\/b> \"number of ways\", \"minimum/maximum\", \"can you reach/make\", plus choices that overlap. If brute-force recursion repeats the same sub-questions, it's DP.<\/p>"}, {"id": "dp-2d", "title": "2-D Dynamic Programming", "blurb": "The same idea in a grid: each cell built from its neighbours.", "primer": "<p>The same DP recipe, but the state needs <b>two numbers<\/b>: <code>dp[i][j]<\/code>, like \"the first i letters of a and the first j letters of b\" or \"row i, column j of a grid\". Each cell is built from neighbours already computed (above, left, diagonal).<\/p>\n<div class=\"note\">Draw the table on paper for a small example and fill it in by hand. That's how you find the recurrence. Then notice that you often only need the previous row, which saves memory.<\/div>\n<p>Beware the Python trap <code>[[0] * n] * m<\/code>, which creates m references to <b>the same row<\/b>. Use <code>[[0] * n for _ in range(m)]<\/code>.<\/p>"}, {"id": "greedy", "title": "Greedy", "blurb": "Take the best-looking choice right now, when you can prove it's safe.", "primer": "<p><b>Greedy = make the best-looking choice right now and never look back.<\/b> It's fast and simple, but it's <b>only correct when you can argue why the local choice can't hurt<\/b>. Otherwise you need DP.<\/p>\n<p>Classic greedy rules: \"reset when the running sum goes negative\" (Kadane), \"track the farthest reach\", \"pick whatever ends earliest\" (intervals).<\/p>\n<div class=\"note\">In interviews, explain <b>why<\/b> greedy is safe, or show a counterexample that proves it isn't (like coin change with coins [1, 3, 4]).<\/div>"}, {"id": "intervals", "title": "Intervals", "blurb": "Meetings on a calendar: sort by start, then merge or count.", "primer": "<p>Intervals are <code>[start, end]<\/code> pairs: meetings, bookings, ranges. Almost every interval problem starts with <b>sorting<\/b>:<\/p>\n<ul><li>by <b>start<\/b> → merge, insert, detect clashes,<\/li><li>by <b>end<\/b> → keep the most non-overlapping ones (greedy).<\/li><\/ul>\n<p>Overlap test: <code>a.start &lt;= b.end and b.start &lt;= a.end<\/code>. \"How many at the same time?\" → a min-heap of end times, or a sweep line of +1/−1 events.<\/p>"}, {"id": "matrix", "title": "Matrix", "blurb": "Grids of numbers: rotate, spiral, and mark rows and columns.", "primer": "<p>A matrix is a list of rows: <code>m[row][col]<\/code>. Common tools:<\/p>\n<ul><li><code>zip(*m)<\/code> gives the columns (transpose).<\/li><li>Boundaries <code>top, bottom, left, right<\/code> for spirals.<\/li><li>Rotation = transpose + reverse.<\/li><li>Using the matrix itself as storage, to get O(1) extra space.<\/li><\/ul>\n<p>Grids where you move between neighbours are really <b>graphs<\/b> (see the Graphs topic).<\/p>"}, {"id": "bits", "title": "Bit Manipulation", "blurb": "Numbers as rows of light switches (0 and 1).", "primer": "<p>Numbers are stored in binary, as rows of 0/1 switches. The bit operators:<\/p>\n<ul><li><code>a &amp; b<\/code> (AND): 1 where <b>both<\/b> are 1 → 6 &amp; 3 = 2 (110 &amp; 011 = 010)<\/li><li><code>a ^ b<\/code> (XOR): 1 where they <b>differ<\/b> → 6 ^ 3 = 5, and x ^ x = 0<\/li><li>OR (the vertical-bar operator): 1 where <b>either<\/b> is 1 → 6 OR 3 = 7<\/li><li><code>&lt;&lt;<\/code> / <code>&gt;&gt;<\/code> (shift): 1 &lt;&lt; 3 = 8, and 8 &gt;&gt; 1 = 4<\/li><\/ul>\n<p>Tricks: <code>n &amp; 1<\/code> (odd?), <code>n &amp; (n - 1)<\/code> (turn off the lowest 1), XOR to cancel out pairs.<\/p>\n<div class=\"note\">Python ints never overflow, so problems that assume 32 bits need a mask: <code>&amp; 0xFFFFFFFF<\/code>.<\/div>"}], "problems": [{"id": "largest-number", "topic": "arrays", "level": "Warm-up", "title": "Find the Largest Number", "blind": false, "lc": null, "statement": "<p>Given a non-empty list of numbers <code>nums<\/code>, return the largest one. <b>Don't use the built-in <code>max()<\/code>.<\/b> The point is to practise walking through a list yourself.<\/p>", "examples": "<pre class=\"plain\">largest([3, 9, 2, 7])   → 9\nlargest([-5, -2, -8])   → -2\nlargest([4])            → 4<\/pre>", "eli10": "<p>Imagine a pile of exam papers. You want the top score. You pick up the first paper and say \"this is the best so far\". Then you look at each next paper: if it's higher, it becomes the new \"best so far\". When the pile is finished, the \"best so far\" is the answer.<\/p>", "approach": "<ol><li>Start with <code>best = nums[0]<\/code> (not 0! The list may contain only negative numbers).<\/li><li>Loop through every number <code>x<\/code>.<\/li><li>If <code>x &gt; best<\/code>, update <code>best = x<\/code>.<\/li><li>Return <code>best<\/code>.<\/li><\/ol>\n<p>This \"keep a running best\" idea appears in many harder problems (Best Time to Buy and Sell Stock, Maximum Subarray), so learn it well.<\/p>", "hints": ["Keep a variable for the 'best so far'.", "Start it at the first element, not at 0."], "starter": "def largest(nums):\n    # walk through the list and remember the best value seen so far\n    pass\n", "solution": "def largest(nums):\n    best = nums[0]          # start with the first number, so negatives work too\n    for x in nums:\n        if x > best:\n            best = x        # found a bigger one, so remember it\n    return best\n", "complexity": "<p><b>Time O(n)<\/b>: we look at each number once. <b>Space O(1)<\/b>: just one variable.<\/p>", "mistakes": "<ul><li>Starting with <code>best = 0<\/code>. Then <code>[-5, -2]<\/code> wrongly returns 0.<\/li><\/ul>", "tests": "\nT(\"example 1\", lambda: largest([3, 9, 2, 7]), 9)\nT(\"all negative\", lambda: largest([-5, -2, -8]), -2)\nT(\"single item\", lambda: largest([4]), 4)\nT(\"max at the end\", lambda: largest([1, 2, 3, 100]), 100)\n"}, {"id": "count-items", "topic": "arrays", "level": "Warm-up", "title": "Count Each Item (Frequency Map)", "blind": false, "lc": null, "statement": "<p>Given a list <code>items<\/code>, return a <b>dictionary<\/b> mapping each distinct item to how many times it appears.<\/p>", "examples": "<pre class=\"plain\">count_items([\"a\", \"b\", \"a\", \"c\", \"a\"])  → {\"a\": 3, \"b\": 1, \"c\": 1}\ncount_items([])                          → {}<\/pre>", "eli10": "<p>Think of counting votes in a class election. You have a sheet of paper. For each vote, you find the candidate's name on the sheet and add a tally mark. If the name isn't there yet, you write it down with one mark.<\/p>\n<p>A Python <b>dictionary<\/b> is exactly that sheet: names (keys) next to counts (values). Finding a name in a dictionary is super fast (it doesn't search the whole sheet), which is why dictionaries power so many interview answers.<\/p>", "approach": "<ol><li>Make an empty dict <code>counts = {}<\/code>.<\/li><li>For each item: <code>counts[item] = counts.get(item, 0) + 1<\/code>. <code>.get(item, 0)<\/code> means \"the current count, or 0 if it isn't there yet\".<\/li><li>Return <code>counts<\/code>.<\/li><\/ol>\n<p>In real code you'd write <code>collections.Counter(items)<\/code>, but build it by hand once so you understand it.<\/p>", "hints": ["Use <code>dict.get(key, 0)<\/code> to read a count that may not exist yet."], "starter": "def count_items(items):\n    counts = {}\n    # add 1 to the count of each item\n    return counts\n", "solution": "def count_items(items):\n    counts = {}\n    for item in items:\n        counts[item] = counts.get(item, 0) + 1   # 0 if we haven't seen it yet\n    return counts\n", "complexity": "<p><b>Time O(n)<\/b>: each dict update is O(1) on average. <b>Space O(k)<\/b>, where k is the number of distinct items.<\/p>", "mistakes": "", "tests": "\nT(\"example\", lambda: count_items([\"a\", \"b\", \"a\", \"c\", \"a\"]), {\"a\": 3, \"b\": 1, \"c\": 1})\nT(\"empty\", lambda: count_items([]), {})\nT(\"numbers\", lambda: count_items([1, 1, 1]), {1: 3})\n"}, {"id": "contains-duplicate", "topic": "arrays", "level": "Easy", "title": "Contains Duplicate", "blind": true, "lc": 217, "statement": "<p>Given a list of integers <code>nums<\/code>, return <code>True<\/code> if <b>any value appears at least twice<\/b>, and <code>False<\/code> if every element is different.<\/p>", "examples": "<pre class=\"plain\">contains_duplicate([1, 2, 3, 1])   → True    (1 appears twice)\ncontains_duplicate([1, 2, 3, 4])   → False\ncontains_duplicate([])             → False<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"Is anything repeated?\"<\/p>\n<p><b>Real-life picture:<\/b> you're the teacher taking attendance, and you suspect someone signed the sheet twice. One slow way: for every name, read the *whole* sheet again looking for the same name. A fast way: keep a <b>notebook of names you've already seen<\/b>. For each new name, check the notebook. If it's there, you've caught a duplicate. If not, write it in.<\/p>\n<p>Checking a Python <b>set<\/b> is like flipping straight to the right page, not reading every page. That's why the set version is fast.<\/p>", "approach": "<h4>Slow way first (brute force)<\/h4>\n<p>Compare every pair: element 0 with 1, 2, 3…, element 1 with 2, 3… That's about n×n/2 comparisons. With 100,000 numbers, that's 5 billion checks. Too slow.<\/p>\n<h4>The clever idea: remember what you've seen<\/h4>\n<ol><li>Make an empty set <code>seen<\/code>.<\/li><li>For each number <code>x<\/code>: - If <code>x<\/code> is already in <code>seen<\/code>, return <code>True<\/code> (duplicate found!). - Otherwise add it: <code>seen.add(x)<\/code>.<\/li><li>If the loop ends, there are no duplicates, so return <code>False<\/code>.<\/li><\/ol>\n<h4>Walk-through on <code>[1, 2, 3, 1]<\/code><\/h4>\n<table><tr><th>x<\/th><th>seen before<\/th><th>in seen?<\/th><th>action<\/th><\/tr><tr><td>1<\/td><td>{}<\/td><td>no<\/td><td>add → {1}<\/td><\/tr><tr><td>2<\/td><td>{1}<\/td><td>no<\/td><td>add → {1, 2}<\/td><\/tr><tr><td>3<\/td><td>{1, 2}<\/td><td>no<\/td><td>add → {1, 2, 3}<\/td><\/tr><tr><td>1<\/td><td>{1, 2, 3}<\/td><td><b>yes<\/b><\/td><td>return True<\/td><\/tr><\/table>\n<p><b>One-liner<\/b> (good to mention): <code>return len(set(nums)) != len(nums)<\/code>. A set drops duplicates, so if it shrank, something was repeated. It's simpler, but it can't stop early.<\/p>", "hints": ["What data structure answers 'have I seen this before?' instantly?", "A set. Check before you add."], "starter": "def contains_duplicate(nums):\n    pass\n", "solution": "def contains_duplicate(nums):\n    seen = set()                 # numbers we've met so far\n    for x in nums:\n        if x in seen:            # O(1) average lookup\n            return True          # caught a repeat, so stop early\n        seen.add(x)\n    return False\n", "complexity": "<p><b>Time O(n)<\/b>: one pass, and each set check is O(1) on average. <b>Space O(n)<\/b>: in the worst case the set holds every number.<\/p>", "mistakes": "<ul><li>Using a <b>list<\/b> for <code>seen<\/code>. <code>x in list<\/code> scans the whole list, which brings back O(n²).<\/li><li>Sorting first works (duplicates become neighbours) but costs O(n log n). Mention it as an option if memory is tight.<\/li><\/ul>", "tests": "\nT(\"example 1\", lambda: contains_duplicate([1, 2, 3, 1]), True)\nT(\"example 2\", lambda: contains_duplicate([1, 2, 3, 4]), False)\nT(\"empty list\", lambda: contains_duplicate([]), False)\nT(\"many repeats\", lambda: contains_duplicate([1, 1, 1, 3, 3, 4, 3, 2, 4, 2]), True)\nT(\"big, all different\", lambda: contains_duplicate(list(range(100000))), False)\n"}, {"id": "valid-anagram", "topic": "arrays", "level": "Easy", "title": "Valid Anagram", "blind": true, "lc": 242, "statement": "<p>Given two strings <code>s<\/code> and <code>t<\/code>, return <code>True<\/code> if <code>t<\/code> is an <b>anagram<\/b> of <code>s<\/code>: it uses exactly the same letters, the same number of times, possibly in a different order.<\/p>", "examples": "<pre class=\"plain\">is_anagram(\"anagram\", \"nagaram\")  → True\nis_anagram(\"rat\", \"car\")          → False\nis_anagram(\"aab\", \"abb\")          → False   (counts differ)<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"Can I rearrange the letters of one word to make the other?\"<\/p>\n<p><b>Real-life picture:<\/b> two Scrabble players each have a bag of letter tiles. Are the bags identical? Tip each bag out and <b>count each letter<\/b>: 3 A's, 1 N, 1 G… If every count matches, the bags are the same. The order of the tiles doesn't matter, only the counts.<\/p>", "approach": "<h4>Idea: compare letter counts<\/h4>\n<ol><li>If the lengths differ, return <code>False<\/code> immediately.<\/li><li>Count the letters of <code>s<\/code> in a dict (the frequency map from the warm-up!).<\/li><li>Count the letters of <code>t<\/code> the same way.<\/li><li>Return whether the two dicts are equal.<\/li><\/ol>\n<h4>Walk-through: \"rat\" vs \"car\"<\/h4>\n<ul><li>counts(\"rat\") = {r:1, a:1, t:1}<\/li><li>counts(\"car\") = {c:1, a:1, r:1}<\/li><li>t ≠ c, so they're not equal. Return <b>False<\/b>.<\/li><\/ul>\n<h4>Alternatives<\/h4>\n<ul><li><code>sorted(s) == sorted(t)<\/code>: simplest, O(n log n).<\/li><li><code>Counter(s) == Counter(t)<\/code>: the Pythonic one-liner, O(n).<\/li><\/ul>", "hints": ["Anagram means same letters with the same counts.", "Count with a dict (or Counter) and compare."], "starter": "def is_anagram(s, t):\n    pass\n", "solution": "def is_anagram(s, t):\n    if len(s) != len(t):\n        return False                    # different sizes can't be anagrams\n    counts = {}\n    for ch in s:\n        counts[ch] = counts.get(ch, 0) + 1     # add letters from s\n    for ch in t:\n        if counts.get(ch, 0) == 0:\n            return False                # t uses a letter s doesn't have (enough of)\n        counts[ch] -= 1                 # use up one tile\n    return True                         # equal lengths + nothing ran out = same bags\n", "complexity": "<p><b>Time O(n)<\/b>. <b>Space O(1)<\/b> for lowercase English letters (at most 26 keys), O(k) in general.<\/p>", "mistakes": "<ul><li>Comparing <code>set(s) == set(t)<\/code>. Sets forget counts, so \"aab\" and \"abb\" would wrongly match.<\/li><\/ul>", "tests": "\nT(\"example 1\", lambda: is_anagram(\"anagram\", \"nagaram\"), True)\nT(\"example 2\", lambda: is_anagram(\"rat\", \"car\"), False)\nT(\"counts differ\", lambda: is_anagram(\"aab\", \"abb\"), False)\nT(\"different lengths\", lambda: is_anagram(\"a\", \"ab\"), False)\nT(\"empty strings\", lambda: is_anagram(\"\", \"\"), True)\n"}, {"id": "two-sum", "topic": "arrays", "level": "Easy", "title": "Two Sum", "blind": true, "lc": 1, "statement": "<p>Given a list of integers <code>nums<\/code> and an integer <code>target<\/code>, return the <b>indices<\/b> <code>[i, j]<\/code> (with i &lt; j) of the two numbers that add up to <code>target<\/code>. Exactly one answer exists, and you may not use the same element twice.<\/p>", "examples": "<pre class=\"plain\">two_sum([2, 7, 11, 15], 9)  → [0, 1]    (2 + 7 = 9)\ntwo_sum([3, 2, 4], 6)       → [1, 2]    (2 + 4 = 6)\ntwo_sum([3, 3], 6)          → [0, 1]<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"Which two numbers make the target, and where are they?\"<\/p>\n<p><b>Real-life picture:<\/b> you have ₹9 and want to buy exactly two items from a shelf. You walk along the shelf. At each item (say it costs ₹2) you think: <i>\"I'd need a partner costing ₹9 − ₹2 = ₹7. Have I already passed a ₹7 item?\"<\/i> If you kept a <b>notebook of prices you've seen and where they were<\/b>, you can answer instantly.<\/p>\n<p>The trick is to stop asking \"which pair works?\" and ask \"<b>what partner do I need, and have I seen it?<\/b>\"<\/p>", "approach": "<h4>Slow way: try every pair<\/h4>\n<p>Two loops: i from 0, j from i+1, check <code>nums[i] + nums[j] == target<\/code>. That's O(n²). It works, but it's too slow for big inputs.<\/p>\n<h4>Clever way: one pass with a dict<\/h4>\n<ol><li><code>seen = {}<\/code> maps a <b>value<\/b> to its <b>index<\/b>.<\/li><li>For each index <code>i<\/code> with value <code>x<\/code>: - <code>need = target - x<\/code> - If <code>need<\/code> is in <code>seen<\/code>, return <code>[seen[need], i]<\/code>. - Otherwise store <code>seen[x] = i<\/code>.<\/li><\/ol>\n<p>Check <b>before<\/b> storing, so you don't pair a number with itself.<\/p>\n<h4>Walk-through: nums = [2, 7, 11, 15], target = 9<\/h4>\n<table><tr><th>i<\/th><th>x<\/th><th>need<\/th><th>seen before<\/th><th>found?<\/th><\/tr><tr><td>0<\/td><td>2<\/td><td>7<\/td><td>{}<\/td><td>no → seen = {2: 0}<\/td><\/tr><tr><td>1<\/td><td>7<\/td><td>2<\/td><td>{2: 0}<\/td><td><b>yes<\/b> → return [0, 1]<\/td><\/tr><\/table>", "hints": ["For each number x, which number do you need to reach the target?", "Store numbers you've seen in a dict: value → index.", "Check for the partner before adding the current number."], "starter": "def two_sum(nums, target):\n    pass\n", "solution": "def two_sum(nums, target):\n    seen = {}                          # value -> index where we saw it\n    for i, x in enumerate(nums):\n        need = target - x              # the partner that would complete the pair\n        if need in seen:\n            return [seen[need], i]     # partner was earlier, so its index is smaller\n        seen[x] = i                    # remember x for future numbers\n    return []                          # (the problem promises we never get here)\n", "complexity": "<p><b>Time O(n)<\/b>: one pass with O(1) dict lookups. <b>Space O(n)<\/b> for the dict.<\/p>", "mistakes": "<ul><li>Storing before checking: with <code>[3, 3]<\/code> and target 6 you might match index 0 with itself.<\/li><li>Sorting the list first loses the original indices (two pointers works only if you keep track of them).<\/li><\/ul>", "tests": "\nT(\"example 1\", lambda: two_sum([2, 7, 11, 15], 9), [0, 1])\nT(\"example 2\", lambda: two_sum([3, 2, 4], 6), [1, 2])\nT(\"duplicates\", lambda: two_sum([3, 3], 6), [0, 1])\nT(\"negatives\", lambda: two_sum([-1, -2, -3, -4, -5], -8), [2, 4])\nT(\"big input\", lambda: two_sum(list(range(100000)), 199997), [99998, 99999])\n"}, {"id": "group-anagrams", "topic": "arrays", "level": "Medium", "title": "Group Anagrams", "blind": true, "lc": 49, "statement": "<p>Given a list of strings <code>words<\/code>, group the anagrams together. Return a list of groups. Any order of groups, and of words within a group, is accepted.<\/p>", "examples": "<pre class=\"plain\">group_anagrams([\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"])\n→ [[\"eat\", \"tea\", \"ate\"], [\"tan\", \"nat\"], [\"bat\"]]\ngroup_anagrams([\"\"])   → [[\"\"]]<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"Put words made of the same letters into the same box.\"<\/p>\n<p><b>Real-life picture:<\/b> you're sorting letters (mail) into pigeonholes. Each pigeonhole needs a <b>label<\/b> so that all anagrams get the same label. A good label: <b>the word's letters sorted alphabetically<\/b>. \"eat\" → \"aet\", \"tea\" → \"aet\", \"ate\" → \"aet\". Same label, same pigeonhole!<\/p>\n<p>So the problem becomes: <i>compute a label for each word, then group the words by label<\/i>. Grouping by a label is exactly what a dictionary of lists does.<\/p>", "approach": "<ol><li><code>groups = defaultdict(list)<\/code> maps a label to a list of words.<\/li><li>For each word: <code>label = \"\".join(sorted(word))<\/code>, then <code>groups[label].append(word)<\/code>.<\/li><li>Return <code>list(groups.values())<\/code>.<\/li><\/ol>\n<h4>Walk-through<\/h4>\n<table><tr><th>word<\/th><th>label<\/th><th>groups after<\/th><\/tr><tr><td>eat<\/td><td>aet<\/td><td>{aet: [eat]}<\/td><\/tr><tr><td>tea<\/td><td>aet<\/td><td>{aet: [eat, tea]}<\/td><\/tr><tr><td>tan<\/td><td>ant<\/td><td>{…, ant: [tan]}<\/td><\/tr><tr><td>ate<\/td><td>aet<\/td><td>{aet: [eat, tea, ate], …}<\/td><\/tr><tr><td>nat<\/td><td>ant<\/td><td>{…, ant: [tan, nat]}<\/td><\/tr><tr><td>bat<\/td><td>abt<\/td><td>{…, abt: [bat]}<\/td><\/tr><\/table>\n<h4>Faster label (bonus)<\/h4>\n<p>Sorting costs O(k log k) per word. Instead count the 26 letters and use the counts tuple as the label: <code>tuple(count)<\/code>. That's O(k). Tuples work as dict keys because they're <b>hashable<\/b>; lists aren't.<\/p>", "hints": ["Anagrams share something when you sort their letters.", "Use that sorted string as a dict key.", "<code>defaultdict(list)<\/code> saves you from 'if key not in dict' checks."], "starter": "def group_anagrams(words):\n    pass\n", "solution": "from collections import defaultdict\n\ndef group_anagrams(words):\n    groups = defaultdict(list)            # label -> words with that label\n    for w in words:\n        label = \"\".join(sorted(w))        # \"tea\" -> \"aet\": same for all anagrams\n        groups[label].append(w)\n    return list(groups.values())\n", "complexity": "<p><b>Time O(n · k log k)<\/b>, where n is the number of words and k the word length (sorting each word). The counting-label version is O(n · k). <b>Space O(n · k)<\/b>.<\/p>", "mistakes": "<ul><li>Using a list as a dict key → <code>TypeError: unhashable type: 'list'<\/code>. Convert it to a tuple or string first.<\/li><\/ul>", "tests": "\nT(\"example\", lambda: group_anagrams([\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"]),\n  [[\"eat\", \"tea\", \"ate\"], [\"tan\", \"nat\"], [\"bat\"]], same_groups)\nT(\"empty word\", lambda: group_anagrams([\"\"]), [[\"\"]], same_groups)\nT(\"single\", lambda: group_anagrams([\"a\"]), [[\"a\"]], same_groups)\nT(\"no anagrams\", lambda: group_anagrams([\"abc\", \"def\"]), [[\"abc\"], [\"def\"]], same_groups)\n"}, {"id": "product-except-self", "topic": "arrays", "level": "Medium", "title": "Product of Array Except Self", "blind": true, "lc": 238, "statement": "<p>Given a list <code>nums<\/code>, return a list <code>answer<\/code> where <code>answer[i]<\/code> is the product of <b>all numbers except <code>nums[i]<\/code><\/b>. You may <b>not use division<\/b>, and it should run in O(n).<\/p>", "examples": "<pre class=\"plain\">product_except_self([1, 2, 3, 4])      → [24, 12, 8, 6]\nproduct_except_self([-1, 1, 0, -3, 3]) → [0, 0, 9, 0, 0]<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> for each position, multiply everything <b>to its left<\/b> and everything <b>to its right<\/b>.<\/p>\n<p><b>Real-life picture:<\/b> people stand in a queue. For each person, you want \"the product of everyone except me\". Split it into two questions: <i>what's the product of everyone <b>in front of<\/b> me?<\/i> and <i>of everyone <b>behind<\/b> me?<\/i> Multiply those two answers.<\/p>\n<p>You can find \"everyone in front\" for all people in one walk from the front (keep a running product), and \"everyone behind\" in one walk from the back.<\/p>", "approach": "<h4>Why not division?<\/h4>\n<p>Total product ÷ nums[i] breaks when there's a 0 (you'd divide by zero), and the problem forbids it anyway.<\/p>\n<h4>Two passes<\/h4>\n<ol><li><code>answer[i]<\/code> = product of everything <b>left<\/b> of i. Walk left to right with <code>left = 1<\/code>: store <code>answer[i] = left<\/code>, then <code>left *= nums[i]<\/code>.<\/li><li>Walk right to left with <code>right = 1<\/code>: <code>answer[i] *= right<\/code>, then <code>right *= nums[i]<\/code>.<\/li><\/ol>\n<h4>Walk-through on [1, 2, 3, 4]<\/h4>\n<table><tr><th>i<\/th><th>left product (before i)<\/th><th>right product (after i)<\/th><th>answer<\/th><\/tr><tr><td>0<\/td><td>1<\/td><td>2·3·4 = 24<\/td><td>24<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>3·4 = 12<\/td><td>12<\/td><\/tr><tr><td>2<\/td><td>1·2 = 2<\/td><td>4<\/td><td>8<\/td><\/tr><tr><td>3<\/td><td>1·2·3 = 6<\/td><td>1<\/td><td>6<\/td><\/tr><\/table>\n<p>The key trick is <b>storing the left products in the answer list itself<\/b>, so you only need O(1) extra space besides the output.<\/p>", "hints": ["Product except me = (product of everything to my left) × (product of everything to my right).", "Compute the left products in one pass and the right products in a second pass, backwards."], "starter": "def product_except_self(nums):\n    pass\n", "solution": "def product_except_self(nums):\n    n = len(nums)\n    answer = [1] * n\n    left = 1\n    for i in range(n):              # pass 1: product of everything LEFT of i\n        answer[i] = left\n        left *= nums[i]\n    right = 1\n    for i in range(n - 1, -1, -1):  # pass 2: multiply in everything RIGHT of i\n        answer[i] *= right\n        right *= nums[i]\n    return answer\n", "complexity": "<p><b>Time O(n)<\/b>: two passes. <b>Space O(1)<\/b> extra (the output list doesn't count).<\/p>", "mistakes": "<ul><li>Updating <code>left<\/code> <b>before<\/b> storing it. Then you include nums[i] in its own product.<\/li><\/ul>", "tests": "\nT(\"example 1\", lambda: product_except_self([1, 2, 3, 4]), [24, 12, 8, 6])\nT(\"with a zero\", lambda: product_except_self([-1, 1, 0, -3, 3]), [0, 0, 9, 0, 0])\nT(\"two zeros\", lambda: product_except_self([0, 4, 0]), [0, 0, 0])\nT(\"two numbers\", lambda: product_except_self([2, 3]), [3, 2])\n"}, {"id": "encode-decode-strings", "topic": "arrays", "level": "Medium", "title": "Encode and Decode Strings", "blind": true, "lc": 271, "statement": "<p>Write <code>encode(strs)<\/code>, which turns a list of strings into <b>one string<\/b>, and <code>decode(s)<\/code>, which turns it back into the original list. The strings may contain <b>any<\/b> characters, including commas, <code>#<\/code>, digits, and empty strings.<\/p>", "examples": "<pre class=\"plain\">decode(encode([\"hello\", \"world\"]))   → [\"hello\", \"world\"]\ndecode(encode([\"\", \"a#b\", \"3#x\"]))   → [\"\", \"a#b\", \"3#x\"]\ndecode(encode([]))                   → []<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> pack many strings into one so they can be unpacked <b>exactly<\/b>, even if they contain your \"separator\" characters.<\/p>\n<p><b>Real-life picture:<\/b> you're sending several parcels in one big box. If you just throw them in, the receiver can't tell where one parcel ends. Gluing a comma between them fails as soon as a parcel itself contains a comma.<\/p>\n<p>Solution: write the <b>length on each parcel's label<\/b>: \"5#hello5#world\". The receiver reads digits up to <code>#<\/code> (that's the length, 5), then takes <b>exactly 5 characters<\/b>, whatever they are. Even if the parcel contains <code>#<\/code> or digits, it doesn't matter, because the receiver counts rather than searching for separators.<\/p>", "approach": "<h4>Encode<\/h4>\n<p>For each string <code>s<\/code>: write <code>len(s)<\/code>, then <code>#<\/code>, then <code>s<\/code>. Join them all. <code>[\"a#b\", \"\"]<\/code> → <code>\"3#a#b\" + \"0#\"<\/code> = <code>\"3#a#b0#\"<\/code>.<\/p>\n<h4>Decode<\/h4>\n<p>Use an index <code>i<\/code> starting at 0:<\/p>\n<ol><li>Find the <code>#<\/code> starting from <code>i<\/code>: <code>j = s.index(\"#\", i)<\/code>.<\/li><li>The length is <code>int(s[i:j])<\/code>.<\/li><li>The string is <code>s[j+1 : j+1+length]<\/code>.<\/li><li>Move <code>i = j + 1 + length<\/code> and repeat until the end.<\/li><\/ol>\n<h4>Why it's safe<\/h4>\n<p>The decoder <b>never looks inside<\/b> the content for separators. It jumps over exactly <code>length<\/code> characters. This \"length-prefix\" framing is how real network protocols (HTTP/2, many binary formats) work.<\/p>", "hints": ["A plain separator fails if a string contains it.", "Put the length of each string in front of it.", "While decoding, read the length first, then slice exactly that many characters."], "starter": "def encode(strs):\n    pass\n\ndef decode(s):\n    pass\n", "solution": "def encode(strs):\n    return \"\".join(f\"{len(s)}#{s}\" for s in strs)   # \"5#hello5#world\"\n\ndef decode(s):\n    out, i = [], 0\n    while i < len(s):\n        j = s.index(\"#\", i)            # the first '#' after i ends the length digits\n        length = int(s[i:j])\n        start = j + 1\n        out.append(s[start:start + length])   # take EXACTLY `length` characters\n        i = start + length                     # jump to the next label\n    return out\n", "complexity": "<p><b>Time O(total characters)<\/b> for both. <b>Space O(total characters)<\/b> for the output.<\/p>", "mistakes": "<ul><li>Splitting on <code>#<\/code> or <code>,<\/code>. That breaks when a string contains those characters, which is exactly what the tests check.<\/li><\/ul>", "tests": "\nT(\"simple\", lambda: decode(encode([\"hello\", \"world\"])), [\"hello\", \"world\"])\nT(\"tricky characters\", lambda: decode(encode([\"\", \"a#b\", \"3#x\", \"##\"])), [\"\", \"a#b\", \"3#x\", \"##\"])\nT(\"empty list\", lambda: decode(encode([])), [])\nT(\"one empty string\", lambda: decode(encode([\"\"])), [\"\"])\nT(\"long string\", lambda: decode(encode([\"x\" * 1234, \"y\"])), [\"x\" * 1234, \"y\"])\nC(\"encode returns a string\", lambda: isinstance(encode([\"a\"]), str), \"encode must return one str\")\n"}, {"id": "longest-consecutive", "topic": "arrays", "level": "Medium", "title": "Longest Consecutive Sequence", "blind": true, "lc": 128, "statement": "<p>Given an <b>unsorted<\/b> list of integers, return the length of the longest run of consecutive numbers (like 4, 5, 6, 7). The numbers don't need to be next to each other in the list. Aim for <b>O(n)<\/b>, which rules out sorting.<\/p>", "examples": "<pre class=\"plain\">longest_consecutive([100, 4, 200, 1, 3, 2])           → 4    (1, 2, 3, 4)\nlongest_consecutive([0, 3, 7, 2, 5, 8, 4, 6, 0, 1])   → 9    (0 through 8)\nlongest_consecutive([])                                → 0<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"What's the longest chain of numbers that follow one after another, like 1-2-3-4?\"<\/p>\n<p><b>Real-life picture:<\/b> roll numbers are written on scattered cards on the floor. You want the longest run of roll numbers with no gaps. Smart approach: only <b>start counting from a card that has no card just before it<\/b> (no \"n − 1\"). For example, 1 is a start because 0 is missing. From each start, count upward (2? yes. 3? yes. 4? yes. 5? no), so the run is 4.<\/p>\n<p>Why only start at chain beginnings? If you started counting at every card, you'd recount the same chain over and over (2→3→4, then 3→4…), which is slow.<\/p>", "approach": "<ol><li>Put all the numbers in a set, so \"is x present?\" is O(1).<\/li><li>For each number <code>x<\/code> in the set: - If <code>x - 1<\/code> is in the set, <b>skip it<\/b>, because <code>x<\/code> isn't the start of a chain. - Otherwise count up: <code>length = 1<\/code>, and while <code>x + length<\/code> is in the set, <code>length += 1<\/code>. - Keep the best length.<\/li><\/ol>\n<h4>Walk-through: {100, 4, 200, 1, 3, 2}<\/h4>\n<table><tr><th>x<\/th><th>x−1 present?<\/th><th>start?<\/th><th>chain<\/th><th>length<\/th><\/tr><tr><td>100<\/td><td>99 no<\/td><td>yes<\/td><td>100<\/td><td>1<\/td><\/tr><tr><td>4<\/td><td>3 yes<\/td><td>skip<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>200<\/td><td>199 no<\/td><td>yes<\/td><td>200<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0 no<\/td><td>yes<\/td><td>1, 2, 3, 4<\/td><td><b>4<\/b><\/td><\/tr><tr><td>3, 2<\/td><td>yes<\/td><td>skip<\/td><td>—<\/td><td>—<\/td><\/tr><\/table>\n<h4>Why it's O(n) even with a nested while loop<\/h4>\n<p>Each number is visited by the inner while loop <b>at most once<\/b> in total, because only chain starts begin counting. So the total work is about 2n.<\/p>", "hints": ["Sorting would be O(n log n). Can a set help?", "A number starts a chain only if (number − 1) is missing.", "From each chain start, count upward while the next number exists."], "starter": "def longest_consecutive(nums):\n    pass\n", "solution": "def longest_consecutive(nums):\n    present = set(nums)\n    best = 0\n    for x in present:\n        if x - 1 in present:\n            continue                    # not a chain start, so skip (keeps it O(n))\n        length = 1\n        while x + length in present:    # walk up the chain\n            length += 1\n        best = max(best, length)\n    return best\n", "complexity": "<p><b>Time O(n)<\/b>: each number is part of at most one upward walk. <b>Space O(n)<\/b> for the set.<\/p>", "mistakes": "<ul><li>Looping over <code>nums<\/code> instead of the set. With many duplicates, this repeats work.<\/li><li>Forgetting the chain-start check. That becomes O(n²) on input like <code>range(n)<\/code>.<\/li><\/ul>", "tests": "\nT(\"example 1\", lambda: longest_consecutive([100, 4, 200, 1, 3, 2]), 4)\nT(\"example 2\", lambda: longest_consecutive([0, 3, 7, 2, 5, 8, 4, 6, 0, 1]), 9)\nT(\"empty\", lambda: longest_consecutive([]), 0)\nT(\"duplicates\", lambda: longest_consecutive([1, 2, 0, 1]), 3)\nT(\"big range (must be fast)\", lambda: longest_consecutive(list(range(200000, 0, -1))), 200000)\n"}, {"id": "reverse-in-place", "topic": "two-pointers", "level": "Warm-up", "title": "Reverse a List In Place", "blind": false, "lc": null, "statement": "<p>Reverse the list <code>nums<\/code> <b>in place<\/b>: change the list itself, don't create a new one, and don't use <code>.reverse()<\/code> or <code>[::-1]<\/code>. Return nothing.<\/p>", "examples": "<pre class=\"plain\">nums = [1, 2, 3, 4, 5]; reverse_in_place(nums)  → nums becomes [5, 4, 3, 2, 1]<\/pre>", "eli10": "<p>Picture kids standing in a line who need to reverse their order. The first and last kids swap places. Then the second and second-last swap. Keep going inward until you meet in the middle.<\/p>\n<p>That's the <b>two pointers<\/b> idea: one finger at the left end (<code>left<\/code>), one at the right end (<code>right<\/code>), both walking toward each other.<\/p>", "approach": "<ol><li><code>left = 0<\/code>, <code>right = len(nums) - 1<\/code>.<\/li><li>While <code>left &lt; right<\/code>: swap <code>nums[left]<\/code> and <code>nums[right]<\/code>, then <code>left += 1<\/code>, <code>right -= 1<\/code>.<\/li><\/ol>\n<p>Python's swap trick: <code>a, b = b, a<\/code>.<\/p>", "hints": ["Start one index at each end.", "Swap, then move both inward. Stop when they meet."], "starter": "def reverse_in_place(nums):\n    # change nums itself; don't return anything\n    pass\n", "solution": "def reverse_in_place(nums):\n    left, right = 0, len(nums) - 1\n    while left < right:\n        nums[left], nums[right] = nums[right], nums[left]   # swap the two ends\n        left += 1\n        right -= 1\n", "complexity": "<p><b>Time O(n)<\/b>: n/2 swaps. <b>Space O(1)<\/b>: no new list.<\/p>", "mistakes": "", "tests": "\ndef _rev(xs):\n    reverse_in_place(xs); return xs\nT(\"odd length\", lambda: _rev([1, 2, 3, 4, 5]), [5, 4, 3, 2, 1])\nT(\"even length\", lambda: _rev([1, 2, 3, 4]), [4, 3, 2, 1])\nT(\"empty\", lambda: _rev([]), [])\nC(\"really in place\", lambda: (lambda xs: (reverse_in_place(xs), xs)[1] is xs)([1, 2]))\n"}, {"id": "valid-palindrome", "topic": "two-pointers", "level": "Easy", "title": "Valid Palindrome", "blind": true, "lc": 125, "statement": "<p>A phrase is a <b>palindrome<\/b> if, after lowercasing it and <b>removing everything that isn't a letter or digit<\/b>, it reads the same forwards and backwards. Return <code>True<\/code> or <code>False<\/code>.<\/p>", "examples": "<pre class=\"plain\">is_palindrome(\"A man, a plan, a canal: Panama\")  → True   (\"amanaplanacanalpanama\")\nis_palindrome(\"race a car\")                      → False\nis_palindrome(\" \")                               → True   (empty after cleaning)<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"Ignoring spaces, punctuation and capital letters, is this the same backwards?\"<\/p>\n<p><b>Real-life picture:<\/b> two friends read the sentence at the same time. One starts at the first letter, the other at the last letter, and they walk toward each other. Each friend <b>skips<\/b> anything that isn't a letter or number. At every step they compare letters (lowercased). If they ever differ, it's not a palindrome. If they meet in the middle without a mismatch, it is.<\/p>", "approach": "<h4>Easy version (uses extra memory)<\/h4>\n<p><code>clean = [c.lower() for c in s if c.isalnum()]<\/code>, then <code>return clean == clean[::-1]<\/code>. This is fine in an interview if you mention that it uses O(n) memory.<\/p>\n<h4>Two pointers (O(1) memory)<\/h4>\n<ol><li><code>left = 0<\/code>, <code>right = len(s) - 1<\/code>.<\/li><li>While <code>left &lt; right<\/code>: - Move <code>left<\/code> forward while <code>s[left]<\/code> isn't alphanumeric. - Move <code>right<\/code> backward while <code>s[right]<\/code> isn't alphanumeric. - If <code>s[left].lower() != s[right].lower()<\/code>, return False. - Move both inward.<\/li><li>Return True.<\/li><\/ol>", "hints": ["<code>ch.isalnum()<\/code> tells you whether a character is a letter or digit.", "Use two pointers that skip junk characters, and compare lowercase letters."], "starter": "def is_palindrome(s):\n    pass\n", "solution": "def is_palindrome(s):\n    left, right = 0, len(s) - 1\n    while left < right:\n        if not s[left].isalnum():\n            left += 1                      # skip junk on the left\n        elif not s[right].isalnum():\n            right -= 1                     # skip junk on the right\n        elif s[left].lower() != s[right].lower():\n            return False                   # mismatch, so not a palindrome\n        else:\n            left += 1                      # matched, so move both inward\n            right -= 1\n    return True\n", "complexity": "<p><b>Time O(n)<\/b>. <b>Space O(1)<\/b>.<\/p>", "mistakes": "<ul><li>Forgetting to lowercase. 'A' and 'a' must match.<\/li><li>Skipping junk with <code>if<\/code> instead of looping, and then comparing a junk character.<\/li><\/ul>", "tests": "\nT(\"example 1\", lambda: is_palindrome(\"A man, a plan, a canal: Panama\"), True)\nT(\"example 2\", lambda: is_palindrome(\"race a car\"), False)\nT(\"only spaces\", lambda: is_palindrome(\" \"), True)\nT(\"digits count\", lambda: is_palindrome(\"0P\"), False)\nT(\"punctuation only\", lambda: is_palindrome(\".,\"), True)\n"}, {"id": "three-sum", "topic": "two-pointers", "level": "Medium", "title": "3Sum", "blind": true, "lc": 15, "statement": "<p>Given a list <code>nums<\/code>, return <b>all unique triplets<\/b> <code>[a, b, c]<\/code> with <code>a + b + c == 0<\/code>. Each triplet should be listed once (no duplicate triplets). Any order is accepted.<\/p>", "examples": "<pre class=\"plain\">three_sum([-1, 0, 1, 2, -1, -4])  → [[-1, -1, 2], [-1, 0, 1]]\nthree_sum([0, 1, 1])              → []\nthree_sum([0, 0, 0])              → [[0, 0, 0]]<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"Find every group of 3 numbers that add up to zero, without repeating a group.\"<\/p>\n<p><b>Real-life picture:<\/b> you have weights, some negative (balloons) and some positive (stones). You want groups of three that balance exactly at 0.<\/p>\n<p><b>The trick:<\/b> <b>sort<\/b> the numbers first. Then <b>fix one number<\/b> (the first of the three), and the problem shrinks to <i>\"find two numbers that add up to −first\"<\/i> in the sorted part to its right. In a sorted list that's easy with two pointers: if the sum is too small, move the left pointer right (bigger numbers). If it's too big, move the right pointer left (smaller numbers).<\/p>", "approach": "<ol><li>Sort <code>nums<\/code>.<\/li><li>For each index <code>i<\/code> (the first number): - If <code>nums[i] &gt; 0<\/code>, stop: three numbers ≥ a positive can't sum to 0. - If <code>nums[i] == nums[i-1]<\/code>, skip it (we already tried this first number, so this avoids duplicate triplets). - Set <code>left = i + 1<\/code>, <code>right = end<\/code>. While <code>left &lt; right<\/code>: - <code>total = nums[i] + nums[left] + nums[right]<\/code> - total &lt; 0 → <code>left += 1<\/code>. total &gt; 0 → <code>right -= 1<\/code>. - total == 0 → record the triplet, move both pointers, and <b>skip repeated values<\/b> on the left.<\/li><\/ol>\n<h4>Walk-through: sorted = [-4, -1, -1, 0, 1, 2]<\/h4>\n<ul><li>i=0 (−4): need two numbers summing to 4. The largest pair is 1+2=3, so no.<\/li><li>i=1 (−1): left at −1, right at 2 → −1−1+2 = 0 ✓ record [−1,−1,2]. Move → left at 0, right at 1 → −1+0+1 = 0 ✓ record [−1,0,1].<\/li><li>i=2 (−1): same as the previous value, so skip.<\/li><li>i=3 (0): left at 1, right at 2 → 3 &gt; 0 … no more.<\/li><\/ul>", "hints": ["Sorting helps a lot. Why?", "Fix the first number, then solve Two Sum on the rest with two pointers.", "Skip equal neighbours to avoid duplicate triplets."], "starter": "def three_sum(nums):\n    pass\n", "solution": "def three_sum(nums):\n    nums = sorted(nums)\n    result = []\n    for i in range(len(nums) - 2):\n        if nums[i] > 0:\n            break                              # all remaining numbers are positive\n        if i > 0 and nums[i] == nums[i - 1]:\n            continue                           # same first number as before, so skip duplicates\n        left, right = i + 1, len(nums) - 1\n        while left < right:\n            total = nums[i] + nums[left] + nums[right]\n            if total < 0:\n                left += 1                      # need a bigger sum\n            elif total > 0:\n                right -= 1                     # need a smaller sum\n            else:\n                result.append([nums[i], nums[left], nums[right]])\n                left += 1\n                right -= 1\n                while left < right and nums[left] == nums[left - 1]:\n                    left += 1                  # skip repeats of the second number\n    return result\n", "complexity": "<p><b>Time O(n²)<\/b>: sorting is O(n log n), then n × a two-pointer scan. <b>Space O(1)<\/b> extra besides the output (and the sorted copy).<\/p>", "mistakes": "<ul><li>Producing duplicates like two copies of [−1, 0, 1]. You need both skip rules.<\/li><li>Using a set of tuples to dedupe works, but it's slower and interviewers want the pointer logic.<\/li><\/ul>", "tests": "\nT(\"example 1\", lambda: three_sum([-1, 0, 1, 2, -1, -4]), [[-1, -1, 2], [-1, 0, 1]], same_groups)\nT(\"none\", lambda: three_sum([0, 1, 1]), [], same_groups)\nT(\"all zeros\", lambda: three_sum([0, 0, 0, 0]), [[0, 0, 0]], same_groups)\nT(\"many duplicates\", lambda: three_sum([-2, 0, 0, 2, 2]), [[-2, 0, 2]], same_groups)\nT(\"mixed\", lambda: three_sum([-4, -2, -2, -2, 0, 1, 2, 2, 2, 3, 3, 4, 4, 6, 6]),\n  [[-4, -2, 6], [-4, 0, 4], [-4, 1, 3], [-4, 2, 2], [-2, -2, 4], [-2, 0, 2]], same_groups)\n"}, {"id": "container-most-water", "topic": "two-pointers", "level": "Medium", "title": "Container With Most Water", "blind": true, "lc": 11, "statement": "<p><code>height[i]<\/code> is the height of a vertical line at position <code>i<\/code>. Choose two lines that, together with the x-axis, form a container. Return the <b>maximum amount of water<\/b> a container can hold: <code>width × the shorter height<\/code>.<\/p>", "examples": "<pre class=\"plain\">max_area([1, 8, 6, 2, 5, 4, 8, 3, 7])  → 49   (lines at 1 and 8: width 7 × min(8, 7) = 49)\nmax_area([1, 1])                        → 1<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"Pick two walls so the water between them is as much as possible.\"<\/p>\n<p><b>Real-life picture:<\/b> water between two walls can only rise to the <b>shorter<\/b> wall, or it spills over. So the amount = distance between the walls × the shorter wall.<\/p>\n<p><b>The clever move:<\/b> start with the two <b>outermost<\/b> walls (the widest possible container). Now we have to move one wall inward, and the width shrinks. Which wall should move? <b>Always the shorter one.<\/b> The shorter wall is the one limiting the water. Moving the taller wall inward can only make things worse (the width shrinks and the height is still limited by the same short wall). Moving the short wall at least gives a chance of finding a taller wall.<\/p>", "approach": "<ol><li><code>left = 0<\/code>, <code>right = n - 1<\/code>, <code>best = 0<\/code>.<\/li><li>While <code>left &lt; right<\/code>: - <code>area = (right - left) * min(height[left], height[right])<\/code>, and <code>best = max(best, area)<\/code>. - If <code>height[left] &lt; height[right]<\/code>: <code>left += 1<\/code>, else <code>right -= 1<\/code>.<\/li><li>Return <code>best<\/code>.<\/li><\/ol>\n<h4>Walk-through on [1, 8, 6, 2, 5, 4, 8, 3, 7]<\/h4>\n<table><tr><th>left<\/th><th>right<\/th><th>heights<\/th><th>area<\/th><th>move<\/th><\/tr><tr><td>0<\/td><td>8<\/td><td>1, 7<\/td><td>8×1 = 8<\/td><td>left (1 is shorter)<\/td><\/tr><tr><td>1<\/td><td>8<\/td><td>8, 7<\/td><td>7×7 = <b>49<\/b><\/td><td>right<\/td><\/tr><tr><td>1<\/td><td>7<\/td><td>8, 3<\/td><td>6×3 = 18<\/td><td>right<\/td><\/tr><tr><td>…<\/td><td>…<\/td><td>…<\/td><td>never beats 49<\/td><td>…<\/td><\/tr><\/table>", "hints": ["Start with the widest container (both ends).", "The water level is limited by the shorter wall.", "Move the pointer at the shorter wall inward."], "starter": "def max_area(height):\n    pass\n", "solution": "def max_area(height):\n    left, right = 0, len(height) - 1\n    best = 0\n    while left < right:\n        width = right - left\n        best = max(best, width * min(height[left], height[right]))\n        if height[left] < height[right]:\n            left += 1          # the shorter wall limits us, so try to find a taller one\n        else:\n            right -= 1\n    return best\n", "complexity": "<p><b>Time O(n)<\/b>: the pointers meet after n steps. <b>Space O(1)<\/b>.<\/p>", "mistakes": "<ul><li>Trying every pair, which is O(n²) and times out.<\/li><li>Moving the taller wall, which skips the optimal answer.<\/li><\/ul>", "tests": "\nT(\"example 1\", lambda: max_area([1, 8, 6, 2, 5, 4, 8, 3, 7]), 49)\nT(\"two lines\", lambda: max_area([1, 1]), 1)\nT(\"increasing\", lambda: max_area([1, 2, 3, 4, 5]), 6)\nT(\"big input\", lambda: max_area(list(range(1, 100001))), 2500000000)\n"}, {"id": "max-sum-k", "topic": "sliding-window", "level": "Warm-up", "title": "Maximum Sum of K Consecutive Numbers", "blind": false, "lc": null, "statement": "<p>Given a list <code>nums<\/code> and an integer <code>k<\/code> (1 ≤ k ≤ len(nums)), return the largest sum of any <b>k consecutive<\/b> numbers.<\/p>", "examples": "<pre class=\"plain\">max_sum_k([2, 1, 5, 1, 3, 2], 3)  → 9    (5 + 1 + 3)\nmax_sum_k([4, -1, 2], 1)           → 4<\/pre>", "eli10": "<p>Imagine a train window that shows exactly k seats at a time. As the train moves one seat forward, <b>one seat enters<\/b> the window on the right and <b>one seat leaves<\/b> on the left. You don't need to re-add all k seats every time. Just do <code>sum + new − old<\/code>.<\/p>\n<p>That's the <b>sliding window<\/b> idea: reuse the previous work instead of starting over.<\/p>", "approach": "<ol><li><code>window = sum(nums[:k])<\/code>, the first window. <code>best = window<\/code>.<\/li><li>For <code>i<\/code> from <code>k<\/code> to the end: <code>window += nums[i] - nums[i - k]<\/code> (add the new one, remove the one that left), then update <code>best<\/code>.<\/li><\/ol>", "hints": ["Compute the first window's sum.", "Slide: add the entering element, subtract the leaving one."], "starter": "def max_sum_k(nums, k):\n    pass\n", "solution": "def max_sum_k(nums, k):\n    window = sum(nums[:k])          # first window\n    best = window\n    for i in range(k, len(nums)):\n        window += nums[i] - nums[i - k]   # one in, one out\n        best = max(best, window)\n    return best\n", "complexity": "<p><b>Time O(n)<\/b> instead of O(n·k). <b>Space O(1)<\/b>.<\/p>", "mistakes": "", "tests": "\nT(\"example 1\", lambda: max_sum_k([2, 1, 5, 1, 3, 2], 3), 9)\nT(\"k = 1\", lambda: max_sum_k([4, -1, 2], 1), 4)\nT(\"whole list\", lambda: max_sum_k([1, 2, 3], 3), 6)\nT(\"negatives\", lambda: max_sum_k([-3, -1, -2], 2), -3)\n"}, {"id": "best-time-stock", "topic": "sliding-window", "level": "Easy", "title": "Best Time to Buy and Sell Stock", "blind": true, "lc": 121, "statement": "<p><code>prices[i]<\/code> is a stock's price on day <code>i<\/code>. Choose <b>one day to buy<\/b> and a <b>later day to sell<\/b>. Return the maximum profit, or <code>0<\/code> if no profit is possible.<\/p>", "examples": "<pre class=\"plain\">max_profit([7, 1, 5, 3, 6, 4])  → 5    (buy at 1, sell at 6)\nmax_profit([7, 6, 4, 3, 1])     → 0    (prices only fall)<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"What's the biggest jump from a low price to a <b>later<\/b> high price?\"<\/p>\n<p><b>Real-life picture:<\/b> you're looking back at a month of mango prices at the market. For each day, ask: <i>\"If I sold today, what's the cheapest day <b>before<\/b> today I could have bought?\"<\/i> Just remember <b>the lowest price seen so far<\/b> as you walk through the days. Today's profit = today's price − lowest so far. Keep the best profit.<\/p>\n<p>It's the \"best so far\" warm-up again, applied twice: track the minimum price and the maximum profit.<\/p>", "approach": "<ol><li><code>lowest = infinity<\/code>, <code>best = 0<\/code>.<\/li><li>For each <code>price<\/code>: - <code>lowest = min(lowest, price)<\/code>, the cheapest buying day up to now. - <code>best = max(best, price - lowest)<\/code>, the profit if we sell today.<\/li><li>Return <code>best<\/code>.<\/li><\/ol>\n<h4>Walk-through on [7, 1, 5, 3, 6, 4]<\/h4>\n<table><tr><th>price<\/th><th>lowest so far<\/th><th>profit today<\/th><th>best<\/th><\/tr><tr><td>7<\/td><td>7<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>5<\/td><td>1<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>3<\/td><td>1<\/td><td>2<\/td><td>4<\/td><\/tr><tr><td>6<\/td><td>1<\/td><td><b>5<\/b><\/td><td>5<\/td><\/tr><tr><td>4<\/td><td>1<\/td><td>3<\/td><td>5<\/td><\/tr><\/table>\n<p>Why is it called sliding window? The \"buy day\" is the left edge and the \"sell day\" is the right edge. The left edge jumps forward whenever we find a cheaper price.<\/p>", "hints": ["You must buy before you sell.", "Track the minimum price seen so far.", "At each day, the profit if you sold today = price − minimum so far."], "starter": "def max_profit(prices):\n    pass\n", "solution": "def max_profit(prices):\n    lowest = float(\"inf\")\n    best = 0\n    for price in prices:\n        lowest = min(lowest, price)          # best day to have bought, up to today\n        best = max(best, price - lowest)     # profit if we sell today\n    return best\n", "complexity": "<p><b>Time O(n)<\/b>: one pass. <b>Space O(1)<\/b>.<\/p>", "mistakes": "<ul><li><code>max(prices) - min(prices)<\/code> is wrong when the maximum comes before the minimum (you can't sell before buying).<\/li><\/ul>", "tests": "\nT(\"example 1\", lambda: max_profit([7, 1, 5, 3, 6, 4]), 5)\nT(\"falling prices\", lambda: max_profit([7, 6, 4, 3, 1]), 0)\nT(\"max before min trap\", lambda: max_profit([2, 4, 1]), 2)\nT(\"one day\", lambda: max_profit([5]), 0)\n"}, {"id": "longest-substring-no-repeat", "topic": "sliding-window", "level": "Medium", "title": "Longest Substring Without Repeating Characters", "blind": true, "lc": 3, "statement": "<p>Given a string <code>s<\/code>, return the length of the longest <b>substring<\/b> (a contiguous piece) with <b>no repeated characters<\/b>.<\/p>", "examples": "<pre class=\"plain\">length_of_longest_substring(\"abcabcbb\")  → 3   (\"abc\")\nlength_of_longest_substring(\"bbbbb\")     → 1   (\"b\")\nlength_of_longest_substring(\"pwwkew\")    → 3   (\"wke\")<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"What's the longest stretch of letters where no letter repeats?\"<\/p>\n<p><b>Real-life picture:<\/b> you're making a necklace by sliding along a string of coloured beads, and you're not allowed two beads of the same colour. Your necklace is a <b>window<\/b> <code>[left … right]<\/code>. You add the next bead on the right. If that colour is <b>already in your necklace<\/b>, you drop beads from the left until the old bead of that colour is gone. Then continue. Track the longest necklace you ever had.<\/p>", "approach": "<h4>Window with a \"last seen\" dictionary<\/h4>\n<ul><li><code>last[ch]<\/code> = the most recent index where <code>ch<\/code> appeared.<\/li><li><code>left<\/code> = the start of the current window.<\/li><\/ul>\n<p>For each <code>right, ch<\/code>:<\/p>\n<ol><li>If <code>ch<\/code> was seen <b>inside the current window<\/b> (<code>last[ch] &gt;= left<\/code>), jump <code>left = last[ch] + 1<\/code> (drop everything up to the old copy).<\/li><li><code>last[ch] = right<\/code>.<\/li><li><code>best = max(best, right - left + 1)<\/code>.<\/li><\/ol>\n<h4>Walk-through on \"abcabcbb\"<\/h4>\n<table><tr><th>right<\/th><th>ch<\/th><th>left after<\/th><th>window<\/th><th>best<\/th><\/tr><tr><td>0<\/td><td>a<\/td><td>0<\/td><td>a<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>b<\/td><td>0<\/td><td>ab<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>c<\/td><td>0<\/td><td>abc<\/td><td>3<\/td><\/tr><tr><td>3<\/td><td>a<\/td><td>1<\/td><td>bca<\/td><td>3<\/td><\/tr><tr><td>4<\/td><td>b<\/td><td>2<\/td><td>cab<\/td><td>3<\/td><\/tr><tr><td>…<\/td><td>…<\/td><td>…<\/td><td>…<\/td><td>3<\/td><\/tr><\/table>", "hints": ["Use a window [left, right] that never contains a repeat.", "When the new character is already in the window, move left past its previous position.", "A dict of 'last index seen' makes the jump instant."], "starter": "def length_of_longest_substring(s):\n    pass\n", "solution": "def length_of_longest_substring(s):\n    last = {}                  # char -> last index we saw it\n    left = best = 0\n    for right, ch in enumerate(s):\n        if ch in last and last[ch] >= left:\n            left = last[ch] + 1          # drop everything up to the old copy\n        last[ch] = right\n        best = max(best, right - left + 1)\n    return best\n", "complexity": "<p><b>Time O(n)<\/b>: each character is visited once. <b>Space O(k)<\/b> for the dict (k distinct characters).<\/p>", "mistakes": "<ul><li>Forgetting the <code>last[ch] &gt;= left<\/code> check. An old occurrence <b>outside<\/b> the window must not move <code>left<\/code> backwards (\"abba\" is the classic trap).<\/li><\/ul>", "tests": "\nT(\"example 1\", lambda: length_of_longest_substring(\"abcabcbb\"), 3)\nT(\"example 2\", lambda: length_of_longest_substring(\"bbbbb\"), 1)\nT(\"example 3\", lambda: length_of_longest_substring(\"pwwkew\"), 3)\nT(\"abba trap\", lambda: length_of_longest_substring(\"abba\"), 2)\nT(\"empty\", lambda: length_of_longest_substring(\"\"), 0)\nT(\"spaces count\", lambda: length_of_longest_substring(\"a b c\"), 3)\n"}, {"id": "char-replacement", "topic": "sliding-window", "level": "Medium", "title": "Longest Repeating Character Replacement", "blind": true, "lc": 424, "statement": "<p>Given an uppercase string <code>s<\/code> and an integer <code>k<\/code>, you may change <b>at most k characters<\/b> to any other uppercase letter. Return the length of the longest substring that can be made of <b>one repeated letter<\/b>.<\/p>", "examples": "<pre class=\"plain\">character_replacement(\"ABAB\", 2)     → 4   (change both B's → \"AAAA\")\ncharacter_replacement(\"AABABBA\", 1)  → 4   (\"AABA\" → \"AAAA\")<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"Find the longest stretch I can make all one letter by repainting at most k letters.\"<\/p>\n<p><b>Real-life picture:<\/b> a fence of coloured planks, and you have k cans of paint. In any section of fence, the smart move is to keep the <b>most common colour<\/b> and repaint the others. A section is fixable if <code>(section length) − (count of its most common colour) ≤ k<\/code>, because that's how many planks you'd repaint.<\/p>\n<p>So slide a window. If it becomes unfixable, shrink it from the left.<\/p>", "approach": "<ol><li>Keep <code>count<\/code> = letter counts inside the window, and <code>top<\/code> = the highest count seen.<\/li><li>For each <code>right<\/code>: - Add <code>s[right]<\/code> to <code>count<\/code>, and update <code>top = max(top, count[s[right]])<\/code>. - If <code>window length - top &gt; k<\/code>, the window needs too many repaints, so remove <code>s[left]<\/code> from count and <code>left += 1<\/code>. - <code>best = max(best, window length)<\/code>.<\/li><\/ol>\n<h4>Why <code>top<\/code> never needs to decrease (the subtle part)<\/h4>\n<p>We only care about finding a <b>longer<\/b> valid window. A longer window needs a bigger <code>top<\/code>. So keeping an old, too-high <code>top<\/code> can't create a wrong bigger answer. It just stops the window shrinking more than needed. This keeps the solution O(n).<\/p>", "hints": ["A window is valid if length − (most frequent letter count) ≤ k.", "Grow on the right. When invalid, shrink from the left by one.", "Track letter counts in a dict or a 26-length list."], "starter": "def character_replacement(s, k):\n    pass\n", "solution": "def character_replacement(s, k):\n    count = {}\n    left = top = best = 0\n    for right, ch in enumerate(s):\n        count[ch] = count.get(ch, 0) + 1\n        top = max(top, count[ch])                 # most common letter in the window\n        while (right - left + 1) - top > k:       # too many letters to repaint\n            count[s[left]] -= 1\n            left += 1\n        best = max(best, right - left + 1)\n    return best\n", "complexity": "<p><b>Time O(n)<\/b>. <b>Space O(1)<\/b>: at most 26 letters.<\/p>", "mistakes": "<ul><li>Recomputing <code>max(count.values())<\/code> every step is fine (26 letters), but you should still be able to explain why the <code>top<\/code> trick works.<\/li><\/ul>", "tests": "\nT(\"example 1\", lambda: character_replacement(\"ABAB\", 2), 4)\nT(\"example 2\", lambda: character_replacement(\"AABABBA\", 1), 4)\nT(\"k = 0\", lambda: character_replacement(\"AABBB\", 0), 3)\nT(\"all same\", lambda: character_replacement(\"AAAA\", 2), 4)\nT(\"single\", lambda: character_replacement(\"A\", 0), 1)\n"}, {"id": "min-window-substring", "topic": "sliding-window", "level": "Hard", "title": "Minimum Window Substring", "blind": true, "lc": 76, "statement": "<p>Given strings <code>s<\/code> and <code>t<\/code>, return the <b>shortest substring of <code>s<\/code><\/b> that contains <b>every character of <code>t<\/code><\/b>, counting duplicates. If none exists, return <code>\"\"<\/code>.<\/p>", "examples": "<pre class=\"plain\">min_window(\"ADOBECODEBANC\", \"ABC\")  → \"BANC\"\nmin_window(\"a\", \"a\")                → \"a\"\nmin_window(\"a\", \"aa\")               → \"\"    (need two a's)<\/pre>", "eli10": "<p><b>What it's really asking:<\/b> \"What
