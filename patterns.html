loat\n    veg: bool = True\n    def __iter__(self):               # a leaf \"iterates\" over just itself\n        yield self\n\nclass Category:                       # a COMPOSITE: holds items AND other categories\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, *things):\n        self.children.extend(things)\n        return self\n    def __iter__(self):               # ITERATOR: every MenuItem inside, however deep\n        for child in self.children:\n            yield from child\n    def find(self, item_id):\n        return next((i for i in self if i.id == item_id), None)\n    def veg_only(self):\n        return [i for i in self if i.veg]\n\ndef sample_menu():\n    return Category(\"QuickBite\").add(\n        Category(\"Snacks\").add(MenuItem(\"samosa\", \"Samosa\", 20), MenuItem(\"fries\", \"French Fries\", 80)),\n        Category(\"Meals\").add(\n            MenuItem(\"thali\", \"Veg Thali\", 150),\n            MenuItem(\"biryani\", \"Chicken Biryani\", 220, veg=False),\n            Category(\"Combos\").add(MenuItem(\"burger-combo\", \"Burger Combo\", 199)),\n        ),\n        Category(\"Drinks\").add(MenuItem(\"chai\", \"Masala Chai\", 25), MenuItem(\"lassi\", \"Sweet Lassi\", 60)),\n    )\n\n# ===== Step 2: YOUR CODE =====\nclass Plain:\n    pass\n\nclass AddOn:\n    pass\n\nADDONS = {}\n\ndef make_priced(item, addons=()):\n    pass\n\nclass NoDiscount:\n    pass\n\nclass Cart:\n    pass\n", "solution": "# ===== Step 1: Menu (Composite + Iterator) =====\nfrom abc import ABC, abstractmethod\nfrom collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol\n\n@dataclass(frozen=True)\nclass MenuItem:                       # a LEAF of the menu tree (frozen = can't change by accident)\n    id: str\n    name: str\n    price: float\n    veg: bool = True\n    def __iter__(self):               # a leaf \"iterates\" over just itself\n        yield self\n\nclass Category:                       # a COMPOSITE: holds items AND other categories\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, *things):\n        self.children.extend(things)\n        return self\n    def __iter__(self):               # ITERATOR: every MenuItem inside, however deep\n        for child in self.children:\n            yield from child\n    def find(self, item_id):\n        return next((i for i in self if i.id == item_id), None)\n    def veg_only(self):\n        return [i for i in self if i.veg]\n\ndef sample_menu():\n    return Category(\"QuickBite\").add(\n        Category(\"Snacks\").add(MenuItem(\"samosa\", \"Samosa\", 20), MenuItem(\"fries\", \"French Fries\", 80)),\n        Category(\"Meals\").add(\n            MenuItem(\"thali\", \"Veg Thali\", 150),\n            MenuItem(\"biryani\", \"Chicken Biryani\", 220, veg=False),\n            Category(\"Combos\").add(MenuItem(\"burger-combo\", \"Burger Combo\", 199)),\n        ),\n        Category(\"Drinks\").add(MenuItem(\"chai\", \"Masala Chai\", 25), MenuItem(\"lassi\", \"Sweet Lassi\", 60)),\n    )\n\n# ===== Step 2: Pricing (Decorator for add-ons + Strategy for discounts) =====\nclass Priced(Protocol):\n    def price(self) -> float: ...\n    def label(self) -> str: ...\n\nclass Plain:                                   # turns a MenuItem into a Priced thing\n    def __init__(self, item):\n        self.item = item\n    def price(self): return self.item.price\n    def label(self): return self.item.name\n\nclass AddOn:                                   # DECORATOR base: wraps any Priced\n    extra, text = 0, \"\"\n    def __init__(self, inner):\n        self.inner = inner\n    def price(self): return self.inner.price() + self.extra\n    def label(self): return f\"{self.inner.label()} + {self.text}\"\n\nclass ExtraCheese(AddOn): extra, text = 30, \"extra cheese\"\nclass ExtraSauce(AddOn): extra, text = 10, \"extra sauce\"\nclass Jumbo(AddOn): extra, text = 50, \"jumbo size\"\n\nADDONS = {\"cheese\": ExtraCheese, \"sauce\": ExtraSauce, \"jumbo\": Jumbo}\n\ndef make_priced(item, addons=()):\n    priced = Plain(item)\n    for name in addons:\n        priced = ADDONS[name](priced)          # stack decorators\n    return priced\n\nclass Discount(ABC):                           # STRATEGY interface\n    @abstractmethod\n    def apply(self, subtotal): ...\n\nclass NoDiscount(Discount):\n    def apply(self, subtotal): return subtotal\n\nclass PercentOff(Discount):\n    def __init__(self, percent): self.percent = percent\n    def apply(self, subtotal): return subtotal * (1 - self.percent / 100)\n\nclass FlatOff(Discount):\n    def __init__(self, amount, min_total=0): self.amount, self.min_total = amount, min_total\n    def apply(self, subtotal): return subtotal - self.amount if subtotal >= self.min_total else subtotal\n\nclass Cart:\n    def __init__(self):\n        self.lines = []                        # list of (priced, qty) tuples\n    def add(self, priced, qty=1):\n        if qty <= 0:\n            raise ValueError(\"qty must be positive\")\n        line = (priced, qty)\n        self.lines.append(line)\n        return line\n    def remove(self, line):\n        self.lines.remove(line)\n    def subtotal(self):\n        return sum(p.price() * q for p, q in self.lines)\n    def total(self, discount=None):\n        return round(max(0, (discount or NoDiscount()).apply(self.subtotal())), 2)\n", "tests": "\n_m = sample_menu()\n_burger = lambda *a: make_priced(_m.find(\"burger-combo\"), a)\nT(\"plain price\", lambda: _burger().price(), 199)\nT(\"stacked add-ons\", lambda: (_burger(\"jumbo\", \"cheese\").price(), _burger(\"jumbo\", \"cheese\").label()), (279, \"Burger Combo + jumbo size + extra cheese\"))\ndef _cart():\n    c = Cart(); c.add(make_priced(_m.find(\"thali\")), 2); c.add(_burger(\"cheese\")); return c\nT(\"subtotal\", lambda: _cart().subtotal(), 529)\nT(\"percent off\", lambda: _cart().total(PercentOff(10)), 476.1)\nT(\"flat off needs minimum\", lambda: (_cart().total(FlatOff(100, 600)), _cart().total(FlatOff(100, 500))), (529, 429))\nT(\"never negative\", lambda: _cart().total(FlatOff(10_000)), 0)\ndef _remove():\n    c = Cart(); line = c.add(make_priced(_m.find(\"chai\"))); c.remove(line); return c.lines\nT(\"remove a line\", _remove, [])\ndef _badqty():\n    try:\n        Cart().add(make_priced(_m.find(\"chai\")), 0); return False\n    except ValueError:\n        return True\nC(\"qty must be positive\", _badqty)\n", "hints": ["AddOn.price() = inner.price() + extra; AddOn.label() appends ' + text'.", "make_priced wraps Plain(item) in each add-on in order.", "Cart.total: round(max(0, discount.apply(subtotal)), 2)."]}]}, {"id": "qb-step3", "part": "project", "title": "Step 3: Building Orders (Builder + Prototype)", "tagline": "A safe way to make orders, and 'order again' in one tap", "body": "<h4>Builder<\/h4>\n<p>An order needs a customer, an address and at least one line, plus an optional discount. The <code>OrderBuilder<\/code> collects these <b>step by step<\/b> (<code>for_customer(...).deliver_to(...).from_cart(...)<\/code>) and checks everything <b>once<\/b> in <code>build()<\/code>. The finished <code>Order<\/code> is a <b>frozen dataclass<\/b>: once placed, it can't be edited by accident.<\/p>\n<p>Each <code>OrderLine<\/code> stores the label and unit price <b>at the time of ordering<\/b>. If the menu price changes tomorrow, old orders still show what the customer really paid.<\/p>\n<h4>Prototype<\/h4>\n<p>\"Order again\" copies a past order with a new id: <code>order.reorder(new_id)<\/code> uses <code>dataclasses.replace<\/code>, which is Python's built-in \"clone with changes\".<\/p>\n<pre><code># ===== Step 3: Orders (Builder + Prototype) =====\n@dataclass(frozen=True)\nclass OrderLine:\n    label: str\n    unit_price: float\n    qty: int\n\n@dataclass(frozen=True)\nclass Order:\n    id: str\n    customer: str\n    address: str\n    lines: tuple\n    total: float\n    def reorder(self, new_id):                 # PROTOTYPE: a copy of this order with a new id\n        return replace(self, id=new_id)\n\nclass OrderBuilder:                            # BUILDER: step by step, validated in build()\n    def __init__(self):\n        self._customer = self._address = None\n        self._cart, self._discount = Cart(), NoDiscount()\n    def for_customer(self, name):\n        self._customer = name\n        return self\n    def deliver_to(self, address):\n        self._address = address\n        return self\n    def add(self, priced, qty=1):\n        self._cart.add(priced, qty)\n        return self\n    def from_cart(self, cart):\n        self._cart = cart\n        return self\n    def with_discount(self, discount):\n        self._discount = discount\n        return self\n    def build(self, order_id):\n        if not self._customer:\n            raise ValueError(\"customer is required\")\n        if not self._address:\n            raise ValueError(\"address is required\")\n        if not self._cart.lines:\n            raise ValueError(\"order is empty\")\n        lines = tuple(OrderLine(p.label(), p.price(), q) for p, q in self._cart.lines)\n        return Order(order_id, self._customer, self._address, lines, self._cart.total(self._discount))<\/code><\/pre>", "quiz": [["Why store the label and price inside OrderLine instead of a reference to MenuItem?", "<p>Orders are historical records. If the menu changes later, the order must still show what was actually bought and paid.<\/p>"]], "exercises": [{"id": "qb3", "title": "OrderBuilder and reorder", "statement": "<p>Write Step 3: frozen dataclasses <code>OrderLine(label, unit_price, qty)<\/code> and <code>Order(id, customer, address, lines, total)<\/code> with <code>reorder(new_id)<\/code>, plus an <code>OrderBuilder<\/code> with chainable <code>for_customer<\/code>, <code>deliver_to<\/code>, <code>add(priced, qty=1)<\/code>, <code>from_cart(cart)<\/code>, <code>with_discount(discount)<\/code> and <code>build(order_id)<\/code>.<\/p>\n<p><code>build<\/code> raises <code>ValueError<\/code> if the customer, the address or the items are missing. <code>lines<\/code> must be a <b>tuple<\/b> of OrderLine, and <code>total<\/code> uses the cart total with the discount.<\/p>", "starter": "# ===== Step 1: Menu (Composite + Iterator) =====\nfrom abc import ABC, abstractmethod\nfrom collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol\n\n@dataclass(frozen=True)\nclass MenuItem:                       # a LEAF of the menu tree (frozen = can't change by accident)\n    id: str\n    name: str\n    price: float\n    veg: bool = True\n    def __iter__(self):               # a leaf \"iterates\" over just itself\n        yield self\n\nclass Category:                       # a COMPOSITE: holds items AND other categories\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, *things):\n        self.children.extend(things)\n        return self\n    def __iter__(self):               # ITERATOR: every MenuItem inside, however deep\n        for child in self.children:\n            yield from child\n    def find(self, item_id):\n        return next((i for i in self if i.id == item_id), None)\n    def veg_only(self):\n        return [i for i in self if i.veg]\n\ndef sample_menu():\n    return Category(\"QuickBite\").add(\n        Category(\"Snacks\").add(MenuItem(\"samosa\", \"Samosa\", 20), MenuItem(\"fries\", \"French Fries\", 80)),\n        Category(\"Meals\").add(\n            MenuItem(\"thali\", \"Veg Thali\", 150),\n            MenuItem(\"biryani\", \"Chicken Biryani\", 220, veg=False),\n            Category(\"Combos\").add(MenuItem(\"burger-combo\", \"Burger Combo\", 199)),\n        ),\n        Category(\"Drinks\").add(MenuItem(\"chai\", \"Masala Chai\", 25), MenuItem(\"lassi\", \"Sweet Lassi\", 60)),\n    )\n\n# ===== Step 2: Pricing (Decorator for add-ons + Strategy for discounts) =====\nclass Priced(Protocol):\n    def price(self) -> float: ...\n    def label(self) -> str: ...\n\nclass Plain:                                   # turns a MenuItem into a Priced thing\n    def __init__(self, item):\n        self.item = item\n    def price(self): return self.item.price\n    def label(self): return self.item.name\n\nclass AddOn:                                   # DECORATOR base: wraps any Priced\n    extra, text = 0, \"\"\n    def __init__(self, inner):\n        self.inner = inner\n    def price(self): return self.inner.price() + self.extra\n    def label(self): return f\"{self.inner.label()} + {self.text}\"\n\nclass ExtraCheese(AddOn): extra, text = 30, \"extra cheese\"\nclass ExtraSauce(AddOn): extra, text = 10, \"extra sauce\"\nclass Jumbo(AddOn): extra, text = 50, \"jumbo size\"\n\nADDONS = {\"cheese\": ExtraCheese, \"sauce\": ExtraSauce, \"jumbo\": Jumbo}\n\ndef make_priced(item, addons=()):\n    priced = Plain(item)\n    for name in addons:\n        priced = ADDONS[name](priced)          # stack decorators\n    return priced\n\nclass Discount(ABC):                           # STRATEGY interface\n    @abstractmethod\n    def apply(self, subtotal): ...\n\nclass NoDiscount(Discount):\n    def apply(self, subtotal): return subtotal\n\nclass PercentOff(Discount):\n    def __init__(self, percent): self.percent = percent\n    def apply(self, subtotal): return subtotal * (1 - self.percent / 100)\n\nclass FlatOff(Discount):\n    def __init__(self, amount, min_total=0): self.amount, self.min_total = amount, min_total\n    def apply(self, subtotal): return subtotal - self.amount if subtotal >= self.min_total else subtotal\n\nclass Cart:\n    def __init__(self):\n        self.lines = []                        # list of (priced, qty) tuples\n    def add(self, priced, qty=1):\n        if qty <= 0:\n            raise ValueError(\"qty must be positive\")\n        line = (priced, qty)\n        self.lines.append(line)\n        return line\n    def remove(self, line):\n        self.lines.remove(line)\n    def subtotal(self):\n        return sum(p.price() * q for p, q in self.lines)\n    def total(self, discount=None):\n        return round(max(0, (discount or NoDiscount()).apply(self.subtotal())), 2)\n\n# ===== Step 3: YOUR CODE =====\n@dataclass(frozen=True)\nclass OrderLine:\n    pass\n\n@dataclass(frozen=True)\nclass Order:\n    pass\n\nclass OrderBuilder:\n    pass\n", "solution": "# ===== Step 1: Menu (Composite + Iterator) =====\nfrom abc import ABC, abstractmethod\nfrom collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol\n\n@dataclass(frozen=True)\nclass MenuItem:                       # a LEAF of the menu tree (frozen = can't change by accident)\n    id: str\n    name: str\n    price: float\n    veg: bool = True\n    def __iter__(self):               # a leaf \"iterates\" over just itself\n        yield self\n\nclass Category:                       # a COMPOSITE: holds items AND other categories\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, *things):\n        self.children.extend(things)\n        return self\n    def __iter__(self):               # ITERATOR: every MenuItem inside, however deep\n        for child in self.children:\n            yield from child\n    def find(self, item_id):\n        return next((i for i in self if i.id == item_id), None)\n    def veg_only(self):\n        return [i for i in self if i.veg]\n\ndef sample_menu():\n    return Category(\"QuickBite\").add(\n        Category(\"Snacks\").add(MenuItem(\"samosa\", \"Samosa\", 20), MenuItem(\"fries\", \"French Fries\", 80)),\n        Category(\"Meals\").add(\n            MenuItem(\"thali\", \"Veg Thali\", 150),\n            MenuItem(\"biryani\", \"Chicken Biryani\", 220, veg=False),\n            Category(\"Combos\").add(MenuItem(\"burger-combo\", \"Burger Combo\", 199)),\n        ),\n        Category(\"Drinks\").add(MenuItem(\"chai\", \"Masala Chai\", 25), MenuItem(\"lassi\", \"Sweet Lassi\", 60)),\n    )\n\n# ===== Step 2: Pricing (Decorator for add-ons + Strategy for discounts) =====\nclass Priced(Protocol):\n    def price(self) -> float: ...\n    def label(self) -> str: ...\n\nclass Plain:                                   # turns a MenuItem into a Priced thing\n    def __init__(self, item):\n        self.item = item\n    def price(self): return self.item.price\n    def label(self): return self.item.name\n\nclass AddOn:                                   # DECORATOR base: wraps any Priced\n    extra, text = 0, \"\"\n    def __init__(self, inner):\n        self.inner = inner\n    def price(self): return self.inner.price() + self.extra\n    def label(self): return f\"{self.inner.label()} + {self.text}\"\n\nclass ExtraCheese(AddOn): extra, text = 30, \"extra cheese\"\nclass ExtraSauce(AddOn): extra, text = 10, \"extra sauce\"\nclass Jumbo(AddOn): extra, text = 50, \"jumbo size\"\n\nADDONS = {\"cheese\": ExtraCheese, \"sauce\": ExtraSauce, \"jumbo\": Jumbo}\n\ndef make_priced(item, addons=()):\n    priced = Plain(item)\n    for name in addons:\n        priced = ADDONS[name](priced)          # stack decorators\n    return priced\n\nclass Discount(ABC):                           # STRATEGY interface\n    @abstractmethod\n    def apply(self, subtotal): ...\n\nclass NoDiscount(Discount):\n    def apply(self, subtotal): return subtotal\n\nclass PercentOff(Discount):\n    def __init__(self, percent): self.percent = percent\n    def apply(self, subtotal): return subtotal * (1 - self.percent / 100)\n\nclass FlatOff(Discount):\n    def __init__(self, amount, min_total=0): self.amount, self.min_total = amount, min_total\n    def apply(self, subtotal): return subtotal - self.amount if subtotal >= self.min_total else subtotal\n\nclass Cart:\n    def __init__(self):\n        self.lines = []                        # list of (priced, qty) tuples\n    def add(self, priced, qty=1):\n        if qty <= 0:\n            raise ValueError(\"qty must be positive\")\n        line = (priced, qty)\n        self.lines.append(line)\n        return line\n    def remove(self, line):\n        self.lines.remove(line)\n    def subtotal(self):\n        return sum(p.price() * q for p, q in self.lines)\n    def total(self, discount=None):\n        return round(max(0, (discount or NoDiscount()).apply(self.subtotal())), 2)\n\n# ===== Step 3: Orders (Builder + Prototype) =====\n@dataclass(frozen=True)\nclass OrderLine:\n    label: str\n    unit_price: float\n    qty: int\n\n@dataclass(frozen=True)\nclass Order:\n    id: str\n    customer: str\n    address: str\n    lines: tuple\n    total: float\n    def reorder(self, new_id):                 # PROTOTYPE: a copy of this order with a new id\n        return replace(self, id=new_id)\n\nclass OrderBuilder:                            # BUILDER: step by step, validated in build()\n    def __init__(self):\n        self._customer = self._address = None\n        self._cart, self._discount = Cart(), NoDiscount()\n    def for_customer(self, name):\n        self._customer = name\n        return self\n    def deliver_to(self, address):\n        self._address = address\n        return self\n    def add(self, priced, qty=1):\n        self._cart.add(priced, qty)\n        return self\n    def from_cart(self, cart):\n        self._cart = cart\n        return self\n    def with_discount(self, discount):\n        self._discount = discount\n        return self\n    def build(self, order_id):\n        if not self._customer:\n            raise ValueError(\"customer is required\")\n        if not self._address:\n            raise ValueError(\"address is required\")\n        if not self._cart.lines:\n            raise ValueError(\"order is empty\")\n        lines = tuple(OrderLine(p.label(), p.price(), q) for p, q in self._cart.lines)\n        return Order(order_id, self._customer, self._address, lines, self._cart.total(self._discount))\n", "tests": "\n_m = sample_menu()\ndef _order():\n    return (OrderBuilder().for_customer(\"Asha\").deliver_to(\"MG Road\")\n            .add(make_priced(_m.find(\"thali\")), 2).add(make_priced(_m.find(\"chai\"), [\"jumbo\"]))\n            .with_discount(PercentOff(10)).build(\"QB0001\"))\nT(\"lines\", lambda: _order().lines, (OrderLine(\"Veg Thali\", 150, 2), OrderLine(\"Masala Chai + jumbo size\", 75, 1)))\nT(\"total with discount\", lambda: _order().total, 337.5)\nT(\"reorder keeps everything but the id\", lambda: (_order().reorder(\"QB0009\").id, _order().reorder(\"QB0009\").total), (\"QB0009\", 337.5))\ndef _missing(step):\n    b = OrderBuilder().for_customer(\"A\").deliver_to(\"X\").add(make_priced(_m.find(\"chai\")))\n    if step == \"customer\": b = OrderBuilder().deliver_to(\"X\").add(make_priced(_m.find(\"chai\")))\n    if step == \"address\": b = OrderBuilder().for_customer(\"A\").add(make_priced(_m.find(\"chai\")))\n    if step == \"items\": b = OrderBuilder().for_customer(\"A\").deliver_to(\"X\")\n    try:\n        b.build(\"x\"); return False\n    except ValueError:\n        return True\nC(\"validates customer, address, items\", lambda: all(_missing(s) for s in (\"customer\", \"address\", \"items\")))\ndef _frozen():\n    try:\n        _order().total = 0; return False\n    except Exception:\n        return True\nC(\"orders are frozen\", _frozen)\n", "hints": ["Each builder method stores a value and returns self.", "build(): check the three requirements, then make a tuple of OrderLine from the cart lines."]}]}, {"id": "qb-step4", "part": "project", "title": "Step 4: Payments (Factory + Adapter)", "tagline": "UPI, card, cash: and tomorrow, something new", "body": "<h4>The problem<\/h4>\n<p>Each payment company gives us a library with a <b>different API<\/b>: <code>QuickPaySDK.charge_paise(paise)<\/code> returns a dict, and <code>CardCoClient.authorize(\"199.00\")<\/code> returns a string. We can't edit their code, and the app shouldn't care which one is used.<\/p>\n<h4>The design<\/h4>\n<ul><li><b>Adapter:<\/b> <code>UpiPayment<\/code> and <code>CardPayment<\/code> wrap the SDKs and expose <b>our<\/b> interface, <code>pay(amount) -&gt; receipt id<\/code>. Unit conversion (rupees to paise) lives inside the adapter.<\/li><li><b>Factory:<\/b> <code>PaymentFactory.create(\"upi\")<\/code> returns the right object. New methods <b>register themselves<\/b> with a decorator, so the factory never needs editing (open/closed).<\/li><li>The adapters accept the SDK in <code><i>_init_<\/i><\/code> (<code>sdk=None<\/code> means \"use the real one\"), which is dependency injection, so tests can pass fakes.<\/li><\/ul>\n<pre><code># ===== Step 4: Payments (Factory + Adapter) =====\nclass QuickPaySDK:                     # pretend third-party UPI library (we can't edit it)\n    def charge_paise(self, paise):\n        return {\"ok\": True, \"txn\": f\"UPI{paise}\"}\n\nclass CardCoClient:                    # pretend third-party card library (we can't edit it)\n    def authorize(self, amount_str):\n        return f\"CARD-{amount_str}\"\n\nclass PaymentFactory:                  # FACTORY with self-registration\n    _methods = {}\n    @classmethod\n    def register(cls, name):\n        def deco(klass):\n            cls._methods[name] = klass\n            return klass\n        return deco\n    @classmethod\n    def create(cls, name):\n        if name not in cls._methods:\n            raise ValueError(f\"unknown payment method: {name}\")\n        return cls._methods[name]()\n\n@PaymentFactory.register(\"upi\")\nclass UpiPayment:                      # ADAPTER: QuickPaySDK -&gt; our pay(amount) interface\n    def __init__(self, sdk=None):\n        self.sdk = sdk or QuickPaySDK()\n    def pay(self, amount):\n        return self.sdk.charge_paise(round(amount * 100))[\"txn\"]\n\n@PaymentFactory.register(\"card\")\nclass CardPayment:                     # ADAPTER: CardCoClient -&gt; pay(amount)\n    def __init__(self, client=None):\n        self.client = client or CardCoClient()\n    def pay(self, amount):\n        return self.client.authorize(f\"{amount:.2f}\")\n\n@PaymentFactory.register(\"cash\")\nclass CashOnDelivery:\n    def pay(self, amount):\n        return f\"COD-{amount:.2f}\"<\/code><\/pre>", "quiz": [["Where does the rupees-to-paise conversion belong, and why?", "<p>Inside the UPI adapter. It's a detail of that SDK; the rest of the app always speaks rupees.<\/p>"]], "exercises": [{"id": "qb4", "title": "Payment factory and adapters", "statement": "<p>Write Step 4: <code>PaymentFactory<\/code> with <code>register(name)<\/code> (a decorator) and <code>create(name)<\/code> (<code>ValueError<\/code> if unknown), plus three registered methods:<\/p>\n<ul><li><code>\"upi\"<\/code> → <code>UpiPayment<\/code>, adapting <code>QuickPaySDK<\/code> (pay ₹12.5 → <code>\"UPI1250\"<\/code>),<\/li><li><code>\"card\"<\/code> → <code>CardPayment<\/code>, adapting <code>CardCoClient<\/code> (pay 199 → <code>\"CARD-199.00\"<\/code>),<\/li><li><code>\"cash\"<\/code> → <code>CashOnDelivery<\/code> (pay 50 → <code>\"COD-50.00\"<\/code>).<\/li><\/ul>\n<p>The two SDK classes are given. Don't modify them.<\/p>", "starter": "# ===== Step 1: Menu (Composite + Iterator) =====\nfrom abc import ABC, abstractmethod\nfrom collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol\n\n@dataclass(frozen=True)\nclass MenuItem:                       # a LEAF of the menu tree (frozen = can't change by accident)\n    id: str\n    name: str\n    price: float\n    veg: bool = True\n    def __iter__(self):               # a leaf \"iterates\" over just itself\n        yield self\n\nclass Category:                       # a COMPOSITE: holds items AND other categories\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, *things):\n        self.children.extend(things)\n        return self\n    def __iter__(self):               # ITERATOR: every MenuItem inside, however deep\n        for child in self.children:\n            yield from child\n    def find(self, item_id):\n        return next((i for i in self if i.id == item_id), None)\n    def veg_only(self):\n        return [i for i in self if i.veg]\n\ndef sample_menu():\n    return Category(\"QuickBite\").add(\n        Category(\"Snacks\").add(MenuItem(\"samosa\", \"Samosa\", 20), MenuItem(\"fries\", \"French Fries\", 80)),\n        Category(\"Meals\").add(\n            MenuItem(\"thali\", \"Veg Thali\", 150),\n            MenuItem(\"biryani\", \"Chicken Biryani\", 220, veg=False),\n            Category(\"Combos\").add(MenuItem(\"burger-combo\", \"Burger Combo\", 199)),\n        ),\n        Category(\"Drinks\").add(MenuItem(\"chai\", \"Masala Chai\", 25), MenuItem(\"lassi\", \"Sweet Lassi\", 60)),\n    )\n\n# ===== Step 2: Pricing (Decorator for add-ons + Strategy for discounts) =====\nclass Priced(Protocol):\n    def price(self) -> float: ...\n    def label(self) -> str: ...\n\nclass Plain:                                   # turns a MenuItem into a Priced thing\n    def __init__(self, item):\n        self.item = item\n    def price(self): return self.item.price\n    def label(self): return self.item.name\n\nclass AddOn:                                   # DECORATOR base: wraps any Priced\n    extra, text = 0, \"\"\n    def __init__(self, inner):\n        self.inner = inner\n    def price(self): return self.inner.price() + self.extra\n    def label(self): return f\"{self.inner.label()} + {self.text}\"\n\nclass ExtraCheese(AddOn): extra, text = 30, \"extra cheese\"\nclass ExtraSauce(AddOn): extra, text = 10, \"extra sauce\"\nclass Jumbo(AddOn): extra, text = 50, \"jumbo size\"\n\nADDONS = {\"cheese\": ExtraCheese, \"sauce\": ExtraSauce, \"jumbo\": Jumbo}\n\ndef make_priced(item, addons=()):\n    priced = Plain(item)\n    for name in addons:\n        priced = ADDONS[name](priced)          # stack decorators\n    return priced\n\nclass Discount(ABC):                           # STRATEGY interface\n    @abstractmethod\n    def apply(self, subtotal): ...\n\nclass NoDiscount(Discount):\n    def apply(self, subtotal): return subtotal\n\nclass PercentOff(Discount):\n    def __init__(self, percent): self.percent = percent\n    def apply(self, subtotal): return subtotal * (1 - self.percent / 100)\n\nclass FlatOff(Discount):\n    def __init__(self, amount, min_total=0): self.amount, self.min_total = amount, min_total\n    def apply(self, subtotal): return subtotal - self.amount if subtotal >= self.min_total else subtotal\n\nclass Cart:\n    def __init__(self):\n        self.lines = []                        # list of (priced, qty) tuples\n    def add(self, priced, qty=1):\n        if qty <= 0:\n            raise ValueError(\"qty must be positive\")\n        line = (priced, qty)\n        self.lines.append(line)\n        return line\n    def remove(self, line):\n        self.lines.remove(line)\n    def subtotal(self):\n        return sum(p.price() * q for p, q in self.lines)\n    def total(self, discount=None):\n        return round(max(0, (discount or NoDiscount()).apply(self.subtotal())), 2)\n\n# ===== Step 3: Orders (Builder + Prototype) =====\n@dataclass(frozen=True)\nclass OrderLine:\n    label: str\n    unit_price: float\n    qty: int\n\n@dataclass(frozen=True)\nclass Order:\n    id: str\n    customer: str\n    address: str\n    lines: tuple\n    total: float\n    def reorder(self, new_id):                 # PROTOTYPE: a copy of this order with a new id\n        return replace(self, id=new_id)\n\nclass OrderBuilder:                            # BUILDER: step by step, validated in build()\n    def __init__(self):\n        self._customer = self._address = None\n        self._cart, self._discount = Cart(), NoDiscount()\n    def for_customer(self, name):\n        self._customer = name\n        return self\n    def deliver_to(self, address):\n        self._address = address\n        return self\n    def add(self, priced, qty=1):\n        self._cart.add(priced, qty)\n        return self\n    def from_cart(self, cart):\n        self._cart = cart\n        return self\n    def with_discount(self, discount):\n        self._discount = discount\n        return self\n    def build(self, order_id):\n        if not self._customer:\n            raise ValueError(\"customer is required\")\n        if not self._address:\n            raise ValueError(\"address is required\")\n        if not self._cart.lines:\n            raise ValueError(\"order is empty\")\n        lines = tuple(OrderLine(p.label(), p.price(), q) for p, q in self._cart.lines)\n        return Order(order_id, self._customer, self._address, lines, self._cart.total(self._discount))\n\n# ===== Step 4 =====\nclass QuickPaySDK:                     # third-party: don't edit\n    def charge_paise(self, paise):\n        return {\"ok\": True, \"txn\": f\"UPI{paise}\"}\n\nclass CardCoClient:                    # third-party: don't edit\n    def authorize(self, amount_str):\n        return f\"CARD-{amount_str}\"\n\n# YOUR CODE: PaymentFactory, UpiPayment, CardPayment, CashOnDelivery\n", "solution": "# ===== Step 1: Menu (Composite + Iterator) =====\nfrom abc import ABC, abstractmethod\nfrom collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol\n\n@dataclass(frozen=True)\nclass MenuItem:                       # a LEAF of the menu tree (frozen = can't change by accident)\n    id: str\n    name: str\n    price: float\n    veg: bool = True\n    def __iter__(self):               # a leaf \"iterates\" over just itself\n        yield self\n\nclass Category:                       # a COMPOSITE: holds items AND other categories\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, *things):\n        self.children.extend(things)\n        return self\n    def __iter__(self):               # ITERATOR: every MenuItem inside, however deep\n        for child in self.children:\n            yield from child\n    def find(self, item_id):\n        return next((i for i in self if i.id == item_id), None)\n    def veg_only(self):\n        return [i for i in self if i.veg]\n\ndef sample_menu():\n    return Category(\"QuickBite\").add(\n        Category(\"Snacks\").add(MenuItem(\"samosa\", \"Samosa\", 20), MenuItem(\"fries\", \"French Fries\", 80)),\n        Category(\"Meals\").add(\n            MenuItem(\"thali\", \"Veg Thali\", 150),\n            MenuItem(\"biryani\", \"Chicken Biryani\", 220, veg=False),\n            Category(\"Combos\").add(MenuItem(\"burger-combo\", \"Burger Combo\", 199)),\n        ),\n        Category(\"Drinks\").add(MenuItem(\"chai\", \"Masala Chai\", 25), MenuItem(\"lassi\", \"Sweet Lassi\", 60)),\n    )\n\n# ===== Step 2: Pricing (Decorator for add-ons + Strategy for discounts) =====\nclass Priced(Protocol):\n    def price(self) -> float: ...\n    def label(self) -> str: ...\n\nclass Plain:                                   # turns a MenuItem into a Priced thing\n    def __init__(self, item):\n        self.item = item\n    def price(self): return self.item.price\n    def label(self): return self.item.name\n\nclass AddOn:                                   # DECORATOR base: wraps any Priced\n    extra, text = 0, \"\"\n    def __init__(self, inner):\n        self.inner = inner\n    def price(self): return self.inner.price() + self.extra\n    def label(self): return f\"{self.inner.label()} + {self.text}\"\n\nclass ExtraCheese(AddOn): extra, text = 30, \"extra cheese\"\nclass ExtraSauce(AddOn): extra, text = 10, \"extra sauce\"\nclass Jumbo(AddOn): extra, text = 50, \"jumbo size\"\n\nADDONS = {\"cheese\": ExtraCheese, \"sauce\": ExtraSauce, \"jumbo\": Jumbo}\n\ndef make_priced(item, addons=()):\n    priced = Plain(item)\n    for name in addons:\n        priced = ADDONS[name](priced)          # stack decorators\n    return priced\n\nclass Discount(ABC):                           # STRATEGY interface\n    @abstractmethod\n    def apply(self, subtotal): ...\n\nclass NoDiscount(Discount):\n    def apply(self, subtotal): return subtotal\n\nclass PercentOff(Discount):\n    def __init__(self, percent): self.percent = percent\n    def apply(self, subtotal): return subtotal * (1 - self.percent / 100)\n\nclass FlatOff(Discount):\n    def __init__(self, amount, min_total=0): self.amount, self.min_total = amount, min_total\n    def apply(self, subtotal): return subtotal - self.amount if subtotal >= self.min_total else subtotal\n\nclass Cart:\n    def __init__(self):\n        self.lines = []                        # list of (priced, qty) tuples\n    def add(self, priced, qty=1):\n        if qty <= 0:\n            raise ValueError(\"qty must be positive\")\n        line = (priced, qty)\n        self.lines.append(line)\n        return line\n    def remove(self, line):\n        self.lines.remove(line)\n    def subtotal(self):\n        return sum(p.price() * q for p, q in self.lines)\n    def total(self, discount=None):\n        return round(max(0, (discount or NoDiscount()).apply(self.subtotal())), 2)\n\n# ===== Step 3: Orders (Builder + Prototype) =====\n@dataclass(frozen=True)\nclass OrderLine:\n    label: str\n    unit_price: float\n    qty: int\n\n@dataclass(frozen=True)\nclass Order:\n    id: str\n    customer: str\n    address: str\n    lines: tuple\n    total: float\n    def reorder(self, new_id):                 # PROTOTYPE: a copy of this order with a new id\n        return replace(self, id=new_id)\n\nclass OrderBuilder:                            # BUILDER: step by step, validated in build()\n    def __init__(self):\n        self._customer = self._address = None\n        self._cart, self._discount = Cart(), NoDiscount()\n    def for_customer(self, name):\n        self._customer = name\n        return self\n    def deliver_to(self, address):\n        self._address = address\n        return self\n    def add(self, priced, qty=1):\n        self._cart.add(priced, qty)\n        return self\n    def from_cart(self, cart):\n        self._cart = cart\n        return self\n    def with_discount(self, discount):\n        self._discount = discount\n        return self\n    def build(self, order_id):\n        if not self._customer:\n            raise ValueError(\"customer is required\")\n        if not self._address:\n            raise ValueError(\"address is required\")\n        if not self._cart.lines:\n            raise ValueError(\"order is empty\")\n        lines = tuple(OrderLine(p.label(), p.price(), q) for p, q in self._cart.lines)\n        return Order(order_id, self._customer, self._address, lines, self._cart.total(self._discount))\n\n# ===== Step 4: Payments (Factory + Adapter) =====\nclass QuickPaySDK:                     # pretend third-party UPI library (we can't edit it)\n    def charge_paise(self, paise):\n        return {\"ok\": True, \"txn\": f\"UPI{paise}\"}\n\nclass CardCoClient:                    # pretend third-party card library (we can't edit it)\n    def authorize(self, amount_str):\n        return f\"CARD-{amount_str}\"\n\nclass PaymentFactory:                  # FACTORY with self-registration\n    _methods = {}\n    @classmethod\n    def register(cls, name):\n        def deco(klass):\n            cls._methods[name] = klass\n            return klass\n        return deco\n    @classmethod\n    def create(cls, name):\n        if name not in cls._methods:\n            raise ValueError(f\"unknown payment method: {name}\")\n        return cls._methods[name]()\n\n@PaymentFactory.register(\"upi\")\nclass UpiPayment:                      # ADAPTER: QuickPaySDK -> our pay(amount) interface\n    def __init__(self, sdk=None):\n        self.sdk = sdk or QuickPaySDK()\n    def pay(self, amount):\n        return self.sdk.charge_paise(round(amount * 100))[\"txn\"]\n\n@PaymentFactory.register(\"card\")\nclass CardPayment:                     # ADAPTER: CardCoClient -> pay(amount)\n    def __init__(self, client=None):\n        self.client = client or CardCoClient()\n    def pay(self, amount):\n        return self.client.authorize(f\"{amount:.2f}\")\n\n@PaymentFactory.register(\"cash\")\nclass CashOnDelivery:\n    def pay(self, amount):\n        return f\"COD-{amount:.2f}\"\n", "tests": "\nT(\"upi\", lambda: PaymentFactory.create(\"upi\").pay(12.5), \"UPI1250\")\nT(\"card\", lambda: PaymentFactory.create(\"card\").pay(199), \"CARD-199.00\")\nT(\"cash\", lambda: PaymentFactory.create(\"cash\").pay(50), \"COD-50.00\")\ndef _unknown():\n    try:\n        PaymentFactory.create(\"bitcoin\"); return False\n    except ValueError:\n        return True\nC(\"unknown method raises ValueError\", _unknown)\ndef _fake():\n    class FakeSDK:\n        def charge_paise(self, paise): return {\"txn\": f\"FAKE{paise}\"}\n    return UpiPayment(FakeSDK()).pay(1)\nT(\"adapter accepts an injected SDK (for tests)\", _fake, \"FAKE100\")\n", "hints": ["register returns a decorator that stores the class in a dict and returns it.", "UpiPayment.pay: return self.sdk.charge_paise(round(amount * 100))['txn']."]}]}, {"id": "qb-step5", "part": "project", "title": "Step 5: Order Lifecycle (State + Observer)", "tagline": "Placed → Paid → Preparing → Out for delivery → Delivered", "body": "<h4>State<\/h4>\n<p>An order moves through statuses, and <b>only some moves are allowed<\/b>: you can't deliver an order that wasn't paid, and you can't cancel once it's out for delivery. The rules live in <b>one table<\/b>, <code>TRANSITIONS<\/code>. Here each status only differs in which moves are allowed, so the <b>light (table) version<\/b> of the State pattern is the right choice (see the State lesson).<\/p>\n<h4>Observer<\/h4>\n<p>When the status changes, many parts of the app care: the customer's app, the kitchen screen, the delivery partner, analytics. The tracker doesn't know any of them. It just <b>publishes<\/b> <code>\"status_changed\"<\/code> on the <code>EventBus<\/code>, and anyone can <b>subscribe<\/b>.<\/p>\n<pre><code># ===== Step 5: Order lifecycle (State table + Observer) =====\nTRANSITIONS = {\n    \"PLACED\": {\"PAID\", \"CANCELLED\"},\n    \"PAID\": {\"PREPARING\", \"CANCELLED\"},\n    \"PREPARING\": {\"OUT_FOR_DELIVERY\"},\n    \"OUT_FOR_DELIVERY\": {\"DELIVERED\"},\n    \"DELIVERED\": set(),\n    \"CANCELLED\": set(),\n}\n\nclass EventBus:                        # OBSERVER: publish/subscribe\n    def __init__(self):\n        self._subs = defaultdict(list)\n    def subscribe(self, event, fn):\n        self._subs[event].append(fn)\n    def publish(self, event, **data):\n        for fn in list(self._subs[event]):\n            try:\n                fn(**data)\n            except Exception:\n                pass                   # one broken subscriber must not break the app\n\nclass InvalidTransition(Exception):\n    pass\n\nclass OrderTracker:                    # STATE (transition-table version)\n    def __init__(self, bus):\n        self.bus, self.status = bus, {}\n    def start(self, order_id):\n        self.status[order_id] = \"PLACED\"\n        self.bus.publish(\"status_changed\", order_id=order_id, old=None, new=\"PLACED\")\n    def move(self, order_id, new):\n        old = self.status[order_id]\n        if new not in TRANSITIONS[old]:\n            raise InvalidTransition(f\"{old} -&gt; {new} is not allowed\")\n        self.status[order_id] = new\n        self.bus.publish(\"status_changed\", order_id=order_id, old=old, new=new)<\/code><\/pre>\n<h4>Try it in your head<\/h4>\n<pre><code>bus = EventBus()\nbus.subscribe(\"status_changed\", lambda order_id, old, new: print(f\"📱 {order_id}: {new}\"))\nt = OrderTracker(bus)\nt.start(\"QB1\")             # 📱 QB1: PLACED\nt.move(\"QB1\", \"PAID\")      # 📱 QB1: PAID\nt.move(\"QB1\", \"DELIVERED\") # InvalidTransition: PAID -&gt; DELIVERED is not allowed<\/code><\/pre>", "quiz": [["Why does EventBus catch exceptions from subscribers?", "<p>So one broken subscriber (say, the SMS service is down) doesn't stop the others or crash order processing.<\/p>"]], "exercises": [{"id": "qb5", "title": "Tracker and event bus", "statement": "<p>Write Step 5: the <code>TRANSITIONS<\/code> table (as in the lesson), an <code>EventBus<\/code> (<code>subscribe(event, fn)<\/code>, and <code>publish(event, **data)<\/code>, which calls the subscribers in order and ignores their exceptions), <code>InvalidTransition<\/code>, and <code>OrderTracker(bus)<\/code> with <code>start(order_id)<\/code> and <code>move(order_id, new)<\/code>. Both publish <code>\"status_changed\"<\/code> with <code>order_id<\/code>, <code>old<\/code> and <code>new<\/code> (old is <code>None<\/code> for start).<\/p>", "starter": "# ===== Step 1: Menu (Composite + Iterator) =====\nfrom abc import ABC, abstractmethod\nfrom collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol\n\n@dataclass(frozen=True)\nclass MenuItem:                       # a LEAF of the menu tree (frozen = can't change by accident)\n    id: str\n    name: str\n    price: float\n    veg: bool = True\n    def __iter__(self):               # a leaf \"iterates\" over just itself\n        yield self\n\nclass Category:                       # a COMPOSITE: holds items AND other categories\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, *things):\n        self.children.extend(things)\n        return self\n    def __iter__(self):               # ITERATOR: every MenuItem inside, however deep\n        for child in self.children:\n            yield from child\n    def find(self, item_id):\n        return next((i for i in self if i.id == item_id), None)\n    def veg_only(self):\n        return [i for i in self if i.veg]\n\ndef sample_menu():\n    return Category(\"QuickBite\").add(\n        Category(\"Snacks\").add(MenuItem(\"samosa\", \"Samosa\", 20), MenuItem(\"fries\", \"French Fries\", 80)),\n        Category(\"Meals\").add(\n            MenuItem(\"thali\", \"Veg Thali\", 150),\n            MenuItem(\"biryani\", \"Chicken Biryani\", 220, veg=False),\n            Category(\"Combos\").add(MenuItem(\"burger-combo\", \"Burger Combo\", 199)),\n        ),\n        Category(\"Drinks\").add(MenuItem(\"chai\", \"Masala Chai\", 25), MenuItem(\"lassi\", \"Sweet Lassi\", 60)),\n    )\n\n# ===== Step 2: Pricing (Decorator for add-ons + Strategy for discounts) =====\nclass Priced(Protocol):\n    def price(self) -> float: ...\n    def label(self) -> str: ...\n\nclass Plain:                                   # turns a MenuItem into a Priced thing\n    def __init__(self, item):\n        self.item = item\n    def price(self): return self.item.price\n    def label(self): return self.item.name\n\nclass AddOn:                                   # DECORATOR base: wraps any Priced\n    extra, text = 0, \"\"\n    def __init__(self, inner):\n        self.inner = inner\n    def price(self): return self.inner.price() + self.extra\n    def label(self): return f\"{self.inner.label()} + {self.text}\"\n\nclass ExtraCheese(AddOn): extra, text = 30, \"extra cheese\"\nclass ExtraSauce(AddOn): extra, text = 10, \"extra sauce\"\nclass Jumbo(AddOn): extra, text = 50, \"jumbo size\"\n\nADDONS = {\"cheese\": ExtraCheese, \"sauce\": ExtraSauce, \"jumbo\": Jumbo}\n\ndef make_priced(item, addons=()):\n    priced = Plain(item)\n    for name in addons:\n        priced = ADDONS[name](priced)          # stack decorators\n    return priced\n\nclass Discount(ABC):                           # STRATEGY interface\n    @abstractmethod\n    def apply(self, subtotal): ...\n\nclass NoDiscount(Discount):\n    def apply(self, subtotal): return subtotal\n\nclass PercentOff(Discount):\n    def __init__(self, percent): self.percent = percent\n    def apply(self, subtotal): return subtotal * (1 - self.percent / 100)\n\nclass FlatOff(Discount):\n    def __init__(self, amount, min_total=0): self.amount, self.min_total = amount, min_total\n    def apply(self, subtotal): return subtotal - self.amount if subtotal >= self.min_total else subtotal\n\nclass Cart:\n    def __init__(self):\n        self.lines = [] r_id, self._customer, self._address, lines, self._cart.total(self._discount))\n\n# ===== Step 4: Payments (Factory + Adapter) =====\nclass QuickPaySDK:                     # pretend third-party UPI library (we can't edit it)\n    def charge_paise(self, paise):\n        return {\"ok\": True, \"txn\": f\"UPI{paise}\"}\n\nclass CardCoClient:                    # pretend third-party card library (we can't edit it)\n    def authorize(self, amount_str):\n        return f\"CARD-{amount_str}\"\n\nclass PaymentFactory:                  # FACTORY with self-registration\n    _methods = {}\n    @classmethod\n    def register(cls, name):\n        def deco(klass):\n            cls._methods[name] = klass\n            return klass\n        return deco\n    @classmethod\n    def create(cls, name):\n        if name not in cls._methods:\n            raise ValueError(f\"unknown payment method: {name}\")\n        return cls._methods[name]()\n\n@PaymentFactory.register(\"upi\")\nclass UpiPayment:                      # ADAPTER: QuickPaySDK -> our pay(amount) interface\n    def __init__(self, sdk=None):\n        self.sdk = sdk or QuickPaySDK()\n    def pay(self, amount):\n        return self.sdk.charge_paise(round(amount * 100))[\"txn\"]\n\n@PaymentFactory.register(\"card\")\nclass CardPayment:                     # ADAPTER: CardCoClient -> pay(amount)\n    def __init__(self, client=None):\n        self.client = client or CardCoClient()\n    def pay(self, amount):\n        return self.client.authorize(f\"{amount:.2f}\")\n\n@PaymentFactory.register(\"cash\")\nclass CashOnDelivery:\n    def pay(self, amount):\n        return f\"COD-{amount:.2f}\"\n\n# ===== Step 5: YOUR CODE =====\nTRANSITIONS = {}\n\nclass EventBus:\n    pass\n\nclass InvalidTransition(Exception):\n    pass\n\nclass OrderTracker:\n    pass\n", "solution": "# ===== Step 1: Menu (Composite + Iterator) =====\nfrom abc import ABC, abstractmethod\nfrom collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol\n\n@dataclass(frozen=True)\nclass MenuItem:                       # a LEAF of the menu tree (frozen = can't change by accident)\n    id: str\n    name: str\n    price: float\n    veg: bool = True\n    def __iter__(self):               # a leaf \"iterates\" over just itself\n        yield self\n\nclass Category:                       # a COMPOSITE: holds items AND other categories\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, *things):\n        self.children.extend(things)\n        return self\n    def __iter__(self):               # ITERATOR: every MenuItem inside, however deep\n        for child in self.children:\n            yield from child\n    def find(self, item_id):\n        return next((i for i in self if i.id == item_id), None)\n    def veg_only(self):\n        return [i for i in self if i.veg]\n\ndef sample_menu():\n    return Category(\"QuickBite\").add(\n        Category(\"Snacks\").add(MenuItem(\"samosa\", \"Samosa\", 20), MenuItem(\"fries\", \"French Fries\", 80)),\n        Category(\"Meals\").add(\n            MenuItem(\"thali\", \"Veg Thali\", 150),\n            MenuItem(\"biryani\", \"Chicken Biryani\", 220, veg=False),\n            Category(\"Combos\").add(MenuItem(\"burger-combo\", \"Burger Combo\", 199)),\n        ),\n        Category(\"Drinks\").add(MenuItem(\"chai\", \"Masala Chai\", 25), MenuItem(\"lassi\", \"Sweet Lassi\", 60)),\n    )\n\n# ===== Step 2: Pricing (Decorator for add-ons + Strategy for discounts) =====\nclass Priced(Protocol):\n    def price(self) -> float: ...\n    def label(self) -> str: ...\n\nclass Plain:                                   # turns a MenuItem into a Priced thing\n    def __init__(self, item):\n        self.item = item\n    def price(self): return self.item.price\n    def label(self): return self.item.name\n\nclass AddOn:                                   # DECORATOR base: wraps any Priced\n    extra, text = 0, \"\"\n    def __init__(self, inner):\n        self.inner = inner\n    def price(self): return self.inner.price() + self.extra\n    def label(self): return f\"{self.inner.label()} + {self.text}\"\n\nclass ExtraCheese(AddOn): extra, text = 30, \"extra cheese\"\nclass ExtraSauce(AddOn): extra, text = 10, \"extra sauce\"\nclass Jumbo(AddOn): extra, text = 50, \"jumbo size\"\n\nADDONS = {\"cheese\": ExtraCheese, \"sauce\": ExtraSauce, \"jumbo\": Jumbo}\n\ndef make_priced(item, addons=()):\n    priced = Plain(item)\n    for name in addons:\n        priced = ADDONS[name](priced)          # stack decorators\n    return priced\n\nclass Discount(ABC):                           # STRATEGY interface\n    @abstractmethod\n    def apply(self, subtotal): ...\n\nclass NoDiscount(Discount):\n    def apply(self, subtotal): return subtotal\n\nclass PercentOff(Discount):\n    def __init__(self, percent): self.percent = percent\n    def apply(self, subtotal): return subtotal * (1 - self.percent / 100)\n\nclass FlatOff(Discount):\n    def __init__(self, amount, min_total=0): self.amount, self.min_total = amount, min_total\n    def apply(self, subtotal): return subtotal - self.amount if subtotal >= self.min_total else subtotal\n\nclass Cart:\n    def __init__(self):\n        self.lines = []                        # list of (priced, qty) tuples\n    def add(self, priced, qty=1):\n        if qty <= 0:\n            raise ValueError(\"qty must be positive\")\n        line = (priced, qty)\n        self.lines.append(line)\n        return line\n    def remove(self, line):\n        self.lines.remove(line)\n    def subtotal(self):\n        return sum(p.price() * q for p, q in self.lines)\n    def total(self, discount=None):\n        return round(max(0, (discount or NoDiscount()).apply(self.subtotal())), 2)\n\n# ===== Step 3: Orders (Builder + Prototype) =====\n@dataclass(frozen=True)\nclass OrderLine:\n    label: str\n    unit_price: float\n    qty: int\n\n@dataclass(frozen=True)\nclass Order:\n    id: str\n    customer: str\n    address: str\n    lines: tuple\n    total: float\n    def reorder(self, new_id):                 # PROTOTYPE: a copy of this order with a new id\n        return replace(self, id=new_id)\n\nclass OrderBuilder:                            # BUILDER: step by step, validated in build()\n    def __init__(self):\n        self._customer = self._address = None\n        self._cart, self._discount = Cart(), NoDiscount()\n    def for_customer(self, name):\n        self._customer = name\n        return self\n    def deliver_to(self, address):\n        self._address = address\n        return self\n    def add(self, priced, qty=1):\n        self._cart.add(priced, qty)\n        return self\n    def from_cart(self, cart):\n        self._cart = cart\n        return self\n    def with_discount(self, discount):\n        self._discount = discount\n        return self\n    def build(self, order_id):\n        if not self._customer:\n            raise ValueError(\"customer is required\")\n        if not self._address:\n            raise ValueError(\"address is required\")\n        if not self._cart.lines:\n            raise ValueError(\"order is empty\")\n        lines = tuple(OrderLine(p.label(), p.price(), q) for p, q in self._cart.lines)\n        return Order(order_id, self._customer, self._address, lines, self._cart.total(self._discount))\n\n# ===== Step 4: Payments (Factory + Adapter) =====\nclass QuickPaySDK:                     # pretend third-party UPI library (we can't edit it)\n    def charge_paise(self, paise):\n        return {\"ok\": True, \"txn\": f\"UPI{paise}\"}\n\nclass CardCoClient:                    # pretend third-party card library (we can't edit it)\n    def authorize(self, amount_str):\n        return f\"CARD-{amount_str}\"\n\nclass PaymentFactory:                  # FACTORY with self-registration\n    _methods = {}\n    @classmethod\n    def register(cls, name):\n        def deco(klass):\n            cls._methods[name] = klass\n            return klass\n        return deco\n    @classmethod\n    def create(cls, name):\n        if name not in cls._methods:\n            raise ValueError(f\"unknown payment method: {name}\")\n        return cls._methods[name]()\n\n@PaymentFactory.register(\"upi\")\nclass UpiPayment:                      # ADAPTER: QuickPaySDK -> our pay(amount) interface\n    def __init__(self, sdk=None):\n        self.sdk = sdk or QuickPaySDK()\n    def pay(self, amount):\n        return self.sdk.charge_paise(round(amount * 100))[\"txn\"]\n\n@PaymentFactory.register(\"card\")\nclass CardPayment:                     # ADAPTER: CardCoClient -> pay(amount)\n    def __init__(self, client=None):\n        self.client = client or CardCoClient()\n    def pay(self, amount):\n        return self.client.authorize(f\"{amount:.2f}\")\n\n@PaymentFactory.register(\"cash\")\nclass CashOnDelivery:\n    def pay(self, amount):\n        return f\"COD-{amount:.2f}\"\n\n# ===== Step 5: Order lifecycle (State table + Observer) =====\nTRANSITIONS = {\n    \"PLACED\": {\"PAID\", \"CANCELLED\"},\n    \"PAID\": {\"PREPARING\", \"CANCELLED\"},\n    \"PREPARING\": {\"OUT_FOR_DELIVERY\"},\n    \"OUT_FOR_DELIVERY\": {\"DELIVERED\"},\n    \"DELIVERED\": set(),\n    \"CANCELLED\": set(),\n}\n\nclass EventBus:                        # OBSERVER: publish/subscribe\n    def __init__(self):\n        self._subs = defaultdict(list)\n    def subscribe(self, event, fn):\n        self._subs[event].append(fn)\n    def publish(self, event, **data):\n        for fn in list(self._subs[event]):\n            try:\n                fn(**data)\n            except Exception:\n                pass                   # one broken subscriber must not break the app\n\nclass InvalidTransition(Exception):\n    pass\n\nclass OrderTracker:                    # STATE (transition-table version)\n    def __init__(self, bus):\n        self.bus, self.status = bus, {}\n    def start(self, order_id):\n        self.status[order_id] = \"PLACED\"\n        self.bus.publish(\"status_changed\", order_id=order_id, old=None, new=\"PLACED\")\n    def move(self, order_id, new):\n        old = self.status[order_id]\n        if new not in TRANSITIONS[old]:\n            raise InvalidTransition(f\"{old} -> {new} is not allowed\")\n        self.status[order_id] = new\n        self.bus.publish(\"status_changed\", order_id=order_id, old=old, new=new)\n", "tests": "\ndef _run():\n    bus, log = EventBus(), []\n    bus.subscribe(\"status_changed\", lambda order_id, old, new: log.append((order_id, old, new)))\n    def broken(**kw): raise RuntimeError(\"sms down\")\n    bus.subscribe(\"status_changed\", broken)\n    t = OrderTracker(bus)\n    t.start(\"A\"); t.move(\"A\", \"PAID\"); t.move(\"A\", \"PREPARING\")\n    return log\nT(\"events in order\", _run, [(\"A\", None, \"PLACED\"), (\"A\", \"PLACED\", \"PAID\"), (\"A\", \"PAID\", \"PREPARING\")])\ndef _invalid():\n    t = OrderTracker(EventBus()); t.start(\"B\"); t.move(\"B\", \"PAID\")\n    try:\n        t.move(\"B\", \"DELIVERED\"); return False\n    except InvalidTransition:\n        return t.status[\"B\"] == \"PAID\"\nC(\"illegal move raises InvalidTransition and keeps the status\", _invalid)\ndef _cancel():\n    t = OrderTracker(EventBus()); t.start(\"C\"); t.move(\"C\", \"CANCELLED\")\n    try:\n        t.move(\"C\", \"PAID\"); return False\n    except InvalidTransition:\n        return True\nC(\"cancelled is final\", _cancel)\n", "hints": ["TRANSITIONS maps each status to a set of allowed next statuses.", "move(): look up the old status, check <code>new in TRANSITIONS[old]<\/code>, update, publish."]}]}, {"id": "qb-step6", "part": "project", "title": "Step 6: Cart Undo & Checkout Rules (Command + Chain)", "tagline": "Oops, remove that! And: we don't deliver there.", "body": "<h4>Command: undo in the cart<\/h4>\n<p>Every \"add to cart\" tap becomes a <b>command object<\/b> (<code>AddToCart<\/code>) with <code>execute()<\/code> and <code>undo()<\/code>. <code>CartHistory<\/code> keeps two stacks, so the user can undo and redo freely. The command remembers <b>which line<\/b> it added, so undo removes exactly that line.<\/p>\n<h4>Chain of Responsibility: checkout checks<\/h4>\n<p>Before placing an order, several rules must pass: <b>cart not empty → minimum order amount → delivery city<\/b>. Each rule is a small handler that checks one thing and passes the request to the next. Adding a rule (\"no orders after 11 pm\") means writing one class and adding it to the chain.<\/p>\n<pre><code># ===== Step 6: Cart undo (Command) + checkout checks (Chain of Responsibility) =====\nclass AddToCart:                       # COMMAND\n    def __init__(self, cart, priced, qty=1):\n        self.cart, self.priced, self.qty, self.line = cart, priced, qty, None\n    def execute(self):\n        self.line = self.cart.add(self.priced, self.qty)\n    def undo(self):\n        self.cart.remove(self.line)\n\nclass CartHistory:\n    def __init__(self):\n        self.done, self.undone = [], []\n    def run(self, cmd):\n        cmd.execute(); self.done.append(cmd); self.undone.clear()\n    def undo(self):\n        if self.done:\n            cmd = self.done.pop(); cmd.undo(); self.undone.append(cmd)\n    def redo(self):\n        if self.undone:\n            cmd = self.undone.pop(); cmd.execute(); self.done.append(cmd)\n\nclass ValidationError(Exception):\n    pass\n\nclass Check:                           # CHAIN OF RESPONSIBILITY base\n    def __init__(self, nxt=None):\n        self.next = nxt\n    def validate(self, ctx):\n        if self.next:\n            self.next.validate(ctx)\n\nclass NotEmpty(Check):\n    def validate(self, ctx):\n        if not ctx[\"cart\"].lines:\n            raise ValidationError(\"cart is empty\")\n        super().validate(ctx)\n\nclass MinimumOrder(Check):\n    def __init__(self, minimum, nxt=None):\n        super().__init__(nxt)\n        self.minimum = minimum\n    def validate(self, ctx):\n        if ctx[\"cart\"].subtotal() &lt; self.minimum:\n            raise ValidationError(f\"minimum order is {self.minimum}\")\n        super().validate(ctx)\n\nclass DeliveryArea(Check):\n    def __init__(self, cities, nxt=None):\n        super().__init__(nxt)\n        self.cities = cities\n    def validate(self, ctx):\n        if ctx[\"city\"] not in self.cities:\n            raise ValidationError(f\"we don't deliver to {ctx['city']}\")\n        super().validate(ctx)<\/code><\/pre>", "quiz": [["Why does AddToCart store <code>self.line<\/code>?", "<p>So undo removes exactly the line this command added, even if the cart has identical lines from other commands.<\/p>"]], "exercises": [{"id": "qb6", "title": "Commands and the checks chain", "statement": "<p>Write Step 6: <code>AddToCart(cart, priced, qty=1)<\/code> (a command), <code>CartHistory<\/code> (run/undo/redo with two stacks), <code>ValidationError<\/code>, the base <code>Check(nxt=None)<\/code>, and the three checks <code>NotEmpty<\/code>, <code>MinimumOrder(minimum, nxt=None)<\/code> and <code>DeliveryArea(cities, nxt=None)<\/code>. Each check raises <code>ValidationError<\/code> with the exact messages from the lesson (<code>\"cart is empty\"<\/code>, <code>\"minimum order is &lt;n&gt;\"<\/code>, <code>\"we don't deliver to &lt;city&gt;\"<\/code>), or passes to the next. The context is a dict: <code>{\"cart\": cart, \"city\": city}<\/code>.<\/p>", "starter": "# ===== Step 1: Menu (Composite + Iterator) =====\nfrom abc import ABC, abstractmethod\nfrom collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol\n\n@dataclass(frozen=True)\nclass MenuItem:                       # a LEAF of the menu tree (frozen = can't change by accident)\n    id: str\n    name: str\n    price: float\n    veg: bool = True\n    def __iter__(self):               # a leaf \"iterates\" over just itself\n        yield self\n\nclass Category:                       # a COMPOSITE: holds items AND other categories\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, *things):\n        self.children.extend(things)\n        return self\n    def __iter__(self):               # ITERATOR: every MenuItem inside, however deep\n        for child in self.children:\n            yield from child\n    def find(self, item_id):\n        return next((i for i in self if i.id == item_id), None)\n    def veg_only(self):\n        return [i for i in self if i.veg]\n\ndef sample_menu():\n    return Category(\"QuickBite\").add(\n        Category(\"Snacks\").add(MenuItem(\"samosa\", \"Samosa\", 20), MenuItem(\"fries\", \"French Fries\", 80)),\n        Category(\"Meals\").add(\n            MenuItem(\"thali\", \"Veg Thali\", 150),\n            MenuItem(\"biryani\", \"Chicken Biryani\", 220, veg=False),\n            Category(\"Combos\").add(MenuItem(\"burger-combo\", \"Burger Combo\", 199)),\n        ),\n        Category(\"Drinks\").add(MenuItem(\"chai\", \"Masala Chai\", 25), MenuItem(\"lassi\", \"Sweet Lassi\", 60)),\n    )\n\n# ===== Step 2: Pricing (Decorator for add-ons + Strategy for discounts) =====\nclass Priced(Protocol):\n    def price(self) -> float: ...\n    def label(self) -> str: ...\n\nclass Plain:                                   # turns a MenuItem into a Priced thing\n    def __init__(self, item):\n        self.item = item\n    def price(self): return self.item.price\n    def label(self): return self.item.name\n\nclass AddOn:                                   # DECORATOR base: wraps any Priced\n    extra, text = 0, \"\"\n    def __init__(self, inner):\n        self.inner = inner\n    def price(self): return self.inner.price() + self.extra\n    def label(self): return f\"{self.inner.label()} + {self.text}\"\n\nclass ExtraCheese(AddOn): extra, text = 30, \"extra cheese\"\nclass ExtraSauce(AddOn): extra, text = 10, \"extra sauce\"\nclass Jumbo(AddOn): extra, text = 50, \"jumbo size\"\n\nADDONS = {\"cheese\": ExtraCheese, \"sauce\": ExtraSauce, \"jumbo\": Jumbo}\n\ndef make_priced(item, ad ef __init__(self, item):\n        self.item = item\n    def price(self): return self.item.price\n    def label(self): return self.item.name\n\nclass AddOn:                                   # DECORATOR base: wraps any Priced\n    extra, text = 0, \"\"\n    def __init__(self, inner):\n        self.inner = inner\n    def price(self): return self.inner.price() + self.extra\n    def label(self): return f\"{self.inner.label()} + {self.text}\"\n\nclass ExtraCheese(AddOn): extra, text = 30, \"extra cheese\"\nclass ExtraSauce(AddOn): extra, text = 10, \"extra sauce\"\nclass Jumbo(AddOn): extra, text = 50, \"jumbo size\"\n\nADDONS = {\"cheese\": ExtraCheese, \"sauce\": ExtraSauce, \"jumbo\": Jumbo}\n\ndef make_priced(item, addons=()):\n    priced = Plain(item)\n    for name in addons:\n        priced = ADDONS[name](priced)          # stack decorators\n    return priced\n\nclass Discount(ABC):                           # STRATEGY interface\n    @abstractmethod\n    def apply(self, subtotal): ...\n\nclass NoDiscount(Discount):\n    def apply(self, subtotal): return subtotal\n\nclass PercentOff(Discount):\n    def __init__(self, percent): self.percent = percent\n    def apply(self, subtotal): return subtotal * (1 - self.percent / 100)\n\nclass FlatOff(Discount):\n    def __init__(self, amount, min_total=0): self.amount, self.min_total = amount, min_total\n    def apply(self, subtotal): return subtotal - self.amount if subtotal >= self.min_total else subtotal\n\nclass Cart:\n    def __init__(self):\n        self.lines = []                        # list of (priced, qty) tuples\n    def add(self, priced, qty=1):\n        if qty <= 0:\n            raise ValueError(\"qty must be positive\")\n        line = (priced, qty)\n        self.lines.append(line)\n        return line\n    def remove(self, line):\n        self.lines.remove(line)\n    def subtotal(self):\n        return sum(p.price() * q for p, q in self.lines)\n    def total(self, discount=None):\n        return round(max(0, (discount or NoDiscount()).apply(self.subtotal())), 2)\n\n# ===== Step 3: Orders (Builder + Prototype) =====\n@dataclass(frozen=True)\nclass OrderLine:\n    label: str\n    unit_price: float\n    qty: int\n\n@dataclass(frozen=True)\nclass Order:\n    id: str\n    customer: str\n    address: str\n    lines: tuple\n    total: float\n    def reorder(self, new_id):                 # PROTOTYPE: a copy of this order with a new id\n        return replace(self, id=new_id)\n\nclass OrderBuilder:                            # BUILDER: step by step, validated in build()\n    def __init__(self):\n        self._customer = self._address = None\n        self._cart, self._discount = Cart(), NoDiscount()\n    def for_customer(self, name):\n        self._customer = name\n        return self\n    def deliver_to(self, address):\n        self._address = address\n        return self\n    def add(self, priced, qty=1):\n        self._cart.add(priced, qty)\n        return self\n    def from_cart(self, cart):\n        self._cart = cart\n        return self\n    def with_discount(self, discount):\n        self._discount = discount\n        return self\n    def build(self, order_id):\n        if not self._customer:\n            raise ValueError(\"customer is required\")\n        if not self._address:\n            raise ValueError(\"address is required\")\n        if not self._cart.lines:\n            raise ValueError(\"order is empty\")\n        lines = tuple(OrderLine(p.label(), p.price(), q) for p, q in self._cart.lines)\n        return Order(order_id, self._customer, self._address, lines, self._cart.total(self._discount))\n\n# ===== Step 4: Payments (Factory + Adapter) =====\nclass QuickPaySDK:                     # pretend third-party UPI library (we can't edit it)\n    def charge_paise(self, paise):\n        return {\"ok\": True, \"txn\": f\"UPI{paise}\"}\n\nclass CardCoClient:                    # pretend third-party card library (we can't edit it)\n    def authorize(self, amount_str):\n        return f\"CARD-{amount_str}\"\n\nclass PaymentFactory:                  # FACTORY with self-registration\n    _methods = {}\n    @classmethod\n    def register(cls, name):\n        def deco(klass):\n            cls._methods[name] = klass\n            return klass\n        return deco\n    @classmethod\n    def create(cls, name):\n        if name not in cls._methods:\n            raise ValueError(f\"unknown payment method: {name}\")\n        return cls._methods[name]()\n\n@PaymentFactory.register(\"upi\")\nclass UpiPayment:                      # ADAPTER: QuickPaySDK -> our pay(amount) interface\n    def __init__(self, sdk=None):\n        self.sdk = sdk or QuickPaySDK()\n    def pay(self, amount):\n        return self.sdk.charge_paise(round(amount * 100))[\"txn\"]\n\n@PaymentFactory.register(\"card\")\nclass CardPayment:                     # ADAPTER: CardCoClient -> pay(amount)\n    def __init__(self, client=None):\n        self.client = client or CardCoClient()\n    def pay(self, amount):\n        return self.client.authorize(f\"{amount:.2f}\")\n\n@PaymentFactory.register(\"cash\")\nclass CashOnDelivery:\n    def pay(self, amount):\n        return f\"COD-{amount:.2f}\"\n\n# ===== Step 5: Order lifecycle (State table + Observer) =====\nTRANSITIONS = {\n    \"PLACED\": {\"PAID\", \"CANCELLED\"},\n    \"PAID\": {\"PREPARING\", \"CANCELLED\"},\n    \"PREPARING\": {\"OUT_FOR_DELIVERY\"},\n    \"OUT_FOR_DELIVERY\": {\"DELIVERED\"},\n    \"DELIVERED\": set(),\n    \"CANCELLED\": set(),\n}\n\nclass EventBus:                        # OBSERVER: publish/subscribe\n    def __init__(self):\n        self._subs = defaultdict(list)\n    def subscribe(self, event, fn):\n        self._subs[event].append(fn)\n    def publish(self, event, **data):\n        for fn in list(self._subs[event]):\n            try:\n                fn(**data)\n            except Exception:\n                pass                   # one broken subscriber must not break the app\n\nclass InvalidTransition(Exception):\n    pass\n\nclass OrderTracker:                    # STATE (transition-table version)\n    def __init__(self, bus):\n        self.bus, self.status = bus, {}\n    def start(self, order_id):\n        self.status[order_id] = \"PLACED\"\n        self.bus.publish(\"status_changed\", order_id=order_id, old=None, new=\"PLACED\")\n    def move(self, order_id, new):\n        old = self.status[order_id]\n        if new not in TRANSITIONS[old]:\n            raise InvalidTransition(f\"{old} -> {new} is not allowed\")\n        self.status[order_id] = new\n        self.bus.publish(\"status_changed\", order_id=order_id, old=old, new=new)\n\n# ===== Step 6: Cart undo (Command) + checkout checks (Chain of Responsibility) =====\nclass AddToCart:                       # COMMAND\n    def __init__(self, cart, priced, qty=1):\n        self.cart, self.priced, self.qty, self.line = cart, priced, qty, None\n    def execute(self):\n        self.line = self.cart.add(self.priced, self.qty)\n    def undo(self):\n        self.cart.remove(self.line)\n\nclass CartHistory:\n    def __init__(self):\n        self.done, self.undone = [], []\n    def run(self, cmd):\n        cmd.execute(); self.done.append(cmd); self.undone.clear()\n    def undo(self):\n        if self.done:\n            cmd = self.done.pop(); cmd.undo(); self.undone.append(cmd)\n    def redo(self):\n        if self.undone:\n            cmd = self.undone.pop(); cmd.execute(); self.done.append(cmd)\n\nclass ValidationError(Exception):\n    pass\n\nclass Check:                           # CHAIN OF RESPONSIBILITY base\n    def __init__(self, nxt=None):\n        self.next = nxt\n    def validate(self, ctx):\n        if self.next:\n            self.next.validate(ctx)\n\nclass NotEmpty(Check):\n    def validate(self, ctx):\n        if not ctx[\"cart\"].lines:\n            raise ValidationError(\"cart is empty\")\n        super().validate(ctx)\n\nclass MinimumOrder(Check):\n    def __init__(self, minimum, nxt=None):\n        super().__init__(nxt)\n        self.minimum = minimum\n    def validate(self, ctx):\n        if ctx[\"cart\"].subtotal() < self.minimum:\n            raise ValidationError(f\"minimum order is {self.minimum}\")\n        super().validate(ctx)\n\nclass DeliveryArea(Check):\n    def __init__(self, cities, nxt=None):\n        super().__init__(nxt)\n        self.cities = cities\n    def validate(self, ctx):\n        if ctx[\"city\"] not in self.cities:\n            raise ValidationError(f\"we don't deliver to {ctx['city']}\")\n        super().validate(ctx)\n", "tests": "\n_m = sample_menu()\ndef _undo():\n    cart, h = Cart(), CartHistory()\n    h.run(AddToCart(cart, make_priced(_m.find(\"thali\")))); h.run(AddToCart(cart, make_priced(_m.find(\"chai\")), 2))\n    a = cart.subtotal(); h.undo(); b = cart.subtotal(); h.redo(); c = cart.subtotal(); h.undo(); h.undo(); d = cart.subtotal()\n    return [a, b, c, d]\nT(\"undo/redo cart\", _undo, [200, 150, 200, 0])\ndef _check(cart, city):\n    chain = NotEmpty(MinimumOrder(50, DeliveryArea({\"Pune\"})))\n    try:\n        chain.validate({\"cart\": cart, \"city\": city}); return \"ok\"\n    except ValidationError as e:\n        return str(e)\ndef _c(*ids):\n    c = Cart()\n    for i in ids: c.add(make_priced(_m.find(i)))\n    return c\nT(\"empty\", lambda: _check(Cart(), \"Pune\"), \"cart is empty\")\nT(\"too small\", lambda: _check(_c(\"chai\"), \"Pune\"), \"minimum order is 50\")\nT(\"wrong city\", lambda: _check(_c(\"thali\"), \"Delhi\"), \"we don't deliver to Delhi\")\nT(\"all good\", lambda: _check(_c(\"thali\"), \"Pune\"), \"ok\")\n", "hints": ["AddToCart.execute stores the returned line; undo calls cart.remove(self.line).", "Each check raises on failure, otherwise calls super().validate(ctx)."]}]}, {"id": "qb-step7", "part": "project", "title": "Step 7: The App (Facade + Proxy + Singleton + Template Method)", "tagline": "One button for the mobile app to press", "body": "<h4>Facade<\/h4>\n<p>The mobile app shouldn't juggle carts, builders, factories and trackers. <code>QuickBite.place_order(...)<\/code> is <b>one simple call<\/b> that does everything, in order:<\/p>\n<ol><li>look up each item through the <b>cached menu<\/b> and apply its add-ons,<\/li><li>run the <b>checks chain<\/b>,<\/li><li><b>build<\/b> the order,<\/li><li><b>track<\/b> it (PLACED), <b>pay<\/b> through the factory, then mark it PAID,<\/li><li><b>publish<\/b> <code>\"order_paid\"<\/code> for anyone who cares.<\/li><\/ol>\n<h4>Proxy<\/h4>\n<p><code>MenuService<\/code> pretends to be a slow database. <code>CachedMenu<\/code> has the <b>same <code>get()<\/code><\/b> but remembers results, so the \"database\" is asked only once per item.<\/p>\n<h4>Singleton<\/h4>\n<p><code>Settings()<\/code> always returns the same object (minimum order, delivery cities). In a bigger app you might prefer passing settings in (DIP), but it's a fair use for app-wide configuration.<\/p>\n<h4>Template Method<\/h4>\n<p><code>Receipt.render()<\/code> fixes the layout (header → lines → footer). <code>TextReceipt<\/code> and <code>SmsReceipt<\/code> fill in the pieces differently.<\/p>\n<pre><code># ===== Step 7: The app (Facade + Proxy + Singleton + Template Method) =====\nclass Settings:                        # SINGLETON: one shared settings object\n    _instance = None\n    def __new__(cls):\n        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n            cls._instance.min_order = 50\n            cls._instance.cities = {\"Pune\", \"Mumbai\"}\n        return cls._instance\n\nclass MenuService:                     # pretend this is a slow database\n    def __init__(self, menu):\n        self.menu, self.lookups = menu, 0\n    def get(self, item_id):\n        self.lookups += 1\n        item = self.menu.find(item_id)\n        if item is None:\n            raise KeyError(f\"no such item: {item_id}\")\n        return item\n\nclass CachedMenu:                      # PROXY: same get(), but cached\n    def __init__(self, service):\n        self.service, self.cache = service, {}\n    def get(self, item_id):\n        if item_id not in self.cache:\n            self.cache[item_id] = self.service.get(item_id)\n        return self.cache[item_id]\n\nclass Receipt(ABC):                    # TEMPLATE METHOD: fixed layout, variable pieces\n    def render(self, order):\n        return \"\\n\".join([self.header(order), *(self.line(l) for l in order.lines), self.footer(order)])\n    def header(self, order): return f\"QuickBite order {order.id}\"\n    def footer(self, order): return f\"TOTAL {order.total:.2f}\"\n    @abstractmethod\n    def line(self, l): ...\n\nclass TextReceipt(Receipt):\n    def line(self, l): return f\"{l.qty} x {l.label} @ {l.unit_price:.2f}\"\n\nclass SmsReceipt(Receipt):\n    def header(self, order): return f\"QB {order.id}\"\n    def line(self, l): return f\"{l.qty}x {l.label}\"\n\nclass QuickBite:                       # FACADE: one simple entry point for the whole system\n    def __init__(self, menu, bus=None):\n        self.settings = Settings()\n        self.menu = CachedMenu(MenuService(menu))\n        self.bus = bus or EventBus()\n        self.tracker = OrderTracker(self.bus)\n        self.checks = NotEmpty(MinimumOrder(self.settings.min_order, DeliveryArea(self.settings.cities)))\n        self.orders, self._next = {}, 1\n\n    def _new_id(self):\n        order_id = f\"QB{self._next:04d}\"\n        self._next += 1\n        return order_id\n\n    def place_order(self, customer, city, address, items, payment=\"upi\", discount=None):\n        cart = Cart()\n        for item_id, qty, *rest in items:                      # items: (id, qty) or (id, qty, addons)\n            cart.add(make_priced(self.menu.get(item_id), rest[0] if rest else ()), qty)\n        self.checks.validate({\"cart\": cart, \"city\": city})     # chain of checks\n        order = (OrderBuilder().for_customer(customer).deliver_to(f\"{address}, {city}\")\n                 .from_cart(cart).with_discount(discount or NoDiscount()).build(self._new_id()))\n        self.tracker.start(order.id)\n        receipt = PaymentFactory.create(payment).pay(order.total)\n        self.tracker.move(order.id, \"PAID\")\n        self.orders[order.id] = order\n        self.bus.publish(\"order_paid\", order=order, receipt=receipt)\n        return order\n\n    def advance(self, order_id, new_status):\n        self.tracker.move(order_id, new_status)\n\n    def status(self, order_id):\n        return self.tracker.status[order_id]\n\n    def reorder(self, order_id, payment=\"upi\"):\n        order = self.orders[order_id].reorder(self._new_id())  # prototype\n        self.tracker.start(order.id)\n        receipt = PaymentFactory.create(payment).pay(order.total)\n        self.tracker.move(order.id, \"PAID\")\n        self.orders[order.id] = order\n        self.bus.publish(\"order_paid\", order=order, receipt=receipt)\n        return order<\/code><\/pre>", "quiz": [["What would the mobile app code look like without the Facade?", "<p>It would have to create carts, builders, trackers and payment objects itself and call them in the right order, duplicating business logic in every client app.<\/p>"]], "exercises": [{"id": "qb7", "title": "Wire up the facade", "statement": "<p>All the parts from Steps 1–7 are given, <b>except<\/b> the body of <code>QuickBite.place_order<\/code>. Implement it following the 5 steps in the lesson: cached menu lookups with add-ons, the checks, <code>OrderBuilder<\/code> (address = <code>\"&lt;address&gt;, &lt;city&gt;\"<\/code>), start tracking, pay with <code>PaymentFactory<\/code>, move to <code>\"PAID\"<\/code>, store the order in <code>self.orders<\/code>, publish <code>\"order_paid\"<\/code> with <code>order=<\/code> and <code>receipt=<\/code>, and return the order.<\/p>\n<p>Items are tuples <code>(item_id, qty)<\/code> or <code>(item_id, qty, [addons])<\/code>.<\/p>", "starter": "# ===== Step 1: Menu (Composite + Iterator) =====\nfrom abc import ABC, abstractmethod
