\nfrom collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol\n\n@dataclass(frozen=True)\nclass MenuItem:                       # a LEAF of the menu tree (frozen = can't change by accident)\n    id: str\n    name: str\n    price: float\n    veg: bool = True\n    def __iter__(self):               # a leaf \"iterates\" over just itself\n        yield self\n\nclass Category:                       # a COMPOSITE: holds items AND other categories\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, *things):\n        self.children.extend(things)\n        return self\n    def __iter__(self):               # ITERATOR: every MenuItem inside, however deep\n        for child in self.children:\n            yield from child\n    def find(self, item_id):\n        return next((i for i in self if i.id == item_id), None)\n    def veg_only(self):\n        return [i for i in self if i.veg]\n\ndef sample_menu():\n    return Category(\"QuickBite\").add(\n        Category(\"Snacks\").add(MenuItem(\"samosa\", \"Samosa\", 20), MenuItem(\"fries\", \"French Fries\", 80)),\n        Category(\"Meals\").add(\n            MenuItem(\"thali\", \"Veg Thali\", 150),\n            MenuItem(\"biryani\", \"Chicken Biryani\", 220, veg=False),\n            Category(\"Combos\").add(MenuItem(\"burger-combo\", \"Burger Combo\", 199)),\n        ),\n        Category(\"Drinks\").add(MenuItem(\"chai\", \"Masala Chai\", 25), MenuItem(\"lassi\", \"Sweet Lassi\", 60)),\n    )\n\n# ===== Step 2: Pricing (Decorator for add-ons + Strategy for discounts) =====\nclass Priced(Protocol):\n    def price(self) -> float: ...\n    def label(self) -> str: ...\n\nclass Plain:                                   # turns a MenuItem into a Priced thing\n    def __init__(self, item):\n        self.item = item\n    def price(self): return self.item.price\n    def label(self): return self.item.name\n\nclass AddOn:                                   # DECORATOR base: wraps any Priced\n    extra, text = 0, \"\"\n    def __init__(self, inner):\n        self.inner = inner\n    def price(self): return self.inner.price() + self.extra\n    def label(self): return f\"{self.inner.label()} + {self.text}\"\n\nclass ExtraCheese(AddOn): extra, text = 30, \"extra cheese\"\nclass ExtraSauce(AddOn): extra, text = 10, \"extra sauce\"\nclass Jumbo(AddOn): extra, text = 50, \"jumbo size\"\n\nADDONS = {\"cheese\": ExtraCheese, \"sauce\": ExtraSauce, \"jumbo\": Jumbo}\n\ndef make_priced(item, addons=()):\n    priced = Plain(item)\n    for name in addons:\n        priced = ADDONS[name](priced)          # stack decorators\n    return priced\n\nclass Discount(ABC):                           # STRATEGY interface\n    @abstractmethod\n    def apply(self, subtotal): ...\n\nclass NoDiscount(Discount):\n    def apply(self, subtotal): return subtotal\n\nclass PercentOff(Discount):\n    def __init__(self, percent): self.percent = percent\n    def apply(self, subtotal): return subtotal * (1 - self.percent / 100)\n\nclass FlatOff(Discount):\n    def __init__(self, amount, min_total=0): self.amount, self.min_total = amount, min_total\n    def apply(self, subtotal): return subtotal - self.amount if subtotal >= self.min_total else subtotal\n\nclass Cart:\n    def __init__(self):\n        self.lines = []                        # list of (priced, qty) tuples\n    def add(self, priced, qty=1):\n        if qty <= 0:\n            raise ValueError(\"qty must be positive\")\n        line = (priced, qty)\n        self.lines.append(line)\n        return line\n    def remove(self, line):\n        self.lines.remove(line)\n    def subtotal(self):\n        return sum(p.price() * q for p, q in self.lines)\n    def total(self, discount=None):\n        return round(max(0, (discount or NoDiscount()).apply(self.subtotal())), 2)\n\n# ===== Step 3: Orders (Builder + Prototype) =====\n@dataclass(frozen=True)\nclass OrderLine:\n    label: str\n    unit_price: float\n    qty: int\n\n@dataclass(frozen=True)\nclass Order:\n    id: str\n    customer: str\n    address: str\n    lines: tuple\n    total: float\n    def reorder(self, new_id):                 # PROTOTYPE: a copy of this order with a new id\n        return replace(self, id=new_id)\n\nclass OrderBuilder:                            # BUILDER: step by step, validated in build()\n    def __init__(self):\n        self._customer = self._address = None\n        self._cart, self._discount = Cart(), NoDiscount()\n    def for_customer(self, name):\n        self._customer = name\n        return self\n    def deliver_to(self, address):\n        self._address = address\n        return self\n    def add(self, priced, qty=1):\n        self._cart.add(priced, qty)\n        return self\n    def from_cart(self, cart):\n        self._cart = cart\n        return self\n    def with_discount(self, discount):\n        self._discount = discount\n        return self\n    def build(self, order_id):\n        if not self._customer:\n            raise ValueError(\"customer is required\")\n        if not self._address:\n            raise ValueError(\"address is required\")\n        if not self._cart.lines:\n            raise ValueError(\"order is empty\")\n        lines = tuple(OrderLine(p.label(), p.price(), q) for p, q in self._cart.lines)\n        return Order(order_id, self._customer, self._address, lines, self._cart.total(self._discount))\n\n# ===== Step 4: Payments (Factory + Adapter) =====\nclass QuickPaySDK:                     # pretend third-party UPI library (we can't edit it)\n    def charge_paise(self, paise):\n        return {\"ok\": True, \"txn\": f\"UPI{paise}\"}\n\nclass CardCoClient:                    # pretend third-party card library (we can't edit it)\n    def authorize(self, amount_str):\n        return f\"CARD-{amount_str}\"\n\nclass PaymentFactory:                  # FACTORY with self-registration\n    _methods = {}\n    @classmethod\n    def register(cls, name):\n        def deco(klass):\n            cls._methods[name] = klass\n            return klass\n        return deco\n    @classmethod\n    def create(cls, name):\n        if name not in cls._methods:\n            raise ValueError(f\"unknown payment method: {name}\")\n        return cls._methods[name]()\n\n@PaymentFactory.register(\"upi\")\nclass UpiPayment:                      # ADAPTER: QuickPaySDK -> our pay(amount) interface\n    def __init__(self, sdk=None):\n        self.sdk = sdk or QuickPaySDK()\n    def pay(self, amount):\n        return self.sdk.charge_paise(round(amount * 100))[\"txn\"]\n\n@PaymentFactory.register(\"card\")\nclass CardPayment:                     # ADAPTER: CardCoClient -> pay(amount)\n    def __init__(self, client=None):\n        self.client = client or CardCoClient()\n    def pay(self, amount):\n        return self.client.authorize(f\"{amount:.2f}\")\n\n@PaymentFactory.register(\"cash\")\nclass CashOnDelivery:\n    def pay(self, amount):\n        return f\"COD-{amount:.2f}\"\n\n# ===== Step 5: Order lifecycle (State table + Observer) =====\nTRANSITIONS = {\n    \"PLACED\": {\"PAID\", \"CANCELLED\"},\n    \"PAID\": {\"PREPARING\", \"CANCELLED\"},\n    \"PREPARING\": {\"OUT_FOR_DELIVERY\"},\n    \"OUT_FOR_DELIVERY\": {\"DELIVERED\"},\n    \"DELIVERED\": set(),\n    \"CANCELLED\": set(),\n}\n\nclass EventBus:                        # OBSERVER: publish/subscribe\n    def __init__(self):\n        self._subs = defaultdict(list)\n    def subscribe(self, event, fn):\n        self._subs[event].append(fn)\n    def publish(self, event, **data):\n        for fn in list(self._subs[event]):\n            try:\n                fn(**data)\n            except Exception:\n                pass                   # one broken subscriber must not break the app\n\nclass InvalidTransition(Exception):\n    pass\n\nclass OrderTracker:                    # STATE (transition-table version)\n    def __init__(self, bus):\n        self.bus, self.status = bus, {}\n    def start(self, order_id):\n        self.status[order_id] = \"PLACED\"\n        self.bus.publish(\"status_changed\", order_id=order_id, old=None, new=\"PLACED\")\n    def move(self, order_id, new):\n        old = self.status[order_id]\n        if new not in TRANSITIONS[old]:\n            raise InvalidTransition(f\"{old} -> {new} is not allowed\")\n        self.status[order_id] = new\n        self.bus.publish(\"status_changed\", order_id=order_id, old=old, new=new)\n\n# ===== Step 6: Cart undo (Command) + checkout checks (Chain of Responsibility) =====\nclass AddToCart:                       # COMMAND\n    def __init__(self, cart, priced, qty=1):\n        self.cart, self.priced, self.qty, self.line = cart, priced, qty, None\n    def execute(self):\n        self.line = self.cart.add(self.priced, self.qty)\n    def undo(self):\n        self.cart.remove(self.line)\n\nclass CartHistory:\n    def __init__(self):\n        self.done, self.undone = [], []\n    def run(self, cmd):\n        cmd.execute(); self.done.append(cmd); self.undone.clear()\n    def undo(self):\n        if self.done:\n            cmd = self.done.pop(); cmd.undo(); self.undone.append(cmd)\n    def redo(self):\n        if self.undone:\n            cmd = self.undone.pop(); cmd.execute(); self.done.append(cmd)\n\nclass ValidationError(Exception):\n    pass\n\nclass Check:                           # CHAIN OF RESPONSIBILITY base\n    def __init__(self, nxt=None):\n        self.next = nxt\n    def validate(self, ctx):\n        if self.next:\n            self.next.validate(ctx)\n\nclass NotEmpty(Check):\n    def validate(self, ctx):\n        if not ctx[\"cart\"].lines:\n            raise ValidationError(\"cart is empty\")\n        super().validate(ctx)\n\nclass MinimumOrder(Check):\n    def __init__(self, minimum, nxt=None):\n        super().__init__(nxt)\n        self.minimum = minimum\n    def validate(self, ctx):\n        if ctx[\"cart\"].subtotal() < self.minimum:\n            raise ValidationError(f\"minimum order is {self.minimum}\")\n        super().validate(ctx)\n\nclass DeliveryArea(Check):\n    def __init__(self, cities, nxt=None):\n        super().__init__(nxt)\n        self.cities = cities\n    def validate(self, ctx):\n        if ctx[\"city\"] not in self.cities:\n            raise ValidationError(f\"we don't deliver to {ctx['city']}\")\n        super().validate(ctx)\n\n# ===== Step 7: The app (Facade + Proxy + Singleton + Template Method) =====\nclass Settings:                        # SINGLETON: one shared settings object\n    _instance = None\n    def __new__(cls):\n        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n            cls._instance.min_order = 50\n            cls._instance.cities = {\"Pune\", \"Mumbai\"}\n        return cls._instance\n\nclass MenuService:                     # pretend this is a slow database\n    def __init__(self, menu):\n        self.menu, self.lookups = menu, 0\n    def get(self, item_id):\n        self.lookups += 1\n        item = self.menu.find(item_id)\n        if item is None:\n            raise KeyError(f\"no such item: {item_id}\")\n        return item\n\nclass CachedMenu:                      # PROXY: same get(), but cached\n    def __init__(self, service):\n        self.service, self.cache = service, {}\n    def get(self, item_id):\n        if item_id not in self.cache:\n            self.cache[item_id] = self.service.get(item_id)\n        return self.cache[item_id]\n\nclass Receipt(ABC):                    # TEMPLATE METHOD: fixed layout, variable pieces\n    def render(self, order):\n        return \"\\n\".join([self.header(order), *(self.line(l) for l in order.lines), self.footer(order)])\n    def header(self, order): return f\"QuickBite order {order.id}\"\n    def footer(self, order): return f\"TOTAL {order.total:.2f}\"\n    @abstractmethod\n    def line(self, l): ...\n\nclass TextReceipt(Receipt):\n    def line(self, l): return f\"{l.qty} x {l.label} @ {l.unit_price:.2f}\"\n\nclass SmsReceipt(Receipt):\n    def header(self, order): return f\"QB {order.id}\"\n    def line(self, l): return f\"{l.qty}x {l.label}\"\n\nclass QuickBite:                       # FACADE: one simple entry point for the whole system\n    def __init__(self, menu, bus=None):\n        self.settings = Settings()\n        self.menu = CachedMenu(MenuService(menu))\n        self.bus = bus or EventBus()\n        self.tracker = OrderTracker(self.bus)\n        self.checks = NotEmpty(MinimumOrder(self.settings.min_order, DeliveryArea(self.settings.cities)))\n        self.orders, self._next = {}, 1\n\n    def _new_id(self):\n        order_id = f\"QB{self._next:04d}\"\n        self._next += 1\n        return order_id\n\n    def place_order(self, customer, city, address, items, payment=\"upi\", discount=None):\n        # TODO: implement the 5 steps from the lesson\n        pass\n\n    def advance(self, order_id, new_status):\n        self.tracker.move(order_id, new_status)\n\n    def status(self, order_id):\n        return self.tracker.status[order_id]\n", "solution": "# ===== Step 1: Menu (Composite + Iterator) =====\nfrom abc import ABC, abstractmethod\nfrom collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol\n\n@dataclass(frozen=True)\nclass MenuItem:                       # a LEAF of the menu tree (frozen = can't change by accident)\n    id: str\n    name: str\n    price: float\n    veg: bool = True\n    def __iter__(self):               # a leaf \"iterates\" over just itself\n        yield self\n\nclass Category:                       # a COMPOSITE: holds items AND other categories\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, *things):\n        self.children.extend(things)\n        return self\n    def __iter__(self):               # ITERATOR: every MenuItem inside, however deep\n        for child in self.children:\n            yield from child\n    def find(self, item_id):\n        return next((i for i in self if i.id == item_id), None)\n    def veg_only(self):\n        return [i for i in self if i.veg]\n\ndef sample_menu():\n    return Category(\"QuickBite\").add(\n        Category(\"Snacks\").add(MenuItem(\"samosa\", \"Samosa\", 20), MenuItem(\"fries\", \"French Fries\", 80)),\n        Category(\"Meals\").add(\n            MenuItem(\"thali\", \"Veg Thali\", 150),\n            MenuItem(\"biryani\", \"Chicken Biryani\", 220, veg=False),\n            Category(\"Combos\").add(MenuItem(\"burger-combo\", \"Burger Combo\", 199)),\n        ),\n        Category(\"Drinks\").add(MenuItem(\"chai\", \"Masala Chai\", 25), MenuItem(\"lassi\", \"Sweet Lassi\", 60)),\n    )\n\n# ===== Step 2: Pricing (Decorator for add-ons + Strategy for discounts) =====\nclass Priced(Protocol):\n    def price(self) -> float: ...\n    def label(self) -> str: ...\n\nclass Plain:                                   # turns a MenuItem into a Priced thing\n    def __init__(self, item):\n        self.item = item\n    def price(self): return self.item.price\n    def label(self): return self.item.name\n\nclass AddOn:                                   # DECORATOR base: wraps any Priced\n    extra, text = 0, \"\"\n    def __init__(self, inner):\n        self.inner = inner\n    def price(self): return self.inner.price() + self.extra\n    def label(self): return f\"{self.inner.label()} + {self.text}\"\n\nclass ExtraCheese(AddOn): extra, text = 30, \"extra cheese\"\nclass ExtraSauce(AddOn): extra, text = 10, \"extra sauce\"\nclass Jumbo(AddOn): extra, text = 50, \"jumbo size\"\n\nADDONS = {\"cheese\": ExtraCheese, \"sauce\": ExtraSauce, \"jumbo\": Jumbo}\n\ndef make_priced(item, addons=()):\n    priced = Plain(item)\n    for name in addons:\n        priced = ADDONS[name](priced)          # stack decorators\n    return priced\n\nclass Discount(ABC):                           # STRATEGY interface\n    @abstractmethod\n    def apply(self, subtotal): ...\n\nclass NoDiscount(Discount):\n    def apply(self, subtotal): return subtotal\n\nclass PercentOff(Discount):\n    def __init__(self, percent): self.percent = percent\n    def apply(self, subtotal): return subtotal * (1 - self.percent / 100)\n\nclass FlatOff(Discount):\n    def __init__(self, amount, min_total=0): self.amount, self.min_total = amount, min_total\n    def apply(self, subtotal): return subtotal - self.amount if subtotal >= self.min_total else subtotal\n\nclass Cart:\n    def __init__(self):\n        self.lines = []                        # list of (priced, qty) tuples\n    def add(self, priced, qty=1):\n        if qty <= 0:\n            raise ValueError(\"qty must be positive\")\n        line = (priced, qty)\n        self.lines.append(line)\n        return line\n    def remove(self, line):\n        self.lines.remove(line)\n    def subtotal(self):\n        return sum(p.price() * q for p, q in self.lines)\n    def total(self, discount=None):\n        return round(max(0, (discount or NoDiscount()).apply(self.subtotal())), 2)\n\n# ===== Step 3: Orders (Builder + Prototype) =====\n@dataclass(frozen=True)\nclass OrderLine:\n    label: str\n    unit_price: float\n    qty: int\n\n@dataclass(frozen=True)\nclass Order:\n    id: str\n    customer: str\n    address: str\n    lines: tuple\n    total: float\n    def reorder(self, new_id):                 # PROTOTYPE: a copy of this order with a new id\n        return replace(self, id=new_id)\n\nclass OrderBuilder:                            # BUILDER: step by step, validated in build()\n    def __init__(self):\n        self._customer = self._address = None\n        self._cart, self._discount = Cart(), NoDiscount()\n    def for_customer(self, name):\n        self._customer = name\n        return self\n    def deliver_to(self, address):\n        self._address = address\n        return self\n    def add(self, priced, qty=1):\n        self._cart.add(priced, qty)\n        return self\n    def from_cart(self, cart):\n        self._cart = cart\n        return self\n    def with_discount(self, discount):\n        self._discount = discount\n        return self\n    def build(self, order_id):\n        if not self._customer:\n            raise ValueError(\"customer is required\")\n        if not self._address:\n            raise ValueError(\"address is required\")\n        if not self._cart.lines:\n            raise ValueError(\"order is empty\")\n        lines = tuple(OrderLine(p.label(), p.price(), q) for p, q in self._cart.lines)\n        return Order(order_id, self._customer, self._address, lines, self._cart.total(self._discount))\n\n# ===== Step 4: Payments (Factory + Adapter) =====\nclass QuickPaySDK:                     # pretend third-party UPI library (we can't edit it)\n    def charge_paise(self, paise):\n        return {\"ok\": True, \"txn\": f\"UPI{paise}\"}\n\nclass CardCoClient:                    # pretend third-party card library (we can't edit it)\n    def authorize(self, amount_str):\n        return f\"CARD-{amount_str}\"\n\nclass PaymentFactory:                  # FACTORY with self-registration\n    _methods = {}\n    @classmethod\n    def register(cls, name):\n        def deco(klass):\n            cls._methods[name] = klass\n            return klass\n        return deco\n    @classmethod\n    def create(cls, name):\n        if name not in cls._methods:\n            raise ValueError(f\"unknown payment method: {name}\")\n        return cls._methods[name]()\n\n@PaymentFactory.register(\"upi\")\nclass UpiPayment:                      # ADAPTER: QuickPaySDK -> our pay(amount) interface\n    def __init__(self, sdk=None):\n        self.sdk = sdk or QuickPaySDK()\n    def pay(self, amount):\n        return self.sdk.charge_paise(round(amount * 100))[\"txn\"]\n\n@PaymentFactory.register(\"card\")\nclass CardPayment:                     # ADAPTER: CardCoClient -> pay(amount)\n    def __init__(self, client=None):\n        self.client = client or CardCoClient()\n    def pay(self, amount):\n        return self.client.authorize(f\"{amount:.2f}\")\n\n@PaymentFactory.register(\"cash\")\nclass CashOnDelivery:\n    def pay(self, amount):\n        return f\"COD-{amount:.2f}\"\n\n# ===== Step 5: Order lifecycle (State table + Observer) =====\nTRANSITIONS = {\n    \"PLACED\": {\"PAID\", \"CANCELLED\"},\n    \"PAID\": {\"PREPARING\", \"CANCELLED\"},\n    \"PREPARING\": {\"OUT_FOR_DELIVERY\"},\n    \"OUT_FOR_DELIVERY\": {\"DELIVERED\"},\n    \"DELIVERED\": set(),\n    \"CANCELLED\": set(),\n}\n\nclass EventBus:                        # OBSERVER: publish/subscribe\n    def __init__(self):\n        self._subs = defaultdict(list)\n    def subscribe(self, event, fn):\n        self._subs[event].append(fn)\n    def publish(self, event, **data):\n        for fn in list(self._subs[event]):\n            try:\n                fn(**data)\n            except Exception:\n                pass                   # one broken subscriber must not break the app\n\nclass InvalidTransition(Exception):\n    pass\n\nclass OrderTracker:                    # STATE (transition-table version)\n    def __init__(self, bus):\n        self.bus, self.status = bus, {}\n    def start(self, order_id):\n        self.status[order_id] = \"PLACED\"\n        self.bus.publish(\"status_changed\", order_id=order_id, old=None, new=\"PLACED\")\n    def move(self, order_id, new):\n        old = self.status[order_id]\n        if new not in TRANSITIONS[old]:\n            raise InvalidTransition(f\"{old} -> {new} is not allowed\")\n        self.status[order_id] = new\n        self.bus.publish(\"status_changed\", order_id=order_id, old=old, new=new)\n\n# ===== Step 6: Cart undo (Command) + checkout checks (Chain of Responsibility) =====\nclass AddToCart:                       # COMMAND\n    def __init__(self, cart, priced, qty=1):\n        self.cart, self.priced, self.qty, self.line = cart, priced, qty, None\n    def execute(self):\n        self.line = self.cart.add(self.priced, self.qty)\n    def undo(self):\n        self.cart.remove(self.line)\n\nclass CartHistory:\n    def __init__(self):\n        self.done, self.undone = [], []\n    def run(self, cmd):\n        cmd.execute(); self.done.append(cmd); self.undone.clear()\n    def undo(self):\n        if self.done:\n            cmd = self.done.pop(); cmd.undo(); self.undone.append(cmd)\n    def redo(self):\n        if self.undone:\n            cmd = self.undone.pop(); cmd.execute(); self.done.append(cmd)\n\nclass ValidationError(Exception):\n    pass\n\nclass Check:                           # CHAIN OF RESPONSIBILITY base\n    def __init__(self, nxt=None):\n        self.next = nxt\n    def validate(self, ctx):\n        if self.next:\n            self.next.validate(ctx)\n\nclass NotEmpty(Check):\n    def validate(self, ctx):\n        if not ctx[\"cart\"].lines:\n            raise ValidationError(\"cart is empty\")\n        super().validate(ctx)\n\nclass MinimumOrder(Check):\n    def __init__(self, minimum, nxt=None):\n        super().__init__(nxt)\n        self.minimum = minimum\n    def validate(self, ctx):\n        if ctx[\"cart\"].subtotal() < self.minimum:\n            raise ValidationError(f\"minimum order is {self.minimum}\")\n        super().validate(ctx)\n\nclass DeliveryArea(Check):\n    def __init__(self, cities, nxt=None):\n        super().__init__(nxt)\n        self.cities = cities\n    def validate(self, ctx):\n        if ctx[\"city\"] not in self.cities:\n            raise ValidationError(f\"we don't deliver to {ctx['city']}\")\n        super().validate(ctx)\n\n# ===== Step 7: The app (Facade + Proxy + Singleton + Template Method) =====\nclass Settings:                        # SINGLETON: one shared settings object\n    _instance = None\n    def __new__(cls):\n        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n            cls._instance.min_order = 50\n            cls._instance.cities = {\"Pune\", \"Mumbai\"}\n        return cls._instance\n\nclass MenuService:                     # pretend this is a slow database\n    def __init__(self, menu):\n        self.menu, self.lookups = menu, 0\n    def get(self, item_id):\n        self.lookups += 1\n        item = self.menu.find(item_id)\n        if item is None:\n            raise KeyError(f\"no such item: {item_id}\")\n        return item\n\nclass CachedMenu:                      # PROXY: same get(), but cached\n    def __init__(self, service):\n        self.service, self.cache = service, {}\n    def get(self, item_id):\n        if item_id not in self.cache:\n            self.cache[item_id] = self.service.get(item_id)\n        return self.cache[item_id]\n\nclass Receipt(ABC):                    # TEMPLATE METHOD: fixed layout, variable pieces\n    def render(self, order):\n        return \"\\n\".join([self.header(order), *(self.line(l) for l in order.lines), self.footer(order)])\n    def header(self, order): return f\"QuickBite order {order.id}\"\n    def footer(self, order): return f\"TOTAL {order.total:.2f}\"\n    @abstractmethod\n    def line(self, l): ...\n\nclass TextReceipt(Receipt):\n    def line(self, l): return f\"{l.qty} x {l.label} @ {l.unit_price:.2f}\"\n\nclass SmsReceipt(Receipt):\n    def header(self, order): return f\"QB {order.id}\"\n    def line(self, l): return f\"{l.qty}x {l.label}\"\n\nclass QuickBite:                       # FACADE: one simple entry point for the whole system\n    def __init__(self, menu, bus=None):\n        self.settings = Settings()\n        self.menu = CachedMenu(MenuService(menu))\n        self.bus = bus or EventBus()\n        self.tracker = OrderTracker(self.bus)\n        self.checks = NotEmpty(MinimumOrder(self.settings.min_order, DeliveryArea(self.settings.cities)))\n        self.orders, self._next = {}, 1\n\n    def _new_id(self):\n        order_id = f\"QB{self._next:04d}\"\n        self._next += 1\n        return order_id\n\n    def place_order(self, customer, city, address, items, payment=\"upi\", discount=None):\n        cart = Cart()\n        for item_id, qty, *rest in items:                      # items: (id, qty) or (id, qty, addons)\n            cart.add(make_priced(self.menu.get(item_id), rest[0] if rest else ()), qty)\n        self.checks.validate({\"cart\": cart, \"city\": city})     # chain of checks\n        order = (OrderBuilder().for_customer(customer).deliver_to(f\"{address}, {city}\")\n                 .from_cart(cart).with_discount(discount or NoDiscount()).build(self._new_id()))\n        self.tracker.start(order.id)\n        receipt = PaymentFactory.create(payment).pay(order.total)\n        self.tracker.move(order.id, \"PAID\")\n        self.orders[order.id] = order\n        self.bus.publish(\"order_paid\", order=order, receipt=receipt)\n        return order\n\n    def advance(self, order_id, new_status):\n        self.tracker.move(order_id, new_status)\n\n    def status(self, order_id):\n        return self.tracker.status[order_id]\n\n    def reorder(self, order_id, payment=\"upi\"):\n        order = self.orders[order_id].reorder(self._new_id())  # prototype\n        self.tracker.start(order.id)\n        receipt = PaymentFactory.create(payment).pay(order.total)\n        self.tracker.move(order.id, \"PAID\")\n        self.orders[order.id] = order\n        self.bus.publish(\"order_paid\", order=order, receipt=receipt)\n        return order\n", "tests": "\nSettings._instance = None\ndef _app():\n    app = QuickBite(sample_menu()); paid = []\n    app.bus.subscribe(\"order_paid\", lambda order, receipt: paid.append((order.id, receipt)))\n    o = app.place_order(\"Asha\", \"Pune\", \"12 MG Road\", [(\"thali\", 1), (\"burger-combo\", 2, [\"cheese\", \"jumbo\"])],\n                        payment=\"upi\", discount=PercentOff(10))\n    return app, o, paid\nT(\"order total\", lambda: _app()[1].total, 637.2)\nT(\"address and lines\", lambda: (_app()[1].address, _app()[1].lines[1]), (\"12 MG Road, Pune\", OrderLine(\"Burger Combo + extra cheese + jumbo size\", 279, 2)))\nT(\"paid + event published\", lambda: (_app()[0].status(\"QB0001\"), _app()[2]), (\"PAID\", [(\"QB0001\", \"UPI63720\")]))\ndef _cache():\n    app = QuickBite(sample_menu())\n    app.place_order(\"A\", \"Pune\", \"x\", [(\"thali\", 1)]); app.place_order(\"B\", \"Pune\", \"y\", [(\"thali\", 2)])\n    return app.menu.service.lookups\nT(\"menu proxy caches lookups\", _cache, 1)\ndef _rules():\n    app = QuickBite(sample_menu())\n    try:\n        app.place_order(\"A\", \"Delhi\", \"x\", [(\"thali\", 1)]); return \"no error\"\n    except ValidationError as e:\n        return str(e)\nT(\"checks are applied\", _rules, \"we don't deliver to Delhi\")\ndef _flow():\n    app, o, _ = _app(); app.advance(o.id, \"PREPARING\"); app.advance(o.id, \"OUT_FOR_DELIVERY\"); app.advance(o.id, \"DELIVERED\")\n    return app.status(o.id)\nT(\"full lifecycle\", _flow, \"DELIVERED\")\n", "hints": ["Build a Cart, adding make_priced(self.menu.get(item_id), addons) for each item.", "Then self.checks.validate({'cart': cart, 'city': city}), then OrderBuilder()....build(self._new_id()).", "start → pay → move to PAID → store → publish → return."]}]}, {"id": "qb-final", "part": "project", "title": "Final: The Complete App + Your Extension Challenge", "tagline": "Run it, read it, then extend it without editing a single existing class", "body": "<h4>The complete QuickBite source<\/h4>\n<p>Here's everything from Steps 1–7 in one file (about 300 lines). Read it top to bottom: you now know <b>every<\/b> pattern in it.<\/p>\n<pre><code># ===== Step 1: Menu (Composite + Iterator) =====\nfrom abc import ABC, abstractmethod\nfrom collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol\n\n@dataclass(frozen=True)\nclass MenuItem:                       # a LEAF of the menu tree (frozen = can't change by accident)\n    id: str\n    name: str\n    price: float\n    veg: bool = True\n    def __iter__(self):               # a leaf \"iterates\" over just itself\n        yield self\n\nclass Category:                       # a COMPOSITE: holds items AND other categories\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, *things):\n        self.children.extend(things)\n        return self\n    def __iter__(self):               # ITERATOR: every MenuItem inside, however deep\n        for child in self.children:\n            yield from child\n    def find(self, item_id):\n        return next((i for i in self if i.id == item_id), None)\n    def veg_only(self):\n        return [i for i in self if i.veg]\n\ndef sample_menu():\n    return Category(\"QuickBite\").add(\n        Category(\"Snacks\").add(MenuItem(\"samosa\", \"Samosa\", 20), MenuItem(\"fries\", \"French Fries\", 80)),\n        Category(\"Meals\").add(\n            MenuItem(\"thali\", \"Veg Thali\", 150),\n            MenuItem(\"biryani\", \"Chicken Biryani\", 220, veg=False),\n            Category(\"Combos\").add(MenuItem(\"burger-combo\", \"Burger Combo\", 199)),\n        ),\n        Category(\"Drinks\").add(MenuItem(\"chai\", \"Masala Chai\", 25), MenuItem(\"lassi\", \"Sweet Lassi\", 60)),\n    )\n\n# ===== Step 2: Pricing (Decorator for add-ons + Strategy for discounts) =====\nclass Priced(Protocol):\n    def price(self) -&gt; float: ...\n    def label(self) -&gt; str: ...\n\nclass Plain:                                   # turns a MenuItem into a Priced thing\n    def __init__(self, item):\n        self.item = item\n    def price(self): return self.item.price\n    def label(self): return self.item.name\n\nclass AddOn:                                   # DECORATOR base: wraps any Priced\n    extra, text = 0, \"\"\n    def __init__(self, inner):\n        self.inner = inner\n    def price(self): return self.inner.price() + self.extra\n    def label(self): return f\"{self.inner.label()} + {self.text}\"\n\nclass ExtraCheese(AddOn): extra, text = 30, \"extra cheese\"\nclass ExtraSauce(AddOn): extra, text = 10, \"extra sauce\"\nclass Jumbo(AddOn): extra, text = 50, \"jumbo size\"\n\nADDONS = {\"cheese\": ExtraCheese, \"sauce\": ExtraSauce, \"jumbo\": Jumbo}\n\ndef make_priced(item, addons=()):\n    priced = Plain(item)\n    for name in addons:\n        priced = ADDONS[name](priced)          # stack decorators\n    return priced\n\nclass Discount(ABC):                           # STRATEGY interface\n    @abstractmethod\n    def apply(self, subtotal): ...\n\nclass NoDiscount(Discount):\n    def apply(self, subtotal): return subtotal\n\nclass PercentOff(Discount):\n    def __init__(self, percent): self.percent = percent\n    def apply(self, subtotal): return subtotal * (1 - self.percent / 100)\n\nclass FlatOff(Discount):\n    def __init__(self, amount, min_total=0): self.amount, self.min_total = amount, min_total\n    def apply(self, subtotal): return subtotal - self.amount if subtotal &gt;= self.min_total else subtotal\n\nclass Cart:\n    def __init__(self):\n        self.lines = []                        # list of (priced, qty) tuples\n    def add(self, priced, qty=1):\n        if qty &lt;= 0:\n            raise ValueError(\"qty must be positive\")\n        line = (priced, qty)\n        self.lines.append(line)\n        return line\n    def remove(self, line):\n        self.lines.remove(line)\n    def subtotal(self):\n        return sum(p.price() * q for p, q in self.lines)\n    def total(self, discount=None):\n        return round(max(0, (discount or NoDiscount()).apply(self.subtotal())), 2)\n\n# ===== Step 3: Orders (Builder + Prototype) =====\n@dataclass(frozen=True)\nclass OrderLine:\n    label: str\n    unit_price: float\n    qty: int\n\n@dataclass(frozen=True)\nclass Order:\n    id: str\n    customer: str\n    address: str\n    lines: tuple\n    total: float\n    def reorder(self, new_id):                 # PROTOTYPE: a copy of this order with a new id\n        return replace(self, id=new_id)\n\nclass OrderBuilder:                            # BUILDER: step by step, validated in build()\n    def __init__(self):\n        self._customer = self._address = None\n        self._cart, self._discount = Cart(), NoDiscount()\n    def for_customer(self, name):\n        self._customer = name\n        return self\n    def deliver_to(self, address):\n        self._address = address\n        return self\n    def add(self, priced, qty=1):\n        self._cart.add(priced, qty)\n        return self\n    def from_cart(self, cart):\n        self._cart = cart\n        return self\n    def with_discount(self, discount):\n        self._discount = discount\n        return self\n    def build(self, order_id):\n        if not self._customer:\n            raise ValueError(\"customer is required\")\n        if not self._address:\n            raise ValueError(\"address is required\")\n        if not self._cart.lines:\n            raise ValueError(\"order is empty\")\n        lines = tuple(OrderLine(p.label(), p.price(), q) for p, q in self._cart.lines)\n        return Order(order_id, self._customer, self._address, lines, self._cart.total(self._discount))\n\n# ===== Step 4: Payments (Factory + Adapter) =====\nclass QuickPaySDK:                     # pretend third-party UPI library (we can't edit it)\n    def charge_paise(self, paise):\n        return {\"ok\": True, \"txn\": f\"UPI{paise}\"}\n\nclass CardCoClient:                    # pretend third-party card library (we can't edit it)\n    def authorize(self, amount_str):\n        return f\"CARD-{amount_str}\"\n\nclass PaymentFactory:                  # FACTORY with self-registration\n    _methods = {}\n    @classmethod\n    def register(cls, name):\n        def deco(klass):\n            cls._methods[name] = klass\n            return klass\n        return deco\n    @classmethod\n    def create(cls, name):\n        if name not in cls._methods:\n            raise ValueError(f\"unknown payment method: {name}\")\n        return cls._methods[name]()\n\n@PaymentFactory.register(\"upi\")\nclass UpiPayment:                      # ADAPTER: QuickPaySDK -&gt; our pay(amount) interface\n    def __init__(self, sdk=None):\n        self.sdk = sdk or QuickPaySDK()\n    def pay(self, amount):\n        return self.sdk.charge_paise(round(amount * 100))[\"txn\"]\n\n@PaymentFactory.register(\"card\")\nclass CardPayment:                     # ADAPTER: CardCoClient -&gt; pay(amount)\n    def __init__(self, client=None):\n        self.client = client or CardCoClient()\n    def pay(self, amount):\n        return self.client.authorize(f\"{amount:.2f}\")\n\n@PaymentFactory.register(\"cash\")\nclass CashOnDelivery:\n    def pay(self, amount):\n        return f\"COD-{amount:.2f}\"\n\n# ===== Step 5: Order lifecycle (State table + Observer) =====\nTRANSITIONS = {\n    \"PLACED\": {\"PAID\", \"CANCELLED\"},\n    \"PAID\": {\"PREPARING\", \"CANCELLED\"},\n    \"PREPARING\": {\"OUT_FOR_DELIVERY\"},\n    \"OUT_FOR_DELIVERY\": {\"DELIVERED\"},\n    \"DELIVERED\": set(),\n    \"CANCELLED\": set(),\n}\n\nclass EventBus:                        # OBSERVER: publish/subscribe\n    def __init__(self):\n        self._subs = defaultdict(list)\n    def subscribe(self, event, fn):\n        self._subs[event].append(fn)\n    def publish(self, event, **data):\n        for fn in list(self._subs[event]):\n            try:\n                fn(**data)\n            except Exception:\n                pass                   # one broken subscriber must not break the app\n\nclass InvalidTransition(Exception):\n    pass\n\nclass OrderTracker:                    # STATE (transition-table version)\n    def __init__(self, bus):\n        self.bus, self.status = bus, {}\n    def start(self, order_id):\n        self.status[order_id] = \"PLACED\"\n        self.bus.publish(\"status_changed\", order_id=order_id, old=None, new=\"PLACED\")\n    def move(self, order_id, new):\n        old = self.status[order_id]\n        if new not in TRANSITIONS[old]:\n            raise InvalidTransition(f\"{old} -&gt; {new} is not allowed\")\n        self.status[order_id] = new\n        self.bus.publish(\"status_changed\", order_id=order_id, old=old, new=new)\n\n# ===== Step 6: Cart undo (Command) + checkout checks (Chain of Responsibility) =====\nclass AddToCart:                       # COMMAND\n    def __init__(self, cart, priced, qty=1):\n        self.cart, self.priced, self.qty, self.line = cart, priced, qty, None\n    def execute(self):\n        self.line = self.cart.add(self.priced, self.qty)\n    def undo(self):\n        self.cart.remove(self.line)\n\nclass CartHistory:\n    def __init__(self):\n        self.done, self.undone = [], []\n    def run(self, cmd):\n        cmd.execute(); self.done.append(cmd); self.undone.clear()\n    def undo(self):\n        if self.done:\n            cmd = self.done.pop(); cmd.undo(); self.undone.append(cmd)\n    def redo(self):\n        if self.undone:\n            cmd = self.undone.pop(); cmd.execute(); self.done.append(cmd)\n\nclass ValidationError(Exception):\n    pass\n\nclass Check:                           # CHAIN OF RESPONSIBILITY base\n    def __init__(self, nxt=None):\n        self.next = nxt\n    def validate(self, ctx):\n        if self.next:\n            self.next.validate(ctx)\n\nclass NotEmpty(Check):\n    def validate(self, ctx):\n        if not ctx[\"cart\"].lines:\n            raise ValidationError(\"cart is empty\")\n        super().validate(ctx)\n\nclass MinimumOrder(Check):\n    def __init__(self, minimum, nxt=None):\n        super().__init__(nxt)\n        self.minimum = minimum\n    def validate(self, ctx):\n        if ctx[\"cart\"].subtotal() &lt; self.minimum:\n            raise ValidationError(f\"minimum order is {self.minimum}\")\n        super().validate(ctx)\n\nclass DeliveryArea(Check):\n    def __init__(self, cities, nxt=None):\n        super().__init__(nxt)\n        self.cities = cities\n    def validate(self, ctx):\n        if ctx[\"city\"] not in self.cities:\n            raise ValidationError(f\"we don't deliver to {ctx['city']}\")\n        super().validate(ctx)\n\n# ===== Step 7: The app (Facade + Proxy + Singleton + Template Method) =====\nclass Settings:                        # SINGLETON: one shared settings object\n    _instance = None\n    def __new__(cls):\n        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n            cls._instance.min_order = 50\n            cls._instance.cities = {\"Pune\", \"Mumbai\"}\n        return cls._instance\n\nclass MenuService:                     # pretend this is a slow database\n    def __init__(self, menu):\n        self.menu, self.lookups = menu, 0\n    def get(self, item_id):\n        self.lookups += 1\n        item = self.menu.find(item_id)\n        if item is None:\n            raise KeyError(f\"no such item: {item_id}\")\n        return item\n\nclass CachedMenu:                      # PROXY: same get(), but cached\n    def __init__(self, service):\n        self.service, self.cache = service, {}\n    def get(self, item_id):\n        if item_id not in self.cache:\n            self.cache[item_id] = self.service.get(item_id)\n        return self.cache[item_id]\n\nclass Receipt(ABC):                    # TEMPLATE METHOD: fixed layout, variable pieces\n    def render(self, order):\n        return \"\\n\".join([self.header(order), *(self.line(l) for l in order.lines), self.footer(order)])\n    def header(self, order): return f\"QuickBite order {order.id}\"\n    def footer(self, order): return f\"TOTAL {order.total:.2f}\"\n    @abstractmethod\n    def line(self, l): ...\n\nclass TextReceipt(Receipt):\n    def line(self, l): return f\"{l.qty} x {l.label} @ {l.unit_price:.2f}\"\n\nclass SmsReceipt(Receipt):\n    def header(self, order): return f\"QB {order.id}\"\n    def line(self, l): return f\"{l.qty}x {l.label}\"\n\nclass QuickBite:                       # FACADE: one simple entry point for the whole system\n    def __init__(self, menu, bus=None):\n        self.settings = Settings()\n        self.menu = CachedMenu(MenuService(menu))\n        self.bus = bus or EventBus()\n        self.tracker = OrderTracker(self.bus)\n        self.checks = NotEmpty(MinimumOrder(self.settings.min_order, DeliveryArea(self.settings.cities)))\n        self.orders, self._next = {}, 1\n\n    def _new_id(self):\n        order_id = f\"QB{self._next:04d}\"\n        self._next += 1\n        return order_id\n\n    def place_order(self, customer, city, address, items, payment=\"upi\", discount=None):\n        cart = Cart()\n        for item_id, qty, *rest in items:                      # items: (id, qty) or (id, qty, addons)\n            cart.add(make_priced(self.menu.get(item_id), rest[0] if rest else ()), qty)\n        self.checks.validate({\"cart\": cart, \"city\": city})     # chain of checks\n        order = (OrderBuilder().for_customer(customer).deliver_to(f\"{address}, {city}\")\n                 .from_cart(cart).with_discount(discount or NoDiscount()).build(self._new_id()))\n        self.tracker.start(order.id)\n        receipt = PaymentFactory.create(payment).pay(order.total)\n        self.tracker.move(order.id, \"PAID\")\n        self.orders[order.id] = order\n        self.bus.publish(\"order_paid\", order=order, receipt=receipt)\n        return order\n\n    def advance(self, order_id, new_status):\n        self.tracker.move(order_id, new_status)\n\n    def status(self, order_id):\n        return self.tracker.status[order_id]\n\n    def reorder(self, order_id, payment=\"upi\"):\n        order = self.orders[order_id].reorder(self._new_id())  # prototype\n        self.tracker.start(order.id)\n        receipt = PaymentFactory.create(payment).pay(order.total)\n        self.tracker.move(order.id, \"PAID\")\n        self.orders[order.id] = order\n        self.bus.publish(\"order_paid\", order=order, receipt=receipt)\n        return order<\/code><\/pre>\n<h4>A tour of the patterns, as a demo script<\/h4>\n<pre><code>app = QuickBite(sample_menu())\napp.bus.subscribe(\"status_changed\", lambda order_id, old, new: print(f\"📱 {order_id}: {old} -&gt; {new}\"))   # Observer\norder = app.place_order(\"Asha\", \"Pune\", \"12 MG Road\",\n                        [(\"thali\", 1), (\"burger-combo\", 2, [\"cheese\", \"jumbo\"])],   # Decorator add-ons\n                        payment=\"card\", discount=PercentOff(10))                    # Factory+Adapter, Strategy\nprint(TextReceipt().render(order))                                                  # Template Method\napp.advance(order.id, \"PREPARING\")                                                  # State\nagain = app.reorder(order.id)                                                       # Prototype<\/code><\/pre>\n<h4>Where the unused patterns *could* fit (design discussion)<\/h4>\n<ul><li><b>Visitor:<\/b> a <code>SalesReport<\/code> visitor computing tax and revenue per item type.<\/li><li><b>Mediator:<\/b> a <code>DeliveryDispatcher<\/code> coordinating restaurants, riders and customers.<\/li><li><b>Memento:<\/b> saving cart drafts so the user can come back tomorrow.<\/li><li><b>Bridge:<\/b> notifications (Order-update, Promo) × channels (SMS, Push, Email).<\/li><li><b>Flyweight:<\/b> sharing item images and nutrition data among millions of order lines.<\/li><li><b>Abstract Factory:<\/b> a \"region\" factory creating matching tax rules + currency + payment providers per country.<\/li><\/ul>\n<div class=\"note\">Interview tip: when asked \"what patterns did you use?\", explain <b>the problem each one solved<\/b>. Saying \"I used Strategy because discounts change every festival\" beats listing pattern names.<\/div>\n<h4>🏆 Your challenge: extend without editing<\/h4>\n<p>Add <b>two features<\/b> by writing <b>new code only<\/b> (append it at the bottom of the editor and don't modify any existing class):<\/p>\n<ol><li><b>Loyalty points:<\/b> a <code>LoyaltyProgram(bus)<\/code> class that subscribes to <code>\"order_paid\"<\/code> and gives the customer <b>1 point per ₹10<\/b> of the order total (<code>int(total // 10)<\/code>). <code>points(customer)<\/code> returns their points (0 if none).<\/li><li><b>Wallet payment:<\/b> register a new payment method <code>\"wallet\"<\/code> with the factory. <code>WalletPayment<\/code> uses a shared class-level dict <code>balances<\/code> (customer-agnostic for simplicity: one key <code>\"default\"<\/code>), starts at ₹1000, deducts the amount, returns <code>\"WAL-&lt;remaining balance with 2 decimals&gt;\"<\/code>, and raises <code>ValueError(\"insufficient wallet balance\")<\/code> if there isn't enough. The order must then <b>not<\/b> be stored or published.<\/li><\/ol>\n<p>This proves the design is open for extension and closed for modification. That's SOLID in action!<\/p>", "quiz": [], "exercises": [{"id": "qb-ext", "title": "Extension challenge: loyalty + wallet", "statement": "<p>The full QuickBite code is already in the editor. <b>Scroll to the bottom<\/b> and add <code>LoyaltyProgram<\/code> and <code>WalletPayment<\/code> as described in the lesson, without changing any existing code.<\/p>", "starter": "# ===== Step 1: Menu (Composite + Iterator) =====\nfrom abc import ABC, abstractmethod\nfrom collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol\n\n@dataclass(frozen=True)\nclass MenuItem:                       # a LEAF of the menu tree (frozen = can't change by accident)\n    id: str\n    name: str\n    price: float\n    veg: bool = True\n    def __iter__(self):               # a leaf \"iterates\" over just itself\n        yield self\n\nclass Category:                       # a COMPOSITE: holds items AND other categories\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, *things):\n        self.children.extend(things)\n        return self\n    def __iter__(self):               # ITERATOR: every MenuItem inside, however deep\n        for child in self.children:\n            yield from child\n    def find(self, item_id):\n        return next((i for i in self if i.id == item_id), None)\n    def veg_only(self):\n        return [i for i in self if i.veg]\n\ndef sample_menu():\n    return Category(\"QuickBite\").add(\n        Category(\"Snacks\").add(MenuItem(\"samosa\", \"Samosa\", 20), MenuItem(\"fries\", \"French Fries\", 80)),\n        Category(\"Meals\").add(\n            MenuItem(\"thali\", \"Veg Thali\", 150),\n            MenuItem(\"biryani\", \"Chicken Biryani\", 220, veg=False),\n            Category(\"Combos\").add(MenuItem(\"burger-combo\", \"Burger Combo\", 199)),\n        ),\n        Category(\"Drinks\").add(MenuItem(\"chai\", \"Masala Chai\", 25), MenuItem(\"lassi\", \"Sweet Lassi\", 60)),\n    )\n\n# ===== Step 2: Pricing (Decorator for add-ons + Strategy for discounts) =====\nclass Priced(Protocol):\n    def price(self) -> float: ...\n    def label(self) -> str: ...\n\nclass Plain:                                   # turns a MenuItem into a Priced thing\n    def __init__(self, item):\n        self.item = item\n    def price(self): return self.item.price\n    def label(self): return self.item.name\n\nclass AddOn:                                   # DECORATOR base: wraps any Priced\n    extra, text = 0, \"\"\n    def __init__(self, inner):\n        self.inner = inner\n    def price(self): return self.inner.price() + self.extra\n    def label(self): return f\"{self.inner.label()} + {self.text}\"\n\nclass ExtraCheese(AddOn): extra, text = 30, \"extra cheese\"\nclass ExtraSauce(AddOn): extra, text = 10, \"extra sauce\"\nclass Jumbo(AddOn): extra, text = 50, \"jumbo size\"\n\nADDONS = {\"cheese\": ExtraCheese, \"sauce\": ExtraSauce, \"jumbo\": Jumbo}\n\ndef make_priced(item, addons=()):\n    priced = Plain(item)\n    for name in addons:\n        priced = ADDONS[name](priced)          # stack decorators\n    return priced\n\nclass Discount(ABC):                           # STRATEGY interface\n    @abstractmethod\n    def apply(self, subtotal): ...\n\nclass NoDiscount(Discount):\n    def apply(self, subtotal): return subtotal\n\nclass PercentOff(Discount):\n    def __init__(self, percent): self.percent = percent\n    def apply(self, subtotal): return subtotal * (1 - self.percent / 100)\n\nclass FlatOff(Discount):\n    def __init__(self, amount, min_total=0): self.amount, self.min_total = amount, min_total\n    def apply(self, subtotal): return subtotal - self.amount if subtotal >= self.min_total else subtotal\n\nclass Cart:\n    def __init__(self):\n        self.lines = []                        # list of (priced, qty) tuples\n    def add(self, priced, qty=1):\n        if qty <= 0:\n            raise ValueError(\"qty must be positive\")\n        line = (priced, qty)\n        self.lines.append(line)\n        return line\n    def remove(self, line):\n        self.lines.remove(line)\n    def subtotal(self):\n        return sum(p.price() * q for p, q in self.lines)\n    def total(self, discount=None):\n        return round(max(0, (discount or NoDiscount()).apply(self.subtotal())), 2)\n\n# ===== Step 3: Orders (Builder + Prototype) =====\n@dataclass(frozen=True)\nclass OrderLine:\n    label: str\n    unit_price: float\n    qty: int\n\n@dataclass(frozen=True)\nclass Order:\n    id: str\n    customer: str\n    address: str\n    lines: tuple\n    total: float\n    def reorder(self, new_id):                 # PROTOTYPE: a copy of this order with a new id\n        return replace(self, id=new_id)\n\nclass OrderBuilder:                            # BUILDER: step by step, validated in build()\n    def __init__(self):\n        self._customer = self._address = None\n        self._cart, self._discount = Cart(), NoDiscount()\n    def for_customer(self, name):\n        self._customer = name\n        return self\n    def deliver_to(self, address):\n        self._address = address\n        return self\n    def add(self, priced, qty=1):\n        self._cart.add(priced, qty)\n        return self\n    def from_cart(self, cart):\n        self._cart = cart\n        return self\n    def with_discount(self, discount):\n        self._discount = discount\n        return self\n    def build(self, order_id):\n        if not self._customer:\n            raise ValueError(\"customer is required\")\n        if not self._address:\n            raise ValueError(\"address is required\")\n        if not self._cart.lines:\n            raise ValueError(\"order is empty\")\n        lines = tuple(OrderLine(p.label(), p.price(), q) for p, q in self._cart.lines)\n        return Order(order_id, self._customer, self._address, lines, self._cart.total(self._discount))\n\n# ===== Step 4: Payments (Factory + Adapter) =====\nclass QuickPaySDK:                     # pretend third-party UPI library (we can't edit it)\n    def charge_paise(self, paise):\n        return {\"ok\": True, \"txn\": f\"UPI{paise}\"}\n\nclass CardCoClient:                    # pretend third-party card library (we can't edit it)\n    def authorize(self, amount_str):\n        return f\"CARD-{amount_str}\"\n\nclass PaymentFactory:                  # FACTORY with self-registration\n    _methods = {}\n    @classmethod\n    def register(cls, name):\n        def deco(klass):\n            cls._methods[name] = klass\n            return klass\n        return deco\n    @classmethod\n    def create(cls, name):\n        if name not in cls._methods:\n            raise ValueError(f\"unknown payment method: {name}\")\n        return cls._methods[name]()\n\n@PaymentFactory.register(\"upi\")\nclass UpiPayment:                      # ADAPTER: QuickPaySDK -> our pay(amount) interface\n    def __init__(self, sdk=None):\n        self.sdk = sdk or QuickPaySDK()\n    def pay(self, amount):\n        return self.sdk.charge_paise(round(amount * 100))[\"txn\"]\n\n@PaymentFactory.register(\"card\")\nclass CardPayment:                     # ADAPTER: CardCoClient -> pay(amount)\n    def __init__(self, client=None):\n        self.client = client or CardCoClient()\n    def pay(self, amount):\n        return self.client.authorize(f\"{amount:.2f}\")\n\n@PaymentFactory.register(\"cash\")\nclass CashOnDelivery:\n    def pay(self, amount):\n        return f\"COD-{amount:.2f}\"\n\n# ===== Step 5: Order lifecycle (State table + Observer) =====\nTRANSITIONS = {\n    \"PLACED\": {\"PAID\", \"CANCELLED\"},\n    \"PAID\": {\"PREPARING\", \"CANCELLED\"},\n    \"PREPARING\": {\"OUT_FOR_DELIVERY\"},\n    \"OUT_FOR_DELIVERY\": {\"DELIVERED\"},\n    \"DELIVERED\": set(),\n    \"CANCELLED\": set(),\n}\n\nclass EventBus:                        # OBSERVER: publish/subscribe\n    def __init__(self):\n        self._subs = defaultdict(list)\n    def subscribe(self, event, fn):\n        self._subs[event].append(fn)\n    def publish(self, event, **data):\n        for fn in list(self._subs[event]):\n            try:\n                fn(**data)\n            except Exception:\n                pass                   # one broken subscriber must not break the app\n\nclass InvalidTransition(Exception):\n    pass\n\nclass OrderTracker:                    # STATE (transition-table version)\n    def __init__(self, bus):\n        self.bus, self.status = bus, {}\n    def start(self, order_id):\n        self.status[order_id] = \"PLACED\"\n        self.bus.publish(\"status_changed\", order_id=order_id, old=None, new=\"PLACED\")\n    def move(self, order_id, new):\n        old = self.status[order_id]\n        if new not in TRANSITIONS[old]:\n            raise InvalidTransition(f\"{old} -> {new} is not allowed\")\n        self.status[order_id] = new\n        self.bus.publish(\"status_changed\", order_id=order_id, old=old, new=new)\n\n# ===== Step 6: Cart undo (Command) + checkout checks (Chain of Responsibility) =====\nclass AddToCart:                       # COMMAND\n    def __init__(self, cart, priced, qty=1):\n        self.cart, self.priced, self.qty, self.line = cart, priced, qty, None\n    def execute(self):\n        self.line = self.cart.add(self.priced, self.qty)\n    def undo(self):\n        self.cart.remove(self.line)\n\nclass CartHistory:\n    def __init__(self):\n        self.done, self.undone = [], []\n    def run(self, cmd):\n        cmd.execute(); self.done.append(cmd); self.undone.clear()\n    def undo(self):\n        if self.done:\n            cmd = self.done.pop(); cmd.undo(); self.undone.append(cmd)\n    def redo(self):\n        if self.undone:\n            cmd = self.undone.pop(); cmd.execute(); self.done.append(cmd)\n\nclass ValidationError(Exception):\n    pass\n\nclass Check:                           # CHAIN OF RESPONSIBILITY base\n    def __init__(self, nxt=None):\n        self.next = nxt\n    def validate(self, ctx):\n        if self.next:\n            self.next.validate(ctx)\n\nclass NotEmpty(Check):\n    def validate(self, ctx):\n        if not ctx[\"cart\"].lines:\n            raise ValidationError(\"cart is empty\")\n        super().validate(ctx)\n\nclass MinimumOrder(Check):\n    def __init__(self, minimum, nxt=None):\n        super().__init__(nxt)\n        self.minimum = minimum\n    def validate(self, ctx):\n        if ctx[\"cart\"].subtotal() < self.minimum:\n            raise ValidationError(f\"minimum order is {self.minimum}\")\n        super().validate(ctx)\n\nclass DeliveryArea(Check):\n    def __init__(self, cities, nxt=None):\n        super().__init__(nxt)\n        self.cities = cities\n    def validate(self, ctx):\n        if ctx[\"city\"] not in self.cities:\n            raise ValidationError(f\"we don't deliver to {ctx['city']}\")\n        super().validate(ctx)\n\n# ===== Step 7: The app (Facade + Proxy + Singleton + Template Method) =====\nclass Settings:                        # SINGLETON: one shared settings object\n    _instance = None\n    def __new__(cls):\n        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n            cls._instance.min_order = 50\n            cls._instance.cities = {\"Pune\", \"Mumbai\"}\n        return cls._instance\n\nclass MenuService:                     # pretend this is a slow database\n    def __init__(self, menu):\n        self.menu, self.lookups = menu, 0\n    def get(self, item_id):\n        self.lookups += 1\n        item = self.menu.find(item_id)\n        if item is None:\n            raise KeyError(f\"no such item: {item_id}\")\n        return item\n\nclass CachedMenu:                      # PROXY: same get(), but cached\n    def __init__(self, service):\n        self.service, self.cache = service, {}\n    def get(self, item_id):\n        if item_id not in self.cache:\n            self.cache[item_id] = self.service.get(item_id)\n        return self.cache[item_id]\n\nclass Receipt(ABC):                    # TEMPLATE METHOD: fixed layout, variable pieces\n    def render(self, order):\n        return \"\\n\".join([self.header(order), *(self.line(l) for l in order.lines), self.footer(order)])\n    def header(self, order): return f\"QuickBite order {order.id}\"\n    def footer(self, order): return f\"TOTAL {order.total:.2f}\"\n    @abstractmethod\n    def line(self, l): ...\n\nclass TextReceipt(Receipt):\n    def line(self, l): return f\"{l.qty} x {l.label} @ {l.unit_price:.2f}\"\n\nclass SmsReceipt(Receipt):\n    def header(self, order): return f\"QB {order.id}\"\n    def line(self, l): return f\"{l.qty}x {l.label}\"\n\nclass QuickBite:                       # FACADE: one simple entry point for the whole system\n    def __init__(self, menu, bus=None):\n        self.settings = Settings()\n        self.menu = CachedMenu(MenuService(menu))\n        self.bus = bus or EventBus()\n        self.tracker = OrderTracker(self.bus)\n        self.checks = NotEmpty(MinimumOrder(self.settings.min_order, DeliveryArea(self.settings.cities)))\n        self.orders, self._next = {}, 1\n\n    def _new_id(self):\n        order_id = f\"QB{self._next:04d}\"\n        self._next += 1\n        return order_id\n\n    def place_order(self, customer, city, address, items, payment=\"upi\", discount=None):\n        cart = Cart()\n        for item_id, qty, *rest in items:                      # items: (id, qty) or (id, qty, addons)\n            cart.add(make_priced(self.menu.get(item_id), rest[0] if rest else ()), qty)\n        self.checks.validate({\"cart\": cart, \"city\": city})     # chain of checks\n        order = (OrderBuilder().for_customer(customer).deliver_to(f\"{address}, {city}\")\n                 .from_cart(cart).with_discount(discount or NoDiscount()).build(self._new_id()))\n        self.tracker.start(order.id)\n        receipt = PaymentFactory.create(payment).pay(order.total)\n        self.tracker.move(order.id, \"PAID\")\n        self.orders[order.id] = order\n        self.bus.publish(\"order_paid\", order=order, receipt=receipt)\n        return order\n\n    def advance(self, order_id, new_status):\n        self.tracker.move(order_id, new_status)\n\n    def status(self, order_id):\n        return self.tracker.status[order_id]\n\n    def reorder(self, order_id, payment=\"upi\"):\n        order = self.orders[order_id].reorder(self._new_id())  # prototype\n        self.tracker.start(order.id)\n        receipt = PaymentFactory.create(payment).pay(order.total)\n        self.tracker.move(order.id, \"PAID\")\n        self.orders[order.id] = order\n        self.bus.publish(\"order_paid\", order=order, receipt=receipt)\n        return order\n\n\n# ===================== YOUR EXTENSIONS BELOW (don't edit anything above) =====================\nclass LoyaltyProgram:\n    pass\n\n# @PaymentFactory.register(\"wallet\")\n# class WalletPayment: ...\n", "solution": "# ===== Step 1: Menu (Composite + Iterator) =====\nfrom abc import ABC, abstractmethod\nfrom collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol\n\n@dataclass(frozen=True)\nclass MenuItem:                       # a LEAF of the menu tree (frozen = can't change by accident)\n    id: str\n    name: str\n    price: float\n    veg: bool = True\n    def __iter__(self):               # a leaf \"iterates\" over just itself\n        yield self\n\nclass Category:                       # a COMPOSITE: holds items AND other categories\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, *things):\n        self.children.extend(things)\n        return self\n    def __iter__(self):               # ITERATOR: every MenuItem inside, however deep\n        for child in self.children:\n            yield from child\n    def find(self, item_id):\n        return next((i for i in self if i.id == item_id), None)\n    def veg_only(self):\n        return [i for i in self if i.veg]\n\ndef sample_menu():\n    return Category(\"QuickBite\").add(\n        Category(\"Snacks\").add(MenuItem(\"samosa\", \"Samosa\", 20), MenuItem(\"fries\", \"French Fries\", 80)),\n        Category(\"Meals\").add(\n            MenuItem(\"thali\", \"Veg Thali\", 150),\n            MenuItem(\"biryani\", \"Chicken Biryani\", 220, veg=False),\n            Category(\"Combos\").add(MenuItem(\"burger-combo\", \"Burger Combo\", 199)),\n        ),\n        Category(\"Drinks\").add(MenuItem(\"chai\", \"Masala Chai\", 25), MenuItem(\"lassi\", \"Sweet Lassi\", 60)),\n    )\n\n# ===== Step 2: Pricing (Decorator for add-ons + Strategy for discounts) =====\nclass Priced(Protocol):\n    def price(self) -> float: ...\n    def label(self) -> str: ...\n\nclass Plain:                                   # turns a MenuItem into a Priced thing\n    def __init__(self, item):\n        self.item = item\n    def price(self): return self.item.price\n    def label(self): return self.item.name\n\nclass AddOn:                                   # DECORATOR base: wraps any Priced\n    extra, text = 0, \"\"\n    def __init__(self, inner):\n        self.inner = inner\n    def price(self): return self.inner.price() + self.extra\n    def label(self): return f\"{self.inner.label()} + {self.text}\"\n\nclass ExtraCheese(AddOn): extra, text = 30, \"extra cheese\"\nclass ExtraSauce(AddOn): extra, text = 10, \"extra sauce\"\nclass Jumbo(AddOn): extra, text = 50, \"jumbo size\"\n\nADDONS = {\"cheese\": ExtraCheese, \"sauce\": ExtraSauce, \"jumbo\": Jumbo}\n\ndef make_priced(item, addons=()):\n    priced = Plain(item)\n    for name in addons:\n        priced = ADDONS[name](priced)          # stack decorators\n    return priced\n\nclass Discount(ABC):                           # STRATEGY interface\n    @abstractmethod\n    def apply(self, subtotal): ...\n\nclass NoDiscount(Discount):\n    def apply(self, subtotal): return subtotal\n\nclass PercentOff(Discount):\n    def __init__(self, percent): self.percent = percent\n    def apply(self, subtotal): return subtotal * (1 - self.percent / 100)\n\nclass FlatOff(Discount):\n    def __init__(self, amount, min_total=0): self.amount, self.min_total = amount, min_total\n    def apply(self, subtotal): return subtotal - self.amount if subtotal >= self.min_total else subtotal\n\nclass Cart:\n    def __init__(self):\n        self.lines = []                        # list of (priced, qty) tuples\n    def add(self, priced, qty=1):\n        if qty <= 0:\n            raise ValueError(\"qty must be positive\")\n        line = (priced, qty)\n        self.lines.append(line)\n        return line\n    def remove(self, line):\n        self.lines.remove(line)\n    def subtotal(self):\n        return sum(p.price() * q for p, q in self.lines)\n    def total(self, discount=None):\n        return round(max(0, (discount or NoDiscount()).apply(self.subtotal())), 2)\n\n# ===== Step 3: Orders (Builder + Prototype) =====\n@dataclass(frozen=True)\nclass OrderLine:\n    label: str\n    unit_price: float\n    qty: int\n\n@dataclass(frozen=True)\nclass Order:\n    id: str\n    customer: str\n    address: str\n    lines: tuple\n    total: float\n    def reorder(self, new_id):                 # PROTOTYPE: a copy of this order with a new id\n        return replace(self, id=new_id)\n\nclass OrderBuilder:                            # BUILDER: step by step, validated in build()\n    def __init__(self):\n        self._customer = self._address = None\n        self._cart, self._discount = Cart(), NoDiscount()\n    def for_customer(self, name):\n        self._customer = name\n        return self\n    def deliver_to(self, address):\n        self._address = address\n        return self\n    def add(self, priced, qty=1):\n        self._cart.add(priced, qty)\n        return self\n    def from_cart(self, cart):\n        self._cart = cart\n        return self\n    def with_discount(self, discount):\n        self._discount = discount\n        return self\n    def build(self, order_id):\n        if not self._customer:\n            raise ValueError(\"customer is required\")\n        if not self._address:\n            raise ValueError(\"address is required\")\n        if not self._cart.lines:\n            raise ValueError(\"order is empty\")\n        lines = tuple(OrderLine(p.label(), p.price(), q) for p, q in self._cart.lines)\n        return Order(order_id, self._customer, self._address, lines, self._cart.total(self._discount))\n\n# ===== Step 4: Payments (Factory + Adapter) =====\nclass QuickPaySDK:                     # pretend third-party UPI library (we can't edit it)\n    def charge_paise(self, paise):\n        return {\"ok\": True, \"txn\": f\"UPI{paise}\"}\n\nclass CardCoClient:                    # pretend third-party card library (we can't edit it)\n    def authorize(self, amount_str):\n        return f\"CARD-{amount_str}\"\n\nclass PaymentFactory:                  # FACTORY with self-registration\n    _methods = {}\n    @classmethod\n    def register(cls, name):\n        def deco(klass):\n            cls._methods[name] = klass\n            return klass\n        return deco\n    @classmethod\n    def create(cls, name):\n        if name not in cls._methods:\n            raise ValueError(f\"unknown payment method: {name}\")\n        return cls._methods[name]()\n\n@PaymentFactory.register(\"upi\")\nclass UpiPayment:                      # ADAPTER: QuickPaySDK -> our pay(amount) interface\n    def __init__(self, sdk=None):\n        self.sdk = sdk or QuickPaySDK()\n    def pay(self, amount):\n        return self.sdk.charge_paise(round(amount * 100))[\"txn\"]\n\n@PaymentFactory.register(\"card\")\nclass CardPayment:                     # ADAPTER: CardCoClient -> pay(amount)\n    def __init__(self, client=None):\n        self.client = client or CardCoClient()\n    def pay(self, amount):\n        return self.client.authorize(f\"{amount:.2f}\")\n\n@PaymentFactory.register(\"cash\")\nclass CashOnDelivery:\n    def pay(self, amount):\n        return f\"COD-{amount:.2f}\"\n\n# ===== Step 5: Order lifecycle (State table + Observer) =====\nTRANSITIONS = {\n    \"PLACED\": {\"PAID\", \"CANCELLED\"},\n    \"PAID\": {\"PREPARING\", \"CANCELLED\"},\n    \"PREPARING\": {\"OUT_FOR_DELIVERY\"},\n    \"OUT_FOR_DELIVERY\": {\"DELIVERED\"},\n    \"DELIVERED\": set(),\n    \"CANCELLED\": set(),\n}\n\nclass EventBus:                        # OBSERVER: publish/subscribe\n    def __init__(self):\n        self._subs = defaultdict(list)\n    def subscribe(self, event, fn):\n        self._subs[event].append(fn)\n    def publish(self, event, **data):\n        for fn in list(self._subs[event]):\n            try:\n                fn(**data)\n            except Exception:\n                pass                   # one broken subscriber must not break the app\n\nclass InvalidTransition(Exception):\n    pass\n\nclass OrderTracker:                    # STATE (transition-table version)\n    def __init__(self, bus):\n        self.bus, self.status = bus, {}\n    def start(self, order_id):\n        self.status[order_id] = \"PLACED\"\n        self.bus.publish(\"status_changed\", order_id=order_id, old=None, new=\"PLACED\")\n    def move(self, order_id, new):\n        old = self.status[order_id]\n        if new not in TRANSITIONS[old]:\n            raise InvalidTransition(f\"{old} -> {new} is not allowed\")\n        self.status[order_id] = new\n        self.bus.publish(\"status_changed\", order_id=order_id, old=old, new=new)\n\n# ===== Step 6: Cart undo (Command) + checkout checks (Chain of Responsibility) =====\nclass AddToCart:                       # COMMAND\n    def __init__(self, cart, priced, qty=1):\n        self.cart, self.priced, self.qty, self.line = cart, priced, qty, None\n    def execute(self):\n        self.line = self.cart.add(self.priced, self.qty)\n    def undo(self):\n        self.cart.remove(self.line)\n\nclass CartHistory:\n    def __init__(self):\n        self.done, self.undone = [], []\n    def run(self, cmd):\n        cmd.execute(); self.done.append(cmd); self.undone.clear()\n    def undo(self):\n        if self.done:\n            cmd = self.done.pop(); cmd.undo(); self.undone.append(cmd)\n    def redo(self):\n        if self.undone:\n            cmd = self.undone.pop(); cmd.execute(); self.done.append(cmd)\n\nclass ValidationError(Exception):\n    pass\n\nclass Check:                           # CHAIN OF RESPONSIBILITY base\n    def __init__(self, nxt=None):\n        self.next = nxt\n    def validate(self, ctx):\n        if self.next:\n            self.next.validate(ctx)\n\nclass NotEmpty(Check):\n    def validate(self, ctx):\n        if not ctx[\"cart\"].lines:\n            raise ValidationError(\"cart is empty\")\n        super().validate(ctx)\n\nclass MinimumOrder(Check):\n    def __init__(self, minimum, nxt=None):\n        super().__init__(nxt)\n        self.minimum = minimum\n    def validate(self, ctx):\n        if ctx[\"cart\"].subtotal() < self.minimum:\n            raise ValidationError(f\"minimum order is {self.minimum}\")\n        super().validate(ctx)\n\nclass DeliveryArea(Check):\n    def __init__(self, cities, nxt=None):\n        super().__init__(nxt)\n        self.cities = cities\n    def validate(self, ctx):\n        if ctx[\"city\"] not in self.cities:\n            raise ValidationError(f\"we don't deliver to {ctx['city']}\")\n        super().validate(ctx)\n\n# ===== Step 7: The app (Facade + Proxy + Singleton + Template Method) =====\nclass Settings:                        # SINGLETON: one shared settings object\n    _instance = None\n    def __new__(cls):\n        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n            cls._instance.min_order = 50\n            cls._instance.cities = {\"Pune\", \"Mumbai\"}\n        return cls._instance\n\nclass MenuService:                     # pretend this is a slow database\n    def __init__(self, menu):\n        self.menu, self.lookups = menu, 0\n    def get(self, item_id):\n        self.lookups += 1\n        item = self.menu.find(item_id)\n        if item is None:\n            raise KeyError(f\"no such item: {item_id}\")\n        return item\n\nclass CachedMenu:                      # PROXY: same get(), but cached\n    def __init__(self, service):\n        self.service, self.cache = service, {}\n    def get(self, item_id):\n        if item_id not in self.cache:\n            self.cache[item_id] = self.service.get(item_id)\n        return self.cache[item_id]\n\nclass Receipt(ABC):                    # TEMPLATE METHOD: fixed layout, variable pieces\n    def render(self, order):\n        return \"\\n\".join([self.header(order), *(self.line(l) for l in order.lines), self.footer(order)])\n    def header(self, order): return f\"QuickBite order {order.id}\"\n    def footer(self, order): return f\"TOTAL {order.total:.2f}\"\n    @abstractmethod\n    def line(self, l): ...\n\nclass TextReceipt(Receipt):\n    def line(self, l): return f\"{l.qty} x {l.label} @ {l.unit_price:.2f}\"\n\nclass SmsReceipt(Receipt):\n    def header(self, order): return f\"QB {order.id}\"\n    def line(self, l): return f\"{l.qty}x {l.label}\"\n\nclass QuickBite:                       # FACADE: one simple entry point for the whole system\n    def __init__(self, menu, bus=None):\n        self.settings = Settings()\n        self.menu = CachedMenu(MenuService(menu))\n        self.bus = bus or EventBus()\n        self.tracker = OrderTracker(self.bus)\n        self.checks = NotEmpty(MinimumOrder(self.settings.min_order, DeliveryArea(self.settings.cities)))\n        self.orders, self._next = {}, 1\n\n    def _new_id(self):\n        order_id = f\"QB{self._next:04d}\"\n        self._next += 1\n        return order_id\n\n    def place_order(self, customer, city, address, items, payment=\"upi\", discount=None):\n        cart = Cart()\n        for item_id, qty, *rest in items:                      # items: (id, qty) or (id, qty, addons)\n            cart.add(make_priced(self.menu.get(item_id), rest[0] if rest else ()), qty)\n        self.checks.validate({\"cart\": cart, \"city\": city})     # chain of checks\n        order = (OrderBuilder().for_customer(customer).deliver_to(f\"{address}, {city}\")\n                 .from_cart(cart).with_discount(discount or NoDiscount()).build(self._new_id()))\n        self.tracker.start(order.id)\n        receipt = PaymentFactory.create(payment).pay(order.total)\n        self.tracker.move(order.id, \"PAID\")\n        self.orders[order.id] = order\n        self.bus.publish(\"order_paid\", order=order, receipt=receipt)\n        return order\n\n    def advance(self, order_id, new_status):\n        self.tracker.move(order_id, new_status)\n\n    def status(self, order_id):\n        return self.tracker.status[order_id]\n\n    def reorder(self, order_id, payment=\"upi\"):\n        order = self.orders[order_id].reorder(self._new_id())  # prototype\n        self.tracker.start(order.id)\n        receipt = PaymentFactory.create(payment).pay(order.total)\n        self.tracker.move(order.id, \"PAID\")\n        self.orders[order.id] = order\n        self.bus.publish(\"order_paid\", order=order, receipt=receipt)\n        return order\n\n\n# ===================== YOUR EXTENSIONS BELOW (don't edit anything above) =====================\nclass LoyaltyProgram:                          # a new OBSERVER: no existing class changed\n    def __init__(self, bus):\n        self._points = defaultdict(int)\n        bus.subscribe(\"order_paid\", self.on_paid)\n    def on_paid(self, order,  the marker)\", _untouched, \"add new classes only, below the marker line\")\n", "hints": ["LoyaltyProgram.<i>_init_<\/i> subscribes a method to 'order_paid'; that method receives order= and receipt=.", "Decorate WalletPayment with @PaymentFactory.register('wallet').", "QuickBite.place_order already stops before storing/publishing if pay() raises."]}]}], "python": {"prelude": "\nfrom typing import List, Optional\nfrom collections import Counter, defaultdict, deque, OrderedDict\nimport heapq, bisect, math, itertools, functools, string, re\n\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val, self.next = val, next\n    def __repr__(self):\n        return \"ListNode(\" + \" -> \".join(map(str, from_ll(self, 50))) + \")\"\n\ndef to_ll(values):\n    \"\"\"Python list -> linked list. to_ll([1, 2, 3]) gives 1 -> 2 -> 3\"\"\"\n    dummy = tail = ListNode()\n    for v in values:\n        tail.next = ListNode(v)\n        tail = tail.next\n    return dummy.next\n\ndef from_ll(head, limit=100000):\n    \"\"\"linked list -> Python list (stops after `limit` nodes, in case of a cycle)\"\"\"\n    out = []\n    while head is not None and len(out) < limit:\n        out.append(head.val)\n        head = head.next\n    return out\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val, self.left, self.right = val, left, right\n    def __repr__(self):\n        return f\"TreeNode({from_tree(self)})\"\n\ndef to_tree(values):\n    \"\"\"Level-order list (None = missing child) -> binary tree. to_tree([2, 1, 3])\"\"\"\n    if not values or values[0] is None:\n        return None\n    root = TreeNode(values[0])\n    q, i = deque([root]), 1\n    while q and i < len(values):\n        node = q.popleft()\n        if i < len(values) and values[i] is not None:\n            node.left = TreeNode(values[i]); q.append(node.left)\n        i += 1\n        if i < len(values) and values[i] is not None:\n            node.right = TreeNode(values[i]); q.append(node.right)\n        i += 1\n    return root\n\ndef from_tree(root):\n    \"\"\"binary tree -> level-order list (trailing None removed)\"\"\"\n    out, q = [], deque([root])\n    while q:\n        n = q.popleft()\n        if n is None:\n            out.append(None)\n        else:\n            out.append(n.val); q.append(n.left); q.append(n.right)\n    while out and out[-1] is None:\n        out.pop()\n    return out\n\ndef find_node(root, val):\n    \"\"\"find the node holding `val` (used by tests that need node references)\"\"\"\n    stack = [root]\n    while stack:\n        n = stack.pop()\n        if n is None: continue\n        if n.val == val: return n\n        stack += [n.left, n.right]\n    return None\n\nclass Node:\n    \"\"\"graph node for Clone Graph\"\"\"\n    def __init__(self, val=0, neighbors=None):\n        self.val = val\n        self.neighbors = neighbors if neighbors is not None else []\n    def __repr__(self):\n        return f\"Node({self.val})\"\n\ndef build_graph(adj):\n    \"\"\"adj[i] = list of neighbour values of node i+1 (values start at 1)\"\"\"\n    if not adj:\n        return None\n    nodes = [Node(i + 1) for i in range(len(adj))]\n    for i, nbrs in enumerate(adj):\n        nodes[i].neighbors = [nodes[j - 1] for j in nbrs]\n    return nodes[0]\n\ndef graph_to_adj(node):\n    if node is None:\n        return []\n    seen, q = {node.val: node}, deque([node])\n    while q:\n        n = q.popleft()\n        for m in n.neighbors:\n            if m.val not in seen:\n                seen[m.val] = m; q.append(m)\n    return [[m.val for m in seen[v].neighbors] for v in sorted(seen)]\n\ndef graph_node_ids(node):\n    seen, q = {}, deque([node] if node else [])\n    while q:\n        n = q.popleft()\n        if id(n) in seen: continue\n        seen[id(n)] = n\n        q.extend(n.neighbors)\n    return set(seen)\n", "harness": "\nimport json as _json, traceback as _tb, sys as _sys, linecache as _lc\n_results = []\n\ndef _short(x):\n
