<style>

:root{--bg:#0f1115;--bg2:#151821;--bg3:#1c2030;--fg:#e6e8ee;--muted:#9aa3b5;--line:#262b3a;--accent:#ffd43b;--accent2:#4b8bbe;--ok:#3fb950;--bad:#f85149;--warn:#f0883e;--vio:#bc8cff;--cyan:#39c5cf;

[data-theme="light"]{--bg:#fbfaf7;--bg2:#f3f1ec;--bg3:#ebe8e0;--fg:#1d2230;--muted:#5b6475;--line:#dcd8cd;--accent:#b8860b;--accent2:#2f6aa0;--code-bg:#f6f4ee;--kw:#cf222e;--str:#0a3069;--num:#0550ae;--com:#8c959f;--fn:#8250df;--bi:#953800;--dec:#116329}

body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}

.topbar{position:fixed;top:0;left:0;right:0;height:56px;z-index:30;display:flex;align-items:center;gap:12px;padding:0 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

#menuBtn{display:none}
.side{position:fixed;top:56px;bottom:0;left:0;width:var(--side);overflow-y:auto;background:var(--bg2);border-right:1px solid var(--line);padding:12px 10px 40px}
.meter{font-size:13px;color:var(--muted);padding:2px 8px 10px}.meter b{color:var(--fg)}
.bar{height:6px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:5px 0 8px}.bar i{display:block;height:100%;background:var(--ok);width:0}
.tgroup{margin-bottom:2px}
.thead{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:600;color:var(--fg);text-decoration:none}
.thead:hover,.thead.active{background:var(--bg3)}
.thead small{color:var(--muted);font-weight:500}
.plist{display:none;padding:0 0 6px 8px}.tgroup.open .plist{display:block}
.pitem{display:flex;gap:7px;align-items:center;padding:4px 8px;border-radius:6px;font-size:13.5px;color:var(--fg);text-decoration:none;line-height:1.3}
.pitem:hover{background:var(--bg3)}.pitem.active{background:var(--bg3);box-shadow:inset 3px 0 0 var(--accent)}

.pitem.hidden,.tgroup.hidden{display:none}
.lv{font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:1px 6px;border-radius:4px;flex:none}
.lv.Warm-up{background:#2d3a52;color:#a5d6ff}.lv.Easy{background:#1f3d2a;color:#7ee787}.lv.Medium{background:#4a3a14;color:#ffd43b}.lv.Hard{background:#4d1f1f;color:#ffa198}
[data-theme="light"] .lv.Warm-up{background:#dbeafe;color:#1e40af}[data-theme="light"] .lv.Easy{background:#dcfce7;color:#166534}[data-theme="light"] .lv.Medium{background:#fef3c7;color:#92400e}[data-theme="light"] .lv.Hard{background:#fee2e2;color:#991b1b}
.b75{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:4px;background:var(--vio);color:#160b2b;flex:none}

.muted{color:var(--muted)}
:not(pre)>code{background:var(--bg3);padding:1px 6px;border-radius:5px;font-size:.88em}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;font-size:13.5px;line-height:1.55;margin:10px 0}

table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left}th{background:var(--bg3)}

.tok-kw{color:var(--kw)}.tok-str{color:var(--str)}.tok-num{color:var(--num)}.tok-com{color:var(--com);font-style:italic}.tok-fn{color:var(--fn)}.tok-bi{color:var(--bi)}.tok-dec{color:var(--dec)}.tok-self{color:var(--bi);font-style:italic}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin:14px 0}

textarea.code{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--fg);padding:12px 12px;font-size:13.5px;line-height:1.55;tab-size:4;white-space:pre;overflow:hidden;min-height:240px}
.out{border:1px solid var(--line);border-radius:10px;margin-top:10px;background:var(--bg2);display:none}
.out.show{display:block}

.t-row{padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}.t-row:last-child{border-bottom:0}

.t-row pre{margin:5px 0;font-size:12.5px;padding:7px 10px}
.out pre.stdout{margin:8px 14px 12px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;background:var(--bg3)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;display:flex;align-items:center;justify-content:center;font-size:64px;animation:pop 1.2s ease forwards}

.lesson-tag{font-size:15px;color:var(--muted);margin:0 0 14px}

.litem:hover{background:var(--bg3)}.litem.active{background:var(--bg3);box-shadow:inset 3px 0 0 var(--accent)}

.exercise{border:1px solid var(--line);border-radius:12px;padding:4px 16px 14px;margin:18px 0;background:color-mix(in srgb,var(--ok) 4%,var(--bg))}

<script id="data" type="application/json">{"parts": [["start", "Part 0 · Start Here"], ["solid", "Part 1 · SOLID Principles"], ["creational", "Part 2 · Creational Patterns (making objects)"], ["structural", "Part 3 · Structural Patterns (connecting objects)"], ["behavioral", "Part 4 · Behavioral Patterns (objects working together)"], ["project", "Part 5 · Project: QuickBite Food-Ordering App"]], "lessons": [{"id": "why-design", "part": "start", "title": "Why Do We Even Need Design?", "tagline": "Messy code is like a messy school bag", "body": "<h4>The messy school bag<\/h4>\n<p>Imagine your school bag with <b>no compartments<\/b>. Books, tiffin, pencils, sports shoes, all thrown in together. On day 1 it's fine. By month 3, your tiffin has leaked onto your maths notebook, and finding a pencil takes 5 minutes.<\/p>\n<p>Code is the same. A small program can be messy and still work. But real programs <b>grow<\/b>: new features every week, many people editing them. Without organisation:<\/p>\n<ul><li>changing one thing <b>breaks<\/b> something unrelated,<\/li><li>nobody can <b>find<\/b> where anything is,<\/li><li><b>adding<\/b> a feature means editing 20 places,<\/li><li><b>testing<\/b> is impossible because everything is glued together.<\/li><\/ul>\n<p><b>Software design<\/b> is about putting compartments in your bag: deciding which piece of code is responsible for what, and how the pieces talk to each other.<\/p>\n<h4>Two big ideas in this tutorial<\/h4>\n<ol><li><b>SOLID principles<\/b>: 5 rules of thumb for good classes. Think of them as \"good habits\", like \"keep your tiffin in its own box\".<\/li><li><b>Design patterns<\/b>: 22 famous <b>ready-made solutions<\/b> to problems that keep coming up. Think of them as \"recipes\". You don't invent a new recipe for tea every morning, you use one that works.<\/li><\/ol>\n<div class=\"note\">Patterns were collected in a famous 1994 book by four authors (the \"Gang of Four\", GoF). They wrote for C++/Java. <b>Python makes many patterns simpler<\/b>, sometimes just a function. You'll see the \"Pythonic shortcut\" in every lesson.<\/div>\n<h4>Words you need (2-minute refresher)<\/h4>\n<table><tr><th>word<\/th><th>meaning<\/th><th>school example<\/th><\/tr><tr><td><b>class<\/b><\/td><td>a blueprint<\/td><td>the \"Student\" form design<\/td><\/tr><tr><td><b>object<\/b><\/td><td>a thing made from the blueprint<\/td><td>Asha's filled-in form<\/td><\/tr><tr><td><b>method<\/b><\/td><td>something an object can do<\/td><td><code>student.submit_homework()<\/code><\/td><\/tr><tr><td><b>inheritance<\/b> (\"is a\")<\/td><td>a child class reuses a parent<\/td><td>a <code>ClassMonitor<\/code> <b>is a<\/b> <code>Student<\/code><\/td><\/tr><tr><td><b>composition<\/b> (\"has a\")<\/td><td>an object contains another<\/td><td>a <code>School<\/code> <b>has<\/b> <code>Classrooms<\/code><\/td><\/tr><tr><td><b>interface<\/b><\/td><td>a promise: \"I have these methods\"<\/td><td>anything with <code>.charge()<\/code> can be a charger<\/td><\/tr><\/table>\n<p>If any of these feel shaky, read <b>chapters 08–10 (OOP from Zero)<\/b> in the main guide first.<\/p>\n<h4>Interfaces in Python: ABC and Protocol<\/h4>\n<p>Many patterns rely on an <b>interface<\/b>, a \"socket\" that different objects can plug into:<\/p>\n<pre><code>from abc import ABC, abstractmethod\nfrom typing import Protocol\n\nclass Shape(ABC):                  # ABC: children MUST implement area()\n    @abstractmethod\n    def area(self) -&gt; float: ...\n\nclass Drawable(Protocol):          # Protocol: anything with draw() fits, no inheritance needed\n    def draw(self) -&gt; str: ...<\/code><\/pre>\n<h4>How to study each lesson<\/h4>\n<p>Every lesson follows the same path: <b>story → messy code (the problem) → the pattern (the fix) → picture → when NOT to use it → Python shortcut → quick check → practice<\/b>. Do the practice. Reading about swimming won't teach you to swim!<\/p>", "quiz": [["What's the difference between a class and an object?", "<p>A class is the <b>blueprint<\/b> (the form design). An object is <b>one actual thing<\/b> made from it (one filled-in form). One class, many objects.<\/p>"], ["'Is a' or 'has a'? A Car and its Engine.", "<p><b>Has a<\/b>: a car *has* an engine, so that's composition. A car is not a kind of engine.<\/p>"], ["Why does a pattern from a Java book often look simpler in Python?", "<p>Python has first-class functions, duck typing, modules, decorators and dataclasses built in. Some patterns that need several classes in Java are just a function or a module in Python.<\/p>"]], "exercises": [{"id": "warmup-shape", "title": "Warm-up: your first interface", "statement": "<p>Create an abstract class <code>Shape<\/code> with an abstract method <code>area()<\/code>. Then make two shapes:<\/p>\n<ul><li><code>Rectangle(w, h)<\/code> with area <code>w * h<\/code>,<\/li><li><code>Circle(r)<\/code> with area <code>3.14 * r * r<\/code> (use 3.14).<\/li><\/ul>\n<p>Finally, write <code>total_area(shapes)<\/code>, which adds up the areas of any list of shapes.<\/p>", "starter": "from abc import ABC, abstractmethod\n\nclass Shape(ABC):\n    pass   # add an abstract method area()\n\nclass Rectangle(Shape):\n    pass\n\nclass Circle(Shape):\n    pass\n\ndef total_area(shapes):\n    pass\n", "solution": "from abc import ABC, abstractmethod\n\nclass Shape(ABC):\n    @abstractmethod\n    def area(self):\n        ...\n\nclass Rectangle(Shape):\n    def __init__(self, w, h):\n        self.w, self.h = w, h\n    def area(self):\n        return self.w * self.h\n\nclass Circle(Shape):\n    def __init__(self, r):\n        self.r = r\n    def area(self):\n        return 3.14 * self.r * self.r\n\ndef total_area(shapes):\n    return sum(s.area() for s in shapes)     # works for ANY shape: that's polymorphism\n", "tests": "\nT(\"rectangle\", lambda: Rectangle(3, 4).area(), 12)\nT(\"circle\", lambda: Circle(1).area(), 3.14)\nT(\"total\", lambda: round(total_area([Rectangle(2, 5), Circle(2)]), 2), 22.56)\ndef _abstract():\n    try:\n        Shape(); return False\n    except TypeError:\n        return True\nC(\"Shape can't be created directly (it's abstract)\", _abstract, \"Shape() should raise TypeError: add @abstractmethod\")\nC(\"Rectangle is a Shape\", lambda: issubclass(Rectangle, Shape) and issubclass(Circle, Shape))\n", "hints": ["Use <code>@abstractmethod<\/code> above <code>def area(self)<\/code> inside Shape.", "<code>total_area<\/code> can use <code>sum(s.area() for s in shapes)<\/code>."]}]}, {"id": "srp", "part": "solid", "title": "S: Single Responsibility Principle", "tagline": "One class, one job", "body": "<h4>The story<\/h4>\n<p>In your school, the <b>canteen uncle<\/b> makes food, the <b>librarian<\/b> issues books, and the <b>PE teacher<\/b> runs sports. Imagine one person doing all three. When the library rules change, the cook has to learn them. When he's sick, there's no food, no books and no sports!<\/p>\n<p><b>SRP: a class should have only one reason to change.<\/b> In simple words, <b>one class, one job<\/b>.<\/p>\n<h4>The messy code<\/h4>\n<pre><code>class ReportCard:\n    def __init__(self, student, marks):\n        self.student, self.marks = student, marks\n    def average(self):                         # job 1: calculate\n        return sum(self.marks) / len(self.marks)\n    def to_html(self):                         # job 2: format for display\n        return f\"&lt;h1&gt;{self.student}&lt;/h1&gt;&lt;p&gt;{self.average():.1f}&lt;/p&gt;\"\n    def save(self, path):                      # job 3: store in a file\n        with open(path, \"w\") as f:\n            f.write(self.to_html())\n    def email_parents(self, address):          # job 4: send email\n        ...<\/code><\/pre>\n<p>This class changes if the <b>grading rule<\/b> changes, if the <b>design<\/b> changes, if we move from <b>files to a database<\/b>, or if the <b>email provider<\/b> changes. That's four reasons to change, so it's fragile.<\/p>\n<h4>The fix: one job each<\/h4>\n<pre><code>class ReportCard:                      # job: the data + grade calculations\n    def __init__(self, student, marks):\n        self.student, self.marks = student, marks\n    def average(self):\n        return sum(self.marks) / len(self.marks)\n\nclass HtmlFormatter:                   # job: how it looks\n    def format(self, card):\n        return f\"&lt;h1&gt;{card.student}&lt;/h1&gt;&lt;p&gt;{card.average():.1f}&lt;/p&gt;\"\n\nclass FileSaver:                       # job: where it's stored\n    def save(self, text, path):\n        with open(path, \"w\") as f:\n            f.write(text)<\/code><\/pre>\n<p>Now changing the design only touches <code>HtmlFormatter<\/code>. Switching to a database means replacing <code>FileSaver<\/code>. Each piece is also easy to <b>test<\/b> on its own.<\/p>\n<h4>The \"and\" test<\/h4>\n<p>Describe your class in one sentence. If you need the word <b>\"and\"<\/b> (\"it calculates marks <b>and<\/b> formats HTML <b>and<\/b> saves files\"), it probably has too many jobs.<\/p>\n<div class=\"note\"><b>Don't overdo it:<\/b> SRP doesn't mean \"one method per class\". <code>ReportCard<\/code> can have <code>average()<\/code>, <code>highest()<\/code> and <code>grade()<\/code>. Those are all the same job (the maths of marks).<\/div>", "quiz": [["A <code>User<\/code> class validates passwords, saves to the DB, and sends welcome emails. Which SRP smell is it?", "<p>Three reasons to change: security rules, storage, and email. Split it into <code>PasswordPolicy<\/code>, <code>UserRepository<\/code> and <code>WelcomeMailer<\/code>, and keep <code>User<\/code> as the data.<\/p>"], ["Does SRP mean every class must have one method?", "<p>No. One <b>job<\/b> (one reason to change), which can involve many related methods.<\/p>"]], "exercises": [{"id": "srp-split", "title": "Split the god class", "statement": "<p><code>Invoice<\/code> below does three jobs. Refactor it into:<\/p>\n<ul><li><code>Invoice(items)<\/code>, which stores <code>items<\/code> (a list of <code>(name, price)<\/code> tuples) and has <code>total()<\/code>,<\/li><li><code>InvoicePrinter<\/code>, with <code>render(invoice)<\/code> returning exactly the same text as the old <code>print_text()<\/code>,<\/li><li><code>TaxCalculator(rate)<\/code>, with <code>tax(invoice)<\/code> returning <code>round(invoice.total() * rate, 2)<\/code>.<\/li><\/ul>\n<p><code>Invoice<\/code> must <b>not<\/b> have <code>print_text<\/code> or <code>tax<\/code> methods anymore.<\/p>", "starter": "# OLD messy version, refactor it:\nclass Invoice:\n    def __init__(self, items, tax_rate):\n        self.items, self.tax_rate = items, tax_rate\n    def total(self):\n        return sum(price for _, price in self.items)\n    def tax(self):\n        return round(self.total() * self.tax_rate, 2)\n    def print_text(self):\n        lines = [f\"{name}: {price}\" for name, price in self.items]\n        return \"\\n\".join(lines + [f\"TOTAL: {self.total()}\"])\n", "solution": "class Invoice:                          # job: the invoice data + its total\n    def __init__(self, items):\n        self.items = items\n    def total(self):\n        return sum(price for _, price in self.items)\n\nclass InvoicePrinter:                   # job: presentation\n    def render(self, invoice):\n        lines = [f\"{name}: {price}\" for name, price in invoice.items]\n        return \"\\n\".join(lines + [f\"TOTAL: {invoice.total()}\"])\n\nclass TaxCalculator:                    # job: tax rules\n    def __init__(self, rate):\n        self.rate = rate\n    def tax(self, invoice):\n        return round(invoice.total() * self.rate, 2)\n", "tests": "\n_inv = lambda: Invoice([(\"pen\", 10), (\"book\", 90)])\nT(\"total\", lambda: _inv().total(), 100)\nT(\"printer\", lambda: InvoicePrinter().render(_inv()), \"pen: 10\\nbook: 90\\nTOTAL: 100\")\nT(\"tax\", lambda: TaxCalculator(0.18).tax(_inv()), 18.0)\nC(\"Invoice no longer prints or taxes\", lambda: not hasattr(Invoice, \"print_text\") and not hasattr(Invoice, \"tax\"),\n  \"remove print_text and tax from Invoice\")\n", "hints": ["Invoice keeps only items + total().", "Move printing into InvoicePrinter.render(invoice), which reads invoice.items."]}]}, {"id": "ocp", "part": "solid", "title": "O: Open/Closed Principle", "tagline": "Add new things without editing old things", "body": "<h4>The story<\/h4>\n<p>Think of a <b>power strip<\/b> (extension board). When you buy a new gadget, you <b>plug it in<\/b>. You don't open the strip and rewire it! The strip is <b>closed<\/b> for changes but <b>open<\/b> for new plugs.<\/p>\n<p><b>OCP: code should be open for extension, closed for modification.<\/b> Add new behaviour by <b>adding new code<\/b>, not by editing code that already works (and is already tested).<\/p>\n<h4>The messy code<\/h4>\n<pre><code>def calculate_fee(student_type, base):\n    if student_type == \"regular\":\n        return base\n    elif student_type == \"scholarship\":\n        return base * 0.5\n    elif student_type == \"staff_child\":\n        return base * 0.3\n    # every new type = edit this function again (and risk breaking the others)<\/code><\/pre>\n<h4>The fix: a \"socket\" (interface) plus one class per type<\/h4>\n<pre><code>from abc import ABC, abstractmethod\n\nclass FeePolicy(ABC):\n    @abstractmethod\n    def fee(self, base): ...\n\nclass Regular(FeePolicy):\n    def fee(self, base): return base\n\nclass Scholarship(FeePolicy):\n    def fee(self, base): return base * 0.5\n\nclass StaffChild(FeePolicy):\n    def fee(self, base): return base * 0.3\n\ndef calculate_fee(policy: FeePolicy, base):\n    return policy.fee(base)          # never changes again!\n\n# New type next year? Just ADD a class:\nclass SportsQuota(FeePolicy):\n    def fee(self, base): return base * 0.6<\/code><\/pre>\n<h4>Python shortcut: a registry dictionary<\/h4>\n<pre><code>FEE_RULES = {\"regular\": lambda b: b, \"scholarship\": lambda b: b * 0.5}\nFEE_RULES[\"sports\"] = lambda b: b * 0.6        # extend without touching existing code<\/code><\/pre>\n<div class=\"note\"><b>Spot it:<\/b> long <code>if/elif<\/code> chains on a \"type\" string, repeated in several places, are the classic OCP smell. The fix is usually <b>polymorphism<\/b> or a <b>registry<\/b>.<\/div>", "quiz": [["What does 'closed for modification' protect you from?", "<p>Breaking code that already works and is tested. New features go into <b>new<\/b> code, so old features keep working.<\/p>"], ["What's the usual fix for a long if/elif chain on a type?", "<p>Polymorphism (a class per type behind a common interface), or a dictionary registry of functions or classes.<\/p>"]], "exercises": [{"id": "ocp-shipping", "title": "Make shipping costs extensible", "statement": "<p>Replace the <code>if/elif<\/code> with classes. Create an abstract <code>Shipping<\/code> with <code>cost(weight)<\/code>, plus:<\/p>\n<ul><li><code>Standard<\/code>: <code>weight * 10<\/code><\/li><li><code>Express<\/code>: <code>weight * 20 + 50<\/code><\/li><li><code>Free<\/code>: always <code>0<\/code><\/li><\/ul>\n<p>Then <code>shipping_cost(method, weight)<\/code> must just call <code>method.cost(weight)<\/code>. Finally, <b>add a new<\/b> <code>Drone<\/code> class (<code>weight * 15 + 100<\/code>) <b>without editing<\/b> <code>shipping_cost<\/code>.<\/p>", "starter": "# messy version:\n# def shipping_cost(kind, weight):\n#     if kind == \"standard\": return weight * 10\n#     elif kind == \"express\": return weight * 20 + 50\n#     elif kind == \"free\": return 0\n\nfrom abc import ABC, abstractmethod\n\nclass Shipping(ABC):\n    pass\n\ndef shipping_cost(method, weight):\n    pass\n", "solution": "from abc import ABC, abstractmethod\n\nclass Shipping(ABC):\n    @abstractmethod\n    def cost(self, weight): ...\n\nclass Standard(Shipping):\n    def cost(self, weight): return weight * 10\n\nclass Express(Shipping):\n    def cost(self, weight): return weight * 20 + 50\n\nclass Free(Shipping):\n    def cost(self, weight): return 0\n\nclass Drone(Shipping):                       # added later: no edits anywhere else\n    def cost(self, weight): return weight * 15 + 100\n\ndef shipping_cost(method, weight):\n    return method.cost(weight)\n", "tests": "\nT(\"standard\", lambda: shipping_cost(Standard(), 2), 20)\nT(\"express\", lambda: shipping_cost(Express(), 2), 90)\nT(\"free\", lambda: shipping_cost(Free(), 99), 0)\nT(\"drone (the extension)\", lambda: shipping_cost(Drone(), 2), 130)\nC(\"all are Shipping\", lambda: all(issubclass(c, Shipping) for c in (Standard, Express, Free, Drone)))\n", "hints": ["Each class implements cost(self, weight).", "shipping_cost is one line: return method.cost(weight)."]}]}, {"id": "lsp", "part": "solid", "title": "L: Liskov Substitution Principle", "tagline": "A child must keep the parent's promises", "body": "<h4>The story<\/h4>\n<p>Your teacher says: <i>\"Any student can be sent to fetch chalk from the staff room.\"<\/i> If one \"student\" is actually a <b>toddler visiting for the day<\/b> who can't walk there alone, the teacher's rule breaks. If you call something a Student, it must be able to do what students do.<\/p>\n<p><b>LSP: if <code>B<\/code> is a child of <code>A<\/code>, you must be able to use a <code>B<\/code> anywhere an <code>A<\/code> is expected, without surprises.<\/b> (Named after computer scientist Barbara Liskov.)<\/p>\n<h4>The famous broken example<\/h4>\n<pre><code>class Bird:\n    def fly(self):\n        return \"flap flap\"\n\nclass Penguin(Bird):\n    def fly(self):\n        raise Exception(\"Penguins can't fly!\")   # breaks Bird's promise\n\ndef migrate(birds):\n    for b in birds:\n        b.fly()          # crashes when a Penguin is in the list<\/code><\/pre>\n<p><code>Penguin<\/code> <b>is<\/b> a bird in biology, but <b>not<\/b> in this code, because this code's <code>Bird<\/code> promises \"I can fly\".<\/p>\n<h4>The fix: make promises honest<\/h4>\n<pre><code>class Bird:\n    def eat(self): return \"nom\"\n\nclass FlyingBird(Bird):\n    def fly(self): return \"flap flap\"\n\nclass Sparrow(FlyingBird): ...\nclass Penguin(Bird):                   # a Bird, but NOT a FlyingBird\n    def swim(self): return \"splash\"\n\ndef migrate(birds: list[FlyingBird]):  # only accepts birds that really fly\n    return [b.fly() for b in birds]<\/code><\/pre>\n<h4>LSP warning signs<\/h4>\n<ul><li>A child method that <b>raises<\/b> \"not supported\" or does nothing.<\/li><li>A child that <b>demands more<\/b> (stricter inputs) or <b>gives less<\/b> (weaker outputs) than the parent.<\/li><li>Code that checks <code>if isinstance(x, Penguin):<\/code> before calling a method. That's a sign the hierarchy is lying.<\/li><\/ul>\n<div class=\"note\">The classic interview example: is a <code>Square<\/code> a <code>Rectangle<\/code>? If a rectangle lets you set width and height separately, a square can't keep that promise. Make them separate classes, or immutable.<\/div>", "quiz": [["Your <code>ReadOnlyList(list)<\/code> raises an error in <code>append<\/code>. Is that LSP-safe?", "<p>No. Code expecting a list will call <code>append<\/code> and crash. Don't inherit from <code>list<\/code>; make a separate class (or use a tuple).<\/p>"], ["How can <code>isinstance<\/code> checks before method calls hint at an LSP problem?", "<p>If callers must special-case a subclass, that subclass doesn't really behave like its parent, so the hierarchy is wrong.<\/p>"]], "exercises": [{"id": "lsp-accounts", "title": "Fix the savings account", "statement": "<p>A <code>FixedDeposit<\/code> currently inherits from <code>Account<\/code> but <b>raises<\/b> on <code>withdraw<\/code>, which breaks LSP. Redesign it:<\/p>\n<ul><li><code>Account(balance)<\/code> with <code>deposit(x)<\/code> and a <code>balance<\/code> attribute (no withdraw!),<\/li><li><code>WithdrawableAccount(Account)<\/code> adds <code>withdraw(x)<\/code> (raise <code>ValueError<\/code> if x &gt; balance),<\/li><li><code>Savings(WithdrawableAccount)<\/code> is a normal account,<\/li><li><code>FixedDeposit(Account)<\/code> can only deposit.<\/li><\/ul>\n<p><code>pay_rent(account, amount)<\/code> takes a <b>WithdrawableAccount<\/b> and withdraws. It must never be possible to pass a FixedDeposit as a withdrawable account.<\/p>", "starter": "class Account:\n    def __init__(self, balance=0):\n        self.balance = balance\n    def deposit(self, x):\n        self.balance += x\n    def withdraw(self, x):\n        self.balance -= x\n\nclass FixedDeposit(Account):\n    def withdraw(self, x):\n        raise Exception(\"locked!\")     # LSP violation, fix the design\n\ndef pay_rent(account, amount):\n    account.withdraw(amount)\n", "solution": "class Account:\n    def __init__(self, balance=0):\n        self.balance = balance\n    def deposit(self, x):\n        self.balance += x\n\nclass WithdrawableAccount(Account):\n    def withdraw(self, x):\n        if x > self.balance:\n            raise ValueError(\"insufficient funds\")\n        self.balance -= x\n\nclass Savings(WithdrawableAccount):\n    pass\n\nclass FixedDeposit(Account):            # honest: it never promised withdraw\n    pass\n\ndef pay_rent(account: WithdrawableAccount, amount):\n    account.withdraw(amount)\n", "tests": "\ndef _rent():\n    s = Savings(1000); pay_rent(s, 300); return s.balance\nT(\"rent from savings\", _rent, 700)\ndef _fd():\n    f = FixedDeposit(500); f.deposit(100); return f.balance\nT(\"fixed deposit can deposit\", _fd, 600)\nC(\"FixedDeposit has no withdraw\", lambda: not hasattr(FixedDeposit(), \"withdraw\"), \"FixedDeposit must not inherit withdraw\")\nC(\"FixedDeposit is NOT withdrawable\", lambda: not issubclass(FixedDeposit, WithdrawableAccount))\ndef _over():\n    try:\n        Savings(10).withdraw(50); return False\n    except ValueError:\n        return True\nC(\"overdraw raises ValueError\", _over)\n", "hints": ["Move withdraw out of Account into a new subclass.", "FixedDeposit should inherit from Account only."]}]}, {"id": "isp", "part": "solid", "title": "I: Interface Segregation Principle", "tagline": "Don't force anyone to sign up for things they can't do", "body": "<h4>The story<\/h4>\n<p>Imagine the school forces <b>every<\/b> student to join cricket <b>and<\/b> music <b>and<\/b> coding club, even if they hate cricket. Half of them would \"join\" but do nothing. Better: <b>small separate clubs<\/b>, where you join only what you actually do.<\/p>\n<p><b>ISP: many small, specific interfaces beat one big \"do-everything\" interface.<\/b> A class shouldn't be forced to implement methods it doesn't need.<\/p>\n<h4>The messy code<\/h4>\n<pre><code>from abc import ABC, abstractmethod\n\nclass Machine(ABC):\n    @abstractmethod\n    def print(self, doc): ...\n    @abstractmethod\n    def scan(self) -&gt; str: ...\n    @abstractmethod\n    def fax(self, number): ...\n\nclass CheapPrinter(Machine):\n    def print(self, doc): return f\"printing {doc}\"\n    def scan(self): raise NotImplementedError     # forced to fake it\n    def fax(self, number): raise NotImplementedError<\/code><\/pre>\n<p>(Notice that ISP violations often cause LSP violations too!)<\/p>\n<h4>The fix: small interfaces (roles)<\/h4>\n<pre><code>from typing import Protocol\n\nclass Printer(Protocol):\n    def print(self, doc) -&gt; str: ...\n\nclass Scanner(Protocol):\n    def scan(self) -&gt; str: ...\n\nclass CheapPrinter:                     # implements only what it can\n    def print(self, doc): return f\"printing {doc}\"\n\nclass OfficeMachine:                    # can do several roles\n    def print(self, doc): return f\"printing {doc}\"\n    def scan(self): return \"scanned page\"\n\ndef print_homework(p: Printer, doc):    # asks only for what it needs\n    return p.print(doc)<\/code><\/pre>\n<div class=\"note\">Python's <code>Protocol<\/code> is great for ISP: a class doesn't even have to inherit; it just needs the right methods (duck typing, but checked by type checkers).<\/div>", "quiz": [["A <code>Worker<\/code> interface has <code>work()<\/code> and <code>eat_lunch()<\/code>. A <code>Robot<\/code> worker must implement <code>eat_lunch()<\/code>. What's wrong?", "<p>That's an ISP violation. Split it into <code>Workable<\/code> and <code>Eater<\/code>; the robot implements only <code>Workable<\/code>.<\/p>"], ["Why does ISP make testing easier?", "<p>A function asking for a tiny interface (just <code>print()<\/code>) can be tested with a tiny fake object.<\/p>"]], "exercises": [{"id": "isp-devices", "title": "Split the smart-device interface", "statement": "<p>Create three small abstract interfaces: <code>Switchable<\/code> (<code>turn_on()<\/code> / <code>turn_off()<\/code>), <code>Dimmable<\/code> (<code>set_brightness(level)<\/code>), and <code>Speaker<\/code> (<code>play(song)<\/code>). Then:<\/p>\n<ul><li><code>Bulb<\/code>: Switchable + Dimmable. It stores <code>on<\/code> (bool) and <code>brightness<\/code> (int, default 100). <code>turn_on<\/code> and <code>turn_off<\/code> set <code>on<\/code>.<\/li><li><code>SmartSpeaker<\/code>: Switchable + Speaker. <code>play(song)<\/code> returns <code>\"playing &lt;song&gt;\"<\/code> only if it's on, else <code>\"off\"<\/code>.<\/li><li><code>Fan<\/code>: Switchable only.<\/li><\/ul>\n<p>Write <code>all_off(devices)<\/code>, which turns off every Switchable device. <b>No class may have a method it can't really do.<\/b><\/p>", "starter": "from abc import ABC, abstractmethod\n\nclass Switchable(ABC):\n    pass\n\nclass Dimmable(ABC):\n    pass\n\nclass Speaker(ABC):\n    pass\n\nclass Bulb:\n    pass\n\nclass SmartSpeaker:\n    pass\n\nclass Fan:\n    pass\n\ndef all_off(devices):\n    pass\n", "solution": "from abc import ABC, abstractmethod\n\nclass Switchable(ABC):\n    @abstractmethod\n    def turn_on(self): ...\n    @abstractmethod\n    def turn_off(self): ...\n\nclass Dimmable(ABC):\n    @abstractmethod\n    def set_brightness(self, level): ...\n\nclass Speaker(ABC):\n    @abstractmethod\n    def play(self, song): ...\n\nclass _OnOff(Switchable):                 # shared on/off behaviour\n    def __init__(self):\n        self.on = False\n    def turn_on(self):\n        self.on = True\n    def turn_off(self):\n        self.on = False\n\nclass Bulb(_OnOff, Dimmable):\n    def __init__(self):\n        super().__init__()\n        self.brightness = 100\n    def set_brightness(self, level):\n        self.brightness = level\n\nclass SmartSpeaker(_OnOff, Speaker):\n    def play(self, song):\n        return f\"playing {song}\" if self.on else \"off\"\n\nclass Fan(_OnOff):\n    pass\n\ndef all_off(devices):\n    for d in devices:\n        d.turn_off()\n", "tests": "\ndef _scene():\n    b, s, f = Bulb(), SmartSpeaker(), Fan()\n    for d in (b, s, f): d.turn_on()\n    b.set_brightness(30)\n    played = s.play(\"lofi\")\n    all_off([b, s, f])\n    return [b.brightness, played, b.on, s.on, f.on, s.play(\"x\")]\nT(\"living-room scene\", _scene, [30, \"playing lofi\", False, False, False, \"off\"])\nC(\"Fan is not Dimmable and can't play\", lambda: not hasattr(Fan(), \"set_brightness\") and not hasattr(Fan(), \"play\"))\nC(\"Bulb can't play music\", lambda: not hasattr(Bulb(), \"play\"))\nC(\"interfaces used\", lambda: issubclass(Bulb, Dimmable) and issubclass(SmartSpeaker, Speaker) and all(issubclass(c, Switchable) for c in (Bulb, SmartSpeaker, Fan)))\n", "hints": ["A small base class with on/off can be shared by all three devices.", "Use multiple inheritance from the small interfaces: class Bulb(Base, Dimmable)."]}]}, {"id": "dip", "part": "solid", "title": "D: Dependency Inversion Principle", "tagline": "Depend on the socket, not on the exact plug", "body": "<h4>The story<\/h4>\n<p>Your phone has a <b>USB-C port<\/b>. It doesn't care whether you plug in your charger, your friend's, or a power bank. If phones were <b>soldered<\/b> to one specific charger, you'd be stuck forever.<\/p>\n<p><b>DIP: important (high-level) code should depend on an abstraction (an interface), not on concrete details.<\/b> And the details plug into that abstraction.<\/p>\n<h4>The messy code<\/h4>\n<pre><code>class MySQLDatabase:\n    def save(self, data): ...\n\nclass AttendanceService:\n    def __init__(self):\n        self.db = MySQLDatabase()          # soldered to MySQL!\n    def mark_present(self, student):\n        self.db.save({\"student\": student, \"present\": True})<\/code><\/pre>\n<p>Problems: you can't switch to another database, and <b>you can't test it without a real MySQL server<\/b>.<\/p>\n<h4>The fix: depend on an interface, and \"inject\" the concrete thing<\/h4>\n<pre><code>from typing import Protocol\n\nclass Storage(Protocol):                  # the abstraction (the USB-C port)\n    def save(self, data) -&gt; None: ...\n\nclass AttendanceService:\n    def __init__(self, storage: Storage):  # handed in from outside = \"dependency injection\"\n        self.storage = storage\n    def mark_present(self, student):\n        self.storage.save({\"student\": student, \"present\": True})\n\nclass MySQLStorage:\n    def save(self, data): ...              # real one, for production\n\nclass MemoryStorage:                       # fake one, for tests\n    def __init__(self): self.rows = []\n    def save(self, data): self.rows.append(data)\n\nservice = AttendanceService(MemoryStorage())   # tests: no database needed!<\/code><\/pre>\n<h4>DIP vs \"dependency injection\"<\/h4>\n<ul><li><b>Dependency Inversion<\/b> is the <b>principle<\/b>: depend on abstractions.<\/li><li><b>Dependency Injection<\/b> is the <b>technique<\/b>: pass dependencies in (usually through <code><i>_init_<\/i><\/code>) instead of creating them inside.<\/li><\/ul>\n<div class=\"note\">Rule of thumb: if a class does <code>self.x = SomethingConcrete()<\/code> in <code><i>_init_<\/i><\/code> for something slow or external (a DB, an API, email, the clock), consider passing it in instead.<\/div>", "quiz": [["Why is <code>datetime.now()<\/code> inside business logic a DIP smell?", "<p>The code depends on the real clock, so tests can't control time. Inject a <code>clock<\/code> function instead (e.g. <code>clock=datetime.now<\/code>).<\/p>"], ["What's the difference between Dependency Inversion and Dependency Injection?", "<p>Inversion is the principle (depend on abstractions); injection is the technique (pass dependencies in from outside).<\/p>"]], "exercises": [{"id": "dip-notifier", "title": "Inject the notifier", "statement": "<p><code>ExamResults<\/code> currently creates an <code>SmsSender<\/code> inside itself. Fix it:<\/p>\n<ul><li>Define a <code>Notifier<\/code> Protocol (or ABC) with <code>send(to, message)<\/code>.<\/li><li><code>ExamResults(notifier)<\/code> receives the notifier in <code><i>_init_<\/i><\/code>.<\/li><li><code>publish(student, phone, marks)<\/code> sends <code>\"&lt;student&gt; scored &lt;marks&gt;\"<\/code> to <code>phone<\/code> via the notifier, and returns <code>\"PASS\"<\/code> if marks ≥ 35, else <code>\"FAIL\"<\/code>.<\/li><li>Write a <code>FakeNotifier<\/code> that records every <code>(to, message)<\/code> in a list attribute <code>sent<\/code>, so tests need no real SMS.<\/li><\/ul>", "starter": "class SmsSender:\n    def send(self, to, message):\n        raise RuntimeError(\"would send a real SMS!\")\n\nclass ExamResults:\n    def __init__(self):\n        self.sms = SmsSender()            # hard-wired: fix this\n    def publish(self, student, phone, marks):\n        self.sms.send(phone, f\"{student} scored {marks}\")\n        return \"PASS\" if marks >= 35 else \"FAIL\"\n\nclass FakeNotifier:\n    pass\n", "solution": "from typing import Protocol\n\nclass Notifier(Protocol):\n    def send(self, to, message) -> None: ...\n\nclass SmsSender:\n    def send(self, to, message):\n        raise RuntimeError(\"would send a real SMS!\")\n\nclass ExamResults:\n    def __init__(self, notifier: Notifier):\n        self.notifier = notifier              # injected from outside\n    def publish(self, student, phone, marks):\n        self.notifier.send(phone, f\"{student} scored {marks}\")\n        return \"PASS\" if marks >= 35 else \"FAIL\"\n\nclass FakeNotifier:\n    def __init__(self):\n        self.sent = []\n    def send(self, to, message):\n        self.sent.append((to, message))\n", "tests": "\ndef _run():\n    fake = FakeNotifier()\n    r = ExamResults(fake)\n    return [r.publish(\"Asha\", \"999\", 82), r.publish(\"Ravi\", \"888\", 20), fake.sent]\nT(\"publish with a fake\", _run, [\"PASS\", \"FAIL\", [(\"999\", \"Asha scored 82\"), (\"888\", \"Ravi scored 20\")]])\ndef _no_sms():\n    import inspect\n    return \"SmsSender()\" not in inspect.getsource(ExamResults.__init__)\nC(\"ExamResults doesn't create SmsSender itself\", _no_sms, \"take the notifier as an __init__ parameter\")\n", "hints": ["Change <code><i>_init_<\/i>(self)<\/code> to <code><i>_init_<\/i>(self, notifier)<\/code>.", "FakeNotifier needs <code>self.sent = []<\/code> and a send() that appends."]}]}, {"id": "singleton", "part": "creational", "title": "Singleton", "tagline": "Only one principal for the whole school", "body": "<h4>The story<\/h4>\n<p>A school has <b>exactly one principal<\/b>. Whoever asks \"who's the principal?\" (teachers, students, parents) gets the <b>same person<\/b>. You'd never want two principals giving different orders!<\/p>\n<p><b>Singleton: make sure a class has only one object, and give everyone a single way to reach it.<\/b> Used for things like app settings, a logger, or a connection pool.<\/p>\n<h4>Classic version (override <code><i>_new_<\/i><\/code>)<\/h4>\n<pre><code>class Principal:\n    _instance = None\n    def __new__(cls, *args, **kwargs):\n        if cls._instance is None:                 # first time only\n            cls._instance = super().__new__(cls)\n        return cls._instance                      # always the same object\n\na = Principal(); b = Principal()\nprint(a is b)        # True: the same object<\/code><\/pre>\n<p>(<code><i>_new_<\/i><\/code> creates the object; <code><i>_init_<\/i><\/code> fills it. Remember from OOP chapter 11: <code><i>_init_<\/i><\/code> still runs on every <code>Principal()<\/code> call, so don't reset data there.)<\/p>\n<h4>Thread-safe version (when several threads may create it at once)<\/h4>\n<pre><code>import threading\nclass Config:\n    _instance, _lock = None, threading.Lock()\n    def __new__(cls):\n        if cls._instance is None:\n            with cls._lock:                       # only one thread at a time\n                if cls._instance is None:         # check again inside the lock\n                    cls._instance = super().__new__(cls)\n                    cls._instance.settings = {}\n        return cls._instance<\/code><\/pre>\n<h4>🐍 The Pythonic shortcut: just use a module!<\/h4>\n<p>A Python module is imported <b>only once<\/b>, so any object created inside it is automatically a singleton:<\/p>\n<pre><code># config.py\nsettings = {\"theme\": \"dark\"}\n# anywhere else:\nfrom config import settings     # everyone gets the SAME dict<\/code><\/pre>\n<h4>⚠ When NOT to use it<\/h4>\n<p>Singletons are <b>global variables in disguise<\/b>. They make testing hard (tests share state) and hide dependencies. Often the better choice is to create <b>one object<\/b> in <code>main()<\/code> and <b>pass it in<\/b> (dependency injection, from the DIP lesson).<\/p>", "quiz": [["Why does <code><i>_init_<\/i><\/code> need care in a <code><i>_new_<\/i><\/code>-based singleton?", "<p><code><i>_init_<\/i><\/code> runs on every <code>Class()<\/code> call even though the same object comes back, so it could reset the data. Initialize once inside <code><i>_new_<\/i><\/code>, or guard <code><i>_init_<\/i><\/code>.<\/p>"], ["What's the simplest singleton in Python?", "<p>A module-level object. Modules are imported once and cached in <code>sys.modules<\/code>.<\/p>"]], "exercises": [{"id": "singleton-counter", "title": "A visitor counter that exists only once", "statement": "<p>Make <code>VisitorCounter<\/code> a singleton. Every <code>VisitorCounter()<\/code> call returns the <b>same<\/b> object. It has <code>visit()<\/code>, which increases <code>count<\/code> by 1, and the <code>count<\/code> attribute <b>must not reset<\/b> when <code>VisitorCounter()<\/code> is called again.<\/p>", "starter": "class VisitorCounter:\n    def __init__(self):\n        self.count = 0          # careful: this would reset every time!\n    def visit(self):\n        self.count += 1\n", "solution": "class VisitorCounter:\n    _instance = None\n    def __new__(cls):\n        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n            cls._instance.count = 0           # initialize ONCE, here\n        return cls._instance\n    def visit(self):\n        self.count += 1\n", "tests": "\nVisitorCounter._instance = None if hasattr(VisitorCounter, \"_instance\") else None\nC(\"same object every time\", lambda: VisitorCounter() is VisitorCounter())\ndef _count():\n    a = VisitorCounter(); start = a.count\n    a.visit(); VisitorCounter().visit(); VisitorCounter().visit()\n    return VisitorCounter().count - start\nT(\"count doesn't reset\", _count, 3)\n", "hints": ["Override <i>_new_<\/i> and store the single object in a class attribute.", "Set count = 0 inside <i>_new_<\/i> (only the first time), not in <i>_init_<\/i>."]}]}, {"id": "factory", "part": "creational", "title": "Factory (Simple Factory & Factory Method)", "tagline": "Order by name; the factory builds it", "body": "<h4>The story<\/h4>\n<p>At a pizza shop you just say <b>\"one Margherita\"<\/b>. You don't go into the kitchen and decide how to knead the dough. The <b>kitchen (the factory)<\/b> knows how to make each pizza. If the shop adds a new pizza, <b>your way of ordering doesn't change<\/b>.<\/p>\n<p><b>Factory: put the \"which class do I create, and how?\" decision in one place<\/b>, so the rest of the code just asks for what it wants.<\/p>\n<h4>The messy code<\/h4>\n<pre><code># scattered all over the app:\nif kind == \"email\": n = EmailNotifier(smtp_host, port)\nelif kind == \"sms\": n = SmsNotifier(api_key)<\/code><\/pre>\n<p>Every place that creates notifiers repeats this logic. Adding \"push notifications\" means hunting down every copy.<\/p>\n<h4>Simple factory (the version you'll use most)<\/h4>\n<pre><code>class EmailNotifier:\n    def send(self, msg): return f\"email: {msg}\"\nclass SmsNotifier:\n    def send(self, msg): return f\"sms: {msg}\"\n\nclass NotifierFactory:\n    _registry = {\"email\": EmailNotifier, \"sms\": SmsNotifier}\n\n    @classmethod\n    def register(cls, name):                    # new kinds plug themselves in (OCP!)\n        def deco(klass):\n            cls._registry[name] = klass\n            return klass\n        return deco\n\n    @classmethod\n    def create(cls, name):\n        if name not in cls._registry:\n            raise ValueError(f\"unknown notifier: {name}\")\n        return cls._registry[name]()\n\n@NotifierFactory.register(\"push\")\nclass PushNotifier:\n    def send(self, msg): return f\"push: {msg}\"\n\nNotifierFactory.create(\"push\").send(\"hi\")      # 'push: hi'<\/code><\/pre>\n<h4>Factory <b>Method<\/b> (the GoF version)<\/h4>\n<p>A parent class defines the steps but lets <b>subclasses decide which object to create<\/b>:<\/p>\n<pre><code>class Dialog:\n    def render(self):\n        button = self.create_button()          # the \"factory method\"\n        return f\"[{button.draw()}]\"\n    def create_button(self):                   # subclasses override this\n        raise NotImplementedError\n\nclass WindowsDialog(Dialog):\n    def create_button(self): return WindowsButton()\nclass WebDialog(Dialog):\n    def create_button(self): return HtmlButton()<\/code><\/pre>\n<h4>🐍 Pythonic shortcuts<\/h4>\n<ul><li><b>Classes are objects<\/b> in Python, so a plain dict <code>{\"email\": EmailNotifier}<\/code> is already a factory.<\/li><li><code>@classmethod<\/code> <b>alternative constructors<\/b> are tiny factories: <code>date.fromisoformat(\"2026-01-01\")<\/code>, <code>dict.fromkeys(...)<\/code>.<\/li><\/ul>", "quiz": [["What problem does a factory solve?", "<p>Creation logic (which class, which arguments) lives in one place, so callers don't repeat or know it, and adding a new type touches only the factory.<\/p>"], ["Name a factory method in Python's standard library.", "<p><code>datetime.fromtimestamp()<\/code>, <code>date.fromisoformat()<\/code>, <code>int.from_bytes()<\/code>, <code>dict.fromkeys()<\/code>. These are classmethod alternative constructors.<\/p>"]], "exercises": [{"id": "factory-shapes", "title": "A shape factory with registration", "statement": "<p>Build <code>ShapeFactory<\/code> with:<\/p>\n<ul><li><code>ShapeFactory.register(name)<\/code>, a <b>decorator<\/b> that adds a class to the registry,<\/li><li><code>ShapeFactory.create(name, *args)<\/code>, which returns an instance, or raises <code>ValueError<\/code> for unknown names.<\/li><\/ul>\n<p>Register <code>Square(side)<\/code> as <code>\"square\"<\/code> (area = side²) and <code>Rect(w, h)<\/code> as <code>\"rect\"<\/code> (area = w·h), using the decorator.<\/p>", "starter": "class ShapeFactory:\n    _registry = {}\n\n    @classmethod\n    def register(cls, name):\n        pass\n\n    @classmethod\n    def create(cls, name, *args):\n        pass\n\n# use @ShapeFactory.register(\"square\") on these:\nclass Square:\n    def __init__(self, side): self.side = side\n    def area(self): return self.side ** 2\n\nclass Rect:\n    def __init__(self, w, h): self.w, self.h = w, h\n    def area(self): return self.w * self.h\n", "solution": "class ShapeFactory:\n    _registry = {}\n\n    @classmethod\n    def register(cls, name):\n        def deco(klass):\n            cls._registry[name] = klass\n            return klass                 # return the class unchanged\n        return deco\n\n    @classmethod\n    def create(cls, name, *args):\n        if name not in cls._registry:\n            raise ValueError(f\"unknown shape: {name}\")\n        return cls._registry[name](*args)\n\n@ShapeFactory.register(\"square\")\nclass Square:\n    def __init__(self, side): self.side = side\n    def area(self): return self.side ** 2\n\n@ShapeFactory.register(\"rect\")\nclass Rect:\n    def __init__(self, w, h): self.w, self.h = w, h\n    def area(self): return self.w * self.h\n", "tests": "\nT(\"square\", lambda: ShapeFactory.create(\"square\", 3).area(), 9)\nT(\"rect\", lambda: ShapeFactory.create(\"rect\", 2, 5).area(), 10)\nC(\"returns real instances\", lambda: isinstance(ShapeFactory.create(\"square\", 1), Square))\ndef _unknown():\n    try:\n        ShapeFactory.create(\"hexagon\"); return False\n    except ValueError:\n        return True\nC(\"unknown name raises ValueError\", _unknown)\ndef _later():\n    @ShapeFactory.register(\"tri\")\n    class Tri:\n        def __init__(self, b, h): self.b, self.h = b, h\n        def area(self): return self.b * self.h / 2\n    return ShapeFactory.create(\"tri\", 4, 3).area()\nT(\"new shapes plug in later\", _later, 6.0)\n", "hints": ["register returns a decorator function: def deco(klass): ...; return klass.", "create looks the class up in the dict and calls it with *args."]}]}, {"id": "abstract-factory", "part": "creational", "title": "Abstract Factory", "tagline": "A matching uniform set: never mix and match by accident", "body": "<h4>The story<\/h4>\n<p>Your school has a <b>summer uniform set<\/b> (half shirt, shorts, cap) and a <b>winter uniform set<\/b> (full shirt, trousers, sweater). You'd look silly mixing a sweater with shorts. The uniform shop gives you a <b>whole matching set<\/b> at once.<\/p>\n<p><b>Abstract Factory: an interface for creating *families* of related objects that belong together<\/b>, without naming their exact classes.<\/p>\n<h4>Example: light and dark themes<\/h4>\n<pre><code>from abc import ABC, abstractmethod\n\nclass Button(ABC):\n    @abstractmethod\n    def draw(self): ...\nclass Checkbox(ABC):\n    @abstractmethod\n    def draw(self): ...\n\nclass LightButton(Button):\n    def draw(self): return \"⬜ button\"\nclass DarkButton(Button):\n    def draw(self): return \"⬛ button\"\nclass LightCheckbox(Checkbox):\n    def draw(self): return \"☐ light\"\nclass DarkCheckbox(Checkbox):\n    def draw(self): return \"☑ dark\"\n\nclass ThemeFactory(ABC):                 # the abstract factory\n    @abstractmethod\n    def button(self) -&gt; Button: ...\n    @abstractmethod\n    def checkbox(self) -&gt; Checkbox: ...\n\nclass LightTheme(ThemeFactory):\n    def button(self): return LightButton()\n    def checkbox(self): return LightCheckbox()\n\nclass DarkTheme(ThemeFactory):\n    def button(self): return DarkButton()\n    def checkbox(self): return DarkCheckbox()\n\ndef build_settings_page(theme: ThemeFactory):\n    return [theme.button().draw(), theme.checkbox().draw()]   # always a matching pair<\/code><\/pre>\n<h4>Factory vs Abstract Factory<\/h4>\n<table><tr><th><\/th><th>Factory<\/th><th>Abstract Factory<\/th><\/tr><tr><td>creates<\/td><td><b>one<\/b> product<\/td><td>a <b>family<\/b> of products<\/td><\/tr><tr><td>example<\/td><td>\"give me a notifier\"<\/td><td>\"give me a whole matching UI theme\"<\/td><\/tr><\/table>\n<p>Real-world uses: UI themes, database drivers (connection + cursor + dialect), cloud providers (AWS storage + AWS queue vs GCP storage + GCP queue).<\/p>", "quiz": [["When do you need an Abstract Factory instead of a simple factory?", "<p>When several created objects <b>must match each other<\/b> (a family): theme widgets, or provider-specific clients that must come from the same provider.<\/p>"]], "exercises": [{"id": "af-furniture", "title": "Furniture families", "statement": "<p>A furniture shop sells <b>Modern<\/b> and <b>Victorian<\/b> sets. Create:<\/p>\n<ul><li>products <code>ModernChair<\/code>, <code>ModernTable<\/code>, <code>VictorianChair<\/code>, <code>VictorianTable<\/code>, each with <code>describe()<\/code> returning <code>\"modern chair\"<\/code>, <code>\"modern table\"<\/code>, <code>\"victorian chair\"<\/code>, <code>\"victorian table\"<\/code>,<\/li><li>an abstract <code>FurnitureFactory<\/code> with <code>make_chair()<\/code> and <code>make_table()<\/code>,<\/li><li><code>ModernFactory<\/code> and <code>VictorianFactory<\/code>.<\/li><\/ul>\n<p><code>furnish_room(factory)<\/code> returns <code>[chair.describe(), table.describe()]<\/code>.<\/p>", "starter": "from abc import ABC, abstractmethod\n\nclass FurnitureFactory(ABC):\n    pass\n\ndef furnish_room(factory):\n    pass\n", "solution": "from abc import ABC, abstractmethod\n\nclass ModernChair:\n    def describe(self): return \"modern chair\"\nclass ModernTable:\n    def describe(self): return \"modern table\"\nclass VictorianChair:\n    def describe(self): return \"victorian chair\"\nclass VictorianTable:\n    def describe(self): return \"victorian table\"\n\nclass FurnitureFactory(ABC):\n    @abstractmethod\n    def make_chair(self): ...\n    @abstractmethod\n    def make_table(self): ...\n\nclass ModernFactory(FurnitureFactory):\n    def make_chair(self): return ModernChair()\n    def make_table(self): return ModernTable()\n\nclass VictorianFactory(FurnitureFactory):\n    def make_chair(self): return VictorianChair()\n    def make_table(self): return VictorianTable()\n\ndef furnish_room(factory):\n    return [factory.make_chair().describe(), factory.make_table().describe()]\n", "tests": "\nT(\"modern set\", lambda: furnish_room(ModernFactory()), [\"modern chair\", \"modern table\"])\nT(\"victorian set\", lambda: furnish_room(VictorianFactory()), [\"victorian chair\", \"victorian table\"])\nC(\"factories share the abstract base\", lambda: issubclass(ModernFactory, FurnitureFactory) and issubclass(VictorianFactory, FurnitureFactory))\ndef _abstract():\n    try:\n        FurnitureFactory(); return False\n    except TypeError:\n        return True\nC(\"FurnitureFactory is abstract\", _abstract)\n", "hints": ["Write the 4 product classes first.", "Each concrete factory returns its own family's chair and table."]}]}, {"id": "builder", "part": "creational", "title": "Builder", "tagline": "Build a burger step by step", "body": "<h4>The story<\/h4>\n<p>At a burger counter, you build your order <b>step by step<\/b>: bun → patty → cheese? → onions? → sauce. Some steps are optional, and the order is checked at the end (\"you can't have a burger with no patty!\"). Then they hand you the <b>finished<\/b> burger.<\/p>\n<p><b>Builder: construct a complex object step by step, then produce the final (often immutable) result with <code>build()<\/code><\/b>, which validates everything once.<\/p>\n<h4>The problem: the \"telescoping constructor\"<\/h4>\n<pre><code>Burger(\"sesame\", \"veg\", True, False, True, \"mayo\", 2, False)   # what does True mean?? 😵<\/code><\/pre>\n<h4>The builder<\/h4>\n<pre><code>from dataclasses import dataclass\n\n@dataclass(frozen=True)                  # the finished product can't be changed\nclass Burger:\n    bun: str\n    patty: str\n    toppings: tuple\n    sauce: str\n\nclass BurgerBuilder:\n    def __init__(self):\n        self._bun, self._patty, self._toppings, self._sauce = \"plain\", None, [], \"none\"\n    def bun(self, kind):\n        self._bun = kind\n        return self                      # returning self allows chaining\n    def patty(self, kind):\n        self._patty = kind\n        return self\n    def add(self, topping):\n        self._toppings.append(topping)\n        return self\n    def sauce(self, kind):\n        self._sauce = kind\n        return self\n    def build(self):\n        if self._patty is None:\n            raise ValueError(\"a burger needs a patty!\")   # validation in ONE place\n        return Burger(self._bun, self._patty, tuple(self._toppings), self._sauce)\n\nburger = BurgerBuilder().bun(\"sesame\").patty(\"veg\").add(\"cheese\").add(\"onion\").sauce(\"mayo\").build()<\/code><\/pre>\n<p>This style of chaining calls is called a <b>fluent interface<\/b> (SQLAlchemy queries and pandas method chains work this way).<\/p>\n<h4>🐍 Pythonic shortcut<\/h4>\n<p>Python has <b>keyword arguments with defaults<\/b>, which solve most telescoping problems on their own:<\/p>\n<pre><code>Burger(bun=\"sesame\", patty=\"veg\", toppings=(\"cheese\",), sauce=\"mayo\")<\/code><\/pre>\n<p>Use a real Builder when: construction happens <b>in steps over time<\/b>, <b>validation spans several fields<\/b>, or the same steps can produce <b>different results<\/b> (an SQL string vs a MongoDB query).<\/p>", "quiz": [["Why does each builder method <code>return self<\/code>?", "<p>So calls can be chained: <code>b.bun(...).patty(...).build()<\/code>, a fluent interface.<\/p>"], ["When are plain keyword arguments enough?", "<p>When the object is created in one go and validation is simple. Python's kwargs already fix 'what does True mean?'.<\/p>"]], "exercises": [{"id": "builder-query", "title": "An SQL query builder", "statement": "<p>Write <code>QueryBuilder(table)<\/code> with chainable methods:<\/p>\n<ul><li><code>select(*cols)<\/code> (default <code>*<\/code> if never called),<\/li><li><code>where(condition)<\/code> (can be called several times; conditions are joined with <code> AND <\/code>),<\/li><li><code>order_by(col)<\/code>,<\/li><li><code>limit(n)<\/code>,<\/li><\/ul>\n<p>and <code>build()<\/code> returning a string like: <code>SELECT name, age FROM students WHERE age &gt; 10 AND class = 5 ORDER BY name LIMIT 3<\/code> Leave out the parts that weren't set. <code>limit<\/code> must raise <code>ValueError<\/code> if n ≤ 0.<\/p>", "starter": "class QueryBuilder:\n    def __init__(self, table):\n        self.table = table\n\n    def build(self):\n        pass\n", "solution": "class QueryBuilder:\n    def __init__(self, table):\n        self.table = table\n        self._cols, self._where, self._order, self._limit = [\"*\"], [], None, None\n\n    def select(self, *cols):\n        self._cols = list(cols)\n        return self\n\n    def where(self, condition):\n        self._where.append(condition)\n        return self\n\n    def order_by(self, col):\n        self._order = col\n        return self\n\n    def limit(self, n):\n        if n <= 0:\n            raise ValueError(\"limit must be positive\")\n        self._limit = n\n        return self\n\n    def build(self):\n        parts = [f\"SELECT {', '.join(self._cols)} FROM {self.table}\"]\n        if self._where:\n            parts.append(\"WHERE \" + \" AND \".join(self._where))\n        if self._order:\n            parts.append(f\"ORDER BY {self._order}\")\n        if self._limit:\n            parts.append(f\"LIMIT {self._limit}\")\n        return \" \".join(parts)\n", "tests": "\nT(\"full query\", lambda: QueryBuilder(\"students\").select(\"name\", \"age\").where(\"age > 10\").where(\"class = 5\").order_by(\"name\").limit(3).build(),\n  \"SELECT name, age FROM students WHERE age > 10 AND class = 5 ORDER BY name LIMIT 3\")\nT(\"defaults\", lambda: QueryBuilder(\"books\").build(), \"SELECT * FROM books\")\nT(\"only where\", lambda: QueryBuilder(\"t\").where(\"x = 1\").build(), \"SELECT * FROM t WHERE x = 1\")\ndef _bad():\n    try:\n        QueryBuilder(\"t\").limit(0); return False\n    except ValueError:\n        return True\nC(\"limit(0) raises ValueError\", _bad)\nC(\"methods chain (return self)\", lambda: isinstance(QueryBuilder(\"t\").select(\"a\").where(\"b\"), QueryBuilder))\n", "hints": ["Store each part in an attribute; every method returns self.", "In build(), add each part to a list only if it was set, then join with spaces."]}]}, {"id": "prototype", "part": "creational", "title": "Prototype", "tagline": "Photocopy instead of starting from scratch", "body": "<h4>The story<\/h4>\n<p>Your teacher makes <b>one perfect worksheet<\/b> and then <b>photocopies<\/b> it for 40 students, instead of writing 40 by hand. Each student can then fill in their own copy without affecting the others.<\/p>\n<p><b>Prototype: create new objects by copying (cloning) an existing, already-set-up object.<\/b> It's useful when setting an object up is expensive or complicated (loading settings, a big configuration, a game character with many stats).<\/p>\n<h4>In Python: the <code>copy<\/code> module<\/h4>\n<pre><code>import copy\n\nclass Character:\n    def __init__(self, name, level, skills):\n        self.name, self.level, self.skills = name, level, skills\n    def clone(self, **changes):\n        new = copy.deepcopy(self)        # a full independent copy (inner lists copied too)\n        new.__dict__.update(changes)     # tweak a few fields\n        return new\n\nwarrior = Character(\"Template\", 10, [\"sword\", \"shield\"])\nasha = warrior.clone(name=\"Asha\")\nasha.skills.append(\"bow\")                # doesn't affect warrior: deep copy!<\/code><\/pre>\n<h4>⚠ Shallow vs deep copy (the classic bug)<\/h4>\n<pre><code>shallow = copy.copy(warrior)      # NEW object, but the SAME skills list inside\nshallow.skills.append(\"magic\")    # oops, warrior.skills changed too!<\/code><\/pre>\n<ul><li><code>copy.copy<\/code> (shallow): copies the outer object; inner lists and dicts are <b>shared<\/b>.<\/li><li><code>copy.deepcopy<\/code>: copies everything, all the way down.<\/li><\/ul>\n<h4>A prototype registry<\/h4>\n<p>Keep ready-made templates in a dict and clone them on request:<\/p>\n<pre><code>TEMPLATES = {\"warrior\": warrior, \"mage\": Character(\"Template\", 8, [\"fireball\"])}\nhero = TEMPLATES[\"mage\"].clone(name=\"Ravi\")<\/code><\/pre>\n<p>🐍 For dataclasses, <code>dataclasses.replace(obj, name=\"Ravi\")<\/code> (or <code>copy.replace<\/code> in 3.13) is a built-in shallow \"clone with changes\".<\/p>", "quiz": [["Shallow copy of an object containing a list, then you append to the copy's list. What happens to the original?", "<p>The original's list changes too, because a shallow copy shares inner objects. Use <code>copy.deepcopy<\/code>.<\/p>"]], "exercises": [{"id": "prototype-docs", "title": "Document templates", "statement": "<p>Write <code>Document(title, sections)<\/code> (sections is a list of strings) with <code>clone(<b>changes)<\/code>, which returns a <\/b>deep** copy with optional field changes.<\/p>\n<p>Then write a <code>TemplateRegistry<\/code> with <code>add(name, doc)<\/code> and <code>create(name, <b>changes)<\/code>, which returns a fresh clone of the stored template. Raise <code>KeyError<\/code> for unknown names. Changing a clone must <\/b>never** change the template.<\/p>", "starter": "import copy\n\nclass Document:\n    def __init__(self, title, sections):\n        self.title, self.sections = title, sections\n    def clone(self, **changes):\n        pass\n\nclass TemplateRegistry:\n    pass\n", "solution": "import copy\n\nclass Document:\n    def __init__(self, title, sections):\n        self.title, self.sections = title, sections\n    def clone(self, **changes):\n        new = copy.deepcopy(self)\n        new.__dict__.update(changes)\n        return new\n\nclass TemplateRegistry:\n    def __init__(self):\n        self._templates = {}\n    def add(self, name, doc):\n        self._templates[name] = doc\n    def create(self, name, **changes):\n        return self._templates[name].clone(**changes)     # KeyError if unknown\n", "tests": "\ndef _run():\n    reg = TemplateRegistry()\n    reg.add(\"report\", Document(\"Report\", [\"Intro\", \"Results\"]))\n    a = reg.create(\"report\", title=\"Science Report\")\n    a.sections.append(\"Conclusion\")\n    b = reg.create(\"report\")\n    return [a.title, a.sections, b.title, b.sections]\nT(\"clones are independent\", _run, [\"Science Report\", [\"Intro\", \"Results\", \"Conclusion\"], \"Report\", [\"Intro\", \"Results\"]])\ndef _missing():\n    try:\n        TemplateRegistry().create(\"nope\"); return False\n    except KeyError:\n        return True\nC(\"unknown template raises KeyError\", _missing)\ndef _deep():\n    d = Document(\"x\", [[\"nested\"]]); c = d.clone(); c.sections[0].append(\"y\"); return d.sections == [[\"nested\"]]\nC(\"deep copy (nested lists too)\", _deep)\n", "hints": ["Use copy.deepcopy(self), then update <i>_dict_<\/i> with the changes.", "The registry stores templates in a dict and calls .clone(**changes)."]}]}, {"id": "adapter", "part": "structural", "title": "Adapter", "tagline": "A travel plug adapter for code", "body": "<h4>The story<\/h4>\n<p>You travel to the UK with your Indian phone charger. The UK sockets have a <b>different shape<\/b>! You don't rebuild your charger or the wall. You buy a small <b>travel adapter<\/b> that fits both.<\/p>\n<p><b>Adapter: wrap an object with an incompatible interface so it looks like the interface your code expects.<\/b> It's very common when using <b>third-party libraries<\/b> or <b>old code<\/b> you can't change.<\/p>\n<h4>Example: two payment companies with different APIs<\/h4>\n<pre><code>from typing import Protocol\n\nclass PaymentGateway(Protocol):            # what OUR app expects\n    def pay(self, amount_rupees: float) -&gt; str: ...\n\nclass PayFastSDK:                          # third-party library 1 (can't change it)\n    def make_payment(self, paise: int) -&gt; dict:\n        return {\"status\": \"ok\", \"ref\": f\"PF-{paise}\"}\n\nclass OldBankAPI:                          # third-party library 2 (completely different)\n    def transfer(self, amount, currency=\"INR\") -&gt; str:\n        return f\"BANK-{amount}-{currency}\"\n\nclass PayFastAdapter:                      # makes PayFast look like PaymentGateway\n    def __init__(self, sdk: PayFastSDK):\n        self.sdk = sdk\n    def pay(self, amount_rupees):\n        result = self.sdk.make_payment(int(amount_rupees * 100))   # convert rupees to paise\n        return result[\"ref\"]\n\nclass OldBankAdapter:\n    def __init__(self, api: OldBankAPI):\n        self.api = api\n    def pay(self, amount_rupees):\n        return self.api.transfer(amount_rupees)\n\ndef checkout(gateway: PaymentGateway, total):\n    return gateway.pay(total)               # works with either; it never sees the SDKs\n\ncheckout(PayFastAdapter(PayFastSDK()), 99.5)     # 'PF-9950'<\/code><\/pre>\n<pre class=\"plain\"> Your code ──calls──► pay()  [Adapter]  ──translates──► make_payment(paise)  [3rd-party SDK]<\/pre>\n<h4>Why it's great<\/h4>\n<ul><li>Your app depends on <b>your own interface<\/b>, not on the library's (DIP again!).<\/li><li>Switching providers means writing <b>one new adapter<\/b>.<\/li><li>In tests, you can use a fake gateway.<\/li><\/ul>", "quiz": [["You switch from one SMS provider to another with a different API. What changes if you used an Adapter?", "<p>Only the adapter class (write a new one). The rest of the app keeps calling your own <code>send()<\/code> interface.<\/p>"], ["Adapter vs Decorator?", "<p>An Adapter <b>changes the interface<\/b> to fit. A Decorator <b>keeps the same interface<\/b> and adds behaviour.<\/p>"]], "exercises": [{"id": "adapter-temps", "title": "Adapt a Fahrenheit sensor", "statement": "<p>Your weather app expects sensors with <code>celsius()<\/code> (returning a float rounded to 1 decimal place). A company gives you <code>FahrenheitSensor<\/code> with a <code>read_f()<\/code> method, which you <b>can't<\/b> modify. Write <code>FahrenheitAdapter(sensor)<\/code> so it works with <code>average_temp(sensors)<\/code>, which is already written.<\/p>\n<p>C = (F − 32) × 5 / 9.<\/p>", "starter": "class CelsiusSensor:\n    def __init__(self, c): self.c = c\n    def celsius(self): return self.c\n\nclass FahrenheitSensor:          # third-party: don't change\n    def __init__(self, f): self.f = f\n    def read_f(self): return self.f\n\ndef average_temp(sensors):\n    return round(sum(s.celsius() for s in sensors) / len(sensors), 1)\n\nclass FahrenheitAdapter:\n    pass\n", "solution": "class CelsiusSensor:\n    def __init__(self, c): self.c = c\n    def celsius(self): return self.c\n\nclass FahrenheitSensor:\n    def __init__(self, f): self.f = f\n    def read_f(self): return self.f\n\ndef average_temp(sensors):\n    return round(sum(s.celsius() for s in sensors) / len(sensors), 1)\n\nclass FahrenheitAdapter:\n    def __init__(self, sensor):\n        self.sensor = sensor                  # wrap the incompatible object\n    def celsius(self):\n        return round((self.sensor.read_f() - 32) * 5 / 9, 1)   # translate\n", "tests": "\nT(\"boiling point\", lambda: FahrenheitAdapter(FahrenheitSensor(212)).celsius(), 100.0)\nT(\"mixed sensors\", lambda: average_temp([CelsiusSensor(20), FahrenheitAdapter(FahrenheitSensor(86))]), 25.0)\nC(\"FahrenheitSensor not modified\", lambda: not hasattr(FahrenheitSensor, \"celsius\"), \"don't add celsius() to the third-party class\")\n", "hints": ["Store the wrapped sensor in <i>_init_<\/i>.", "celsius() calls sensor.read_f() and converts the result."]}]}, {"id": "decorator", "part": "structural", "title": "Decorator", "tagline": "Toppings on a pizza", "body": "<h4>The story<\/h4>\n<p>Start with a <b>plain pizza<\/b> (₹200). Add cheese (+₹40), then olives (+₹30), then jalapeños (+₹25). Each topping <b>wraps<\/b> the pizza and adds a little to the price and the description. It's still \"a pizza\" at every step, so you can keep adding.<\/p>\n<p><b>Decorator: wrap an object in another object with the same interface, adding behaviour before or after delegating to the inner one.<\/b> You can stack wrappers in any combination, so you don't need a class for every combination (<code>CheeseOlivePizza<\/code>, <code>CheeseJalapenoPizza<\/code>… would explode!).<\/p>\n<h4>The object decorator (GoF style)<\/h4>\n<pre><code>class Pizza:\n    def cost(self): return 200\n    def name(self): return \"pizza\"\n\nclass Topping:                                # base decorator: same interface as Pizza\n    def __init__(self, inner):\n        self.inner = inner\n    def cost(self): return self.inner.cost()\n    def name(self): return self.inner.name()\n\nclass Cheese(Topping):\n    def cost(self): return self.inner.cost() + 40\n    def name(self): return self.inner.name() + \" + cheese\"\n\nclass Olives(Topping):\n    def cost(self): return self.inner.cost() + 30\n    def name(self): return self.inner.name() + \" + olives\"\n\norder = Olives(Cheese(Pizza()))\nprint(order.name(), order.cost())             # pizza + cheese + olives 270<\/code><\/pre>\n<pre class=\"plain\"> Olives ──wraps──► Cheese ──wraps──► Pizza\n cost() = 30 +    ( 40 +            200 )<\/pre>\n<h4>Python's <code>@decorator<\/code> syntax: the same idea for functions<\/h4>\n<pre><code>import functools, time\n\ndef timed(func):\n    @functools.wraps(func)                 # keep the original name and docstring\n    def wrapper(*args, **kwargs):\n        start = time.perf_counter()\n        result = func(*args, **kwargs)     # call the wrapped function\n        print(f\"{func.__name__} took {time.perf_counter() - start:.4f}s\")\n        return result\n    return wrapper\n\n@timed                                     # same as: slow_add = timed(slow_add)\ndef slow_add(a, b):\n    return a + b<\/code><\/pre>\n<p>Real-world uses: logging, caching (<code>@functools.cache<\/code>), retries, auth checks (<code>@login_required<\/code> in Django), web routes (<code>@app.get(\"/\")<\/code>).<\/p>", "quiz": [["Why are decorators better than subclasses for pizza toppings?", "<p>Subclasses would need one class per <b>combination<\/b> (which explodes quickly). Decorators combine freely at runtime: <code>Olives(Cheese(Pizza()))<\/code>.<\/p>"], ["What does <code>@functools.wraps<\/code> do?", "<p>It copies the wrapped function's name, docstring and other metadata to the wrapper, so debugging and documentation still show the real function.<\/p>"]], "exercises": [{"id": "decorator-coffee", "title": "Coffee with add-ons", "statement": "<p><code>Coffee<\/code> has <code>cost()<\/code> = 50 and <code>describe()<\/code> = <code>\"coffee\"<\/code>. Write decorators:<\/p>\n<ul><li><code>Milk<\/code> (+10, <code>\" + milk\"<\/code>), <code>Sugar<\/code> (+5, <code>\" + sugar\"<\/code>), <code>ExtraShot<\/code> (+25, <code>\" + extra shot\"<\/code>),<\/li><\/ul>\n<p>so that <code>Sugar(Milk(Coffee()))<\/code> gives cost 65 and describes as <code>\"coffee + milk + sugar\"<\/code>. Decorators must stack in <b>any<\/b> order and <b>any<\/b> number of times.<\/p>", "starter": "class Coffee:\n    def cost(self): return 50\n    def describe(self): return \"coffee\"\n\nclass AddOn:\n    pass\n", "solution": "class Coffee:\n    def cost(self): return 50\n    def describe(self): return \"coffee\"\n\nclass AddOn:                                 # base decorator: wraps any beverage\n    price, label = 0, \"\"\n    def __init__(self, inner):\n        self.inner = inner\n    def cost(self):\n        return self.inner.cost() + self.price\n    def describe(self):\n        return f\"{self.inner.describe()} + {self.label}\"\n\nclass Milk(AddOn):\n    price, label = 10, \"milk\"\nclass Sugar(AddOn):\n    price, label = 5, \"sugar\"\nclass ExtraShot(AddOn):\n    price, label = 25, \"extra shot\"\n", "tests": "\nT(\"milk + sugar\", lambda: (Sugar(Milk(Coffee())).cost(), Sugar(Milk(Coffee())).describe()), (65, \"coffee + milk + sugar\"))\nT(\"double shot\", lambda: ExtraShot(ExtraShot(Coffee())).cost(), 100)\nT(\"order matters for description\", lambda: Milk(Sugar(Coffee())).describe(), \"coffee + sugar + milk\")\nT(\"plain\", lambda: Coffee().cost(), 50)\n", "hints": ["A base AddOn stores <code>inner<\/code> and delegates to it.", "Each add-on adds its price to inner.cost() and its label to inner.describe()."]}, {"id": "decorator-retry", "title": "Function decorator: @count_calls", "statement": "<p>Write a function decorator <code>count_calls<\/code> that counts how many times the decorated function is called, stored as an attribute <code>calls<\/code> on the wrapper. It must preserve the function's <code><i>_name_<\/i><\/code> (use <code>functools.wraps<\/code>) and pass all arguments through.<\/p>", "starter": "import functools\n\ndef count_calls(func):\n    pass\n\n@count_calls\ndef greet(name, punctuation=\"!\"):\n    return f\"hi {name}{punctuation}\"\n", "solution": "import functools\n\ndef count_calls(func):\n    @functools.wraps(func)\n    def wrapper(*args, **kwargs):\n        wrapper.calls += 1\n        return func(*args, **kwargs)\n    wrapper.calls = 0\n    return wrapper\n\n@count_calls\ndef greet(name, punctuation=\"!\"):\n    return f\"hi {name}{punctuation}\"\n", "tests": "\ndef _run():\n    greet.calls = 0\n    a = greet(\"asha\"); b = greet(\"ravi\", punctuation=\"?\")\n    return [a, b, greet.calls]\nT(\"counts and passes args\", _run, [\"hi asha!\", \"hi ravi?\", 2])\nT(\"keeps the name\", lambda: greet.__name__, \"greet\")\n", "hints": ["Define wrapper(*args, **kwargs) inside, and increment wrapper.calls.", "Set wrapper.calls = 0 before returning wrapper."]}]}, {"id": "facade", "part": "structural", "title": "Facade", "tagline": "One reception desk instead of ten offices", "body": "<h4>The story<\/h4>\n<p>To get admission in a school you'd normally need the accounts office, the library card office, the uniform shop, the transport desk… Instead, a friendly <b>reception desk<\/b> says: <i>\"Give me the form, I'll handle everything.\"<\/i> The offices still exist, but you only talk to <b>one desk<\/b>.<\/p>\n<p><b>Facade: a simple front door to a complicated system.<\/b> It doesn't hide the subsystems from experts; it just gives normal users an easy path.<\/p>\n<pre><code>class Inventory:\n    def reserve(self, item): return f\"reserved {item}\"\nclass Payment:\n    def charge(self, amount): return f\"charged {amount}\"\nclass Shipping:\n    def schedule(self, item, address): return f\"shipping {item} to {address}\"\nclass Email:\n    def send(self, to, text): return f\"emailed {to}\"\n\nclass ShopFacade:                                   # the reception desk\n    def __init__(self):\n        self.inventory, self.payment = Inventory(), Payment()\n        self.shipping, self.email = Shipping(), Email()\n\n    def buy(self, item, amount, address, email):\n        return [\n            self.inventory.reserve(item),\n            self.payment.charge(amount),\n            self.shipping.schedule(item, address),\n            self.email.send(email, \"order placed\"),\n        ]\n\nShopFacade().buy(\"book\", 299, \"Pune\", \"asha@x.com\")   # one call does it all<\/code><\/pre>\n<h4>Real-world facades in Python<\/h4>\n<ul><li><code>requests.get(url)<\/code> is a facade over sockets, TLS, HTTP parsing, connection pools…<\/li><li><code>shutil.copytree<\/code> is a facade over many low-level file operations.<\/li><li>A \"service layer\" class in a web app (<code>OrderService.place_order(...)<\/code>) is usually a facade.<\/li><\/ul>\n<div class=\"note\"><b>Facade vs Adapter:<\/b> an Adapter makes <b>one<\/b> interface fit another. A Facade makes <b>many<\/b> things simple behind <b>one new<\/b> interface.<\/div>", "quiz": [["Does a Facade prevent using the subsystems directly?", "<p>No. It's a convenience entry point. Advanced code can still use the subsystems when needed.<\/p>"]], "exercises": [{"id": "facade-movie", "title": "Home theatre facade", "statement": "<p>Subsystems are given. Write <code>HomeTheater(projector, sound, lights)<\/code> with:<\/p>\n<ul><li><code>watch(movie)<\/code>: dims the lights to 10, turns on the projector, sets the sound volume to 20, and returns <code>\"Playing &lt;movie&gt;\"<\/code>,<\/li><li><code>end()<\/code>: turns off the projector, sets the lights to 100, and returns <code>\"Goodbye\"<\/code>.<\/li><\/ul>", "starter": "class Projector:\n    def __init__(self): self.on = False\n    def power(self, on): self.on = on\nclass Sound:\n    def __init__(self): self.volume = 0\n    def set_volume(self, v): self.volume = v\nclass Lights:\n    def __init__(self): self.level = 100\n    def dim(self, level): self.level = level\n\nclass HomeTheater:\n    pass\n", "solution": "class Projector:\n    def __init__(self): self.on = False\n    def power(self, on): self.on = on\nclass Sound:\n    def __init__(self): self.volume = 0\n    def set_volume(self, v): self.volume = v\nclass Lights:\n    def __init__(self): self.level = 100\n    def dim(self, level): self.level = level\n\nclass HomeTheater:\n    def __init__(self, projector, sound, lights):\n        self.projector, self.sound, self.lights = projector, sound, lights\n    def watch(self, movie):\n        self.lights.dim(10)\n        self.projector.power(True)\n        self.sound.set_volume(20)\n        return f\"Playing {movie}\"\n    def end(self):\n        self.projector.power(False)\n        self.lights.dim(100)\n        return \"Goodbye\"\n", "tests": "\ndef _run():\n    p, s, l = Projector(), Sound(), Lights()\n    ht = HomeTheater(p, s, l)\n    a = ht.watch(\"Inception\"); mid = (p.on, s.volume, l.level)\n    b = ht.end(); end = (p.on, l.level)\n    return [a, mid, b, end]\nT(\"one call controls everything\", _run, [\"Playing Inception\", (True, 20, 10), \"Goodbye\", (False, 100)])\nC(\"HomeTheater uses the given subsystems\", lambda: (lambda l: (HomeTheater(Projector(), Sound(), l).watch(\"x\"), l.level)[1] == 10)(Lights()))\n", "hints": ["Store the three subsystems, then call their methods in order inside watch() and end()."]}]}, {"id": "proxy", "part": "structural", "title": "Proxy", "tagline": "A stand-in that controls access", "body": "<h4>The story<\/h4>\n<p>A celebrity has a <b>manager<\/b>. You don't call the celebrity directly; the manager answers. The manager can <b>check<\/b> whether you're allowed (protection), <b>remember<\/b> common answers so the celebrity isn't disturbed (caching), or only call the celebrity when <b>really needed<\/b> (lazy loading). To you it feels like talking to the celebrity.<\/p>\n<p><b>Proxy: an object with the same interface as the real object that controls access to it.<\/b><\/p>\n<h4>Three common proxies<\/h4>\n<pre><code>class RealImage:\n    def __init__(self, path):\n        print(f\"loading {path} from disk…\")     # slow!\n        self.path = path\n    def show
