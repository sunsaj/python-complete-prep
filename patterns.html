(self):\n        return f\"showing {self.path}\"\n\nclass LazyImage:                                 # 1) VIRTUAL proxy: create only when first needed\n    def __init__(self, path):\n        self.path, self._real = path, None\n    def show(self):\n        if self._real is None:\n            self._real = RealImage(self.path)    # loaded on first use\n        return self._real.show()\n\nclass CachedWeather:                             # 2) CACHING proxy\n    def __init__(self, api):\n        self.api, self.cache = api, {}\n    def today(self, city):\n        if city not in self.cache:\n            self.cache[city] = self.api.today(city)   # call the slow API only once per city\n        return self.cache[city]\n\nclass ProtectedDocs:                             # 3) PROTECTION proxy\n    def __init__(self, docs, user_role):\n        self.docs, self.role = docs, user_role\n    def read(self, name):\n        if self.role != \"teacher\":\n            raise PermissionError(\"teachers only\")\n        return self.docs.read(name)<\/code><\/pre>\n<p><b>Proxy vs Decorator:<\/b> they're built the same way (both wrap). The difference is intent. A <b>proxy controls access<\/b> (when, whether, how often); a <b>decorator adds features<\/b>.<\/p>\n<p>🐍 Python has a built-in caching proxy for functions: <code>@functools.cache<\/code>.<\/p>", "quiz": [["Name the three proxy types from the lesson.", "<p>Virtual (lazy creation), caching, and protection (permission checks). Remote proxies (an object standing in for one on another computer) are a fourth.<\/p>"]], "exercises": [{"id": "proxy-cache", "title": "A caching proxy with counters", "statement": "<p><code>SlowDictionary.lookup(word)<\/code> is slow (pretend it calls the internet). Write <code>CachedDictionary(real)<\/code> with the same <code>lookup(word)<\/code> that calls the real one <b>only the first time<\/b> for each word. Also keep two counters: <code>hits<\/code> (answered from the cache) and <code>misses<\/code> (had to ask the real one).<\/p>", "starter": "class SlowDictionary:\n    def __init__(self):\n        self.calls = 0\n    def lookup(self, word):\n        self.calls += 1\n        return f\"meaning of {word}\"\n\nclass CachedDictionary:\n    pass\n", "solution": "class SlowDictionary:\n    def __init__(self):\n        self.calls = 0\n    def lookup(self, word):\n        self.calls += 1\n        return f\"meaning of {word}\"\n\nclass CachedDictionary:\n    def __init__(self, real):\n        self.real, self.cache = real, {}\n        self.hits = self.misses = 0\n    def lookup(self, word):\n        if word in self.cache:\n            self.hits += 1\n        else:\n            self.misses += 1\n            self.cache[word] = self.real.lookup(word)    # only on a cache miss\n        return self.cache[word]\n", "tests": "\ndef _run():\n    real = SlowDictionary(); d = CachedDictionary(real)\n    out = [d.lookup(\"cat\"), d.lookup(\"dog\"), d.lookup(\"cat\"), d.lookup(\"cat\")]\n    return [out[2], real.calls, d.hits, d.misses]\nT(\"cache works\", _run, [\"meaning of cat\", 2, 2, 2])\nT(\"same answer as the real one\", lambda: CachedDictionary(SlowDictionary()).lookup(\"sun\"), \"meaning of sun\")\n", "hints": ["Keep a dict cache; check it before calling the real object."]}]}, {"id": "composite", "part": "structural", "title": "Composite", "tagline": "Boxes inside boxes", "body": "<h4>The story<\/h4>\n<p>Your computer has <b>files<\/b> and <b>folders<\/b>. A folder can contain files <b>and other folders<\/b>. When you ask \"how big is this folder?\", it adds up its files <b>and<\/b> asks each sub-folder the same question. To you, a file and a folder both answer <code>size()<\/code>.<\/p>\n<p><b>Composite: treat single objects and groups of objects the same way, using a tree.<\/b><\/p>\n<pre><code>from abc import ABC, abstractmethod\n\nclass Item(ABC):                        # the common interface\n    @abstractmethod\n    def size(self) -&gt; int: ...\n\nclass File(Item):                       # a LEAF: no children\n    def __init__(self, name, kb):\n        self.name, self.kb = name, kb\n    def size(self):\n        return self.kb\n\nclass Folder(Item):                     # a COMPOSITE: contains Items (files or folders!)\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, item):\n        self.children.append(item)\n        return self\n    def size(self):\n        return sum(child.size() for child in self.children)   # recursion does the magic\n\nroot = Folder(\"school\").add(File(\"notes.txt\", 5)).add(Folder(\"photos\").add(File(\"trip.jpg\", 300)))\nroot.size()      # 305<\/code><\/pre>\n<pre class=\"plain\"> school/            size = 5 + 300\n ├── notes.txt  5\n └── photos/        size = 300\n     └── trip.jpg 300<\/pre>\n<p><b>Where you see it:<\/b> folders, menus with sub-menus, company org charts, UI layouts (panels containing buttons and panels), maths expressions (<code>(2 + 3) * 4<\/code> is a tree).<\/p>", "quiz": [["What makes Composite work so neatly?", "<p>Leaves and groups share <b>one interface<\/b>, and groups delegate to their children recursively, so client code never needs to check 'is this a file or a folder?'.<\/p>"]], "exercises": [{"id": "composite-menu", "title": "Restaurant menu with sub-menus", "statement": "<p>Build a menu tree:<\/p>\n<ul><li><code>Dish(name, price)<\/code> with <code>total()<\/code> = price and <code>count()<\/code> = 1,<\/li><li><code>Menu(name)<\/code> with <code>add(item)<\/code> (returns self for chaining), <code>total()<\/code> = the sum of the children's totals, and <code>count()<\/code> = the total number of <b>dishes<\/b> inside, however deeply nested.<\/li><\/ul>\n<p>Also write <code>cheapest(menu)<\/code>, returning the name of the cheapest <code>Dish<\/code> anywhere in the tree.<\/p>", "starter": "class Dish:\n    pass\n\nclass Menu:\n    pass\n\ndef cheapest(menu):\n    pass\n", "solution": "class Dish:\n    def __init__(self, name, price):\n        self.name, self.price = name, price\n    def total(self): return self.price\n    def count(self): return 1\n    def dishes(self): return [self]\n\nclass Menu:\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, item):\n        self.children.append(item)\n        return self\n    def total(self): return sum(c.total() for c in self.children)\n    def count(self): return sum(c.count() for c in self.children)\n    def dishes(self): return [d for c in self.children for d in c.dishes()]\n\ndef cheapest(menu):\n    return min(menu.dishes(), key=lambda d: d.price).name\n", "tests": "\ndef _m():\n    drinks = Menu(\"drinks\").add(Dish(\"tea\", 20)).add(Dish(\"juice\", 60))\n    snacks = Menu(\"snacks\").add(Dish(\"samosa\", 15)).add(Menu(\"combos\").add(Dish(\"thali\", 150)))\n    return Menu(\"main\").add(drinks).add(snacks).add(Dish(\"dosa\", 80))\nT(\"total\", lambda: _m().total(), 325)\nT(\"count\", lambda: _m().count(), 5)\nT(\"cheapest\", lambda: cheapest(_m()), \"samosa\")\nT(\"empty menu\", lambda: (Menu(\"x\").total(), Menu(\"x\").count()), (0, 0))\n", "hints": ["Both classes need total() and count(); Menu sums its children's.", "For cheapest, add a method that lists all dishes recursively."]}]}, {"id": "bridge", "part": "structural", "title": "Bridge", "tagline": "Separate the remote from the TV", "body": "<h4>The story<\/h4>\n<p>A <b>TV remote<\/b> and a <b>TV<\/b> are separate things. Any remote (basic or fancy with voice) can control any TV brand (Sony or Samsung). If they were glued together you'd need a class for every combination: <code>BasicSonyRemote<\/code>, <code>VoiceSamsungRemote<\/code>… With 3 remotes × 4 TVs, that's <b>12 classes<\/b>. Separate them and you need <b>3 + 4 = 7<\/b>.<\/p>\n<p><b>Bridge: split something that varies in two independent directions into two hierarchies, and connect them with composition<\/b> (the remote *has a* device).<\/p>\n<pre><code>class Device:                                # implementation side\n    def __init__(self): self.volume, self.on = 10, False\n    def toggle(self): self.on = not self.on\nclass Sony(Device):\n    brand = \"Sony\"\nclass Samsung(Device):\n    brand = \"Samsung\"\n\nclass Remote:                                # abstraction side, which HAS a device (the bridge)\n    def __init__(self, device: Device):\n        self.device = device\n    def power(self):\n        self.device.toggle()\n    def volume_up(self):\n        self.device.volume += 1\n\nclass VoiceRemote(Remote):                   # extend the remotes freely…\n    def say(self, command):\n        if command == \"louder\":\n            for _ in range(5):\n                self.volume_up()\n\nVoiceRemote(Samsung()).say(\"louder\")         # …and combine with any device<\/code><\/pre>\n<p><b>Where you see it:<\/b> notifications (Urgent / Normal) × channels (Email / SMS), shapes × renderers (screen / printer), database query layer × drivers.<\/p>\n<div class=\"note\">Bridge is \"composition over inheritance\" applied on purpose, when you can see <b>two independent axes of change<\/b>.<\/div>", "quiz": [["You have 4 shapes and 3 renderers. How many classes with inheritance only? With Bridge?", "<p>Inheritance only: 4 × 3 = 12 combination classes. Bridge: 4 + 3 = 7 classes, with a shape *having* a renderer.<\/p>"]], "exercises": [{"id": "bridge-notify", "title": "Messages × channels", "statement": "<p>Messages come in two kinds and can go through two channels:<\/p>\n<ul><li><b>Channels:<\/b> <code>EmailChannel<\/code> and <code>SmsChannel<\/code>, each with <code>deliver(text)<\/code> returning <code>\"EMAIL: &lt;text&gt;\"<\/code> or <code>\"SMS: &lt;text&gt;\"<\/code>.<\/li><li><b>Messages:<\/b> <code>Message(channel)<\/code> with <code>send(text)<\/code> that delivers <code>text<\/code> unchanged, and <code>UrgentMessage(Message)<\/code> that delivers <code>\"URGENT! \" + text.upper()<\/code>.<\/li><\/ul>\n<p>Any message must work with any channel, so there must be <b>no<\/b> classes like <code>UrgentSms<\/code>.<\/p>", "starter": "class EmailChannel:\n    pass\n\nclass SmsChannel:\n    pass\n\nclass Message:\n    pass\n\nclass UrgentMessage(Message):\n    pass\n", "solution": "class EmailChannel:\n    def deliver(self, text): return f\"EMAIL: {text}\"\n\nclass SmsChannel:\n    def deliver(self, text): return f\"SMS: {text}\"\n\nclass Message:\n    def __init__(self, channel):\n        self.channel = channel                  # the bridge: a message HAS a channel\n    def format(self, text):\n        return text\n    def send(self, text):\n        return self.channel.deliver(self.format(text))\n\nclass UrgentMessage(Message):\n    def format(self, text):\n        return \"URGENT! \" + text.upper()\n", "tests": "\nT(\"normal email\", lambda: Message(EmailChannel()).send(\"hi\"), \"EMAIL: hi\")\nT(\"urgent sms\", lambda: UrgentMessage(SmsChannel()).send(\"fire drill\"), \"SMS: URGENT! FIRE DRILL\")\nT(\"urgent email\", lambda: UrgentMessage(EmailChannel()).send(\"x\"), \"EMAIL: URGENT! X\")\nC(\"UrgentMessage is a Message\", lambda: issubclass(UrgentMessage, Message))\n", "hints": ["Message stores a channel and calls channel.deliver(...).", "UrgentMessage only changes how the text is formatted."]}]}, {"id": "flyweight", "part": "structural", "title": "Flyweight", "tagline": "Share what's the same, store only what's different", "body": "<h4>The story<\/h4>\n<p>A forest in a video game has <b>1 million trees<\/b>, but only <b>3 kinds<\/b> of tree (oak, pine, palm). Each kind's 3D model and texture is <b>huge<\/b>. Storing a copy in every tree would crash your computer. Instead, store each kind <b>once<\/b> and let each tree remember only its <b>own small details<\/b>: its position.<\/p>\n<p><b>Flyweight: share the common heavy part (intrinsic state) between many objects; keep the unique light part (extrinsic state) per object.<\/b><\/p>\n<pre><code>class TreeType:                          # the shared, heavy part (the flyweight)\n    def __init__(self, name, texture):\n        self.name, self.texture = name, texture\n\nclass TreeFactory:\n    _types = {}\n    @classmethod\n    def get(cls, name, texture):\n        key = (name, texture)\n        if key not in cls._types:\n            cls._types[key] = TreeType(name, texture)   # created only once per kind\n        return cls._types[key]\n\nclass Tree:                              # the light part: just position + a reference\n    __slots__ = (\"x\", \"y\", \"kind\")       # __slots__ makes each tree even smaller\n    def __init__(self, x, y, kind):\n        self.x, self.y, self.kind = x, y, kind\n\nforest = [Tree(i, i * 2, TreeFactory.get(\"oak\", \"oak.png\")) for i in range(1_000_000)]\nlen(TreeFactory._types)   # 1: only one TreeType object exists<\/code><\/pre>\n<h4>Python already does this for you!<\/h4>\n<ul><li><b>Small integers<\/b> (−5 to 256) and many short <b>strings<\/b> are shared (\"interned\") by CPython. <code>a = 7; b = 7; a is b<\/code> gives True.<\/li><li><code>sys.intern(s)<\/code> lets you intern strings yourself.<\/li><li><code>@functools.cache<\/code> on a factory function is an easy flyweight factory.<\/li><\/ul>", "quiz": [["Intrinsic vs extrinsic state?", "<p>Intrinsic = shared, doesn't change, stored in the flyweight (the tree model). Extrinsic = unique per use, passed in or stored per object (the tree's position).<\/p>"]], "exercises": [{"id": "flyweight-chars", "title": "Character styles in a text editor", "statement": "<p>A document has thousands of characters, but only a few <b>styles<\/b> (font, size, bold). Write:<\/p>\n<ul><li><code>Style(font, size, bold)<\/code>,<\/li><li><code>StyleFactory.get(font, size, bold)<\/code>, which returns the <b>same<\/b> Style object for the same combination; <code>StyleFactory.count()<\/code> returns how many distinct styles exist,<\/li><li><code>Char(symbol, style)<\/code>.<\/li><\/ul>\n<p>Build <code>make_text(text, style_args)<\/code> returning a list of <code>Char<\/code>s that all share one style.<\/p>", "starter": "class Style:\n    pass\n\nclass StyleFactory:\n    pass\n\nclass Char:\n    pass\n\ndef make_text(text, style_args):\n    pass\n", "solution": "class Style:\n    def __init__(self, font, size, bold):\n        self.font, self.size, self.bold = font, size, bold\n\nclass StyleFactory:\n    _cache = {}\n    @classmethod\n    def get(cls, font, size, bold):\n        key = (font, size, bold)\n        if key not in cls._cache:\n            cls._cache[key] = Style(font, size, bold)\n        return cls._cache[key]\n    @classmethod\n    def count(cls):\n        return len(cls._cache)\n\nclass Char:\n    __slots__ = (\"symbol\", \"style\")\n    def __init__(self, symbol, style):\n        self.symbol, self.style = symbol, style\n\ndef make_text(text, style_args):\n    style = StyleFactory.get(*style_args)\n    return [Char(ch, style) for ch in text]\n", "tests": "\nStyleFactory._cache = {} if hasattr(StyleFactory, \"_cache\") else None\ndef _run():\n    a = make_text(\"hello world\" * 100, (\"Arial\", 12, False))\n    b = make_text(\"bold!\", (\"Arial\", 12, True))\n    c = make_text(\"again\", (\"Arial\", 12, False))\n    return [len(a), StyleFactory.count(), a[0].style is c[3].style, a[0].style is b[0].style]\nT(\"styles are shared\", _run, [1100, 2, True, False])\nC(\"same args, same object\", lambda: StyleFactory.get(\"Mono\", 10, True) is StyleFactory.get(\"Mono\", 10, True))\n", "hints": ["Cache Style objects in a dict keyed by (font, size, bold).", "Every Char keeps a reference to the shared Style."]}]}, {"id": "strategy", "part": "behavioral", "title": "Strategy", "tagline": "Choose how to get to school today", "body": "<h4>The story<\/h4>\n<p>You can get to school by <b>walking<\/b>, <b>cycling<\/b> or <b>bus<\/b>. The goal is the same (reach school); only the <b>way<\/b> changes. Each morning you pick a strategy based on the weather and time.<\/p>\n<p><b>Strategy: put each way of doing a job in its own class (or function) behind one interface, and choose which one to use at runtime.<\/b><\/p>\n<h4>The messy code<\/h4>\n<pre><code>def travel_time(mode, km):\n    if mode == \"walk\": return km * 12\n    elif mode == \"cycle\": return km * 4\n    elif mode == \"bus\": return km * 2 + 10      # waiting time<\/code><\/pre>\n<h4>The pattern<\/h4>\n<pre><code>from typing import Protocol\n\nclass Route(Protocol):\n    def minutes(self, km: float) -&gt; float: ...\n\nclass Walk:\n    def minutes(self, km): return km * 12\nclass Cycle:\n    def minutes(self, km): return km * 4\nclass Bus:\n    def minutes(self, km): return km * 2 + 10\n\nclass Navigator:\n    def __init__(self, route: Route):\n        self.route = route                 # the strategy can be swapped any time\n    def eta(self, km):\n        return self.route.minutes(km)\n\nnav = Navigator(Walk()); nav.eta(2)        # 24\nnav.route = Bus();       nav.eta(2)        # 14<\/code><\/pre>\n<h4>🐍 Pythonic shortcut: functions are strategies<\/h4>\n<pre><code>STRATEGIES = {\"walk\": lambda km: km * 12, \"bus\": lambda km: km * 2 + 10}\ndef eta(km, how=STRATEGIES[\"walk\"]):\n    return how(km)\nsorted(students, key=lambda s: s.marks)    # `key=` is a strategy!<\/code><\/pre>\n<p><b>Where you see it:<\/b> sorting keys, payment methods, discount rules, compression algorithms, route planners, ML model selection.<\/p>", "quiz": [["How is Strategy related to the Open/Closed principle?", "<p>New behaviours are new strategy classes or functions; the code that uses the strategy never changes.<\/p>"], ["What is <code>sorted(..., key=len)<\/code> an example of?", "<p>The Strategy pattern using a plain function: the comparison strategy is passed in.<\/p>"]], "exercises": [{"id": "strategy-discount", "title": "Discount strategies", "statement": "<p>Write discount strategies, each with <code>apply(total)<\/code>:<\/p>\n<ul><li><code>NoDiscount<\/code>: the total unchanged,<\/li><li><code>Percent(p)<\/code>: p% off,<\/li><li><code>Flat(amount)<\/code>: minus the amount, but never below 0,<\/li><li><code>BuyOverGetOff(threshold, off)<\/code>: if total ≥ threshold, subtract <code>off<\/code>.<\/li><\/ul>\n<p><code>Checkout(strategy)<\/code> has <code>pay(total)<\/code>, which returns <code>round(strategy.apply(total), 2)<\/code>, and the strategy can be changed later by assigning <code>checkout.strategy = ...<\/code>.<\/p>", "starter": "class NoDiscount:\n    pass\n\nclass Checkout:\n    pass\n", "solution": "class NoDiscount:\n    def apply(self, total): return total\n\nclass Percent:\n    def __init__(self, p): self.p = p\n    def apply(self, total): return total * (1 - self.p / 100)\n\nclass Flat:\n    def __init__(self, amount): self.amount = amount\n    def apply(self, total): return max(0, total - self.amount)\n\nclass BuyOverGetOff:\n    def __init__(self, threshold, off): self.threshold, self.off = threshold, off\n    def apply(self, total): return total - self.off if total >= self.threshold else total\n\nclass Checkout:\n    def __init__(self, strategy):\n        self.strategy = strategy\n    def pay(self, total):\n        return round(self.strategy.apply(total), 2)\n", "tests": "\nT(\"no discount\", lambda: Checkout(NoDiscount()).pay(500), 500)\nT(\"20 percent\", lambda: Checkout(Percent(20)).pay(500), 400.0)\nT(\"flat never negative\", lambda: Checkout(Flat(100)).pay(60), 0)\nT(\"threshold met\", lambda: Checkout(BuyOverGetOff(1000, 150)).pay(1200), 1050)\nT(\"threshold not met\", lambda: Checkout(BuyOverGetOff(1000, 150)).pay(900), 900)\ndef _swap():\n    c = Checkout(NoDiscount()); a = c.pay(100); c.strategy = Percent(50); return [a, c.pay(100)]\nT(\"swap strategy at runtime\", _swap, [100, 50.0])\n", "hints": ["Each strategy is a tiny class with apply(total).", "Checkout stores self.strategy and calls it in pay()."]}]}, {"id": "observer", "part": "behavioral", "title": "Observer", "tagline": "Subscribe to a YouTube channel", "body": "<h4>The story<\/h4>\n<p>When you <b>subscribe<\/b> to a YouTube channel, you get notified of every new video. The channel doesn't know or care who you are. It just tells <b>all subscribers<\/b>. You can <b>unsubscribe<\/b> any time.<\/p>\n<p><b>Observer: an object (the subject) keeps a list of subscribers (observers) and notifies all of them when something happens.<\/b> The subject and the observers stay loosely connected.<\/p>\n<pre><code>class Channel:                                   # the SUBJECT\n    def __init__(self, name):\n        self.name, self._subscribers = name, []\n    def subscribe(self, fn):\n        self._subscribers.append(fn)\n    def unsubscribe(self, fn):\n        self._subscribers.remove(fn)\n    def upload(self, title):\n        for notify in list(self._subscribers):    # copy, in case someone unsubscribes mid-loop\n            notify(self.name, title)\n\ndef phone(channel, title): print(f\"📱 {channel}: {title}\")\ndef email(channel, title): print(f\"📧 {channel} posted {title}\")\n\nc = Channel(\"MathsWithFun\")\nc.subscribe(phone); c.subscribe(email)\nc.upload(\"Fractions made easy\")                  # both get notified<\/code><\/pre>\n<h4>An event bus: Observer for a whole app<\/h4>\n<pre><code>from collections import defaultdict\nclass EventBus:\n    def __init__(self): self.handlers = defaultdict(list)\n    def on(self, event, fn): self.handlers[event].append(fn)\n    def emit(self, event, **data):\n        for fn in self.handlers[event]:\n            fn(**data)\n\nbus = EventBus()\nbus.on(\"order_paid\", lambda order_id: print(\"send receipt\", order_id))\nbus.on(\"order_paid\", lambda order_id: print(\"tell kitchen\", order_id))\nbus.emit(\"order_paid\", order_id=42)<\/code><\/pre>\n<p><b>Where you see it:<\/b> button clicks in GUIs, Django signals, spreadsheet cells updating, stock price alerts, message brokers (Kafka) at large scale.<\/p>\n<div class=\"note\">⚠ <b>Gotchas:<\/b> one failing subscriber shouldn't break the rest (wrap each call in try/except), and remember to unsubscribe, or the subject keeps old objects alive forever (a memory leak).<\/div>", "quiz": [["Why does the subject loop over a *copy* of the subscriber list?", "<p>A subscriber might unsubscribe while being notified, and changing a list while looping over it skips items or errors.<\/p>"], ["Observer vs simply calling functions directly?", "<p>With Observer, the subject doesn't know its subscribers. New reactions are added without changing the subject (open/closed).<\/p>"]], "exercises": [{"id": "observer-stock", "title": "Stock price alerts", "statement": "<p>Write <code>Stock(symbol, price)<\/code> with <code>subscribe(fn)<\/code>, <code>unsubscribe(fn)<\/code> and a <code>set_price(new)<\/code> method that updates the price and calls every subscriber as <code>fn(symbol, old, new)<\/code>, <b>but only if the price actually changed<\/b>. Subscribers are called in the order they subscribed, and an exception raised by one subscriber must <b>not<\/b> stop the others (catch it and move on).<\/p>", "starter": "class Stock:\n    def __init__(self, symbol, price):\n        self.symbol, self.price = symbol, price\n", "solution": "class Stock:\n    def __init__(self, symbol, price):\n        self.symbol, self.price = symbol, price\n        self._subs = []\n    def subscribe(self, fn):\n        self._subs.append(fn)\n    def unsubscribe(self, fn):\n        self._subs.remove(fn)\n    def set_price(self, new):\n        old = self.price\n        if new == old:\n            return                                  # nothing changed, so no notification\n        self.price = new\n        for fn in list(self._subs):\n            try:\n                fn(self.symbol, old, new)\n            except Exception:\n                pass                                # one bad subscriber can't break the rest\n", "tests": "\ndef _run():\n    log = []\n    s = Stock(\"TCS\", 100)\n    a = lambda sym, o, n: log.append((\"a\", sym, o, n))\n    def broken(sym, o, n): raise RuntimeError(\"boom\")\n    b = lambda sym, o, n: log.append((\"b\", n))\n    s.subscribe(a); s.subscribe(broken); s.subscribe(b)\n    s.set_price(110); s.set_price(110); s.unsubscribe(a); s.set_price(90)\n    return log\nT(\"notifications\", _run, [(\"a\", \"TCS\", 100, 110), (\"b\", 110), (\"b\", 90)])\ndef _price():\n    s = Stock(\"X\", 5); s.set_price(7); return s.price\nT(\"price updates even with no subscribers\", _price, 7)\n", "hints": ["Keep a list of subscriber functions.", "In set_price, return early if nothing changed; wrap each call in try/except."]}]}, {"id": "command", "part": "behavioral", "title": "Command", "tagline": "Write the order on a slip of paper", "body": "<h4>The story<\/h4>\n<p>In a restaurant, the waiter writes your order on a <b>slip of paper<\/b> and pins it in the kitchen. The slip <b>is<\/b> the request. It can wait in a queue, be done later, be cancelled, or be kept as a record. And the waiter doesn't need to know how to cook!<\/p>\n<p><b>Command: turn a request (an action) into an object.<\/b> Then you can <b>queue<\/b> it, <b>log<\/b> it, <b>undo<\/b> it, or <b>replay<\/b> it.<\/p>\n<h4>Undo/redo for a drawing app<\/h4>\n<pre><code>class AddShape:\n    def __init__(self, canvas, shape):\n        self.canvas, self.shape = canvas, shape\n    def execute(self):\n        self.canvas.append(self.shape)\n    def undo(self):\n        self.canvas.remove(self.shape)\n\nclass Editor:\n    def __init__(self):\n        self.canvas, self.done, self.undone = [], [], []\n    def run(self, cmd):\n        cmd.execute()\n        self.done.append(cmd)\n        self.undone.clear()              # a new action wipes the redo history\n    def undo(self):\n        if self.done:\n            cmd = self.done.pop(); cmd.undo(); self.undone.append(cmd)\n    def redo(self):\n        if self.undone:\n            cmd = self.undone.pop(); cmd.execute(); self.done.append(cmd)\n\ned = Editor()\ned.run(AddShape(ed.canvas, \"circle\")); ed.run(AddShape(ed.canvas, \"square\"))\ned.undo()       # canvas = ['circle']\ned.redo()       # canvas = ['circle', 'square']<\/code><\/pre>\n<pre class=\"plain\">  done stack:   [add circle, add square]   ← undo pops from here\n  undone stack: []                          ← redo pops from here<\/pre>\n<p><b>Where you see it:<\/b> undo/redo in editors, task queues (Celery jobs are commands), remote-control buttons, database migrations (<code>upgrade<\/code> / <code>downgrade<\/code>), transaction logs.<\/p>\n<p>🐍 A simple command can be just a function or a <code>functools.partial<\/code>. A class is needed when you want <code>undo()<\/code> too.<\/p>", "quiz": [["Why does doing a new action clear the redo stack?", "<p>Redo history only makes sense along the same timeline. After a new action, the 'future' you undid is no longer reachable.<\/p>"], ["Name two things Command lets you do with actions besides running them.", "<p>Undo/redo, queueing or scheduling, logging or auditing, and replaying.<\/p>"]], "exercises": [{"id": "command-text", "title": "Undo/redo text editor", "statement": "<p>Write commands on a <code>Doc<\/code> (it has a <code>text<\/code> attribute):<\/p>\n<ul><li><code>Append(doc, s)<\/code>: adds s at the end; undo removes it,<\/li><li><code>Delete(doc, n)<\/code>: removes the last n characters; undo puts them back (remember what you deleted!).<\/li><\/ul>\n<p>Write <code>History<\/code> with <code>run(cmd)<\/code>, <code>undo()<\/code> and <code>redo()<\/code>, using the two-stack approach (a new <code>run<\/code> clears redo). Undo or redo with nothing to do should simply do nothing.<\/p>", "starter": "class Doc:\n    def __init__(self): self.text = \"\"\n\nclass Append:\n    pass\n\nclass Delete:\n    pass\n\nclass History:\n    pass\n", "solution": "class Doc:\n    def __init__(self): self.text = \"\"\n\nclass Append:\n    def __init__(self, doc, s): self.doc, self.s = doc, s\n    def execute(self): self.doc.text += self.s\n    def undo(self): self.doc.text = self.doc.text[:-len(self.s)] if self.s else self.doc.text\n\nclass Delete:\n    def __init__(self, doc, n): self.doc, self.n, self.removed = doc, n, \"\"\n    def execute(self):\n        self.removed = self.doc.text[-self.n:] if self.n else \"\"     # remember for undo\n        self.doc.text = self.doc.text[:len(self.doc.text) - len(self.removed)]\n    def undo(self): self.doc.text += self.removed\n\nclass History:\n    def __init__(self): self.done, self.undone = [], []\n    def run(self, cmd):\n        cmd.execute(); self.done.append(cmd); self.undone.clear()\n    def undo(self):\n        if self.done:\n            cmd = self.done.pop(); cmd.undo(); self.undone.append(cmd)\n    def redo(self):\n        if self.undone:\n            cmd = self.undone.pop(); cmd.execute(); self.done.append(cmd)\n", "tests": "\ndef _run():\n    d, h = Doc(), History(); seen = []\n    h.run(Append(d, \"Hello\")); h.run(Append(d, \" World\")); seen.append(d.text)\n    h.run(Delete(d, 5)); seen.append(d.text)\n    h.undo(); seen.append(d.text)\n    h.undo(); seen.append(d.text)\n    h.redo(); seen.append(d.text)\n    h.run(Append(d, \"!\")); h.redo(); seen.append(d.text)\n    h.undo(); h.undo(); h.undo(); h.undo(); seen.append(d.text)\n    return seen\nT(\"full undo/redo story\", _run, [\"Hello World\", \"Hello \", \"Hello World\", \"Hello\", \"Hello World\", \"Hello World!\", \"\"])\ndef _empty():\n    d, h = Doc(), History(); h.undo(); h.redo(); return d.text\nT(\"undo/redo on empty history do nothing\", _empty, \"\")\n", "hints": ["Delete must store the removed text inside execute(), so undo can restore it.", "History.run clears the redo stack."]}]}, {"id": "state", "part": "behavioral", "title": "State", "tagline": "A traffic light that knows what it is", "body": "<h4>The story<\/h4>\n<p>A <b>traffic light<\/b> behaves differently depending on its current colour. Pressing \"next\" on red gives green; on green it gives yellow; on yellow, red. Instead of one giant <code>if colour == …<\/code> everywhere, <b>each colour knows what comes next and how it behaves<\/b>.<\/p>\n<p><b>State: an object changes its behaviour when its internal state changes, by delegating to a state object.<\/b> It looks as if the object changed its class.<\/p>\n<h4>The messy code<\/h4>\n<pre><code>class Order:\n    def __init__(self): self.status = \"new\"\n    def pay(self):\n        if self.status == \"new\": self.status = \"paid\"\n        elif self.status == \"paid\": raise Exception(\"already paid\")\n        elif self.status == \"shipped\": raise Exception(\"too late\")\n    def ship(self):\n        if self.status == \"paid\": self.status = \"shipped\"\n        else: raise Exception(\"can't ship\")\n    # every new status = edit EVERY method 😵<\/code><\/pre>\n<h4>The pattern: one class per state<\/h4>\n<pre><code>class OrderState:\n    def pay(self, order):  raise ValueError(f\"can't pay when {self.name}\")\n    def ship(self, order): raise ValueError(f\"can't ship when {self.name}\")\n\nclass New(OrderState):\n    name = \"new\"\n    def pay(self, order): order.state = Paid()\n\nclass Paid(OrderState):\n    name = \"paid\"\n    def ship(self, order): order.state = Shipped()\n\nclass Shipped(OrderState):\n    name = \"shipped\"\n\nclass Order:\n    def __init__(self): self.state = New()\n    def pay(self): self.state.pay(self)          # delegate to the current state\n    def ship(self): self.state.ship(self)<\/code><\/pre>\n<h4>🐍 The lighter version: a transition table<\/h4>\n<p>When states differ only in <b>which moves are allowed<\/b> (not in big behaviour differences), a dictionary is cleaner:<\/p>\n<pre><code>ALLOWED = {\"new\": {\"paid\", \"cancelled\"}, \"paid\": {\"shipped\"}, \"shipped\": set()}\ndef move(order, new):\n    if new not in ALLOWED[order.status]:\n        raise ValueError(f\"{order.status} → {new} not allowed\")\n    order.status = new<\/code><\/pre>\n<p><b>State vs Strategy:<\/b> they look alike. With Strategy, *you* pick the algorithm from outside. With State, the object <b>switches states itself<\/b> as things happen.<\/p>", "quiz": [["When should you prefer a transition table over state classes?", "<p>When states only differ in which transitions are allowed. Use classes when each state has substantially different behaviour.<\/p>"], ["State vs Strategy?", "<p>Strategy is chosen by the client and doesn't change itself. State objects trigger transitions to other states as events happen.<\/p>"]], "exercises": [{"id": "state-vending", "title": "Vending machine states", "statement": "<p>A vending machine (one product, price 20) has three states: <code>Idle<\/code>, <code>HasCoin<\/code> and <code>SoldOut<\/code>. Implement <code>VendingMachine(stock)<\/code> with:<\/p>\n<ul><li><code>insert(amount)<\/code>: in Idle, store the credit and move to HasCoin; in HasCoin, add to the credit; in SoldOut, return <code>\"sold out, returning &lt;amount&gt;\"<\/code>.<\/li><li><code>press()<\/code>: in HasCoin with credit ≥ 20, dispense, give change, reduce stock, and return <code>\"enjoy! change &lt;credit-20&gt;\"<\/code>. Then move to Idle, or to SoldOut if the stock is 0. With too little credit, return <code>\"need &lt;20-credit&gt; more\"<\/code>. In Idle, return <code>\"insert coin first\"<\/code>.<\/li><li><code>state_name()<\/code>: <code>\"idle\"<\/code>, <code>\"has_coin\"<\/code> or <code>\"sold_out\"<\/code>.<\/li><\/ul>\n<p>A machine created with stock 0 starts in SoldOut. Use state classes (not if/elif on strings inside VendingMachine).<\/p>", "starter": "class VendingMachine:\n    PRICE = 20\n    def __init__(self, stock):\n        self.stock, self.credit = stock, 0\n", "solution": "class State:\n    name = \"?\"\n    def insert(self, m, amount): raise NotImplementedError\n    def press(self, m): raise NotImplementedError\n\nclass Idle(State):\n    name = \"idle\"\n    def insert(self, m, amount):\n        m.credit = amount\n        m.state = HasCoin()\n        return f\"credit {m.credit}\"\n    def press(self, m):\n        return \"insert coin first\"\n\nclass HasCoin(State):\n    name = \"has_coin\"\n    def insert(self, m, amount):\n        m.credit += amount\n        return f\"credit {m.credit}\"\n    def press(self, m):\n        if m.credit < m.PRICE:\n            return f\"need {m.PRICE - m.credit} more\"\n        change, m.credit = m.credit - m.PRICE, 0\n        m.stock -= 1\n        m.state = SoldOut() if m.stock == 0 else Idle()\n        return f\"enjoy! change {change}\"\n\nclass SoldOut(State):\n    name = \"sold_out\"\n    def insert(self, m, amount):\n        return f\"sold out, returning {amount}\"\n    def press(self, m):\n        return \"sold out\"\n\nclass VendingMachine:\n    PRICE = 20\n    def __init__(self, stock):\n        self.stock, self.credit = stock, 0\n        self.state = Idle() if stock > 0 else SoldOut()\n    def insert(self, amount): return self.state.insert(self, amount)\n    def press(self): return self.state.press(self)\n    def state_name(self): return self.state.name\n", "tests": "\ndef _run():\n    m = VendingMachine(1); out = [m.state_name(), m.press()]\n    m.insert(10); out.append(m.press()); out.append(m.state_name())\n    m.insert(15); out.append(m.press()); out.append(m.state_name())\n    out.append(m.insert(5))\n    return out\nT(\"story\", _run, [\"idle\", \"insert coin first\", \"need 10 more\", \"has_coin\", \"enjoy! change 5\", \"sold_out\", \"sold out, returning 5\"])\nT(\"starts sold out\", lambda: VendingMachine(0).state_name(), \"sold_out\")\ndef _two():\n    m = VendingMachine(2); m.insert(20); a = m.press(); return [a, m.state_name(), m.stock]\nT(\"back to idle when stock remains\", _two, [\"enjoy! change 0\", \"idle\", 1])\n", "hints": ["Create Idle, HasCoin and SoldOut classes, each with insert(m, amount) and press(m).", "VendingMachine just delegates: return self.state.press(self)."]}]}, {"id": "template-method", "part": "behavioral", "title": "Template Method", "tagline": "Same recipe steps, different ingredients", "body": "<h4>The story<\/h4>\n<p>Making <b>tea<\/b> and making <b>coffee<\/b> follow the same recipe: <i>boil water → brew → pour into a cup → add extras<\/i>. Only the <b>brew<\/b> and <b>extras<\/b> steps differ (tea leaves + lemon vs coffee powder + milk). Write the recipe <b>once<\/b> and let each drink fill in its own steps.<\/p>\n<p><b>Template Method: a parent class defines the skeleton of an algorithm (the order of steps); subclasses fill in some steps<\/b> without changing the order.<\/p>\n<pre><code>from abc import ABC, abstractmethod\n\nclass HotDrink(ABC):\n    def make(self):                          # the TEMPLATE method: a fixed order\n        steps = [self.boil(), self.brew(), self.pour()]\n        if self.wants_extras():              # a \"hook\": optional, with a default\n            steps.append(self.extras())\n        return steps\n\n    def boil(self): return \"boil water\"      # shared steps\n    def pour(self): return \"pour in cup\"\n    def wants_extras(self): return True      # hook with a default\n\n    @abstractmethod\n    def brew(self): ...                      # subclasses MUST fill these in\n    @abstractmethod\n    def extras(self): ...\n\nclass Tea(HotDrink):\n    def brew(self): return \"steep tea\"\n    def extras(self): return \"add lemon\"\n\nclass BlackCoffee(HotDrink):\n    def brew(self): return \"drip coffee\"\n    def extras(self): return \"add milk\"\n    def wants_extras(self): return False     # override the hook<\/code><\/pre>\n<p><b>Where you see it:<\/b> <code>unittest.TestCase<\/code> (setUp → test → tearDown), Django class-based views (<code>get_queryset<\/code>, <code>get_context_data<\/code>), game loops, data exporters (fetch → transform → write).<\/p>\n<div class=\"note\"><b>Template Method vs Strategy:<\/b> Template Method uses <b>inheritance<\/b> (override steps). Strategy uses <b>composition<\/b> (pass in a step). Prefer Strategy when the steps vary independently or need to change at runtime.<\/div>", "quiz": [["What's a 'hook' in the Template Method?", "<p>An optional step with a default implementation that subclasses *may* override (like <code>wants_extras<\/code>).<\/p>"], ["Where does Python's unittest use it?", "<p><code>TestCase.run()<\/code> is the template: setUp(), your test method, then tearDown(), which you override.<\/p>"]], "exercises": [{"id": "template-report", "title": "Report exporters", "statement": "<p>Write an abstract <code>Exporter<\/code> with the template method <code>export(rows)<\/code>, which returns <code>header() + body + footer()<\/code>:<\/p>\n<ul><li>the body is <code>\"\".join(self.row(r) for r in rows)<\/code>,<\/li><li><code>header()<\/code> and <code>footer()<\/code> default to <code>\"\"<\/code> (hooks),<\/li><li><code>row(r)<\/code> is abstract.<\/li><\/ul>\n<p>Then:<\/p>\n<ul><li><code>CsvExporter<\/code>: header <code>\"name,marks\\n\"<\/code>, rows like <code>\"Asha,90\\n\"<\/code>,<\/li><li><code>HtmlExporter<\/code>: header <code>\"&lt;table&gt;\"<\/code>, footer <code>\"&lt;/table&gt;\"<\/code>, rows <code>\"&lt;tr&gt;&lt;td&gt;Asha&lt;/td&gt;&lt;td&gt;90&lt;/td&gt;&lt;/tr&gt;\"<\/code>.<\/li><\/ul>\n<p>Each <code>r<\/code> is a tuple <code>(name, marks)<\/code>.<\/p>", "starter": "from abc import ABC, abstractmethod\n\nclass Exporter(ABC):\n    pass\n", "solution": "from abc import ABC, abstractmethod\n\nclass Exporter(ABC):\n    def export(self, rows):                         # the template: fixed order\n        return self.header() + \"\".join(self.row(r) for r in rows) + self.footer()\n    def header(self): return \"\"                     # hooks\n    def footer(self): return \"\"\n    @abstractmethod\n    def row(self, r): ...\n\nclass CsvExporter(Exporter):\n    def header(self): return \"name,marks\\n\"\n    def row(self, r): return f\"{r[0]},{r[1]}\\n\"\n\nclass HtmlExporter(Exporter):\n    def header(self): return \"<table>\"\n    def footer(self): return \"<\/table>\"\n    def row(self, r): return f\"<tr><td>{r[0]}<\/td><td>{r[1]}<\/td><\/tr>\"\n", "tests": "\n_rows = [(\"Asha\", 90), (\"Ravi\", 75)]\nT(\"csv\", lambda: CsvExporter().export(_rows), \"name,marks\\nAsha,90\\nRavi,75\\n\")\nT(\"html\", lambda: HtmlExporter().export(_rows), \"<table><tr><td>Asha<\/td><td>90<\/td><\/tr><tr><td>Ravi<\/td><td>75<\/td><\/tr><\/table>\")\nT(\"empty\", lambda: HtmlExporter().export([]), \"<table><\/table>\")\ndef _abstract():\n    try:\n        Exporter(); return False\n    except TypeError:\n        return True\nC(\"Exporter is abstract\", _abstract)\n", "hints": ["export() calls header(), row() for each row, then footer().", "Mark row() with @abstractmethod."]}]}, {"id": "iterator", "part": "behavioral", "title": "Iterator", "tagline": "Next song, please", "body": "<h4>The story<\/h4>\n<p>A music player has a <b>\"next\"<\/b> button. You don't need to know whether the songs are stored in a list, a folder, or come from the internet. You just press \"next\" until there are no more.<\/p>\n<p><b>Iterator: give a way to go through the elements of a collection one by one, without exposing how it's stored inside.<\/b><\/p>\n<h4>Python has this pattern <b>built into the language<\/b><\/h4>\n<p><code>for x in thing:<\/code> works on anything that follows the <b>iterator protocol<\/b>:<\/p>\n<ul><li><code><i>_iter_<\/i>()<\/code> returns an iterator,<\/li><li>the iterator's <code><i>_next_<\/i>()<\/code> returns the next item, or raises <code>StopIteration<\/code> at the end.<\/li><\/ul>\n<pre><code>class Countdown:\n    def __init__(self, start): self.start = start\n    def __iter__(self):                  # easiest way: make __iter__ a generator\n        n = self.start\n        while n &gt; 0:\n            yield n                      # pause here and hand out one value\n            n -= 1\n\nfor x in Countdown(3):\n    print(x)        # 3, 2, 1<\/code><\/pre>\n<h4>Custom traversal orders<\/h4>\n<p>The same collection can offer different iterators:<\/p>\n<pre><code>class Playlist:\n    def __init__(self, songs): self.songs = songs\n    def __iter__(self): return iter(self.songs)                # normal order\n    def reversed_order(self): return reversed(self.songs)      # another iterator\n    def shuffled(self, seed=0):\n        import random\n        order = self.songs[:]\n        random.Random(seed).shuffle(order)\n        yield from order<\/code><\/pre>\n<p><b>Generators<\/b> (functions with <code>yield<\/code>) are Python's superpower here: lazy, memory-friendly, and only a few lines. See chapter 07 of the main guide for how they work inside.<\/p>", "quiz": [["What two methods make up Python's iterator protocol?", "<p><code><i>_iter_<\/i><\/code> (return an iterator) and <code><i>_next_<\/i><\/code> (return the next item or raise <code>StopIteration<\/code>).<\/p>"], ["Why are generators memory-friendly?", "<p>They produce one item at a time on demand instead of building a whole list in memory.<\/p>"]], "exercises": [{"id": "iterator-tree", "title": "Iterate a family tree", "statement": "<p><code>Person(name, children=None)<\/code> forms a family tree. Make <code>Person<\/code> <b>iterable<\/b>, so that <code>for p in grandpa<\/code> yields every <b>name<\/b> in <b>depth-first pre-order<\/b> (a person first, then each child's subtree in order). Also add <code>by_generation()<\/code>, a generator that yields lists of names level by level (breadth-first).<\/p>", "starter": "class Person:\n    def __init__(self, name, children=None):\n        self.name = name\n        self.children = children or []\n", "solution": "from collections import deque\n\nclass Person:\n    def __init__(self, name, children=None):\n        self.name = name\n        self.children = children or []\n\n    def __iter__(self):                         # depth-first pre-order, as a generator\n        yield self.name\n        for child in self.children:\n            yield from child                    # delegate to the child's own iterator\n\n    def by_generation(self):                    # breadth-first, level by level\n        level = [self]\n        while level:\n            yield [p.name for p in level]\n            level = [c for p in level for c in p.children]\n", "tests": "\ndef _fam():\n    return Person(\"Dada\", [Person(\"Papa\", [Person(\"Asha\"), Person(\"Ravi\")]), Person(\"Chacha\", [Person(\"Mini\")])])\nT(\"depth-first\", lambda: list(_fam()), [\"Dada\", \"Papa\", \"Asha\", \"Ravi\", \"Chacha\", \"Mini\"])\nT(\"by generation\", lambda: list(_fam().by_generation()), [[\"Dada\"], [\"Papa\", \"Chacha\"], [\"Asha\", \"Ravi\", \"Mini\"]])\nT(\"works with `in`\", lambda: \"Mini\" in _fam(), True)\n", "hints": ["Write <i>_iter_<\/i> as a generator: yield self.name, then <code>yield from child<\/code> for each child.", "by_generation: keep a list for the current level and build the next level from the children."]}]}, {"id": "chain", "part": "behavioral", "title": "Chain of Responsibility", "tagline": "Ask the class monitor, then the teacher, then the principal", "body": "<h4>The story<\/h4>\n<p>You have a problem at school. You ask the <b>class monitor<\/b>. If they can't handle it, they pass it to the <b>class teacher<\/b>. If it's still too big, the teacher passes it to the <b>principal<\/b>. Each person either <b>handles it<\/b> or <b>passes it along<\/b> the chain.<\/p>\n<p><b>Chain of Responsibility: pass a request along a chain of handlers; each one decides whether to handle it or forward it to the next.<\/b><\/p>\n<pre><code>class Handler:\n    def __init__(self, next_handler=None):\n        self.next = next_handler\n    def handle(self, problem):\n        if self.next:\n            return self.next.handle(problem)\n        return \"nobody could help\"\n\nclass Monitor(Handler):\n    def handle(self, problem):\n        if problem == \"lost pencil\":\n            return \"monitor: borrow mine\"\n        return super().handle(problem)         # pass it along\n\nclass Teacher(Handler):\n    def handle(self, problem):\n        if problem in (\"homework doubt\", \"seat change\"):\n            return \"teacher: sorted\"\n        return super().handle(problem)\n\nclass Principal(Handler):\n    def handle(self, problem):\n        return f\"principal: will look into '{problem}'\"\n\nchain = Monitor(Teacher(Principal()))\nchain.handle(\"lost pencil\")      # monitor handles it\nchain.handle(\"bus late\")         # goes all the way to the principal<\/code><\/pre>\n<h4>A pipeline where every step runs (middleware)<\/h4>\n<p>Often each handler does its part and then <b>always<\/b> passes the request on, like web middleware: authentication → rate limit → logging → the actual view. Any step can stop the chain by raising an error or returning early.<\/p>\n<p><b>Where you see it:<\/b> web framework middleware (Django, FastAPI/Starlette), Python's <code>logging<\/code> (loggers pass records up to their parents' handlers), customer-support escalation, event bubbling in browsers.<\/p>", "quiz": [["What's the benefit of Chain of Responsibility over one big if/elif?", "<p>Each handler is small and independent, and handlers can be added, removed or reordered without touching the others.<\/p>"]], "exercises": [{"id": "chain-approval", "title": "Expense approval chain", "statement": "<p>Expenses need approval based on the amount:<\/p>\n<ul><li><code>TeamLead<\/code> approves up to 1,000,<\/li><li><code>Manager<\/code> up to 10,000,<\/li><li><code>Director<\/code> up to 100,000,<\/li><li>anything bigger returns <code>\"rejected: too large\"<\/code>.<\/li><\/ul>\n<p>Each handler returns <code>\"&lt;role&gt; approved &lt;amount&gt;\"<\/code> (roles: <code>team lead<\/code>, <code>manager<\/code>, <code>director<\/code>) or passes the request to its next handler. Build the chain with <code>make_chain()<\/code>.<\/p>", "starter": "class Approver:\n    def __init__(self, next_approver=None):\n        self.next = next_approver\n\ndef make_chain():\n    pass\n", "solution": "class Approver:\n    limit, role = 0, \"\"\n    def __init__(self, next_approver=None):\n        self.next = next_approver\n    def approve(self, amount):\n        if amount <= self.limit:\n            return f\"{self.role} approved {amount}\"\n        if self.next:\n            return self.next.approve(amount)        # pass it up the chain\n        return \"rejected: too large\"\n\nclass TeamLead(Approver):\n    limit, role = 1_000, \"team lead\"\nclass Manager(Approver):\n    limit, role = 10_000, \"manager\"\nclass Director(Approver):\n    limit, role = 100_000, \"director\"\n\ndef make_chain():\n    return TeamLead(Manager(Director()))\n", "tests": "\nT(\"small\", lambda: make_chain().approve(500), \"team lead approved 500\")\nT(\"boundary\", lambda: make_chain().approve(1000), \"team lead approved 1000\")\nT(\"medium\", lambda: make_chain().approve(5000), \"manager approved 5000\")\nT(\"big\", lambda: make_chain().approve(99999), \"director approved 99999\")\nT(\"too big\", lambda: make_chain().approve(10**6), \"rejected: too large\")\n", "hints": ["Give each class a limit and a role; the base class does the compare-or-forward logic.", "make_chain returns TeamLead(Manager(Director()))."]}]}, {"id": "mediator", "part": "behavioral", "title": "Mediator", "tagline": "The air-traffic controller", "body": "<h4>The story<\/h4>\n<p>Planes at an airport <b>don't talk to every other plane<\/b> (\"are you landing? I'm taking off!\"). That would be chaos with 50 planes. Instead, everyone talks only to the <b>control tower<\/b>, which coordinates them all.<\/p>\n<p><b>Mediator: objects communicate through one central coordinator instead of referring to each other directly.<\/b> This turns a messy web of connections into a tidy star.<\/p>\n<pre class=\"plain\"> without a mediator: everyone knows everyone      with a mediator: a star\n   A ── B                                          A   B\n   │ ╲╱ │                                           ╲ ╱\n   │ ╱╲ │                                         [ Tower ]\n   C ── D                                           ╱ ╲\n                                                   C   D<\/pre>\n<h4>A class chat room<\/h4>\n<pre><code>class ChatRoom:                                   # the MEDIATOR\n    def __init__(self):\n        self.members = {}\n    def join(self, user):\n        self.members[user.name] = user\n        user.room = self\n    def send(self, sender, text, to=None):\n        targets = [self.members[to]] if to else [u for u in self.members.values() if u is not sender]\n        for u in targets:\n            u.inbox.append(f\"{sender.name}: {text}\")\n\nclass Student:\n    def __init__(self, name):\n        self.name, self.inbox, self.room = name, [], None\n    def say(self, text, to=None):\n        self.room.send(self, text, to)            # talks only to the mediator\n\nroom = ChatRoom()\nasha, ravi = Student(\"Asha\"), Student(\"Ravi\")\nroom.join(asha); room.join(ravi)\nasha.say(\"hi all\")                                # Ravi gets it<\/code><\/pre>\n<p><b>Where you see it:<\/b> chat rooms, GUI dialogs (a form controller coordinating text boxes and buttons), air-traffic control, game lobbies.<\/p>\n<div class=\"note\"><b>Mediator vs Observer:<\/b> Observer broadcasts \"something happened\" to anyone listening. A Mediator actively <b>coordinates<\/b> who talks to whom, often with rules.<\/div>", "quiz": [["What problem does a Mediator solve?", "<p>Too many direct connections between objects (N×N). Each object only knows the mediator, so the objects stay simple and reusable.<\/p>"]], "exercises": [{"id": "mediator-tower", "title": "Airport control tower", "statement": "<p>Write <code>Tower<\/code> with <code>request_landing(plane)<\/code>, which allows <b>one plane on the runway at a time<\/b>:<\/p>\n<ul><li>if the runway is free, give it to the plane and return <code>\"&lt;id&gt; cleared to land\"<\/code>,<\/li><li>otherwise, add the plane to a waiting queue and return <code>\"&lt;id&gt; hold\"<\/code>.<\/li><\/ul>\n<p><code>runway_free()<\/code> is called when the current plane leaves. It clears the runway, and if a plane is waiting, the <b>first one in the queue<\/b> gets the runway; return <code>\"&lt;id&gt; cleared to land\"<\/code> for it (or <code>\"runway empty\"<\/code>).<\/p>\n<p><code>Plane(id, tower)<\/code> has <code>land()<\/code>, which calls the tower. Planes never talk to each other.<\/p>", "starter": "from collections import deque\n\nclass Tower:\n    pass\n\nclass Plane:\n    def __init__(self, id, tower):\n        self.id, self.tower = id, tower\n    def land(self):\n        return self.tower.request_landing(self)\n", "solution": "from collections import deque\n\nclass Tower:\n    def __init__(self):\n        self.on_runway = None\n        self.waiting = deque()\n    def request_landing(self, plane):\n        if self.on_runway is None:\n            self.on_runway = plane\n            return f\"{plane.id} cleared to land\"\n        self.waiting.append(plane)\n        return f\"{plane.id} hold\"\n    def runway_free(self):\n        self.on_runway = None\n        if self.waiting:\n            self.on_runway = self.waiting.popleft()\n            return f\"{self.on_runway.id} cleared to land\"\n        return \"runway empty\"\n\nclass Plane:\n    def __init__(self, id, tower):\n        self.id, self.tower = id, tower\n    def land(self):\n        return self.tower.request_landing(self)\n", "tests": "\ndef _run():\n    t = Tower(); a, b, c = Plane(\"AI101\", t), Plane(\"6E202\", t), Plane(\"UK303\", t)\n    return [a.land(), b.land(), c.land(), t.runway_free(), t.runway_free(), t.runway_free()]\nT(\"one at a time, in order\", _run, [\"AI101 cleared to land\", \"6E202 hold\", \"UK303 hold\", \"6E202 cleared to land\", \"UK303 cleared to land\", \"runway empty\"])\ndef _again():\n    t = Tower(); p = Plane(\"A\", t); p.land(); t.runway_free(); return Plane(\"B\", t).land()\nT(\"free runway is reused\", _again, \"B cleared to land\")\n", "hints": ["The tower stores the plane on the runway plus a deque of waiting planes.", "runway_free pops from the left of the queue."]}]}, {"id": "memento", "part": "behavioral", "title": "Memento", "tagline": "Save game, load game", "body": "<h4>The story<\/h4>\n<p>Before fighting the big boss in a video game, you <b>save the game<\/b>. If you lose, you <b>load<\/b> the save and you're back exactly where you were. The save file is a <b>snapshot<\/b>. You can't edit what's inside it; you can only restore it.<\/p>\n<p><b>Memento: capture an object's internal state in a snapshot so it can be restored later, without exposing the object's internals.<\/b><\/p>\n<pre><code>from dataclasses import dataclass\n\n@dataclass(frozen=True)              # frozen: a save file must not be changed\nclass Snapshot:\n    level: int\n    health: int\n    items: tuple\n\nclass Game:                          # the ORIGINATOR\n    def __init__(self):\n        self.level, self.health, self.items = 1, 100, []\n    def save(self) -&gt; Snapshot:\n        return Snapshot(self.level, self.health, tuple(self.items))   # copy the state\n    def load(self, snap: Snapshot):\n        self.level, self.health, self.items = snap.level, snap.health, list(snap.items)\n\nclass SaveSlots:                     # the CARETAKER: stores snapshots and never looks inside\n    def __init__(self): self.slots = {}\n    def store(self, name, snap): self.slots[name] = snap\n    def get(self, name): return self.slots[name]\n\ng = Game(); slots = SaveSlots()\ng.level, g.items = 5, [\"sword\"]\nslots.store(\"before boss\", g.save())\ng.health = 0                          # lost the fight 😢\ng.load(slots.get(\"before boss\"))      # back to level 5 with full health<\/code><\/pre>\n<p><b>Memento vs Command for undo:<\/b> Command stores <b>how to reverse an action<\/b>. Memento stores <b>a whole snapshot<\/b>. Mementos are simpler but use more memory, so they work well for small states or periodic checkpoints.<\/p>\n<p><b>Where you see it:<\/b> game saves, editor \"revert to saved\", database transactions (savepoints), form drafts.<\/p>", "quiz": [["Why make the snapshot immutable and copy lists into it?", "<p>If the snapshot shared the live list, later changes to the game would silently change the 'saved' state too.<\/p>"]], "exercises": [{"id": "memento-editor", "title": "Drawing app checkpoints", "statement": "<p><code>Canvas<\/code> has <code>shapes<\/code> (a list) and <code>color<\/code> (a string). Write:<\/p>\n<ul><li><code>Canvas.save()<\/code>, which returns an <b>immutable<\/b> snapshot (copy the list!),<\/li><li><code>Canvas.restore(snapshot)<\/code>,<\/li><li><code>Checkpoints<\/code> (the caretaker) with <code>push(snapshot)<\/code> and <code>pop()<\/code>, which returns the latest snapshot, or <code>None<\/code> if there is none.<\/li><\/ul>\n<p>Changing the canvas after saving must not affect saved snapshots.<\/p>", "starter": "class Canvas:\n    def __init__(self):\n        self.shapes, self.color = [], \"black\"\n    def draw(self, shape):\n        self.shapes.append(shape)\n\nclass Checkpoints:\n    pass\n", "solution": "from dataclasses import dataclass\n\n@dataclass(frozen=True)\nclass CanvasSnapshot:\n    shapes: tuple\n    color: str\n\nclass Canvas:\n    def __init__(self):\n        self.shapes, self.color = [], \"black\"\n    def draw(self, shape):\n        self.shapes.append(shape)\n    def save(self):\n        return CanvasSnapshot(tuple(self.shapes), self.color)   # a frozen copy\n    def restore(self, snap):\n        self.shapes, self.color = list(snap.shapes), snap.color\n\nclass Checkpoints:\n    def __init__(self): self._stack = []\n    def push(self, snap): self._stack.append(snap)\n    def pop(self): return self._stack.pop() if self._stack else None\n", "tests": "\ndef _run():\n    c, cp = Canvas(), Checkpoints()\n    c.draw(\"circle\"); cp.push(c.save())\n    c.draw(\"square\"); c.color = \"red\"; cp.push(c.save())\n    c.draw(\"star\"); c.color = \"blue\"\n    c.restore(cp.pop()); a = (list(c.shapes), c.color)\n    c.restore(cp.pop()); b = (list(c.shapes), c.color)\n    return [a, b, cp.pop()]\nT(\"checkpoints restore in reverse order\", _run, [([\"circle\", \"square\"], \"red\"), ([\"circle\"], \"black\"), None])\ndef _immutable():\n    c = Canvas(); c.draw(\"x\"); s = c.save(); c.draw(\"y\")\n    try:\n        s.color = \"z\"; return False\n    except Exception:\n        return len(s.shapes) == 1\nC(\"snapshots are frozen copies\", _immutable, \"use a frozen dataclass and copy the list into a tuple\")\n", "hints": ["A frozen dataclass makes a good snapshot.", "Copy the shapes list into a tuple when saving, and back into a list when restoring."]}]}, {"id": "visitor", "part": "behavioral", "title": "Visitor", "tagline": "A health inspector visiting different shops", "body": "<h4>The story<\/h4>\n<p>A <b>health inspector<\/b> visits a bakery, a restaurant and a juice shop. Each needs a different check. Next month a <b>tax inspector<\/b> visits the same shops with different checks. The shops don't change; new <b>visitors<\/b> bring new operations.<\/p>\n<p><b>Visitor: add new operations to a group of classes without changing those classes.<\/b> Each operation lives in its own visitor.<\/p>\n<h4>GoF style (double dispatch)<\/h4>\n<pre><code>class Circle:\n    def __init__(self, r): self.r = r\n    def accept(self, visitor): return visitor.visit_circle(self)\n\nclass Square:\n    def __init__(self, s): self.s = s\n    def accept(self, visitor): return visitor.visit_square(self)\n\nclass AreaVisitor:                         # operation 1\n    def visit_circle(self, c): return 3.14 * c.r ** 2\n    def visit_square(self, s): return s.s ** 2\n\nclass SvgVisitor:                          # operation 2, added WITHOUT touching the shapes\n    def visit_circle(self, c): return f'&lt;circle r=\"{c.r}\"/&gt;'\n    def visit_square(self, s): return f'&lt;rect width=\"{s.s}\"/&gt;'\n\nshapes = [Circle(1), Square(2)]\n[s.accept(AreaVisitor()) for s in shapes]        # [3.14, 4]<\/code><\/pre>\n<h4>🐍 Pythonic shortcut: <code>functools.singledispatch<\/code><\/h4>\n<pre><code>from functools import singledispatch\n\n@singledispatch\ndef area(shape):\n    raise TypeError(f\"unknown shape {type(shape).__name__}\")\n\n@area.register\ndef _(shape: Circle): return 3.14 * shape.r ** 2\n\n@area.register\ndef _(shape: Square): return shape.s ** 2<\/code><\/pre>\n<p><b>Where you see it:<\/b> compilers and linters walking a syntax tree (Python's own <code>ast.NodeVisitor<\/code>!), exporting a document to PDF/HTML/Markdown, tax or pricing calculations over different item types.<\/p>\n<div class=\"note\">Trade-off: adding a new <b>operation<\/b> is easy (a new visitor), but adding a new <b>class<\/b> means updating every visitor.<\/div>", "quiz": [["When is Visitor a good fit?", "<p>When the classes are stable but you keep adding new operations over them (exports, reports, analysis).<\/p>"], ["What Python stdlib class uses Visitor?", "<p><code>ast.NodeVisitor<\/code>: <code>visit_Name<\/code>, <code>visit_Call<\/code>, etc. are called for each node type.<\/p>"]], "exercises": [{"id": "visitor-cart", "title": "Cart visitors: tax and weight", "statement": "<p>Items: <code>Book(price)<\/code>, <code>Food(price, kg)<\/code> and <code>Gadget(price, kg)<\/code>. Each has <code>accept(visitor)<\/code> calling <code>visitor.visit_book(self)<\/code>, <code>visit_food<\/code> or <code>visit_gadget<\/code>.<\/p>\n<p>Write two visitors:<\/p>\n<ul><li><code>TaxVisitor<\/code>: books 0% tax, food 5%, gadgets 18%. It returns the tax amount, rounded to 2 decimals.<\/li><li><code>ShippingWeightVisitor<\/code>: books weigh 0.5 kg each; food and gadgets use their <code>kg<\/code>.<\/li><\/ul>\n<p>Write <code>total(items, visitor)<\/code>, which returns the rounded sum of <code>item.accept(visitor)<\/code>.<\/p>", "starter": "class Book:\n    def __init__(self, price): self.price = price\n\nclass Food:\n    def __init__(self, price, kg): self.price, self.kg = price, kg\n\nclass Gadget:\n    def __init__(self, price, kg): self.price, self.kg = price, kg\n\ndef total(items, visitor):\n    pass\n", "solution": "class Book:\n    def __init__(self, price): self.price = price\n    def accept(self, v): return v.visit_book(self)\n\nclass Food:\n    def __init__(self, price, kg): self.price, self.kg = price, kg\n    def accept(self, v): return v.visit_food(self)\n\nclass Gadget:\n    def __init__(self, price, kg): self.price, self.kg = price, kg\n    def accept(self, v): return v.visit_gadget(self)\n\nclass TaxVisitor:\n    def visit_book(self, b): return 0\n    def visit_food(self, f): return round(f.price * 0.05, 2)\n    def visit_gadget(self, g): return round(g.price * 0.18, 2)\n\nclass ShippingWeightVisitor:\n    def visit_book(self, b): return 0.5\n    def visit_food(self, f): return f.kg\n    def visit_gadget(self, g): return g.kg\n\ndef total(items, visitor):\n    return round(sum(item.accept(visitor) for item in items), 2)\n", "tests": "\n_cart = lambda: [Book(300), Food(200, 2), Gadget(1000, 1.5), Book(100)]\nT(\"tax\", lambda: total(_cart(), TaxVisitor()), 190.0)\nT(\"weight\", lambda: total(_cart(), ShippingWeightVisitor()), 4.5)\nT(\"empty cart\", lambda: total([], TaxVisitor()), 0)\n", "hints": ["Each item's accept calls the matching visit_* method on the visitor.", "total sums item.accept(visitor) for all items."]}]}, {"id": "qb-overview", "part": "project", "title": "QuickBite: The Plan", "tagline": "We'll build a real food-ordering app, step by step", "body": "<h4>What we're building<\/h4>\n<p><b>QuickBite<\/b> is the backend of a food-ordering app (like a mini Swiggy or Zomato for your school canteen). By the end, this works:<\/p>\n<pre><code>app = QuickBite(sample_menu())\norder = app.place_order(\"Asha\", \"Pune\", \"12 MG Road\",\n                        [(\"thali\", 1), (\"burger-combo\", 2, [\"cheese\", \"jumbo\"])],\n                        payment=\"upi\", discount=PercentOff(10))\napp.advance(order.id, \"PREPARING\")\nprint(TextReceipt().render(order))<\/code><\/pre>\n<h4>Requirements (what the \"client\" asked for)<\/h4>\n<ol><li>A <b>menu<\/b> with categories inside categories (Snacks, Meals → Combos…).<\/li><li><b>Add-ons<\/b> (extra cheese, jumbo size) that change the price, in any combination.<\/li><li><b>Discounts<\/b> that change every festival.<\/li><li>Orders that are <b>validated<\/b> (customer, address, at least one item) and can be <b>re-ordered<\/b>.<\/li><li><b>Several payment providers<\/b>, each with its own weird third-party API.<\/li><li>An order <b>lifecycle<\/b> (placed → paid → preparing → out for delivery → delivered) with <b>notifications<\/b>.<\/li><li><b>Undo<\/b> in the cart, plus <b>checkout rules<\/b> (minimum order, delivery cities).<\/li><li><b>One simple entry point<\/b> for the mobile app, cached menu lookups, shared settings, and receipts in different formats.<\/li><\/ol>\n<h4>Which pattern solves which requirement<\/h4>\n<table><tr><th>requirement<\/th><th>pattern(s)<\/th><th>step<\/th><\/tr><tr><td>nested menu, \"loop over every item\"<\/td><td><b>Composite<\/b>, <b>Iterator<\/b><\/td><td>1<\/td><\/tr><tr><td>add-ons in any combination<\/td><td><b>Decorator<\/b><\/td><td>2<\/td><\/tr><tr><td>changing discounts<\/td><td><b>Strategy<\/b><\/td><td>2<\/td><\/tr><tr><td>safe order creation, reorder<\/td><td><b>Builder<\/b>, <b>Prototype<\/b><\/td><td>3<\/td><\/tr><tr><td>many payment SDKs<\/td><td><b>Factory<\/b>, <b>Adapter<\/b><\/td><td>4<\/td><\/tr><tr><td>lifecycle + notifications<\/td><td><b>State<\/b>, <b>Observer<\/b><\/td><td>5<\/td><\/tr><tr><td>cart undo, checkout rules<\/td><td><b>Command<\/b>, <b>Chain of Responsibility<\/b><\/td><td>6<\/td><\/tr><tr><td>simple entry, caching, settings, receipts<\/td><td><b>Facade<\/b>, <b>Proxy<\/b>, <b>Singleton<\/b>, <b>Template Method<\/b><\/td><td>7<\/td><\/tr><\/table>\n<div class=\"note\"><b>We deliberately don't use<\/b> Visitor, Mediator, Memento, Bridge, Flyweight or Abstract Factory here. Good designers <b>don't force patterns<\/b> where there's no problem for them to solve. A pattern without a problem is just extra complexity. (Ideas for where they *could* fit come in the final lesson.)<\/div>\n<h4>The class picture<\/h4>\n<pre class=\"plain\">          QuickBite  (Facade)\n   ┌──────────┼─────────────┬───────────────┬──────────────┐\nCachedMenu  Checks chain  OrderBuilder   PaymentFactory  OrderTracker ──► EventBus ──► subscribers\n (Proxy)    (Chain)       (Builder)       (Factory)       (State)          (Observer)\n   │                         │               │\nMenuService ──► Category/MenuItem          UpiPayment/CardPayment (Adapters) ──► 3rd-party SDKs\n               (Composite + Iterator)\nCart ◄── Plain/AddOn (Decorator)   Discount (Strategy)   AddToCart/CartHistory (Command)<\/pre>\n<h4>SOLID in this project<\/h4>\n<ul><li><b>S:<\/b> each class has one job (Cart adds up totals, OrderBuilder validates and builds, OrderTracker handles status).<\/li><li><b>O:<\/b> new add-ons, discounts, payment methods and checks are <b>new classes<\/b>, with no edits.<\/li><li><b>L:<\/b> every <code>Discount<\/code> and every payment method can replace another.<\/li><li><b>I:<\/b> small interfaces: <code>Priced<\/code> has just <code>price()<\/code> and <code>label()<\/code>; a payment needs only <code>pay()<\/code>.<\/li><li><b>D:<\/b> the facade depends on abstractions (any Discount, any payment from the factory, any bus).<\/li><\/ul>\n<p>Each of the next lessons builds one step. The exercise gives you all the <b>previous steps' code ready-made<\/b>, and you write the new step.<\/p>", "quiz": [], "exercises": []}, {"id": "qb-step1", "part": "project", "title": "Step 1: The Menu (Composite + Iterator)", "tagline": "Categories inside categories", "body": "<h4>The problem<\/h4>\n<p>The menu has <b>categories inside categories<\/b>: Meals → Combos → Burger Combo. We need to:<\/p>\n<ul><li>loop over <b>every<\/b> dish, however deeply nested (for search, or a \"veg only\" filter),<\/li><li>find a dish by its id,<\/li><\/ul>\n<p>without writing special code for \"is this a category or a dish?\" everywhere.<\/p>\n<h4>The design<\/h4>\n<ul><li><code>MenuItem<\/code> (a <b>leaf<\/b>) is a frozen dataclass. Its <code><i>_iter_<\/i><\/code> yields just itself.<\/li><li><code>Category<\/code> (a <b>composite<\/b>) holds children, and its <code><i>_iter_<\/i><\/code> does <code>yield from child<\/code> for each child.<\/li><\/ul>\n<p>Because <b>both<\/b> are iterable in the same way, the category doesn't care whether a child is a dish or another category. That's the <b>Composite<\/b> pattern with Python's built-in <b>Iterator<\/b> protocol.<\/p>\n<pre><code># ===== Step 1: Menu (Composite + Iterator) =====\nfrom abc import ABC, abstractmethod\nfrom collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol\n\n@dataclass(frozen=True)\nclass MenuItem:                       # a LEAF of the menu tree (frozen = can't change by accident)\n    id: str\n    name: str\n    price: float\n    veg: bool = True\n    def __iter__(self):               # a leaf \"iterates\" over just itself\n        yield self\n\nclass Category:                       # a COMPOSITE: holds items AND other categories\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, *things):\n        self.children.extend(things)\n        return self\n    def __iter__(self):               # ITERATOR: every MenuItem inside, however deep\n        for child in self.children:\n            yield from child\n    def find(self, item_id):\n        return next((i for i in self if i.id == item_id), None)\n    def veg_only(self):\n        return [i for i in self if i.veg]\n\ndef sample_menu():\n    return Category(\"QuickBite\").add(\n        Category(\"Snacks\").add(MenuItem(\"samosa\", \"Samosa\", 20), MenuItem(\"fries\", \"French Fries\", 80)),\n        Category(\"Meals\").add(\n            MenuItem(\"thali\", \"Veg Thali\", 150),\n            MenuItem(\"biryani\", \"Chicken Biryani\", 220, veg=False),\n            Category(\"Combos\").add(MenuItem(\"burger-combo\", \"Burger Combo\", 199)),\n        ),\n        Category(\"Drinks\").add(MenuItem(\"chai\", \"Masala Chai\", 25), MenuItem(\"lassi\", \"Sweet Lassi\", 60)),\n    )<\/code><\/pre>\n<h4>Things to notice<\/h4>\n<ul><li><code>frozen=True<\/code> means nobody can accidentally change a dish's price in one order and affect everyone.<\/li><li><code>find<\/code> is just a generator expression over the whole tree.<\/li><li>Adding a new sub-category needs <b>no code changes<\/b> at all.<\/li><\/ul>", "quiz": [["Why does MenuItem have an <code><i>_iter_<\/i><\/code> that yields itself?", "<p>So that leaves and categories can be treated the same way: <code>yield from child<\/code> works whether the child is a dish or a category, with no isinstance checks.<\/p>"]], "exercises": [{"id": "qb1", "title": "Build the menu tree", "statement": "<p>Write <code>MenuItem<\/code> (frozen dataclass: <code>id<\/code>, <code>name<\/code>, <code>price<\/code>, <code>veg=True<\/code>, plus an <code><i>_iter_<\/i><\/code> that yields itself) and <code>Category(name)<\/code> with <code>add(*things)<\/code> (chainable), <code><i>_iter_<\/i><\/code>, <code>find(item_id)<\/code> (None if missing) and <code>veg_only()<\/code>. <code>sample_menu()<\/code> is provided at the bottom of the starter and must work with your classes.<\/p>", "starter": "# ===== Step 1: Menu (Composite + Iterator) =====\nfrom abc import ABC, abstractmethod\nfrom collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol\n\n@dataclass(frozen=True)\nclass MenuItem:\n    id: str\n    name: str\n    price: float\n    veg: bool = True\n    # TODO: add __iter__ that yields self\n\nclass Category:\n    def __init__(self, name):\n        self.name, self.children = name, []\n    # TODO: add(), __iter__(), find(), veg_only()\n\ndef sample_menu():\n    return Category(\"QuickBite\").add(\n        Category(\"Snacks\").add(MenuItem(\"samosa\", \"Samosa\", 20), MenuItem(\"fries\", \"French Fries\", 80)),\n        Category(\"Meals\").add(\n            MenuItem(\"thali\", \"Veg Thali\", 150),\n            MenuItem(\"biryani\", \"Chicken Biryani\", 220, veg=False),\n            Category(\"Combos\").add(MenuItem(\"burger-combo\", \"Burger Combo\", 199)),\n        ),\n        Category(\"Drinks\").add(MenuItem(\"chai\", \"Masala Chai\", 25), MenuItem(\"lassi\", \"Sweet Lassi\", 60)),\n    )\n", "solution": "# ===== Step 1: Menu (Composite + Iterator) =====\nfrom abc import ABC, abstractmethod\nfrom collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol\n\n@dataclass(frozen=True)\nclass MenuItem:                       # a LEAF of the menu tree (frozen = can't change by accident)\n    id: str\n    name: str\n    price: float\n    veg: bool = True\n    def __iter__(self):               # a leaf \"iterates\" over just itself\n        yield self\n\nclass Category:                       # a COMPOSITE: holds items AND other categories\n    def __init__(self, name):\n        self.name, self.children = name, []\n    def add(self, *things):\n        self.children.extend(things)\n        return self\n    def __iter__(self):               # ITERATOR: every MenuItem inside, however deep\n        for child in self.children:\n            yield from child\n    def find(self, item_id):\n        return next((i for i in self if i.id == item_id), None)\n    def veg_only(self):\n        return [i for i in self if i.veg]\n\ndef sample_menu():\n    return Category(\"QuickBite\").add(\n        Category(\"Snacks\").add(MenuItem(\"samosa\", \"Samosa\", 20), MenuItem(\"fries\", \"French Fries\", 80)),\n        Category(\"Meals\").add(\n            MenuItem(\"thali\", \"Veg Thali\", 150),\n            MenuItem(\"biryani\", \"Chicken Biryani\", 220, veg=False),\n            Category(\"Combos\").add(MenuItem(\"burger-combo\", \"Burger Combo\", 199)),\n        ),\n        Category(\"Drinks\").add(MenuItem(\"chai\", \"Masala Chai\", 25), MenuItem(\"lassi\", \"Sweet Lassi\", 60)),\n    )\n", "tests": "\nT(\"counts every dish\", lambda: len(list(sample_menu())), 7)\nT(\"finds nested combo\", lambda: sample_menu().find(\"burger-combo\").price, 199)\nT(\"missing item\", lambda: sample_menu().find(\"pizza\"), None)\nT(\"veg only\", lambda: [i.id for i in sample_menu().veg_only()], [\"samosa\", \"fries\", \"thali\", \"burger-combo\", \"chai\", \"lassi\"])\ndef _frozen():\n    try:\n        sample_menu().find(\"chai\").price = 1; return False\n    except Exception:\n        return True\nC(\"menu items are frozen\", _frozen)\n", "hints": ["MenuItem.<i>_iter_<\/i>: <code>yield self<\/code>.", "Category.<i>_iter_<\/i>: <code>for child in self.children: yield from child<\/code>."]}]}, {"id": "qb-step2", "part": "project", "title": "Step 2: Add-ons & Discounts (Decorator + Strategy)", "tagline": "Extra cheese, jumbo size, festival offers", "body": "<h4>Add-ons: the Decorator pattern<\/h4>\n<p>A burger can be <b>plain<\/b>, <b>+cheese<\/b>, <b>+cheese +jumbo<\/b>, <b>+sauce +cheese<\/b>… Making one class per combination would explode. Instead:<\/p>\n<ul><li><code>Plain(item)<\/code> wraps a menu item and gives <code>price()<\/code> and <code>label()<\/code>,<\/li><li>every add-on is a <b>decorator<\/b> that wraps any <code>Priced<\/code> thing and adds its extra price and text.<\/li><\/ul>\n<p><code>ExtraCheese(Jumbo(Plain(burger)))<\/code> costs 199 + 50 + 30 = 279.<\/p>\n<h4>Discounts: the Strategy pattern<\/h4>\n<p>Discounts change every festival, so each discount is a class with <code>apply(subtotal)<\/code>. The cart doesn't know which one it got. That's Strategy, and adding \"Diwali 25% off\" later means adding one new class.<\/p>\n<pre><code># ===== Step 2: Pricing (Decorator for add-ons + Strategy for discounts) =====\nclass Priced(Protocol):\n    def price(self) -&gt; float: ...\n    def label(self) -&gt; str: ...\n\nclass Plain:                                   # turns a MenuItem into a Priced thing\n    def __init__(self, item):\n        self.item = item\n    def price(self): return self.item.price\n    def label(self): return self.item.name\n\nclass AddOn:                                   # DECORATOR base: wraps any Priced\n    extra, text = 0, \"\"\n    def __init__(self, inner):\n        self.inner = inner\n    def price(self): return self.inner.price() + self.extra\n    def label(self): return f\"{self.inner.label()} + {self.text}\"\n\nclass ExtraCheese(AddOn): extra, text = 30, \"extra cheese\"\nclass ExtraSauce(AddOn): extra, text = 10, \"extra sauce\"\nclass Jumbo(AddOn): extra, text = 50, \"jumbo size\"\n\nADDONS = {\"cheese\": ExtraCheese, \"sauce\": ExtraSauce, \"jumbo\": Jumbo}\n\ndef make_priced(item, addons=()):\n    priced = Plain(item)\n    for name in addons:\n        priced = ADDONS[name](priced)          # stack decorators\n    return priced\n\nclass Discount(ABC):                           # STRATEGY interface\n    @abstractmethod\n    def apply(self, subtotal): ...\n\nclass NoDiscount(Discount):\n    def apply(self, subtotal): return subtotal\n\nclass PercentOff(Discount):\n    def __init__(self, percent): self.percent = percent\n    def apply(self, subtotal): return subtotal * (1 - self.percent / 100)\n\nclass FlatOff(Discount):\n    def __init__(self, amount, min_total=0): self.amount, self.min_total = amount, min_total\n    def apply(self, subtotal): return subtotal - self.amount if subtotal &gt;= self.min_total else subtotal\n\nclass Cart:\n    def __init__(self):\n        self.lines = []                        # list of (priced, qty) tuples\n    def add(self, priced, qty=1):\n        if qty &lt;= 0:\n            raise ValueError(\"qty must be positive\")\n        line = (priced, qty)\n        self.lines.append(line)\n        return line\n    def remove(self, line):\n        self.lines.remove(line)\n    def subtotal(self):\n        return sum(p.price() * q for p, q in self.lines)\n    def total(self, discount=None):\n        return round(max(0, (discount or NoDiscount()).apply(self.subtotal())), 2)<\/code><\/pre>\n<h4>Things to notice<\/h4>\n<ul><li><code>class ExtraCheese(AddOn): extra, text = 30, \"extra cheese\"<\/code> puts the class body on one line. It's allowed because it's a simple assignment, and it reads nicely for tiny subclasses.<\/li><li><code>make_priced(item, [\"cheese\", \"jumbo\"])<\/code> turns a list of add-on names into stacked decorators. The <code>ADDONS<\/code> dict is a mini <b>factory<\/b>.<\/li><li><code>Cart.total()<\/code> never goes below 0, whatever discount you pass.<\/li><\/ul>", "quiz": [["Why not a <code>with_cheese<\/code> boolean on MenuItem?", "<p>Then every new add-on would mean editing MenuItem (breaking open/closed), and combinations would need ever more flags. Decorators stack freely.<\/p>"]], "exercises": [{"id": "qb2", "title": "Add-ons, discounts and the cart", "statement": "<p>Using the given Step 1 code, write Step 2: <code>Plain<\/code>, <code>AddOn<\/code> (with <code>ExtraCheese<\/code> +30, <code>ExtraSauce<\/code> +10, <code>Jumbo<\/code> +50), <code>ADDONS<\/code>, <code>make_priced(item, addons)<\/code>, the discounts (<code>NoDiscount<\/code>, <code>PercentOff(p)<\/code>, <code>FlatOff(amount, min_total=0)<\/code>), and <code>Cart<\/code> with <code>add<\/code> (returns the line tuple; qty must be &gt; 0), <code>remove(line)<\/code>, <code>subtotal()<\/code> and <code>total(discount=None)<\/code> (rounded to 2 decimals, never below 0).<\/p>", "starter": "# ===== Step 1: Menu (Composite + Iterator) =====\nfrom abc import ABC, abstractmethod\nfrom collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol\n\n@dataclass(frozen=True)\nclass MenuItem:                       # a LEAF of the menu tree (frozen = can't change by accident)\n    id: str\n    name: str\n    price: f
